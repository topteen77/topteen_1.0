# TopTeens - Connect to MySQL on host (e.g. mysql8 on host:3306)
# Use when 0innerdb_default network doesn't exist - connect via host.docker.internal
#
# Requires: MySQL running on host port 3306 (e.g. mysql8 from 0innerdb)
# On Linux: host.docker.internal resolves via extra_hosts

services:
  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-3306}

  celery:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-3306}

  celery_beat:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-3306}
