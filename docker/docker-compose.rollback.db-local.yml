# TopTeens - Rollback with local MySQL (use when DB_MODE=local)
# Merged with docker-compose.rollback.yml

services:
  web:
    environment:
      - DB_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-topteens}
      MYSQL_USER: ${DB_USER:-topteens}
      MYSQL_PASSWORD: ${DB_PASSWORD:-topteens}
    volumes:
      - ${MYSQL_DATA_PATH:-mysql_data}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
