# TopTeens nginx – upstream and includes
# Domain configs: conf.d/topteen.conf (production), conf.d/demotopteen.conf (dev)
# HTTPS: conf.d/topteen-ssl.conf is enabled by entrypoint when SSL certs exist
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    upstream django {
        server web:8000;
    }

    include /etc/nginx/conf.d/*.conf;
}
