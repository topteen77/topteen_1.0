# TopTeens nginx – upstream and includes (tuned for low lag)
# Domain configs: conf.d/topteen.conf (production), conf.d/demotopteen.conf (dev)
# HTTPS: conf.d/topteen-ssl.conf is enabled by entrypoint when SSL certs exist
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream django {
        server web:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
