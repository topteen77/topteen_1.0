# TopTeens ENV stack: mariadb, nginx, redis, elasticsearch, certbot. Run from docker/: deploy.sh up-env

services:
  mariadb:
    image: mariadb:10.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-topteens}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - ${MARIADB_DATA_PATH:-../data/mariadb}:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF_PATH:-nginx/conf.d}:/etc/nginx/conf.d:ro
      - ${SSL_CERT_PATH:-../ssl}:/etc/nginx/ssl:ro
      - ${CERTBOT_WEBROOT:-../certbot-webroot}:/var/www/certbot:ro
      - ${LOG_PATH:-../logs}:/var/log/nginx
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $$!; nginx -s reload; done & nginx -g 'daemon off;'"]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $$!; done;'"
    volumes:
      - ${CERTBOT_CONF_PATH:-../certbot-conf}:/etc/letsencrypt
      - ${CERTBOT_WEBROOT:-../certbot-webroot}:/var/www/certbot

  elasticsearch:
    image: elasticsearch:7.14.2
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - ${ELASTICSEARCH_DATA_PATH:-../data/elasticsearch}:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_env_volume:/data

volumes:
  redis_env_volume:
