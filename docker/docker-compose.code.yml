# TopTeens CODE stack: same app image as deploy (developertopteen/demotopteen). Run from docker/: deploy.sh up-code

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${DOCKER_IMAGE:-developertopteen/demotopteen}:latest
    pull_policy: never
    working_dir: /app
    command: /start.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ${LOG_PATH:-../logs}:/app/logs
    env_file: ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_PATH=/app/logs
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - REDIS_HOST=redis
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    image: ${DOCKER_IMAGE_NGINX:-developertopteen/demotopteen-nginx}:latest
    pull_policy: never
    restart: unless-stopped
    env_file: ../.env
    environment:
      - PRODUCTION_SERVER_NAMES=${PRODUCTION_SERVER_NAMES:-topteen.in www.topteen.in}
      - STAGING_SERVER_NAMES=${STAGING_SERVER_NAMES:-demo.topteen.in 43.204.127.118 localhost}
    ports:
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - static_volume:/var/www/html/static:ro
      - media_volume:/var/www/html/media:ro
      - ${LOG_PATH:-../logs}:/var/log/nginx
      - ${SSL_CERT_PATH:-../ssl}:/etc/nginx/ssl:ro
      - ${CERTBOT_WEBROOT:-../certbot-webroot}:/var/www/acme:ro
    depends_on:
      - web

  celery:
    image: ${DOCKER_IMAGE:-developertopteen/demotopteen}:latest
    pull_policy: never
    command: celery -A topteens worker -l info --concurrency ${CELERY_CONCURRENCY:-4} -O default
    working_dir: /app
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ${LOG_PATH:-../logs}:/app/logs
    env_file: ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_PATH=/app/logs
      - REDIS_HOST=redis
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
    depends_on:
      - web
      - redis

  celery_beat:
    image: ${DOCKER_IMAGE:-developertopteen/demotopteen}:latest
    pull_policy: never
    command: celery -A topteens beat -l info
    working_dir: /app
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ${LOG_PATH:-../logs}:/app/logs
    env_file: ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_PATH=/app/logs
      - REDIS_HOST=redis
    depends_on:
      - web
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis_volume:/data

volumes:
  static_volume:
  media_volume:
  redis_volume:
