# =============================================================================
# docker_files/nginx/production.conf
# PRODUCTION host-nginx front for Docker stack (Option A)
# =============================================================================
# This is a SEPARATE file from the live site:
#   /etc/nginx/sites-enabled/topteens   ← keep as-is (gunicorn unix socket)
#
# When you are ready to switch www.topteen.in traffic to Docker:
#   1. ./docker_files/deploy.sh up          # Docker listens on 127.0.0.1:8090
#   1. ./docker_files/deploy.sh up          # Docker listens on 127.0.0.1:8090
#   2. sudo cp docker_files/nginx/production.conf \
#        /etc/nginx/sites-available/topteens-docker
#   3. sudo ln -sf /etc/nginx/sites-available/topteens-docker \
#        /etc/nginx/sites-enabled/topteens-docker
#   4. sudo mv /etc/nginx/sites-enabled/topteens \
#        /etc/nginx/sites-enabled/topteens.off   # disable old — do NOT delete
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Rollback to old gunicorn site:
#   sudo mv /etc/nginx/sites-enabled/topteens.off /etc/nginx/sites-enabled/topteens
#   sudo rm -f /etc/nginx/sites-enabled/topteens-docker
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domains: keep server_name in sync with SERVER_NAMES in docker_files/.env
# SSL: host certbot (unchanged). Docker SSL_MODE=off. APP_PORT=8090 (not 8080).
# =============================================================================

server {
    listen 443 ssl;
    server_name www.topteen.in topteen.in;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    if ($host = "topteen.in") {
        return 301 https://www.topteen.in$request_uri;
    }

    ssl_certificate     /etc/letsencrypt/live/www.topteen.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.topteen.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /.well-known/acme-challenge/ {
        root /home/ubuntu/demo-topteen-certificate/www-topteen;
        allow all;
    }

    # Main app → Docker nginx (APP_PORT=8090 in docker_files/.env; 8080 used by indo-israel)
    # Main app → Docker nginx (APP_PORT=8090 in docker_files/.env; 8080 used by indo-israel)
    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8090;
        proxy_pass http://127.0.0.1:8090;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /data/topteens/nginx/static/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Local chart PNGs (bind-mounted). More specific than /media/.
    location /media/graph_images/ {
        alias /data/topteens/nginx/media/graph_images/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # S3_MEDIA_ACCESS_MODE=proxy: Django serves /media/s3/... from the bucket.
    # Do NOT alias /media/ to disk — that 404s all S3 media after Docker cutover.
    location /media/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8090;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /counsel-engine/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /counselor_project/ {
        include proxy_params;
        proxy_pass http://unix:/run/counselor_project.sock;
    }
}

server {
    listen 80;
    server_name www.topteen.in topteen.in default_server;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /.well-known/acme-challenge/ {
        root /home/ubuntu/demo-topteen-certificate/www-topteen;
        allow all;
    }

    location / {
        return 301 https://www.topteen.in$request_uri;
    }
}
