# =============================================================================
# TopTeen full stack - docker_files independent deployment
# App code path inside containers: /app/topteen1.0
#
# Host data root (bind mounts, picked up at runtime):
#   ${DATA_ROOT}/nginx/static|media|conf|ssl|logs
#   ${DATA_ROOT}/mariadb
#   ${DATA_ROOT}/elasticsearch
#   ${DATA_ROOT}/redis
#   ${DATA_ROOT}/logs
#   ${DATA_ROOT}/certbot/{conf,webroot}
#
# Run via:  ./docker_files/deploy.sh up
# Setup:    cp docker_files/env.example docker_files/.env
# =============================================================================

x-app-common: &app-common
  image: "${APP_IMAGE:-developertopteen/demotopteen}:${APP_IMAGE_TAG:-topteen1.0}"
  pull_policy: never
  restart: unless-stopped
  working_dir: /app/topteen1.0
  env_file:
    - "${APP_ENV_FILE:-../.env}"
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - APP_HOME=/app/topteen1.0
    - LOG_PATH=/app/topteen1.0/logs
    - COMMON_BASE_PATH=/app/topteen1.0
    - REDIS_HOST=redis
    - ELASTICSEARCH_HOST=elasticsearch
    - GUNICORN_WORKERS=${GUNICORN_WORKERS:-8}
    - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
    - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
    # docker_files/.env wins over repo-root .env (explicit overrides)
    - USE_HTTPS=${USE_HTTPS:-False}
    - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
    - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,test.topteen.in}
    - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
    - CSRF_COOKIE_DOMAIN=${CSRF_COOKIE_DOMAIN:-}
  volumes:
    - ${DATA_ROOT:-/data/topteens}/nginx/static:/app/topteen1.0/staticfiles
    - ${DATA_ROOT:-/data/topteens}/nginx/media:/app/topteen1.0/media
    - ${DATA_ROOT:-/data/topteens}/logs:/app/topteen1.0/logs
  networks:
    - topteen_net

services:

  web:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker_files/Dockerfile
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',8000))==0 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      replicas: ${WEB_REPLICAS:-2}

  celery:
    <<: *app-common
    command: celery -A topteens worker -l info --concurrency ${CELERY_CONCURRENCY:-4} -O default
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A topteens inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  celery_beat:
    <<: *app-common
    command: celery -A topteens beat -l info --schedule /app/topteen1.0/logs/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    build:
      context: ..
      dockerfile: docker_files/nginx/Dockerfile
    image: "${NGINX_IMAGE:-developertopteen/demotopteen-nginx}:${NGINX_IMAGE_TAG:-topteen1.0}"
    pull_policy: never
    restart: unless-stopped
    environment:
      - SERVER_NAMES=${SERVER_NAMES:-localhost}
      - APP_UPSTREAM=web
      - APP_UPSTREAM_PORT=8000
      - CLIENT_MAX_BODY_SIZE=${CLIENT_MAX_BODY_SIZE:-25M}
      - USE_HTTPS=${USE_HTTPS:-False}
    ports:
      # Domain (no port in URL): http://domain/  https://domain/
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # IP testing only (optional aliases onto same nginx listeners)
      - "${TEST_HTTP_PORT:-8005}:80"
      - "${TEST_HTTPS_PORT:-8443}:443"
    volumes:
      # Static / media served from host data folder (same files Django collectstatic writes)
      - ${DATA_ROOT:-/data/topteens}/nginx/static:/var/www/html/static:ro
      - ${DATA_ROOT:-/data/topteens}/nginx/media:/var/www/html/media:ro
      # Runtime nginx conf (rw so SSL hook can enable/disable HTTPS block)
      - ${DATA_ROOT:-/data/topteens}/nginx/conf:/etc/nginx/conf.d
      - ${DATA_ROOT:-/data/topteens}/nginx/ssl:/etc/nginx/ssl:ro
      - ${DATA_ROOT:-/data/topteens}/nginx/logs:/var/log/nginx
      - ${DATA_ROOT:-/data/topteens}/certbot/webroot:/var/www/acme:ro
    depends_on:
      - web
    networks:
      - topteen_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_ROOT:-/data/topteens}/redis:/data
    networks:
      - topteen_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional local DB - enable with: COMPOSE_PROFILES=local-db ./docker_files/deploy.sh up
  mariadb:
    profiles: ["local-db"]
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-topteen}
      MARIADB_USER: ${DB_USER:-topteen}
      MARIADB_PASSWORD: ${DB_PASSWORD:-topteen}
    volumes:
      - ${DATA_ROOT:-/data/topteens}/mariadb:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    networks:
      - topteen_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    profiles: ["search"]
    image: elasticsearch:7.14.2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
    volumes:
      - ${DATA_ROOT:-/data/topteens}/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - topteen_net

  # Auto-renew Let's Encrypt (enable: COMPOSE_PROFILES=ssl or ssl,local-db)
  # After renew, ssl-deploy-hook.sh copies certs into nginx/ssl.
  # Reload nginx from host cron:  0 4 * * * /path/to/docker_files/deploy.sh ssl renew
  certbot:
    profiles: ["ssl"]
    image: certbot/certbot
    restart: unless-stopped
    environment:
      - NGINX_SSL_DIR=/nginx-ssl
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot
          --deploy-hook /hooks/ssl-deploy-hook.sh
          --quiet || true;
        sleep 12h & wait $${!};
      done'
    volumes:
      - ${DATA_ROOT:-/data/topteens}/certbot/conf:/etc/letsencrypt
      - ${DATA_ROOT:-/data/topteens}/certbot/webroot:/var/www/certbot
      - ${DATA_ROOT:-/data/topteens}/nginx/ssl:/nginx-ssl
      - ./ssl-deploy-hook.sh:/hooks/ssl-deploy-hook.sh:ro
    networks:
      - topteen_net

networks:
  topteen_net:
    name: "${PROJECT_NAME:-topteen}-topteen10-net"
    driver: bridge
