<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourism Mindmap UI</title>
  <link rel="stylesheet" href="./mindmap.css" />
</head>
<body>
  <header class="toolbar">
    <h1>Mind Map: Tourism Impacts</h1>
    <div class="toolbar-actions">
      <button id="zoomOutBtn" title="Zoom out">-</button>
      <button id="zoomInBtn" title="Zoom in">+</button>
      <button id="resetViewBtn" class="ghost">Reset View</button>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="canvas" id="canvas">
      <svg id="links" aria-hidden="true"></svg>
      <div id="mindmap" role="application" aria-label="Tourism mindmap"></div>
    </div>
  </main>

  <script src="./mindmap.js"></script>
</body>
</html>
