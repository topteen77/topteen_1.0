# TopTeens - Production: nginx (HTTP + HTTPS when SSL present), gunicorn, celery
# Dev: use docker/docker-compose.local.yaml for HTTP-only Django runserver
# Usage: ./deploy.sh   or   docker compose up -d

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: topteens-web:latest
    working_dir: /app
    command: /start.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-6}
      - REDIS_HOST=redis
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: topteens-nginx:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - static_volume:/var/www/html/static:ro
      - media_volume:/var/www/html/media:ro
      - ${SSL_CERT_PATH:-./ssl}:/etc/nginx/ssl:ro
    environment:
      - SSL_CERT_PATH=/etc/nginx/ssl
    depends_on:
      - web

  celery:
    image: topteens-web:latest
    command: celery -A topteens worker -l info
    working_dir: /app
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    depends_on:
      - web
      - redis

  celery_beat:
    image: topteens-web:latest
    command: celery -A topteens beat -l info
    working_dir: /app
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    depends_on:
      - web
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis_volume:/data

volumes:
  static_volume:
  media_volume:
  redis_volume:
