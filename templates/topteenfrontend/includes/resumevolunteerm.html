{% for v in resumevolunteer %}
<div class="addedData flex justify-between w-full py-[12px] selectedSkillMobile">
    <div class="flex flex-col gap-[5px]">
        <p class="text-[15px] leading-[20.25px] semibold text-[#4f4f4f]">{{v.title}}</p>
        <p class=" text-[#828282] regularFont text-[13px] leading-[17.55px]">{{v.role}}  •  {% if v.start_date %}{{v.start_date.strftime("%b, %Y")}} - {{v.start_date.strftime("%b, %Y")}}{% endif %}</p>
    </div>

    <button type="button" class="dataDelete" onclick="addedDeleteHandler(this)" data-id="{{v.id}}" data-title="{{v.title}}" data-url="{{url('resumevolunteer')}}" data-mdivid="volunteerm" data-ddivid="volunteerd"><i
            class="fa-solid fa-circle-xmark text-[#bdbdbd] my-auto"></i></button>
</div>
{% endfor %}
