<!-- SET PASSWORD POPUP -->
<div class="hideModal modalPopup" id="setPasswordDiv">
  <div class="modalContent">
    <button type="button" class="modalCloser" aria-label="Close">
      <i class='bx bx-x fs-24'></i>
    </button>

    <div class="text-center py-3">
      <div class="mb-4">
        <div class="mx-auto d-flex align-items-center justify-content-center bg-light rounded-circle" style="width: 68px; height: 68px;">
          <i class='bx bx-key fs-48 text-purple'></i>
        </div>
      </div>
      <h3 class="fs-24 fw-700 text-dark mb-3">Set Your Password</h3>

      <p class="text-gray fs-15 mb-3 px-3">
        Please set a secure password for your account
      </p>

      <p id="errorMsgSetPassword" class="text-danger fs-12 mb-3"></p>

      <form onsubmit="return setPassword()" id="setPasswordForm" class="px-3">
        <div class="w-full mb-2">
          <input
            class="w-full h-[48px] border-[2px] border-[#3F37C9] rounded-xl bg-[#FFFFFF]"
            type="password"
            name="password"
            id="setPasswordInput"
            placeholder="Enter new password"
            required
            minlength="8"
          />
        </div>
        <div class="w-full mb-2">
          <input
            class="w-full h-[48px] border-[2px] border-[#3F37C9] rounded-xl bg-[#FFFFFF]"
            type="password"
            name="confirm_password"
            id="setPasswordConfirmInput"
            placeholder="Confirm new password"
            required
            minlength="8"
          />
        </div>
        <p id="passwordMatchMsgSet" class="text-[12px] text-center mb-2" style="display: none;"></p>
      
        <p
          id="errorMsgSet"
          class="text-[12px] leading-[21.6px] tracking-[1%] text-center"
          style="color: red"
        ></p>
        <div
          class="mx-auto w-[344px] h-[53px] rounded-[10px] bg-[#2E289D] mt-[12px]"
        >
          <button
            type="submit"
            class="w-[344px] h-[48px] rounded-[10px] bg-[#3f37c9] boldFont text-[14px] leading-[18.9px] text-[#ffffff] tracking-[1%]"
          >
            SET PASSWORD
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function checkPasswordMatchSet() {
  const password = document.getElementById('setPasswordInput').value;
  const confirmPassword = document.getElementById('setPasswordConfirmInput').value;
  const matchMsg = document.getElementById('passwordMatchMsgSet');
  
  if (confirmPassword.length === 0) {
    matchMsg.style.display = 'none';
    return;
  }
  
  matchMsg.style.display = 'block';
  
  if (password === confirmPassword) {
    matchMsg.textContent = '✓ Passwords match';
    matchMsg.style.color = '#10b981';
  } else {
    matchMsg.textContent = '✗ Passwords do not match';
    matchMsg.style.color = '#ef4444';
  }
}

// Add event listeners
document.addEventListener('DOMContentLoaded', function() {
  const passwordInput = document.getElementById('setPasswordInput');
  const confirmInput = document.getElementById('setPasswordConfirmInput');
  
  if (passwordInput) {
    passwordInput.addEventListener('keyup', function() {
      checkPasswordMatchSet();
    });
  }
  
  if (confirmInput) {
    confirmInput.addEventListener('keyup', function() {
      checkPasswordMatchSet();
    });
  }
});

function setPassword() {
  var formData = new FormData(document.getElementById("setPasswordForm"));
  var password = formData.get("password");
  var confirmPassword = formData.get("confirm_password");
  
  // Clear previous errors
  var errorTag = document.getElementById("errorMsgSetPassword");
  if (errorTag) {
    errorTag.textContent = "";
  }
  
  // Validate passwords match
  if (password !== confirmPassword) {
    if (errorTag) {
      errorTag.textContent = "Passwords do not match";
    }
    return false;
  }
  
  // Validate password length
  if (password.length < 8) {
    if (errorTag) {
      errorTag.textContent = "Password must be at least 8 characters long";
    }
    return false;
  }
  
  // Disable submit button
  var submitButton = document.querySelector('#setPasswordForm button[type="submit"]');
  if (submitButton) {
    submitButton.disabled = true;
    submitButton.textContent = "Setting Password...";
    submitButton.style.opacity = "0.6";
  }
  
  // Helper function to get CSRF token from cookies
  function getCookie(name) {
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      var cookies = document.cookie.split(';');
      for (var i = 0; i < cookies.length; i++) {
        var cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
  
  // Get setpassword URL from global variable or use template
  var setPasswordUrl = typeof userssetpassword !== 'undefined' ? userssetpassword : "{{ url('users:setpassword') }}";
  
  $.ajax({
    type: "POST",
    url: setPasswordUrl,
    data: formData,
    dataType: 'json',  // Explicitly expect JSON response
    beforeSend: function(xhr) {
      var csrfToken = getCookie('csrftoken');
      if (csrfToken) {
        xhr.setRequestHeader("X-CSRFToken", csrfToken);
      }
    },
    success: function (data) {
      console.log("SetPassword response:", data);
      console.log("Response type:", typeof data);
      console.log("Redirect URL:", data.redirect_url);
      
      // Re-enable button
      if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent = "SET PASSWORD";
        submitButton.style.opacity = "1";
      }
      
      // Check if data is a string (needs parsing) or object
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (e) {
          console.error("Failed to parse response:", e);
          if (errorTag) {
            errorTag.textContent = "Error processing response. Please try again.";
          }
          return;
        }
      }
      
      if (data && data.success) {
        // Close set password modal
        var setPasswordDiv = document.getElementById("setPasswordDiv");
        if (setPasswordDiv) {
          setPasswordDiv.classList.add("hideModal");
        }
        
        // Redirect immediately
        var redirectUrl = data.redirect_url || "{{ url('users:userdashboard') }}";
        console.log("Redirecting to:", redirectUrl);
        
        // Force immediate redirect
        if (redirectUrl && redirectUrl !== 'undefined' && redirectUrl !== 'null') {
          // Use replace for immediate redirect
          window.location.replace(redirectUrl);
        } else {
          // Fallback redirect
          var fallbackUrl = "{{ url('users:userdashboard') }}";
          console.log("Using fallback URL:", fallbackUrl);
          window.location.replace(fallbackUrl);
        }
      } else {
        // Show error message
        if (errorTag) {
          errorTag.textContent = data.message || "Failed to set password. Please try again.";
        }
      }
    },
    error: function (xhr, status, error) {
      // Re-enable button
      if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent = "SET PASSWORD";
        submitButton.style.opacity = "1";
      }
      
      var errorMessage = "Unable to set password. Please try again.";
      if (xhr.responseJSON && xhr.responseJSON.message) {
        errorMessage = xhr.responseJSON.message;
      } else if (xhr.responseText) {
        try {
          var errorData = JSON.parse(xhr.responseText);
          if (errorData.message) {
            errorMessage = errorData.message;
          }
        } catch (e) {
          // Use default message
        }
      }
      
      if (errorTag) {
        errorTag.textContent = errorMessage;
      }
      
      if (xhr.status === 403) {
        fireAlert("Session expired. Refreshing page...", "warning");
        setTimeout(function() {
          window.location.reload();
        }, 1500);
      }
    },
    cache: false,
    contentType: false,
    processData: false,
  });
  return false;
}
</script>
