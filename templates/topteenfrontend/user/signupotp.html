<!-- OTP -->
<div class="hideModal modalPopup" id="otpDiv">
  <div class="modalContent">
    <button type="button" class="modalCloser" aria-label="Close">
      <i class='bx bx-x fs-24'></i>
    </button>

    <div class="text-center py-3">
      <div class="mb-4">
        <div class="mx-auto d-flex align-items-center justify-content-center bg-light rounded-circle" style="width: 68px; height: 68px;">
          <i class='bx bx-mobile fs-48 text-purple'></i>
        </div>
      </div>

      <h3 class="fs-24 fw-700 text-dark mb-3">Check your phone</h3>

      <p class="text-gray fs-15 mb-3 px-3">

        <span class="text-purple fw-600" id="signupotpname"></span>
      </p>
      
      <p id="errorMsgOtpSinguplogin" class="text-danger fs-12 mb-3"></p>
      
      <form onsubmit="return loginsingupotp()" id="singupotp" class="px-3">
        <div class="d-flex justify-content-between gap-2 mb-4 otp-inputs-container">
          <input
            name="otp"
            class="form-control otpSource oinputs otpIp text-center"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{1}"
            minlength="1"
            maxlength="1"
            min="0"
            max="9"
            style="width: 50px; height: 50px; font-size: 20px; font-weight: 600;"
          />

          <input
            name="otp"
            class="form-control oinputs otpIp text-center"

            maxlength="1"

          />

          <input
            name="otp"
            class="form-control oinputs otpIp text-center"
            type="text"
            inputmode="numeric"

            pattern="[0-9]{1}"
            minlength="1"

            max="9"

          />

          <input

            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{1}"
            minlength="1"
            maxlength="1"

          />

          />

          <input

            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"

            maxlength="1"

            max="9"
            style="width: 50px; height: 50px; font-size: 20px; font-weight: 600;"

        <p class="text-gray fs-14 text-center mb-4">
