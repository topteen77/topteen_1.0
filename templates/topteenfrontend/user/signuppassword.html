<!-- DOUBLE PASSWORD FIELD -->
<div
  class="top-0 inset-x-0 z-50 fixed mx-auto bg-black bg-opacity-50 h-screen flex flex-row justify-center items-center hideModal"
  id="signUpPwdDiv"
>
  <div
    class="lg:max-w-[1280px] h-full mx-auto relative flex flex-row justify-center items-center"
  >
    <div
      id="otpPopUp"
      class="bg-[#FFFFFF] rounded-[10px] relative w-[96%] max-w-[395px] lg:w-[395px] pb-[24px] pt-[55px] lg:pt-[69px] modalContent px-4"
    >
      <button
        class="absolute top-[16px] right-[22px] lg:top-[30px] lg:right-[24px] modalCloser"
      >
        <i class="fa fa-xmark"></i>
      </button>
      <div class="w-[68px] h-[68px] mx-auto">
        <img
          src="{{static('topteenfrontend/assets/images/smartphone 1.png')}}"
          class="w-[68px] h-[68px]"
          alt=""
        />
      </div>
      <p
        class="text-[24px] leading-[32.4px] -tracking-[2%] text-center semibold mt-[22px]"
      >
        Enter your password
      </p>
      <p
        class="text-[16px] leading-[21.6px] -tracking-[1.5%] regularFont text-center w-[354px] mx-auto mt-[17px] text-[#494949] text-opacity-80"
      >
        To continue, please enter the password for your account
        <span
          class="text-opacity-100 text-[#3F37C9] semibold"
          id="signuppwdname"
        >
        </span>
      </p>
      <p
        id="errorMsgOtpSinguploginpwd"
        class="text-[12px] leading-[21.6px] tracking-[1%] text-center"
        style="color: red"
      ></p>
      <form onsubmit="return loginsinguppwd()" class="w-[344px] mx-auto mt-[25px]" id="singuppwd">
        <div class="w-full mb-2">
          {% if enc_referral_user %}
          <input type="hidden" name="enc_referral_user" value="{{enc_referral_user}}">
          {% endif %}
          <input
            class="w-full h-[48px] border-[2px] border-[#3F37C9] rounded-xl bg-[#FFFFFF]"
            type="password"
            name="password"
            id="signupPassword"
            placeholder="Enter password"
            onkeyup="checkPasswordStrength(this.value)"
          />
          <!-- Password Strength Indicator -->
          <div id="passwordStrength" class="mt-2" style="display: none;">
            <div class="w-full bg-gray-200 rounded-full h-2">
              <div id="passwordStrengthBar" class="h-2 rounded-full transition-all" style="width: 0%;"></div>
            </div>
            <p id="passwordStrengthText" class="text-[12px] mt-1 text-center"></p>
          </div>
        </div>
        <div class="w-full flex justify-center items-center mb-2">
          <input
            class="w-full h-[48px] border-[2px] border-[#3F37C9] rounded-xl bg-[#FFFFFF]"
            type="password"
            name="confirm_password"
            id="signupConfirmPassword"
            placeholder="Confirm Password"
            onkeyup="checkPasswordMatch()"
          />
        </div>
        <p id="passwordMatchMsg" class="text-[12px] text-center mb-2" style="display: none;"></p>
      
      <p
        id="errorMsg"
        class="text-[12px] leading-[21.6px] tracking-[1%] text-center"
        style="color: red"
      ></p>
      <div
        class="mx-auto w-[344px] h-[53px] rounded-[10px] bg-[#2E289D] mt-[12px]"
      >
        <button
          type="submit"
          class="w-[344px] h-[48px] rounded-[10px] bg-[#3f37c9] boldFont text-[14px] leading-[18.9px] text-[#ffffff] tracking-[1%]"
        >
          SUBMIT
        </button>
      </div>
      </form>
    </div>
  </div>
</div>

<script>
function checkPasswordStrength(password) {
  const strengthDiv = document.getElementById('passwordStrength');
  const strengthBar = document.getElementById('passwordStrengthBar');
  const strengthText = document.getElementById('passwordStrengthText');
  
  if (!password || password.length === 0) {
    strengthDiv.style.display = 'none';
    return;
  }
  
  strengthDiv.style.display = 'block';
  
  let strength = 0;
  let feedback = [];
  
  // Length check
  if (password.length >= 8) {
    strength += 25;
  } else {
    feedback.push('At least 8 characters');
  }
  
  // Lowercase check
  if (/[a-z]/.test(password)) {
    strength += 25;
  } else {
    feedback.push('lowercase letter');
  }
  
  // Uppercase check
  if (/[A-Z]/.test(password)) {
    strength += 25;
  } else {
    feedback.push('uppercase letter');
  }
  
  // Number or special character check
  if (/[0-9]/.test(password) || /[^A-Za-z0-9]/.test(password)) {
    strength += 25;
  } else {
    feedback.push('number or special character');
  }
  
  // Update strength bar
  strengthBar.style.width = strength + '%';
  
  // Update color and text
  if (strength <= 25) {
    strengthBar.style.backgroundColor = '#ef4444'; // red
    strengthText.textContent = 'Weak - Add: ' + feedback.join(', ');
    strengthText.style.color = '#ef4444';
  } else if (strength <= 50) {
    strengthBar.style.backgroundColor = '#f59e0b'; // orange
    strengthText.textContent = 'Fair - Add: ' + feedback.join(', ');
    strengthText.style.color = '#f59e0b';
  } else if (strength <= 75) {
    strengthBar.style.backgroundColor = '#3b82f6'; // blue
    strengthText.textContent = 'Good - Add: ' + feedback.join(', ');
    strengthText.style.color = '#3b82f6';
  } else {
    strengthBar.style.backgroundColor = '#10b981'; // green
    strengthText.textContent = 'Strong password!';
    strengthText.style.color = '#10b981';
  }
}

function checkPasswordMatch() {
  const password = document.getElementById('signupPassword').value;
  const confirmPassword = document.getElementById('signupConfirmPassword').value;
  const matchMsg = document.getElementById('passwordMatchMsg');
  
  if (confirmPassword.length === 0) {
    matchMsg.style.display = 'none';
    return;
  }
  
  matchMsg.style.display = 'block';
  
  if (password === confirmPassword) {
    matchMsg.textContent = '✓ Passwords match';
    matchMsg.style.color = '#10b981';
  } else {
    matchMsg.textContent = '✗ Passwords do not match';
    matchMsg.style.color = '#ef4444';
  }
}
</script>
<!-- DOUBLE PASS ENDS -->
