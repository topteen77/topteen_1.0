<!-- DOUBLE PASSWORD FIELD -->
<div class="hideModal modalPopup" id="signUpPwdDiv">
  <div class="modalContent">
    <button type="button" class="modalCloser" aria-label="Close">
      <i class='bx bx-x fs-24'></i>
    </button>

    <div class="text-center py-3">
      <div class="mb-4">
        <div class="mx-auto d-flex align-items-center justify-content-center bg-light rounded-circle" style="width: 68px; height: 68px;">
          <i class='bx bx-mobile fs-48 text-purple'></i>
        </div>
      </div>
      <h3 class="fs-24 fw-700 text-dark mb-3">Enter your password</h3>

      <p class="text-gray fs-15 mb-3 px-3">
        To continue, please enter the password for your account
        <span class="text-purple fw-600" id="signuppwdname"></span>
      </p>

      <p id="errorMsgOtpSinguploginpwd" class="text-danger fs-12 mb-3" style="display: none; min-height: 20px;"></p>

      <form onsubmit="event.preventDefault(); return loginsinguppwd();" method="post" action="#" id="singuppwd" class="px-3" style="max-width: 360px; margin: 0 auto;">
        <div class="w-full mb-2">
          {% if enc_referral_user %}
          <input type="hidden" name="enc_referral_user" value="{{enc_referral_user}}">
          {% endif %}
          
          <!-- Class Selection Dropdown -->
          <select
            class="form-select custom-input mb-3"
            name="grade"
            id="signupGrade"
            required
            style="height: 48px; border-radius: 12px;"
          >
            <option value="10" selected>Class 10</option>
            <option value="12">Class 12</option>
          </select>
          
          <div class="w-full mb-3">
            <input
              class="form-control custom-input"
              type="password"
              name="password"
              id="signupPassword"
              placeholder="Enter password"
              onkeyup="checkPasswordMatch()"
              autocomplete="new-password"
              style="height: 48px; border-radius: 12px;"
            />
          </div>
        </div>
        <div class="w-full mb-2">
          <input
            class="form-control custom-input"
            type="password"
            name="confirm_password"
            id="signupConfirmPassword"
            placeholder="Confirm Password"
            onkeyup="checkPasswordMatch()"
            autocomplete="new-password"
            style="height: 48px; border-radius: 12px;"
          />
        </div>
        <p id="passwordMatchMsg" class="fs-12 text-center mb-2" style="display: none;"></p>
      
        <button type="submit"
                class="btn custom-button purple-button w-100 fw-600 mt-2"
                style="height: 48px; border-radius: 12px;">
          Create account
        </button>
      </form>
    </div>
  </div>
</div>

<script>
function checkPasswordMatch() {
  const password = document.getElementById('signupPassword').value;
  const confirmPassword = document.getElementById('signupConfirmPassword').value;
  const matchMsg = document.getElementById('passwordMatchMsg');
  
  if (confirmPassword.length === 0) {
    matchMsg.style.display = 'none';
    return;
  }
  
  matchMsg.style.display = 'block';
  
  if (password === confirmPassword) {
    matchMsg.textContent = '✓ Passwords match';
    matchMsg.style.color = '#10b981';
  } else {
    matchMsg.textContent = '✗ Passwords do not match';
    matchMsg.style.color = '#ef4444';
  }
}
</script>
<!-- DOUBLE PASS ENDS -->
