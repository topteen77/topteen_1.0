{% extends 'topteenfrontend/user/user_base.html' %}
 
{% block main %}
<main class="w-full lg:max-w-[1280px] mx-auto pt-[12px] lg:pt-[60px] bg-[#ffffff] ">

    <!-- Notes Heading -->
    <section class="lg:px-20 fixed lg:relative top-[0px] pt-[12px] lg:pt-0 z-30 w-full bg-[#ffffff]">
        <div
            class="py-[24px] border-b-[2px] lg:border-b-0 border-solid border-[#ebebee] relative px-[20px] lg:px-[100px]">
            <button type="button" class="absolute top-[15px] left-[24px]" onclick="window.location='{{url('users:mynotepad')}}'">
                <i class="fa-solid fa-arrow-left text-[#828282] text-[18px] leading-[50px]"></i>
            </button>

            <button type="button" onclick="saveNoteSubmitForm();" class="w-[144px] h-[53px] bg-[#2e289d] rounded-[100px] absolute top-[15px] right-[24px] hidden lg:block overflow-hidden">
                <div class="h-full w-full relative">
                    <div class="w-[144px] flex justify-center items-center gap-[8px] h-[48px] rounded-[100px] bg-[#3f37c9] absolute top-0">
                        <p class="text-[#ffffff] text-[14px] leading-[19px] boldFont">Save</p>
                    </div>
                </div>

            </button>
        </div>

    </section>
    <!-- End of Notes Heading -->

    <!-- Content -->
    <form method="POST" enctype="multipart/form-data" id="createnoteform" class="h-full pt-[60px] lg:py-[36px]">
        <section class="pt-[24px] px-[24px] lg:px-[100px] notesContent h-full">
            <img src="{{static("topteenfrontend/assets/images/folders.svg")}}" class="w-[36px] h-[51px] lg:w-[48px] lg:h-[68px] ml-[12px]" alt="">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <input type="hidden" name="obj_id" value="{{note.id}}">
            <input name="title" type="text" {% if note.title %} value="{{note.title}}" {% endif %} class="block text-[24px] leading-[32px] semibold px-0 border-none w-full notesdAdding" placeholder="Untitled" >
            <textarea placeholder="Tap here to continue..." name="content" id="" class="w-full h-screen px-0 notesAdding border-none mt-[12px]">{% if note.content %}{{note.content}}{% endif %}</textarea>
        </section>
    </form>
    <!-- Content -->

    <div class="flex justify-center lg:hidden fixed bottom-[120px] left-[50%] -translate-x-[50%] z-30">

        <button type="button" onclick="saveNoteSubmitForm();"  class="w-[144px] h-[53px] bg-[#2e289d] rounded-[100px] relative my-auto">
            <div class="w-[144px] flex justify-center items-center gap-[8px] h-[48px] rounded-[100px] bg-[#3f37c9] absolute top-0">
                <p class="text-[#ffffff] text-[14px] leading-[19px] boldFont">Save</p>
            </div>
        </button>

    </div>
   
</main>
{% endblock %}
{% block additionalfooter %} 
<script type="text/javascript">
    $("#createnoteform").on("input",function(){
            saveNoteData();
    });
    function saveNoteSubmitForm(){
        saveNoteData();
        fireAlert("Note Saved","success");
    }
    function saveNoteData(){
        var formData = new FormData(document.getElementById("createnoteform"));
        $.ajax({
            url: "{{url('usernotesave')}}",
            type: 'POST',
            data: formData,
            success: function (data) {
                console.log("save data")
            },
            error: function(data){
                try{
                   fireAlert(data.responseJSON.message,"error");
                }
                catch(e){
                    fireAlert("Internal Server Error","error");
                }
              },
            cache: false,
            contentType: false,
            processData: false
        });
    }

</script>
{% endblock %}
