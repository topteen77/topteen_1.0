<!-- LOGIN WITH PASSWORD MODAL -->
<div class="top-0 inset-x-0 z-50 fixed mx-auto bg-black bg-opacity-50 h-screen flex flex-row justify-center items-center hideModal modalPopup" id="loginpwdDiv">
  <div class="lg:max-w-[1280px] h-full mx-auto relative flex flex-row justify-center items-center">
    <div id="otpPopUp" class="bg-[#ffffff] rounded-[12px] relative w-[96%] max-w-[420px] lg:w-[420px] pb-[24px] pt-[48px] lg:pt-[56px] modalContent px-4 px-lg-4">
      <button type="button" class="modalCloser" aria-label="Close">
        <i class="bx bx-x fs-24"></i>
      </button>
      

      <div class="w-[64px] h-[64px] mx-auto text-center">
        <img
          src="{{static('topteenfrontend/assets/images/smartphone 1.png')}}"
          class="w-[64px] h-[64px]"
          alt="password"
        />
      </div>

      <p class="fs-22 mt-3 mb-2 fw-700 text-purple text-center">
        Enter your password
      </p>

      <p class="fs-15 leading-[21.6px] regularFont text-center mx-auto mt-2 text-[#494949] text-opacity-80" style="max-width: 360px;">
        To continue, please enter the password for your account
        <span class="text-opacity-100 text-[#3f37c9] fw-600" id="loginpwdname">shaurya.verma@gmail.com</span>
      </p>

      <p id="errorMsgloginpwd" class="fs-12 text-center mt-2 mb-0" style="color: #dc2626;"></p>

      <form onsubmit="return loginpwd()" class="mx-auto mt-3" id="loginpwd" style="max-width: 360px;">
        <div class="w-full mb-3">
          <input class="form-control custom-input"
                 type="password"
                 name="password"
                 placeholder="Enter password"
                 autocomplete="current-password"
                 style="height: 48px; border-radius: 12px;" />
        </div>
        
        <!-- Remember Me Checkbox and Forgot Password Link -->
        <div class="w-full d-flex align-items-center justify-content-between mb-3">
          <label class="d-flex align-items-center gap-2 mb-0" for="remember_me" style="font-size: 14px; color: #494949;">
            <input type="checkbox" name="remember_me" id="remember_me" value="1" style="width: 16px; height: 16px;">
            Remember me
          </label>
          <button type="button"
                  onclick="return forgotpasswordshow()"
                  class="btn p-0"
                  style="background: transparent; border: none; color: #3f37c9; font-size: 14px; font-weight: 600;">
            Forgot password?
          </button>
        </div>

        <button type="submit"
                class="btn custom-button purple-button fw-600 w-100"
                style="height: 48px; border-radius: 12px;">
          Continue
        </button>

        <button type="button"
                onclick="return loginwithotpshow()"
                class="btn custom-button outline-button fw-600 w-100 mt-3"
                style="height: 48px; border-radius: 12px;">
          Login with OTP
        </button>

      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Auto-focus on password input when modal loads
    const passwordInput = document.querySelector('#loginpwd input[name="password"]');
    if (passwordInput) {
        // Focus the input field
        passwordInput.focus();
        
        // For password input - submit form on Enter
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginpwd();
            }
        });
    }
});
</script>
<!-- LOGIN WITH PASSWORD MODAL ENDS -->
