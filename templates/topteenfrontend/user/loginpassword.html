<!-- DOUBLE PASSWORD FIELD -->
<div
  class="top-0 inset-x-0 z-50 fixed mx-auto bg-black bg-opacity-50 h-screen flex flex-row justify-center items-center hideModal modalPopup"
  id="loginpwdDiv"
>
  <div
    class="lg:max-w-[1280px] h-full mx-auto relative flex flex-row justify-center items-center"
  >
    <div
      id="otpPopUp"
      class="bg-[#ffffff] rounded-[10px] relative w-[96%] max-w-[395px] lg:w-[395px] pb-[24px] pt-[55px] lg:pt-[69px] modalContent px-4"
    >
    <button type="button" class="modalCloser" aria-label="Close">
      <i class="bx bx-x fs-24"></i>
    </button>
      

      <div class="w-[68px] h-[68px] mx-auto text-center">
        <img
          src="{{static('topteenfrontend/assets/images/smartphone 1.png')}}"
          class="w-[68px] h-[68px]"
          alt=""
        />
      </div>

      <p
        class="fs-22 mt-2 mb-4 fw-700 text-purple text-center "
      >
        Enter your password
      </p>

      <p
        class="text-[16px] leading-[21.6px] -tracking-[1.5%] regularFont text-center w-[354px] mx-auto mt-[17px] text-[#494949] text-opacity-80"
      >
        To continue, please enter the password for your account
        <span class="text-opacity-100 text-[#3f37c9] semibold" id="loginpwdname"
          >shaurya.verma@gmail.com
        </span>
      </p>
      <p
        id="errorMsgloginpwd"
        class="text-[12px] leading-[21.6px] tracking-[1%] text-center"
        style="color: red"
      ></p>
      <form onsubmit="return loginpwd()" class="w-[344px] mx-auto mt-[25px]" id="loginpwd">
        <div class="w-full mb-2">
          <input
            class="w-full h-[48px] border-[2px] border-[#3F37C9] rounded-xl bg-[#FFFFFF]"
            type="password"
            name="password"
            placeholder="Enter password"
          />
        </div>
        
        <!-- Remember Me Checkbox and Forgot Password Link -->
        <div class="w-full mb-2" style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center;">
            <input
              type="checkbox"
              name="remember_me"
              id="remember_me"
              value="1"
              class="w-4 h-4 border-[#3F37C9] rounded text-[#3F37C9] focus:ring-[#3F37C9]"
            />
            <label for="remember_me" class="ms-2 text-[14px] leading-[21.6px] text-[#494949] regularFont">
              Remember me
            </label>
          </div>
          <button 
            type="button" 
            onclick="return forgotpasswordshow()"
            style="background: transparent; border: none; cursor: pointer; padding: 0; margin: 0; text-decoration: none; color: #3f37c9; font-size: 14px; line-height: 21.6px; font-weight: 600;"
            onmouseover="this.style.textDecoration='underline'; this.style.color='#2e289d';"
            onmouseout="this.style.textDecoration='none'; this.style.color='#3f37c9';"
          >
            Forgot password?
          </button>
        </div>
      
     
      <div
        class="mx-auto w-[344px] h-[53px] rounded-[10px] bg-[#2e289d] mt-[12px]"
      >
        <button type="submit"
          
          class="w-[344px] h-[48px] rounded-[10px] bg-[#3f37c9] boldFont text-[14px] leading-[18.9px] text-[#ffffff] tracking-[1%]"
        >
          SUBMIT
        </button>
      

      </div>

    

      <div
        class="mx-auto w-[344px] h-[53px] rounded-[10px] bg-[#2e289d] mt-[12px]"
      >
        <button type="button" onclick="return loginwithotpshow()" class="mt-2 w-100 h-[48px] rounded-[10px] bg-[#3F37C9] boldFont text-[14px] leading-[18.9px] text-[#FFFFFF] tracking-[1%] btn custom-button  blue-button">
        Login with OTP
        </button>
      
      </div>



    </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Auto-focus on password input when modal loads
    const passwordInput = document.querySelector('#loginpwd input[name="password"]');
    if (passwordInput) {
        // Focus the input field
        passwordInput.focus();
        
        // For password input - submit form on Enter
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginpwd();
            }
        });
    }
});
</script>
<!-- DOUBLE PASS ENDS -->
