<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup/Photo</title>
    <link href="{{static('topteenfrontend/assets/css/custom.css')}}"rel="stylesheet"/>
    <link href="{{static("topteenfrontend/assets/css/styles.css")}}" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/75bd64d95c.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class='w-full h-full'>
        <!-- header -->
        <header class='flex justify-between items-center mt-[27px] lg:mt-[35px]  '>
            <img class='h-[15px] w-[15px] ml-[20px] lg:ml-[100px] ' src='../assets/images/arrow.left.png' />
            <div class=' justify-center space-x-1 items-center ml-[30px] lg:ml-[0px] mr-[0px] lg:mr-[100px] flex'>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full'></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full '></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full '></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full  opacity-30'></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full opacity-30'></div>
            </div>
            <!-- <h2 class='text-[#494949] font-bold lg:hidden flex'>LOG IN</h2> -->
            <p class='text-[#3F37C9] flex lg:hidden text-[16px] font-semibold pr-[20px]'>SKIP</p>
            <p class='text-white hidden lg:flex'>1</p>
        </header>
        <!-- second line -->
        <div class='flex justify-center items-center font-semibold text-[24px] mt-[20px] lg:mt-[30px]'>
            <P>Show us how you look</P>
        </div>
        <!-- third line -->
        <div class='flex justify-center items-center font-normal text-center text-[16px] mt-[10px]'>
            <P class=' w-[344px] h-[44px] text-[#494949]'>Join a community of 10k+ students and discover your true
                passion.</P>
        </div>

        <!-- center portion -->
        <div class='flex justify-center items-center w-full h-full mt-[50px]'>
            <div class='h-[230px] w-[230px] bg-[#F7F7FA] rounded-full flex justify-center items-center'>
                <img src='../assets/images/person.fill (1).png' />
            </div>
        </div>



        <!-- button -->
        <div class='w-full flex justify-center items-center mt-[95px] lg:mt-[60px] '>
            <button class='w-[344px] h-[48px] bg-[#3F37C9] rounded-xl text-white font-bold'>CONTINUE</button>
        </div>

        <!-- footer -->
    </div>

    <div
        class='h-[50px]  flex flex-col bg-[#F9F9F9] lg:hidden justify-center items-center border-t-[1px] border-gray-500 mt-7'>
        <div class='flex justify-center items-center space-x-[3px]'>
            <P>topteen.com</P>
            <img src='../assets/images/trust.png' />
        </div>
        <div class='bg-[#4B4B4B] h-[5px] w-[139px] rounded-full mt-[5px] mb-[8px]'></div>
    </div>


</body>

</html>
