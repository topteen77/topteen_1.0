
<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <meta name="googlebot" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{static ('images/favicon/apple-touch-icon.png')}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{static ('images/favicon/favicon-32x32.png')}}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{static ('images/favicon/favicon-16x16.png')}}">
  <link rel="mask-icon" href="{{static ('images/favicon/safari-pinned-tab.svg ')}}" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <title>Every Student, Career Ready | TopTeen</title>

  <!-- Bootstrap CSS -->
  <link rel="preload stylesheet" href="{{static ('css/bootstrap.min.css' )}}">
  <link rel="preload stylesheet" href="{{static ('font/font-style.css' )}}">
  <link rel="stylesheet" href="{{ static ('css/custom-min.css' )}}" type="text/css" media="all" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.1/font/bootstrap-icons.css">
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
  <link rel="stylesheet" type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />
  <!-- custom- js -->

</head>

<body>
  <section class="login-home">
    <div class="container">
      <div class="row">
        <div class="col-md-5 mx-auto ">
          <div class="logo-header text-center my-4"> <img src="{{static ('images/logo.svg')}}" alt="Logo" /> </div>
          <form method="post" action="">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <div class="login-screen  text-center p-5">
              <div class="sample-img"> <img style="width:200px;" src="{{static ('images/login-image.png')}}"
                  alt="topteen" /> </div>
              <h1 class="fs-25 mt-2 mb-5 fw-600" style="color: #333333">LOGIN</h1>
              {% if messages %}
              <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                  {{ message }}
                </div>
                {% endfor %}
              </div>
              {% endif %}
              <div class="form-row">
                <div class="col mb-4">
                  <input type="text" id="Username" name="Username" class="form-control custom-input" placeholder="Enter Username">
                  <div class="invalid-feedback float-start text-start mt-0"> Please Enter Correct username. </div>
                </div>
                <div class="col mb-4">
                  <input type="password" id="password" name="password" class="form-control custom-input" placeholder="Enter Password">

                  <div class="invalid-feedback float-start text-start mt-0"> Please Enter Correct Password. </div>
                </div>
                <div class="setting-button">
                  <button type="submit" class="purple-button button"> SUBMIT </button>
                </div>

              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"
    integrity="sha512-bPs7Ae6pVvhOSiIcyUClR7/q2OAsRiovw4vAkX+zJbw3ShAeeqezq50RIIcIURq7Oa20rW2n2q+fyXBNcU9lrw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="{{ static ('js/bootstrap.min.js')}}"></script>
    <script src="{{ static ('js/main.js')}}"></script>
    <script src="{{ static ('js/jquery.sticky.js')}}"></script>
</body>

</html>
