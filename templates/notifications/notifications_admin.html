{% extends "user_analytics/admin_base.html" %}

{% block title_content %}Notifications | Top Teen{% endblock %}
{% block page_title %}Notifications{% endblock %}

{% block content %}
<div class="admin-content">
  <div class="admin-card mb-3">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label">Type</label>
        <select id="nType" class="form-select">
          <option value="">All</option>
          {% for t in type_configs %}
          <option value="{{ t.event_type }}">{{ t.event_type }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Environment</label>
        <select id="nEnv" class="form-select">
          {% for env_value, env_label in environments %}
          <option value="{{ env_value }}" {% if env_value == current_environment %}selected{% endif %}>{{ env_label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Search</label>
        <input id="nQ" class="form-control" placeholder="Search by notification text">
      </div>
      <div class="col-md-12 d-flex align-items-end gap-2 justify-content-end">
        <button id="nFilter" class="btn btn-primary w-100">Apply</button>
        <button id="nMarkAll" class="btn btn-outline-secondary">Clear all</button>
        <button id="nDeleteAllEnv" class="btn btn-outline-danger">Delete all selected environment</button>
      </div>
    </div>
  </div>
  <div class="admin-card">
    <div id="nList" class="list-group"></div>
    <nav class="mt-3"><ul class="pagination justify-content-center" id="nPager"></ul></nav>
  </div>
</div>
<script>
  (function () {
    var listUrl = '{{ url("notifications:list_api") }}';
    var markReadUrl = '{{ url("notifications:mark_read_api") }}';
    var markAllUrl = '{{ url("notifications:mark_all_read_api") }}';
    var deleteAllUrl = '{{ url("notifications:delete_all_api") }}';
    var page = 1;
    function csrfToken() {
      var m = document.cookie.match(/csrftoken=([^;]+)/);
      return m ? m[1] : '';
    }
    function esc(s) { return String(s || '').replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
    function load() {
      var p = new URLSearchParams();
      p.set('page', page);
      if (document.getElementById('nEnv').value) p.set('environment', document.getElementById('nEnv').value);
      if (document.getElementById('nType').value) p.set('type', document.getElementById('nType').value);
      if (document.getElementById('nQ').value.trim()) p.set('q', document.getElementById('nQ').value.trim());
      fetch(listUrl + '?' + p.toString(), {headers:{'X-Requested-With':'XMLHttpRequest'}}).then(function(r){return r.json();}).then(function(data){
        var list = document.getElementById('nList');
        if (!data.notifications || !data.notifications.length) {
          list.innerHTML = '<div class="text-muted p-3">No notifications found.</div>';
        } else {
          list.innerHTML = data.notifications.map(function(n){
            var pay = n.payload || {};
            var retry = '';
            if (pay.retry_payment_path && pay.show_retry_payment) {
              var rl = esc(pay.retry_payment_label || 'Retry payment');
              retry = '<div class="mt-2"><a class="btn btn-sm btn-primary" href="' + esc(pay.retry_payment_path) + '">' + rl + '</a></div>';
            }
            return '<button class="list-group-item list-group-item-action ' + (n.is_read ? '' : 'list-group-item-light') + '" data-id="'+n.id+'">' +
              '<div class="d-flex justify-content-between"><strong>' + esc(n.title) + '</strong><small>' + esc(n.created) + '</small></div>' +
              '<div class="small text-muted">' + esc(n.event_type) + ' | ' + esc(n.environment || '') + '</div>' +
              '<div>' + esc(n.body || '') + '</div>' + retry + '</button>';
          }).join('');
          list.querySelectorAll('[data-id]').forEach(function(el){
            el.addEventListener('click', function(){
              var fd = new FormData();
              fd.append('id', el.getAttribute('data-id'));
              fetch(markReadUrl, {method:'POST', headers:{'X-CSRFToken': csrfToken(), 'X-Requested-With':'XMLHttpRequest'}, body:fd}).then(load);
            });
          });
        }
        var pager = document.getElementById('nPager');
        pager.innerHTML = '';
        var pg = data.pagination || {};
        if (pg.has_previous) pager.innerHTML += '<li class="page-item"><a class="page-link" href="#" data-p="'+pg.previous_page+'">Previous</a></li>';
        pager.innerHTML += '<li class="page-item disabled"><span class="page-link">'+(pg.current_page || 1)+' / '+(pg.total_pages || 1)+'</span></li>';
        if (pg.has_next) pager.innerHTML += '<li class="page-item"><a class="page-link" href="#" data-p="'+pg.next_page+'">Next</a></li>';
        pager.querySelectorAll('a[data-p]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); page = parseInt(a.getAttribute('data-p')); load(); }); });
      });
    }
    document.getElementById('nFilter').addEventListener('click', function(){ page = 1; load(); });
    document.getElementById('nMarkAll').addEventListener('click', function(){
      fetch(markAllUrl, {method:'POST', headers:{'X-CSRFToken': csrfToken(), 'X-Requested-With':'XMLHttpRequest'}}).then(load);
    });
    document.getElementById('nDeleteAllEnv').addEventListener('click', function(){
      var env = document.getElementById('nEnv').value;
      if (!env) return;
      if (!confirm('Delete all notifications for environment: ' + env + '?')) return;
      var fd = new FormData();
      fd.append('environment', env);
      fetch(deleteAllUrl, {method:'POST', headers:{'X-CSRFToken': csrfToken(), 'X-Requested-With':'XMLHttpRequest'}, body:fd})
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data.success) throw new Error('failed');
          page = 1;
          load();
        })
        .catch(function(){
          alert('Could not delete notifications for selected environment.');
        });
    });
    load();
  })();
</script>
{% endblock %}
