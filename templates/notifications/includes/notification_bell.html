{% if request and request.user and request.user.is_authenticated %}
<div class="tt-notification-bell-wrap tt-notification-bell-wrap--empty dropdown">
  <button class="btn btn-sm btn-light tt-notification-bell" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Notifications">
    <svg class="tt-notification-bell-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="badge bg-danger tt-notification-badge" aria-hidden="true"></span>
  </button>
  <div class="dropdown-menu dropdown-menu-end tt-notification-dropdown p-0 border-0">
    <div class="tt-notification-header">Notifications</div>
    <div class="tt-notification-latest-scroll"></div>
    <div class="tt-notification-footer text-center">
      <a href="{{ url('notifications:page') }}" class="btn btn-sm tt-notification-view-all">View all</a>
    </div>
  </div>
</div>
{% endif %}
