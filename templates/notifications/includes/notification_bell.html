{% if request and request.user and request.user.is_authenticated %}
<div class="tt-notification-bell-wrap dropdown">
  <button class="btn btn-sm btn-light tt-notification-bell" id="ttNotificationBellBtn" data-bs-toggle="dropdown" aria-expanded="false" title="Notifications">
    {# Inline SVG: template20 base loads Boxicons only, not Font Awesome #}
    <svg class="tt-notification-bell-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="badge bg-danger tt-notification-badge" id="ttNotificationBadge" style="display:none;">0</span>
  </button>
  <div class="dropdown-menu dropdown-menu-end tt-notification-dropdown p-0 border-0" aria-labelledby="ttNotificationBellBtn">
    <div class="tt-notification-header">Notifications</div>
    <div id="ttNotificationLatestList" class="tt-notification-latest-scroll"></div>
    <div class="tt-notification-footer text-center">
      <a href="{{ url('notifications:page') }}" class="btn btn-sm tt-notification-view-all">View all</a>
    </div>
  </div>
</div>
<style>
  .tt-notification-bell-wrap { position: relative; }

  .tt-notification-bell {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    border: 1px solid rgba(15, 23, 42, 0.08);
    background: #fff;
    transition: background-color 0.15s ease, box-shadow 0.15s ease;
    width: 40px;
    height: 40px;
  }
  .tt-notification-bell:hover {
    background: #f8fafc;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  }
  .tt-notification-bell-icon { display: block; flex-shrink: 0; color: #475569; }
  .tt-notification-badge {
    position: absolute !important;
    top: -6px;
    right: 0px;
    font-size: 10px;
    min-width: 1rem;
    padding: 0.15em 0.35em;
    border-radius: 999px;
    font-weight: 600;
    height: 1rem;
    display: flex !important;
    align-items: center;
    justify-content: center;
  }
  .tt-notification-dropdown {
    min-width: min(380px, calc(100vw - 24px));
    max-width: calc(100vw - 24px);
    margin-top: 10px !important;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 14px 44px rgba(15, 23, 42, 0.14),
      0 4px 16px rgba(15, 23, 42, 0.06);
  }
  .tt-notification-header {
    padding: 14px 18px;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #0f172a;
    background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
    border-bottom: 1px solid #eef2f7;
  }
  .tt-notification-latest-scroll {
    max-height: 320px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
  }

  .tt-notification-empty {
	display: flex;
	justify-content: center;
	height: 150px;
	align-items: center;
	font-size: 13px;
	color: gray;
}


  .tt-notification-latest-scroll::-webkit-scrollbar {
    width: 6px;
  }
  .tt-notification-latest-scroll::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 999px;
  }
  .tt-notification-item {
    cursor: pointer;
    padding: 12px 18px;
    border-bottom: 1px solid #f1f5f9;
    transition: background-color 0.15s ease;
  }
  .tt-notification-item:last-child {
    border-bottom: none;
  }
  .tt-notification-item:hover {
    background: #f8fafc;
  }
  .tt-notification-item.tt-notification-item--unread {
    background: linear-gradient(90deg, rgba(99, 102, 241, 0.07) 0%, rgba(255, 255, 255, 0) 55%);
    box-shadow: inset 3px 0 0 #6366f1;
  }
  .tt-notification-title {
    font-weight: 600;
    font-size: 0.8125rem;
    color: #0f172a;
    line-height: 1.35;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .tt-notification-body {
    font-size: 0.75rem;
    color: #64748b;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .tt-notification-meta {
    font-size: 0.6875rem;
    color: #94a3b8;
    margin-top: 8px;
  }
  .tt-notification-retry-wrap {
    margin-top: 10px;
  }
  .tt-notification-footer {
    padding: 12px 18px 14px;
    border-top: 1px solid #eef2f7;
    background: #fafbfc;
  }
  .tt-notification-view-all {
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.75rem;
    padding: 0.4rem 1.1rem;
    border: 1px solid #2563eb;
    color: #2563eb;
    background: #fff;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tt-notification-view-all:hover {
    background: #eff6ff;
    color: #1d4ed8;
    border-color: #1d4ed8;
  }
  .tt-notification-summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    padding: 12px 18px;
    border-bottom: 1px solid #f1f5f9;
    text-decoration: none;
    color: inherit;
    transition: background-color 0.15s ease;
  }
  .tt-notification-summary-row:last-child {
    border-bottom: none;
  }
  .tt-notification-summary-row:hover {
    background: #f8fafc;
  }
  .tt-notification-summary-label {
    font-weight: 600;
    font-size: 0.8125rem;
    color: #0f172a;
    line-height: 1.35;
  }
  .tt-notification-summary-count {
    font-size: 0.75rem;
    font-weight: 700;
    min-width: 1.75rem;
    text-align: center;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    background: #eef2ff;
    color: #4338ca;
  }
  .tt-notification-summary-count.tt-notification-summary-count--zero {
    background: #f1f5f9;
    color: #94a3b8;
    font-weight: 600;
  }
   
  .tt-notification-load-err {
    padding: 16px 18px;
    color: #b91c1c;
    font-size: 0.8125rem;
  }



</style>
<script>
  (function () {
    var latestUrl = '{{ url("notifications:latest_api") }}';
    var markReadUrl = '{{ url("notifications:mark_read_api") }}';
    var markBucketReadUrl = '{{ url("notifications:mark_bucket_read_api") }}';
    var badgeEl = document.getElementById('ttNotificationBadge');
    var listEl = document.getElementById('ttNotificationLatestList');
    if (!listEl) return;

    function csrfToken() {
      var m = document.cookie.match(/csrftoken=([^;]+)/);
      return m ? m[1] : '';
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, function (c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
      });
    }

    function markRead(id) {
      var fd = new FormData();
      fd.append('id', id);
      return fetch(markReadUrl, {
        method: 'POST',
        headers: {'X-CSRFToken': csrfToken(), 'X-Requested-With': 'XMLHttpRequest'},
        body: fd
      }).then(function (r) { return r.json(); });
    }

    function markBucketRead(bucketKey) {
      var fd = new FormData();
      fd.append('bucket', bucketKey);
      return fetch(markBucketReadUrl, {
        method: 'POST',
        headers: {'X-CSRFToken': csrfToken(), 'X-Requested-With': 'XMLHttpRequest'},
        body: fd
      }).then(function (r) { return r.json(); });
    }

    function setBadgeCount(c) {
      if (!badgeEl) return;
      if (c > 0) {
        badgeEl.style.display = 'inline-block';
        badgeEl.textContent = c > 99 ? '99+' : String(c);
      } else {
        badgeEl.style.display = 'none';
        badgeEl.textContent = '0';
      }
    }

    function renderSummaryBuckets(buckets) {
      var rows = (buckets || []).map(function (b) {
        var c = parseInt(b.count, 10) || 0;
        var zeroClass = c > 0 ? '' : ' tt-notification-summary-count--zero';
        var url = b.url || '#';
        var clearAttr = (b.clear_on_click === false) ? '0' : '1';
        return (
          '<a href="' + esc(url) + '" class="tt-notification-summary-row" data-bucket="' + esc(b.key || '') + '" data-url="' + esc(url) + '" data-clear-on-click="' + clearAttr + '">' +
          '<span class="tt-notification-summary-label">' + esc(b.label || '') + '</span>' +
          '<span class="tt-notification-summary-count' + zeroClass + '">' + String(c) + '</span>' +
          '</a>'
        );
      }).join('');
      if (!rows) {
        listEl.innerHTML = '<div class="tt-notification-empty"><i class="bx bx-bell-off"></i> No notifications yet.</div>';
        return;
      }
      listEl.innerHTML = rows;
      listEl.querySelectorAll('a.tt-notification-summary-row').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          var key = el.getAttribute('data-bucket');
          var href = el.getAttribute('data-url') || '#';
          var clearOnClick = el.getAttribute('data-clear-on-click') !== '0';
          function go() {
            window.location.href = href;
          }
          if (!clearOnClick) {
            go();
            return;
          }
          markBucketRead(key).then(function (data) {
            if (data && data.success && typeof data.unread_count === 'number') {
              setBadgeCount(data.unread_count);
            }
            go();
          }).catch(go);
        });
      });
    }

    function render(items) {
      if (!items.length) {
        listEl.innerHTML = '<div class="tt-notification-empty">No notifications yet.</div>';
        return;
      }
      listEl.innerHTML = items.map(function (n) {
        var pay = n.payload || {};
        var retry = '';
        if (pay.retry_payment_path && pay.show_retry_payment) {
          var rl = esc(pay.retry_payment_label || 'Retry payment');
          retry = '<div class="tt-notification-retry-wrap"><a class="btn btn-sm btn-primary tt-notification-retry" href="' + esc(pay.retry_payment_path) + '">' + rl + '</a></div>';
        }
        var bodyRaw = n.body || '';
        var unreadClass = n.is_read ? '' : ' tt-notification-item--unread';
        var tipText = [n.title || '', bodyRaw].filter(Boolean).join(' — ');
        var tip = esc(tipText);
        return '<div class="tt-notification-item' + unreadClass + '" data-id="' + n.id + '" title="' + tip + '">' +
          '<div class="tt-notification-title">' + esc(n.title) + '</div>' +
          (bodyRaw ? '<div class="tt-notification-body">' + esc(bodyRaw) + '</div>' : '') +
          retry +
          '<div class="tt-notification-meta">' + esc(n.created) + '</div>' +
        '</div>';
      }).join('');
      listEl.querySelectorAll('.tt-notification-item').forEach(function (el) {
        el.addEventListener('click', function (e) {
          if (e.target && e.target.closest && e.target.closest('a.tt-notification-retry')) {
            return;
          }
          e.preventDefault();
          var nid = el.getAttribute('data-id');
          markRead(nid).then(function () {
            return fetch(latestUrl, {headers: {'X-Requested-With': 'XMLHttpRequest'}});
          }).then(function (r) { return r.json(); }).then(function (data) {
            if (data.success) setBadgeCount(data.unread_count || 0);
            window.location.href = '{{ url("notifications:page") }}';
          }).catch(function () {
            window.location.href = '{{ url("notifications:page") }}';
          });
        });
      });
      listEl.querySelectorAll('a.tt-notification-retry').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.stopPropagation();
          var row = a.closest('.tt-notification-item');
          if (!row) return;
          markRead(row.getAttribute('data-id')).then(function () {
            return fetch(latestUrl, {headers: {'X-Requested-With': 'XMLHttpRequest'}});
          }).then(function (r) { return r.json(); }).then(function (data) {
            if (data.success) setBadgeCount(data.unread_count || 0);
          }).catch(function () {});
        });
      });
    }

    function loadLatest() {
      fetch(latestUrl, {headers: {'X-Requested-With': 'XMLHttpRequest'}})
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.success) return;
          setBadgeCount(data.unread_count || 0);
          if (data.summary_mode && data.buckets) {
            renderSummaryBuckets(data.buckets);
          } else {
            render(data.notifications || []);
          }
        })
        .catch(function () {
          listEl.innerHTML = '<div class="tt-notification-load-err">Could not load notifications.</div>';
        });
    }

    loadLatest();
    setInterval(loadLatest, 60000);

    var bellBtn = document.getElementById('ttNotificationBellBtn');
    if (bellBtn && typeof bootstrap !== 'undefined' && bootstrap.Dropdown) {
      bellBtn.addEventListener('shown.bs.dropdown', function () {
        loadLatest();
      });
    }
  })();
</script>
{% endif %}
