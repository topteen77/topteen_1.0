<style>
  .notifications-page {
    position: relative;
    background:
      radial-gradient(circle at 0% 0%, rgba(98, 112, 239, 0.12) 0%, rgba(98, 112, 239, 0) 34%),
      radial-gradient(circle at 100% 8%, rgba(32, 181, 226, 0.11) 0%, rgba(32, 181, 226, 0) 36%),
      linear-gradient(180deg, #f8faff 0%, #f3f6ff 44%, #f8fbff 100%);
    min-height: 100%;
    border-radius: 16px;
  }

  .notifications-page-inner {
    width: 100%;
    min-height: 100%;
  }



  .notifications-hero {
    border: 1px solid #dfe7ff;
    border-radius: 24px;
    padding: 22px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(244, 248, 255, 0.88) 100%);
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 42px rgba(77, 92, 171, 0.14);
  }

  .notifications-subtitle {
    color: #656f9f;
    font-size: 14px;
    margin-bottom: 0;
  }

  .notifications-controls {
    border: 1px solid #e3e9ff;
    border-radius: 18px;
    padding: 14px;
    margin-top: 16px;
    background: linear-gradient(155deg, #ffffff 0%, #f9fbff 100%);
  }

  .notifications-title {
    font-size: 36px;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #2d3381 0%, #3f49b8 45%, #1893c8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .notifications-title-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
    background: linear-gradient(145deg, #5f68dd 0%, #4298e5 100%);
    color: #fff;
    box-shadow: 0 10px 24px rgba(77, 94, 190, 0.3);
  }

  .notifications-search {
    border-radius: 14px;
    border-color: #d3dcff;
    min-height: 48px;
    padding-left: 42px;
    font-size: 14px;
  }

  .notifications-search-wrap {
    position: relative;
  }

  .notifications-search-wrap i {
    position: absolute;
    top: 50%;
    left: 14px;
    transform: translateY(-50%);
    color: #7682bb;
    font-size: 18px;
  }

  .notifications-search:focus {
    border-color: #5f68dd;
    box-shadow: 0 0 0 4px rgba(95, 104, 221, 0.17);
  }

  .notification-action-btn {
    border: 0;
    border-radius: 12px;
    min-height: 48px;
    font-weight: 700;
    letter-spacing: 0.2px;
    box-shadow: 0 10px 22px rgba(78, 91, 171, 0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }

  .notification-action-btn:hover {
    transform: translateY(-1px);
    filter: saturate(1.05);
    box-shadow: 0 14px 26px rgba(70, 88, 179, 0.26);
  }

  .notifications-list-card {
    border: 1px solid #dfe7ff;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.96);
    overflow: hidden;
    box-shadow: 0 16px 36px rgba(76, 94, 175, 0.12);
  }

  .notification-item {
    border: 0;
    border-bottom: 1px solid #ebf0ff;
    background: #ffffff;
    padding: 16px 18px;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .notification-item--static {
    cursor: default;
  }

  .notification-item:last-child {
    border-bottom: 0;
  }

  .notification-item:hover {
    background: #f8faff;
    transform: translateY(-1px);
    box-shadow: inset 0 0 0 1px #e5ebff;
  }

  .notification-item.is-unread {
    background: linear-gradient(90deg, #f4f7ff 0%, #ffffff 80%);
    border-left: 4px solid #5f68dd;
    padding-left: 14px;
  }

  .notification-title {
    font-size: 15px;
    font-weight: 700;
    color: #252d67;
    margin: 0;
  }

  .notification-time {
    color: #7b84b1;
    font-size: 12px;
    white-space: nowrap;
  }

  .notification-type {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #4f5a9d;
    background: #eef3ff;
    border: 1px solid #dce5ff;
    border-radius: 999px;
    padding: 4px 10px;
    margin-top: 6px;
  }

  .notification-body {
    margin: 8px 0 0;
    color: #3c456f;
    font-size: 13px;
    line-height: 1.5;
  }

  .notification-leading-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    flex-shrink: 0;
    background: linear-gradient(145deg, #6470e7 0%, #35a2e5 100%);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(76, 102, 205, 0.25);
  }

  .notification-unread-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4f59d8;
    box-shadow: 0 0 0 4px rgba(79, 89, 216, 0.14);
  }

  .notification-empty {
    color: #6b739e;
    font-size: 14px;
    text-align: center;
    padding: 58px 16px;
  }

  .notification-empty i {
    font-size: 44px;
    color: #8793cc;
  }

  .notifications-pager-wrap {
    padding: 14px 16px;
    border-top: 1px solid #ebf0ff;
    background: linear-gradient(180deg, #fbfcff 0%, #f8faff 100%);
  }

  #nPager .page-link {
    border-radius: 11px;
    border-color: #d8e1ff;
    color: #4050a5;
    font-weight: 600;
  }

  #nPager .page-item.active .page-link,
  #nPager .page-link:hover {
    background: linear-gradient(120deg, #5d68de 0%, #4e94e3 100%);
    border-color: #5d68de;
    color: #fff;
  } 

  #studentDashboardShell.student-dash-shell {
    padding-top: 0 !important;
  }

  .student-dash-main-col {
    padding: 0 !important;
  }

  @media (max-width: 767.98px) {
    .notifications-hero {
      border-radius: 16px;
      padding: 16px;
    }

    .notifications-title {
      font-size: 28px;
    }

    .notifications-controls {
      padding: 12px;
    }
  }
</style>

<section class="notifications-page px-3 px-lg-4 py-4">
  <div class="notifications-page-inner">
    <div class="notifications-wrap">
      <div class="notifications-hero mb-3">
        <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
          <div>
            <h3 class="notifications-title fw-700 d-flex align-items-center"><span class="notifications-title-icon"><i class='bx bx-bell'></i></span>Notifications</h3>
            <p class="notifications-subtitle">Track your latest updates, activity, and reminders.</p>
          </div>
        </div>
        <div class="notifications-controls">
          <p id="nTypeFilterHint" class="notifications-subtitle mb-2" style="display:none;"></p>
          <form class="row g-2" autocomplete="off" onsubmit="event.preventDefault(); return false;">
            <label class="form-label mb-0 fw-600" for="nQ">Search</label>
            <div class="col-12 col-md-7">
              <div class="notifications-search-wrap">
                <i class='bx bx-search-alt-2'></i>
                <input id="nQ" name="tt_notifications_search" class="form-control notifications-search" type="search"
                  placeholder="Search by title, message, or event" autocomplete="off" autocorrect="off"
                  autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
              </div>
            </div>
            <div class="col-12 col-md-5 d-flex align-items-end gap-2 justify-content-end">
              <button type="button" id="nFilter" class="btn custom-button purple-button notification-action-btn w-50">Apply</button>
              <button type="button" id="nMarkAll" class="btn custom-button blue-button notification-action-btn w-50">Mark all read</button>
            </div>
          </form>
        </div>
      </div>

      <div class="notifications-list-card">
        <div id="nList" class="list-group list-group-flush"></div>
        <div class="notifications-pager-wrap">
          <ul class="pagination justify-content-center mb-0" id="nPager"></ul>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
  (function () {
    var listUrl = '{{ url("notifications:list_api") }}';
    var markReadUrl = '{{ url("notifications:mark_read_api") }}';
    var markAllUrl = '{{ url("notifications:mark_all_read_api") }}';
    var page = 1;
    var filterType = (new URLSearchParams(window.location.search).get('type') || '{{ initial_notification_type|default("") }}').trim();
    var filterBucket = (new URLSearchParams(window.location.search).get('bucket') || '{{ initial_notification_bucket|default("") }}').trim();
    var typeLabels = {
      'institute.student_registered': 'New student registered',
      'institute.student_assigned': 'New student assigned',
      'marketing.new_lead': 'New lead capture',
      'accounts.new_registration': 'New registration',
      'payment.success': 'Payment successful',
      'payment.resolved': 'Payment issue resolved',
      'payment.failed': 'Payment failed',
      'payment.status_updated': 'Payment status updated'
    };
    var bucketLabels = {
      'lead': 'New lead capture',
      'registration': 'New registration',
      'payment_done': 'New payment done',
      'payment_failed': 'Payment failed',
      'careers': 'Career suggestions',
      'blogs': 'Blog suggestions',
      'videos': 'Video suggestions',
      'colleges': 'College suggestions',
      'student_liked': 'Student liked',
      'student_disliked': 'Student disliked'
    };
    function updateTypeFilterHint() {
      var hint = document.getElementById('nTypeFilterHint');
      if (!hint) return;
      if (filterBucket && bucketLabels[filterBucket]) {
        hint.textContent = 'Showing: ' + bucketLabels[filterBucket];
        hint.style.display = 'block';
      } else if (filterType && typeLabels[filterType]) {
        hint.textContent = 'Showing: ' + typeLabels[filterType];
        hint.style.display = 'block';
      } else if (filterType) {
        hint.textContent = 'Showing: ' + filterType;
        hint.style.display = 'block';
      } else {
        hint.style.display = 'none';
        hint.textContent = '';
      }
    }
    function csrfToken() {
      var m = document.cookie.match(/csrftoken=([^;]+)/);
      return m ? m[1] : '';
    }
    function syncBellFromApi(data) {
      if (window.__ttNotificationBell && typeof window.__ttNotificationBell.loadLatest === 'function') {
        window.__ttNotificationBell.loadLatest(true);
        return;
      }
      if (!data || typeof data.unread_count !== 'number') return;
      document.querySelectorAll('.tt-notification-badge').forEach(function (badgeEl) {
        var n = data.unread_count;
        if (n > 0) {
          badgeEl.classList.add('tt-notification-badge--visible');
          badgeEl.setAttribute('aria-hidden', 'false');
          badgeEl.textContent = n > 99 ? '99+' : String(n);
        } else {
          badgeEl.classList.remove('tt-notification-badge--visible');
          badgeEl.setAttribute('aria-hidden', 'true');
          badgeEl.textContent = '';
        }
      });
    }
    function esc(s) { return String(s || '').replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
    function load() {
      var p = new URLSearchParams();
      p.set('page', page);
      if (filterBucket) p.set('bucket', filterBucket);
      else if (filterType) p.set('type', filterType);
      if (document.getElementById('nQ').value.trim()) p.set('q', document.getElementById('nQ').value.trim());
      fetch(listUrl + '?' + p.toString(), {headers:{'X-Requested-With':'XMLHttpRequest'}}).then(function(r){return r.json();}).then(function(data){
        var list = document.getElementById('nList');
        if (!data.notifications || !data.notifications.length) {
          var emptyTitle = filterBucket && bucketLabels[filterBucket]
            ? 'No unread ' + bucketLabels[filterBucket].toLowerCase()
            : 'No notifications yet';
          list.innerHTML = '<div class="notification-empty"><i class="bx bx-bell-off d-block mb-2"></i><p class="mb-1 fw-700">' + esc(emptyTitle) + '</p><p class="mb-0">You are all caught up for now.</p></div>';
        } else {
          list.innerHTML = data.notifications.map(function(n){
            var pay = n.payload || {};
            var dest = (n.destination_url || pay.item_url || '').trim();
            var retry = '';
            if (pay.retry_payment_path && pay.show_retry_payment) {
              var rl = esc(pay.retry_payment_label || 'Retry payment');
              retry = '<div class="mt-2"><a class="btn btn-sm custom-button purple-button" href="' + esc(pay.retry_payment_path) + '">' + rl + '</a></div>';
            }
            var unreadClass = n.is_read ? '' : ' is-unread';
            var staticClass = dest ? '' : ' notification-item--static';
            var unreadDot = n.is_read ? '' : '<span class="notification-unread-dot" aria-hidden="true"></span>';
            return '<button type="button" class="list-group-item list-group-item-action notification-item' + unreadClass + staticClass + '" data-id="'+n.id+'" data-url="'+esc(dest)+'">' +
              '<div class="d-flex align-items-start gap-3">' +
                '<span class="notification-leading-icon"><i class="bx bx-bell"></i></span>' +
                '<div class="flex-grow-1">' +
                  '<div class="d-flex justify-content-between align-items-start gap-2">' +
                    '<p class="notification-title">' + esc(n.title) + '</p>' +
                    '<div class="d-flex align-items-center gap-2">' + unreadDot + '<span class="notification-time">' + esc(n.created) + '</span></div>' +
                  '</div>' +
                  '<span class="notification-type"><i class="bx bx-bolt-circle"></i>' + esc(n.event_type) + '</span>' +
                  '<p class="notification-body">' + esc(n.body || '') + '</p>' + retry +
                '</div>' +
              '</div>' +
            '</button>';
          }).join('');
          list.querySelectorAll('[data-id]').forEach(function(el){
            el.addEventListener('click', function(e){
              if (e.target && e.target.closest && e.target.closest('a')) {
                return;
              }
              var dest = (el.getAttribute('data-url') || '').trim();
              var fd = new FormData();
              fd.append('id', el.getAttribute('data-id'));
              fetch(markReadUrl, {method:'POST', headers:{'X-CSRFToken': csrfToken(), 'X-Requested-With':'XMLHttpRequest'}, body:fd})
                .then(function(r){ return r.json(); })
                .then(function(data){
                  syncBellFromApi(data);
                  if (dest) {
                    window.location.href = dest;
                    return;
                  }
                  load();
                })
                .catch(function(){
                  if (dest) window.location.href = dest;
                  else load();
                });
            });
          });
        }
        var pager = document.getElementById('nPager');
        pager.innerHTML = '';
        var pg = data.pagination || {};
        if (pg.has_previous) pager.innerHTML += '<li class="page-item"><a class="page-link" href="#" data-p="'+pg.previous_page+'">Previous</a></li>';
        pager.innerHTML += '<li class="page-item active"><span class="page-link">'+(pg.current_page || 1)+' / '+(pg.total_pages || 1)+'</span></li>';
        if (pg.has_next) pager.innerHTML += '<li class="page-item"><a class="page-link" href="#" data-p="'+pg.next_page+'">Next</a></li>';
        pager.querySelectorAll('a[data-p]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); page = parseInt(a.getAttribute('data-p')); load(); }); });
      });
    }
    document.getElementById('nFilter').addEventListener('click', function(){ page = 1; load(); });
    document.getElementById('nMarkAll').addEventListener('click', function(){
      fetch(markAllUrl, {method:'POST', headers:{'X-CSRFToken': csrfToken(), 'X-Requested-With':'XMLHttpRequest'}})
        .then(function(r){ return r.json(); })
        .then(function(data){
          syncBellFromApi(data);
          load();
        });
    });
    updateTypeFilterHint();
    syncBellFromApi(null);
    load();
  })();
</script>
