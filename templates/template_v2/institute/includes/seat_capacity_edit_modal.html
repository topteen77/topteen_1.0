<style>
  #ttv2SeatCapacityEditModal .modal-dialog {
    width: min(880px, calc(100vw - 32px));
    max-width: none;
  }
  #ttv2SeatCapacityEditModal .modal-content {
    overflow: hidden;
    border: 0;
    border-radius: 18px;
  }
  #ttv2SeatCapacityEditModal .modal-header {
    padding: 18px 22px;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-modal__heading {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-modal__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 12px;
    color: var(--c-accent, #4f46e5);
    background: color-mix(in srgb, var(--c-accent, #4f46e5) 14%, transparent);
    font-size: 21px;
  }
  #ttv2SeatCapacityEditModal .modal-title {
    color: var(--c-text, #111827);
    font-size: 17px;
    font-weight: 800;
    line-height: 1.2;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-modal__subtitle {
    margin-top: 3px;
    color: var(--c-text3, #6b7280);
    font-size: 11px;
  }
  #ttv2SeatCapacityEditModal .modal-body {
    padding: 20px 22px 22px;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-modal__institute {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding: 10px 12px;
    border: 1px solid var(--c-border2, #e5e7eb);
    border-radius: 12px;
    color: var(--c-text2, #374151);
    background: color-mix(in srgb, var(--c-accent, #4f46e5) 6%, transparent);
    font-size: 12px;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-modal__institute i {
    color: var(--c-accent, #4f46e5);
    font-size: 18px;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-class-row {
    display: grid;
    grid-template-columns: 104px repeat(5, minmax(0, 1fr));
    gap: 12px;
    align-items: end;
    padding: 15px;
    border: 1px solid var(--c-border2, #e5e7eb);
    border-radius: 14px;
    background: color-mix(in srgb, var(--c-bg3, #f8fafc) 72%, transparent);
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-class-row + .ttv2-seat-class-row {
    margin-top: 12px;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-class-row__title {
    align-self: center;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-class-row__eyebrow {
    display: block;
    color: var(--c-text3, #6b7280);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-class-row__name {
    display: block;
    margin-top: 2px;
    color: var(--c-text, #111827);
    font-size: 17px;
    font-weight: 800;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-field .form-label {
    margin-bottom: 6px;
    color: var(--c-text2, #374151);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-field .form-control {
    min-height: 40px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  #ttv2SeatCapacityEditModal .ttv2-seat-modal__hint {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 13px 2px 0;
    color: var(--c-text3, #6b7280);
    font-size: 10px;
  }
  #ttv2SeatCapacityEditModal .modal-footer {
    padding: 14px 22px;
    gap: 8px;
    background: color-mix(in srgb, var(--c-bg3, #f8fafc) 68%, transparent);
  }
  #ttv2SeatCapacityEditModal .modal-footer .btn {
    min-width: 102px;
    min-height: 40px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
  }
  @media (max-width: 767.98px) {
    #ttv2SeatCapacityEditModal .modal-dialog {
      width: auto;
      margin: 12px;
    }
    #ttv2SeatCapacityEditModal .modal-body {
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      padding: 16px;
    }
    #ttv2SeatCapacityEditModal .ttv2-seat-class-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    #ttv2SeatCapacityEditModal .ttv2-seat-class-row__title {
      grid-column: 1 / -1;
      padding-bottom: 2px;
    }
    #ttv2SeatCapacityEditModal .modal-header,
    #ttv2SeatCapacityEditModal .modal-footer {
      padding-left: 16px;
      padding-right: 16px;
    }
  }
  @media (max-width: 399.98px) {
    #ttv2SeatCapacityEditModal .ttv2-seat-class-row {
      grid-template-columns: 1fr;
    }
    #ttv2SeatCapacityEditModal .ttv2-seat-class-row__title {
      grid-column: auto;
    }
    #ttv2SeatCapacityEditModal .modal-footer .btn {
      flex: 1 1 0;
    }
  }
</style>

<div class="modal fade" id="ttv2SeatCapacityEditModal" tabindex="-1" aria-labelledby="ttv2SeatCapacityEditTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div class="ttv2-seat-modal__heading">
          <span class="ttv2-seat-modal__icon"><i class="bx bx-chair"></i></span>
          <div>
            <h5 class="modal-title" id="ttv2SeatCapacityEditTitle">Edit seat capacity</h5>
            <div class="ttv2-seat-modal__subtitle">Set the available seats for each stream and class.</div>
          </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="ttv2SeatCapacityEditForm">
        <div class="modal-body">
          <input type="hidden" name="institute_id" id="ttv2SeatCapacityInstituteId" value="">
          <div class="ttv2-seat-modal__institute">
            <i class="bx bx-buildings"></i>
            <span>Editing capacity for <strong id="ttv2SeatCapacityInstituteName"></strong></span>
          </div>

          <div class="ttv2-seat-class-row">
            <div class="ttv2-seat-class-row__title">
              <span class="ttv2-seat-class-row__eyebrow">Capacity</span>
              <span class="ttv2-seat-class-row__name">Class 11</span>
            </div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-pcm-11">PCM</label><input id="ttv2-pcm-11" type="number" min="0" class="form-control" name="pcm_11" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-cbm-11">CBM</label><input id="ttv2-cbm-11" type="number" min="0" class="form-control" name="cbm_11" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-comm-11">COMM</label><input id="ttv2-comm-11" type="number" min="0" class="form-control" name="comm_11" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-hme-11">HUM</label><input id="ttv2-hme-11" type="number" min="0" class="form-control" name="hme_11" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-hmb-11">HM</label><input id="ttv2-hmb-11" type="number" min="0" class="form-control" name="hmb_11" inputmode="numeric"></div>
          </div>

          <div class="ttv2-seat-class-row">
            <div class="ttv2-seat-class-row__title">
              <span class="ttv2-seat-class-row__eyebrow">Capacity</span>
              <span class="ttv2-seat-class-row__name">Class 12</span>
            </div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-pcm-12">PCM</label><input id="ttv2-pcm-12" type="number" min="0" class="form-control" name="pcm_12" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-cbm-12">CBM</label><input id="ttv2-cbm-12" type="number" min="0" class="form-control" name="cbm_12" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-comm-12">COMM</label><input id="ttv2-comm-12" type="number" min="0" class="form-control" name="comm_12" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-hme-12">HUM</label><input id="ttv2-hme-12" type="number" min="0" class="form-control" name="hme_12" inputmode="numeric"></div>
            <div class="ttv2-seat-field"><label class="form-label" for="ttv2-hmb-12">HM</label><input id="ttv2-hmb-12" type="number" min="0" class="form-control" name="hmb_12" inputmode="numeric"></div>
          </div>

          <p class="ttv2-seat-modal__hint"><i class="bx bx-info-circle"></i> Enter zero when a stream is not offered for a class.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="bx bx-save me-1"></i>Save capacity</button>
        </div>
      </form>
    </div>
  </div>
</div>
