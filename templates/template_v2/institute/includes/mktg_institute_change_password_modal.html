{# Change institute login user password (marketing-scoped). #}
<div class="modal fade ttv2-mktg-change-pwd-modal" id="changePasswordModal{{ ins.id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0">Change login password</h5>
          <p class="text-muted small mb-0 mt-1">
            {{ ins.name }}
            {% if ins.created_by and ins.created_by.email %}
            · <span class="ttv2-mktg-change-pwd-email">{{ ins.created_by.email }}</span>
            {% endif %}
          </p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="changePasswordForm{{ ins.id }}" method="POST">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <input type="hidden" name="institute_id" value="{{ ins.id }}">
        <input type="hidden" name="change_password" value="1">
        <div class="modal-body">
          <p class="small text-muted mb-3">
            Sets the password for this institute’s login account. The new password is emailed to the institute.
          </p>
          <div class="mb-3">
            <label class="form-label" for="mktgNewPwd{{ ins.id }}">New password <span class="text-danger">*</span></label>
            <input type="password"
                   id="mktgNewPwd{{ ins.id }}"
                   name="new_password"
                   class="form-control"
                   autocomplete="new-password"
                   minlength="6"
                   required>
          </div>
          <div class="mb-0">
            <label class="form-label" for="mktgConfirmPwd{{ ins.id }}">Confirm password <span class="text-danger">*</span></label>
            <input type="password"
                   id="mktgConfirmPwd{{ ins.id }}"
                   name="confirm_password"
                   class="form-control"
                   autocomplete="new-password"
                   minlength="6"
                   required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="bx bx-key me-1"></i> Update password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
