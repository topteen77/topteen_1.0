{# Reusable widget: Weekly session report (chart/table toggle). Data via counselor dashboard AJAX (data_type=sessions). #}
<div class="ttv2-card" data-ttv2-weekly-sessions>
  <div class="d-flex align-items-center justify-content-between gap-2 mb-2 flex-wrap">
    <div class="min-w-0">
      <div class="card-title mb-0">Weekly session report</div>
      <div style="font-size:11px;color:var(--c-text3);">Sessions logged per day for counselors in your scope.</div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <div class="btn-group btn-group-sm" role="group" aria-label="Weekly session report view switch">
        <button type="button" class="btn btn-outline-secondary active" data-ttv2-sess-view="chart" title="Chart view" aria-label="Chart view">
          <i class="bx bx-bar-chart-alt-2"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" data-ttv2-sess-view="table" title="Table view" aria-label="Table view">
          <i class="bx bx-table"></i>
        </button>
      </div>
    </div>
  </div>

  <div data-ttv2-sess-chart-wrap style="position:relative;min-height:260px">
    <div data-ttv2-sess-loader class="text-center py-5" style="display:none;">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-gray mb-0">Loading sessions…</p>
    </div>
    <canvas data-ttv2-sess-canvas aria-label="Weekly session report chart"></canvas>
  </div>

  <div data-ttv2-sess-table-wrap class="table-responsive" style="display:none;max-height:280px;overflow:auto;">
    <table class="table table-sm mb-0">
      <thead>
        <tr data-ttv2-sess-table-head></tr>
      </thead>
      <tbody data-ttv2-sess-table-body></tbody>
    </table>
  </div>
</div>
