{# Week header bar: render OUTSIDE AJAX host so dropdown is always clickable. #}
{% if ttv2_analytics is defined and ttv2_analytics %}
<div class="ttv2-week-header mb-3" data-ttv2-week-header>
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <div class="card-title mb-0">Dashboard</div>
      <div class="text-muted" style="color:var(--c-text3)!important;font-size:11px;">
        {{ ttv2_analytics.banners.week_summary|default('Key metrics for your scope') }}
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <div class="dropdown">
        <button type="button"
                class="ttv2-week-pill dropdown-toggle"
                id="ttv2WeekDropdownBtn"
                data-bs-toggle="dropdown"
                aria-expanded="false">
          {{ ttv2_analytics.date_range_label|default('Select week') }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end" id="ttv2WeekDropdownMenu" aria-labelledby="ttv2WeekDropdownBtn">
          <li><span class="dropdown-item-text" style="font-size:11px;color:var(--c-text3);">Loading…</span></li>
        </ul>
      </div>
    </div>
  </div>
</div>
{% endif %}
