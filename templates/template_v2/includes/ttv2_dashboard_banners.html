{# Credit + KIRA insights — bottom-right toasts (30s auto-close). Expects ttv2_analytics. #}
{% if ttv2_analytics is defined and ttv2_analytics %}
<div class="ttv2-dashboard-banners-source"
     data-ttv2-dashboard-banners
     hidden
     aria-hidden="true"
     data-credit="{{ ttv2_analytics.banners.credit|default('') }}"
     data-kira="{{ ttv2_analytics.banners.kira|default('') }}"></div>
{% endif %}
