<script>
  // Marketing group: boot hooks after AJAX inject
  (function(){
    // Filters drawer (mobile slide-in, desktop inline) for the Institutes subpage.
    // This must be defined globally because the markup is injected via innerHTML by the
    // v2 shell, so any inline <script> inside the fragment is never executed.
    window.ttv2InitMktgFilterDrawer = window.ttv2InitMktgFilterDrawer || function(){
      try {
        var section = document.getElementById('ttv2MktgFiltersSection');
        if (!section || section.getAttribute('data-ttv2-mktg-filter-bound') === '1') return;
        section.setAttribute('data-ttv2-mktg-filter-bound', '1');

        var drawer = section.querySelector('#ttv2MktgFiltersDrawer');
        var openBtn = section.querySelector('[data-ttv2-mktg-filter-open]');
        var mqMobile = window.matchMedia('(max-width: 991.98px)');

        function setOpen(open){
          if (!drawer) return;
          section.classList.toggle('is-open', !!open);
          if (openBtn) openBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
          document.body.classList.toggle('ttv2-mktg-filter-open-lock', !!open && mqMobile.matches);
          if (open) {
            try { drawer.focus({ preventScroll: true }); } catch (err) { try { drawer.focus(); } catch(e2) {} }
          }
        }

        section.addEventListener('click', function(e){
          var openTrigger = e.target.closest && e.target.closest('[data-ttv2-mktg-filter-open]');
          if (openTrigger) { e.preventDefault(); setOpen(true); return; }
          var closeTrigger = e.target.closest && e.target.closest('[data-ttv2-mktg-filter-close]');
          if (closeTrigger) { e.preventDefault(); setOpen(false); return; }
        });

        section.__ttv2MktgEsc = function(e){
          if (e.key === 'Escape' && section.classList.contains('is-open')) setOpen(false);
        };
        document.addEventListener('keydown', section.__ttv2MktgEsc);

        if (mqMobile.addEventListener) {
          mqMobile.addEventListener('change', function(ev){ if (!ev.matches) setOpen(false); });
        } else if (mqMobile.addListener) {
          mqMobile.addListener(function(ev){ if (!ev.matches) setOpen(false); });
        }

        var form = section.querySelector('#institute-filter-form');
        if (form) {
          form.addEventListener('submit', function(){ if (mqMobile.matches) setOpen(false); });
        }
      } catch (err) { /* no-op */ }
    };

    (function(){
      if (window.__ttv2MktgFollowupsDocBound) return;
      window.__ttv2MktgFollowupsDocBound = true;

      function ttv2Esc(s){
        if (s == null || s === undefined) return '';
        var d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
      }

      document.addEventListener('click', function(ev){
        var btn = ev.target && ev.target.closest && ev.target.closest('[data-ttv2-mktg-counselor-followups]');
        if (!btn) return;
        ev.preventDefault();

        var modalEl = document.getElementById('ttv2MktgCounselorFollowupsModal');
        if (!modalEl || typeof bootstrap === 'undefined' || !bootstrap.Modal) return;

        var sec = document.getElementById('sec-marketing-counselors');
        var base = (sec && sec.getAttribute('data-ttv2-mktg-followups-url')) || '';
        if (!base) return;

        var cid = (btn.getAttribute('data-counselor-id') || '').trim();
        var activity = (btn.getAttribute('data-counselor-activity') || 'followups').trim();
        var loadEl = document.getElementById('ttv2MktgFollowupsLoading');
        var errEl = document.getElementById('ttv2MktgFollowupsError');
        var wrapEl = document.getElementById('ttv2MktgFollowupsTableWrap');
        var tbody = document.getElementById('ttv2MktgFollowupsTbody');
        var hc = document.getElementById('ttv2MktgFollowupsHdrCounselor');
        var hi = document.getElementById('ttv2MktgFollowupsHdrInstitute');
        var sub = document.getElementById('ttv2MktgFollowupsSubtitle');

        if (loadEl) loadEl.classList.remove('d-none');
        if (errEl) { errEl.classList.add('d-none'); errEl.textContent = ''; }
        if (wrapEl) wrapEl.classList.add('d-none');
        if (tbody) tbody.innerHTML = '';
        if (hc) hc.textContent = '—';
        if (hi) hi.textContent = '—';
        if (sub) {
          sub.textContent = activity === 'completed'
            ? 'Completed follow-up sessions'
            : activity === 'assigned'
              ? 'Students assigned as advisor (primary and/or roster)'
              : 'All follow-up sessions';
        }

        var sep = base.indexOf('?') >= 0 ? '&' : '?';
        var url = base + sep + 'data_type=counselor_followups'
          + '&counselor_id=' + encodeURIComponent(cid)
          + '&counselor_activity=' + encodeURIComponent(activity);

        var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();

        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
          .then(function(r){
            var ct = (r.headers.get('content-type') || '').toLowerCase();
            if (ct.indexOf('application/json') === -1) {
              return r.text().then(function(){
                return { ok: false, j: { ok: false, error: 'bad_response' } };
              });
            }
            return r.json().then(function(j){ return { ok: r.ok, j: j }; });
          })
          .then(function(pack){
            if (loadEl) loadEl.classList.add('d-none');
            var j = pack.j || {};
            if (!pack.ok || !j.ok) {
              if (errEl) {
                var msg = (j && j.error) ? String(j.error) : 'Could not load data.';
                if (msg === 'not_found') msg = 'Counselor not found in your scope.';
                if (msg === 'invalid_params') msg = 'Invalid request.';
                if (msg === 'bad_response') msg = 'Session may have expired — refresh the page.';
                errEl.textContent = msg;
                errEl.classList.remove('d-none');
              }
              return;
            }
            if (hc) hc.textContent = j.counselor_name || 'Counselor';
            if (hi) hi.textContent = j.institute_name || '—';
            if (tbody) {
              var rows = j.rows || [];
              if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center py-4">No records found.</td></tr>';
              } else {
                tbody.innerHTML = rows.map(function(r){
                  return '<tr><td>' + ttv2Esc(r.sno) + '</td><td>' + ttv2Esc(r.name) + '</td><td>'
                    + ttv2Esc(r['class']) + '</td><td>' + ttv2Esc(r.kind) + '</td><td>' + ttv2Esc(r.when) + '</td></tr>';
                }).join('');
              }
            }
            if (wrapEl) wrapEl.classList.remove('d-none');
          })
          .catch(function(){
            if (loadEl) loadEl.classList.add('d-none');
            if (errEl) {
              errEl.textContent = 'Network error.';
              errEl.classList.remove('d-none');
            }
          });
      }, false);
    })();

    window.ttv2AfterAjaxContentLoad = function(){
      try {
        if (typeof window.ttv2BootMarketingGroupDashboard === 'function') {
          window.ttv2BootMarketingGroupDashboard();
        }
      } catch (e) {}
      try { window.ttv2InitMktgFilterDrawer(); } catch (e4) {}
      // Students tab: SSR only has counts/filters; rows load via data_type=students (same as institute v2).
      try {
        var host = document.getElementById('ttv2AjaxContent');
        var marker = host ? host.querySelector('[data-ttv2-page]') : null;
        var page = marker ? (marker.getAttribute('data-ttv2-page') || '').trim().toLowerCase() : '';
        if (page === 'students' && typeof window.ttv2InitStudentTableAfterBodyInject === 'function') {
          window.ttv2InitStudentTableAfterBodyInject();
        }
      } catch (e3) {}
      try {
        var params = new URLSearchParams(window.location.search || '');
        var sec = (params.get('ttv2_section') || '').trim();
        if (sec === 'students') {
          var el = document.getElementById('sec-marketing-students');
          if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
      } catch (e2) {}
    };

    // Belt-and-braces: also bind on regular DOM events in case ttv2AfterAjaxContentLoad
    // gets overridden by another role boot or a different code path.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function(){ try { window.ttv2InitMktgFilterDrawer(); } catch(e){} });
    } else {
      try { window.ttv2InitMktgFilterDrawer(); } catch(e){}
    }
    document.addEventListener('ttv2:content:loaded', function(){ try { window.ttv2InitMktgFilterDrawer(); } catch(e){} });
  })();
</script>
