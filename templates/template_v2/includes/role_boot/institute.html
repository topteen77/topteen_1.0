<script>
  // Institute dashboard: boot hooks after AJAX inject
  (function(){
    function getCookie(name) {
      try {
        var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return m ? decodeURIComponent(m[2]) : null;
      } catch (e) {
        return null;
      }
    }

    window.ttv2InitUnassignedStudentsAssign = function () {
      var root = document.getElementById('ttv2UnassignedStudents');
      if (!root) return;
      if (root.__ttv2AssignBound) return;
      root.__ttv2AssignBound = true;

      var assignUrl = root.getAttribute('data-assign-url') || '#';
      if (!assignUrl || assignUrl === '#') return;

      root.addEventListener('click', function (e) {
        var btn = e.target && e.target.closest ? e.target.closest('[data-ttv2-assign]') : null;
        if (!btn) return;

        var tr = btn.closest('tr[data-sm-id]');
        if (!tr) return;
        var smId = tr.getAttribute('data-sm-id');
        var sel = tr.querySelector('[data-ttv2-counselor]');
        var counselorId = sel ? sel.value : '';
        if (!counselorId) return;

        btn.disabled = true;
        var prev = btn.textContent;
        btn.textContent = 'Assigning...';

        fetch(assignUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': getCookie('csrftoken') || ''
          },
          body: JSON.stringify({ student_management_id: smId, counselor_id: counselorId })
        })
          .then(function (r) {
            return r.json().catch(function () {
              return { ok: false, error: 'bad_json', status: r.status };
            });
          })
          .then(function (data) {
            if (data && data.ok) {
              tr.remove();
            } else {
              btn.disabled = false;
              btn.textContent = prev || 'Assign';
              try {
                var msg = (data && (data.error || data.detail)) ? (data.error || data.detail) : 'Assign failed';
                alert(msg);
              } catch (e) {}
            }
          })
          .catch(function () {
            btn.disabled = false;
            btn.textContent = prev || 'Assign';
            try { alert('Assign failed'); } catch (e) {}
          });
      });
    };

    window.ttv2InitAdvisorChangeControls = function () {
      // List/table: Save/Unassign per row
      try {
        var container = document.getElementById('students-table-container');
        if (container && !container.__ttv2AdvBound) {
          container.__ttv2AdvBound = true;
          function postSet(smId, counselorId, cb, rowUrlOverride) {
            var url =
              rowUrlOverride ||
              container.getAttribute('data-ttv2-set-counselor-url') ||
              '#';
            if (!url || url === '#') return;
            fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': getCookie('csrftoken') || ''
              },
              body: JSON.stringify({ student_management_id: smId, counselor_id: counselorId })
            })
              .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
              .then(function (data) { if (cb) cb(data); })
              .catch(function () { if (cb) cb({ ok: false }); });
          }

          // Unassign link (AJAX)
          container.addEventListener('click', function (e) {
            var unBtn = e.target && e.target.closest ? e.target.closest('[data-ttv2-adv-unassign]') : null;
            if (!unBtn) return;
            e.preventDefault();
            var tr = e.target.closest('tr[data-sm-id]');
            if (!tr) return;
            var smId = tr.getAttribute('data-sm-id');
            var rowUrl = (tr.getAttribute('data-ttv2-set-url') || '').trim();
            postSet(smId, '', function (data) {
              if (!(data && data.ok)) {
                try { alert((data && data.error) ? data.error : 'Unassign failed'); } catch (e2) {}
                return;
              }
              try {
                if (typeof window.ttv2InitStudentTableAfterBodyInject === 'function') {
                  window.ttv2InitStudentTableAfterBodyInject();
                }
              } catch (e3) {}
            }, rowUrl || undefined);
          });

          // Auto-save on dropdown change (AJAX)
          container.addEventListener('change', function (e) {
            var sel = e.target && e.target.closest ? e.target.closest('[data-ttv2-adv-select]') : null;
            if (!sel) return;
            var tr = sel.closest('tr[data-sm-id]');
            if (!tr) return;
            var smId = tr.getAttribute('data-sm-id');
            var counselorId = sel.value || '';
            var rowUrl = (tr.getAttribute('data-ttv2-set-url') || '').trim();
            postSet(smId, counselorId, function (data) {
              if (!(data && data.ok)) {
                try { alert((data && data.error) ? data.error : 'Update failed'); } catch (e2) {}
                return;
              }
              try {
                if (typeof window.ttv2InitStudentTableAfterBodyInject === 'function') {
                  window.ttv2InitStudentTableAfterBodyInject();
                }
              } catch (e3) {}
            }, rowUrl || undefined);
          });
        }
      } catch (e0) {}

      // Grid card assign/unassign is delegated on document.body in student_table_ajax.js (capture phase).
    };

    window.ttv2AfterAjaxContentLoad = function(){
      // Load the roster via AJAX on dashboard + students pages (if the wrapper exists).
      try {
        var host = document.getElementById('ttv2AjaxContent');
        var marker = host ? host.querySelector('[data-ttv2-page]') : null;
        var page = marker ? (marker.getAttribute('data-ttv2-page') || '').trim().toLowerCase() : '';
        if ((page === 'students' || page === 'dashboard') && typeof window.ttv2InitStudentTableAfterBodyInject === 'function') {
          window.ttv2InitStudentTableAfterBodyInject();
        }
      } catch (e0) {}

      /* Modals + slide panel under AJAX host break fixed positioning; move to <body> first */
      try {
        if (typeof window.ttv2RelocateInstituteOverlaysToBody === 'function') {
          window.ttv2RelocateInstituteOverlaysToBody();
        }
      } catch (e) {}
      try {
        if (typeof window.ttv2InitInstituteMobileDrawersOnce === 'function') {
          window.ttv2InitInstituteMobileDrawersOnce();
        }
      } catch (e) {}
      try {
        if (typeof window.ttv2BindInstituteStudentPanelControlsOnce === 'function') {
          window.ttv2BindInstituteStudentPanelControlsOnce();
        }
      } catch (e) {}
      try {
        if (typeof window.ttv2InitInstituteLegacyCharts === 'function') {
          window.ttv2InitInstituteLegacyCharts();
        }
      } catch (e) {}
      try {
        if (typeof window.ttv2InitInstituteCounselorsPage === 'function') {
          window.ttv2InitInstituteCounselorsPage();
        }
      } catch (eC) {}

      // Optional deep link scroll (legacy)
      try {
        var params = new URLSearchParams(window.location.search || '');
        var sec = (params.get('ttv2_section') || '').trim();
        if (sec === 'students') {
          var el = document.getElementById('sec-institute-students');
          if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
      } catch (e2) {}

      // Bind unassigned student assign actions (dashboard only; safe elsewhere)
      try {
        if (typeof window.ttv2InitUnassignedStudentsAssign === 'function') {
          window.ttv2InitUnassignedStudentsAssign();
        }
      } catch (e3) {}

      // Bind change/unassign advisor controls on students list/cards.
      try {
        if (typeof window.ttv2InitAdvisorChangeControls === 'function') {
          window.ttv2InitAdvisorChangeControls();
        }
      } catch (e4) {}

      // Sidebar quick-links: open the legacy institute modals from URL hash
      // (#ql-add-counselor, #ql-upload-matric, #ql-upload-postmatric,
      // #ql-add-multiple, #ql-add-single). The modals are included by
      // template_v2/institute/institute_dashboard_body.html on every partial.
      try {
        if (typeof window.ttv2InstituteOpenQuicklinkModalFromHash === 'function') {
          window.ttv2InstituteOpenQuicklinkModalFromHash();
        }
      } catch (eQL) {}
    };

    // Hash -> modal id map for the institute dashboard quick-links.
    var QL_INSTITUTE_MAP = {
      '#ql-add-multiple': 'addMultipleStudentsModal',
      '#ql-add-single': 'addSingleStudentModal',
      '#ql-add-counselor': 'addCounselorModal',
      '#ql-upload-matric': 'addCsvStudentModal',
      '#ql-upload-postmatric': 'addPostMatricCsvModal'
    };

    // Close every currently-open quick-action (or any) Bootstrap modal so we
    // don't end up with two modals stacked on top of each other when the user
    // clicks a different sidebar quick-link before dismissing the previous one.
    function closeOtherOpenModals(exceptEl){
      try {
        if (typeof bootstrap === 'undefined' || !bootstrap.Modal) return;
        var open = document.querySelectorAll('.modal.show');
        for (var i = 0; i < open.length; i++) {
          var m = open[i];
          if (exceptEl && m === exceptEl) continue;
          try {
            var inst = bootstrap.Modal.getInstance(m);
            if (inst) inst.hide();
            else bootstrap.Modal.getOrCreateInstance(m).hide();
          } catch (e) {}
        }
        // Stale backdrops sometimes linger when modals close in rapid
        // succession (e.g. hashchange handler vs prior backdrop click). Clean
        // up after Bootstrap's transition window.
        setTimeout(function(){
          try {
            var visible = document.querySelectorAll('.modal.show').length;
            if (visible > 0) return;
            var bds = document.querySelectorAll('.modal-backdrop');
            for (var j = bds.length - 1; j >= 0; j--) {
              try { bds[j].parentNode && bds[j].parentNode.removeChild(bds[j]); } catch (e2) {}
            }
            try { document.body.classList.remove('modal-open'); } catch (e3) {}
            try { document.body.style.removeProperty('overflow'); } catch (e3a) {}
            try { document.body.style.removeProperty('padding-right'); } catch (e3b) {}
          } catch (e4) {}
        }, 350);
      } catch (eX) {}
    }

    function showInstituteQuicklinkModal(id){
      try {
        if (typeof bootstrap === 'undefined' || !bootstrap.Modal) return false;
        var el = document.getElementById(id);
        if (!el) return false;
        // If we re-trigger the same modal that's already open, do nothing.
        if (el.classList.contains('show')) return true;
        closeOtherOpenModals(el);
        bootstrap.Modal.getOrCreateInstance(el).show();
        return true;
      } catch (e) { return false; }
    }

    function openInstituteQuicklinkModalFromHash(){
      try {
        var h = (window.location.hash || '').trim();
        var id = QL_INSTITUTE_MAP[h];
        if (!id) {
          // Hash is empty / unrelated → make sure no quick-action modal is left
          // hanging open (e.g. user pressed back to clear the hash).
          if (!h) closeOtherOpenModals(null);
          return;
        }
        showInstituteQuicklinkModal(id);
      } catch (e) {}
    }
    window.ttv2InstituteOpenQuicklinkModalFromHash = openInstituteQuicklinkModalFromHash;
    window.ttv2InstituteCloseOtherModals = closeOtherOpenModals;

    // Intercept sidebar quick-link clicks. If a quick-action modal is already
    // open we close it first (and update the URL hash) before opening the new
    // one — this avoids the visible "modal on top of modal" stacking even when
    // the browser doesn't fire `hashchange` (same hash, different page, etc.).
    if (!window.__ttv2InstituteQLBound) {
      window.__ttv2InstituteQLBound = true;

      document.addEventListener('click', function(ev){
        try {
          var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
          if (!a) return;
          var href = a.getAttribute('href') || '';
          var hashIdx = href.indexOf('#ql-');
          if (hashIdx === -1) return;
          var hash = href.slice(hashIdx);
          var id = QL_INSTITUTE_MAP[hash];
          if (!id) return;
          // Same-document hash navigation: handle ourselves so we can close
          // the previous modal first. The browser would otherwise just update
          // the hash (and only fire hashchange if it actually changed).
          var here = window.location.pathname + window.location.search;
          var hereHash = window.location.hash || '';
          var sameDoc = false;
          try {
            // Resolve the link against the current document so relative paths
            // (Django's reverse() returns "/institute/<slug>/dashboard/")
            // compare correctly with absolute window.location.
            var resolved = new URL(href, window.location.href);
            sameDoc = (resolved.origin === window.location.origin)
              && (resolved.pathname === window.location.pathname)
              && (resolved.search === window.location.search);
          } catch (eU) {
            // Fallback for older browsers / unusual hrefs.
            var targetPath = href.split('#')[0];
            sameDoc = (!targetPath) || targetPath === window.location.href.split('#')[0]
              || targetPath === here || targetPath === window.location.pathname;
          }
          if (sameDoc) {
            ev.preventDefault();
            // Update the hash (history) but suppress our own hashchange
            // handler so we don't fire openFromHash twice.
            window.__ttv2InstituteSuppressHashHandler = true;
            try {
              if (hereHash !== hash) {
                history.replaceState(null, '', here + hash);
              }
            } catch (e2) {}
            setTimeout(function(){ window.__ttv2InstituteSuppressHashHandler = false; }, 50);
            showInstituteQuicklinkModal(id);
          }
        } catch (e) {}
      }, true);

      window.addEventListener('hashchange', function(){
        if (window.__ttv2InstituteSuppressHashHandler) return;
        openInstituteQuicklinkModalFromHash();
      });
      document.addEventListener('DOMContentLoaded', openInstituteQuicklinkModalFromHash);

      // Defensive: when any modal is fully hidden, double-check the body lock /
      // backdrop is cleaned up (Bootstrap occasionally leaves padding-right
      // when modals are hidden during another modal's transition).
      document.addEventListener('hidden.bs.modal', function(){
        setTimeout(function(){
          try {
            if (document.querySelectorAll('.modal.show').length === 0) {
              var bds = document.querySelectorAll('.modal-backdrop');
              for (var j = bds.length - 1; j >= 0; j--) {
                try { bds[j].parentNode && bds[j].parentNode.removeChild(bds[j]); } catch (e2) {}
              }
              document.body.classList.remove('modal-open');
              document.body.style.removeProperty('overflow');
              document.body.style.removeProperty('padding-right');
            }
          } catch (e) {}
        }, 100);
      });
    }
  })();
</script>
