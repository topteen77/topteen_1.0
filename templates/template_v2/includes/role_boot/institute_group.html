<script>
  // Institute group: boot hooks after AJAX inject
  (function(){
    window.ttv2InitMktgFilterDrawer = window.ttv2InitMktgFilterDrawer || function(){
      try {
        var section = document.getElementById('ttv2MktgFiltersSection');
        if (!section || section.getAttribute('data-ttv2-mktg-filter-bound') === '1') return;
        section.setAttribute('data-ttv2-mktg-filter-bound', '1');

        var drawer = section.querySelector('#ttv2MktgFiltersDrawer');
        var openBtn = section.querySelector('[data-ttv2-mktg-filter-open]');
        var mqMobile = window.matchMedia('(max-width: 991.98px)');

        function setOpen(open){
          if (!drawer) return;
          section.classList.toggle('is-open', !!open);
          if (openBtn) openBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
          document.body.classList.toggle('ttv2-mktg-filter-open-lock', !!open && mqMobile.matches);
          if (open) {
            try { drawer.focus({ preventScroll: true }); } catch (err) { try { drawer.focus(); } catch(e2) {} }
          }
        }

        section.addEventListener('click', function(e){
          var openTrigger = e.target.closest && e.target.closest('[data-ttv2-mktg-filter-open]');
          if (openTrigger) { e.preventDefault(); setOpen(true); return; }
          var closeTrigger = e.target.closest && e.target.closest('[data-ttv2-mktg-filter-close]');
          if (closeTrigger) { e.preventDefault(); setOpen(false); return; }
        });

        section.__ttv2MktgEsc = function(e){
          if (e.key === 'Escape' && section.classList.contains('is-open')) setOpen(false);
        };
        document.addEventListener('keydown', section.__ttv2MktgEsc);

        if (mqMobile.addEventListener) {
          mqMobile.addEventListener('change', function(ev){ if (!ev.matches) setOpen(false); });
        } else if (mqMobile.addListener) {
          mqMobile.addListener(function(ev){ if (!ev.matches) setOpen(false); });
        }

        var form = section.querySelector('#institute-filter-form');
        if (form) {
          form.addEventListener('submit', function(){ if (mqMobile.matches) setOpen(false); });
        }
      } catch (err) { /* no-op */ }
    };

    window.ttv2InitMktgRowCsvUploadModals = window.ttv2InitMktgRowCsvUploadModals || function(){
      if (!document.getElementById('ttv2MktgRowMatricCsvUploadModal')
          && !document.getElementById('ttv2MktgRowPostMatricCsvUploadModal')) {
        return;
      }
      function resetDropzone(form){
        if (!form) return;
        try {
          var input = form.querySelector('.ttv2-csv-dropzone-input');
          if (input) {
            input.value = '';
            var fn = form.querySelector('[data-ttv2-csv-filename]');
            if (fn) {
              var empty = fn.getAttribute('data-empty-label') || 'No file selected';
              fn.textContent = empty;
            }
          }
        } catch (e) {}
      }
      function bindRowModal(modalId, hiddenId, labelId, formId){
        var modalEl = document.getElementById(modalId);
        if (!modalEl || modalEl.getAttribute('data-ttv2-mktg-row-csv-bound') === '1') return;
        modalEl.setAttribute('data-ttv2-mktg-row-csv-bound', '1');
        modalEl.addEventListener('show.bs.modal', function(ev){
          var btn = ev.relatedTarget;
          if (!btn) return;
          var hiddenEl = document.getElementById(hiddenId);
          var labelEl = document.getElementById(labelId);
          var formEl = document.getElementById(formId);
          if (hiddenEl) hiddenEl.value = (btn.getAttribute('data-institute-id') || '').trim();
          if (labelEl) {
            var name = (btn.getAttribute('data-institute-name') || '').trim();
            var rem = (btn.getAttribute('data-credits-remaining') || '').trim();
            var line = name ? ('Institute: ' + name) : '—';
            if (rem) line += ' — ' + rem + ' credits left';
            labelEl.textContent = line;
          }
          resetDropzone(formEl);
          try {
            var subId = formId === 'ttv2MktgRowMatricCsvUploadForm'
              ? 'ttv2MktgRowMatricCsvUploadSubmit'
              : 'ttv2MktgRowPostMatricCsvUploadSubmit';
            if (typeof window.ttv2RefreshRowCsvModal === 'function') {
              window.ttv2RefreshRowCsvModal(
                modalId,
                subId,
                (btn.getAttribute('data-institute-id') || ''),
                (btn.getAttribute('data-credits-remaining') || '0')
              );
            }
          } catch (eR) {}
        });
        modalEl.addEventListener('hidden.bs.modal', function(){
          resetDropzone(document.getElementById(formId));
        });
      }
      bindRowModal('ttv2MktgRowMatricCsvUploadModal', 'ttv2MktgRowMatricInstituteId', 'ttv2MktgRowMatricInstituteLabel', 'ttv2MktgRowMatricCsvUploadForm');
      bindRowModal('ttv2MktgRowPostMatricCsvUploadModal', 'ttv2MktgRowPostMatricInstituteId', 'ttv2MktgRowPostMatricInstituteLabel', 'ttv2MktgRowPostMatricCsvUploadForm');
    };

    window.ttv2AfterAjaxContentLoad = function(){
      try {
        window._ttv2InstituteGroupDashboardBooted = false;
        if (typeof window.ttv2BootInstituteGroupDashboard === 'function') {
          window.ttv2BootInstituteGroupDashboard();
        }
      } catch (e) {}
      try { window.ttv2InitMktgRowCsvUploadModals(); } catch (e5) {}
      try { window.ttv2InitMktgFilterDrawer(); } catch (e4) {}
      try {
        var host = document.getElementById('ttv2AjaxContent');
        var marker = host ? host.querySelector('[data-ttv2-page]') : null;
        var page = marker ? (marker.getAttribute('data-ttv2-page') || '').trim().toLowerCase() : '';
        if (page === 'students' && typeof window.ttv2InitStudentTableAfterBodyInject === 'function') {
          window.ttv2InitStudentTableAfterBodyInject();
        }
      } catch (e3) {}
      try {
        var params = new URLSearchParams(window.location.search || '');
        var sec = (params.get('ttv2_section') || '').trim();
        if (sec === 'students') {
          var el = document.getElementById('sec-group-students');
          if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
      } catch (e2) {}
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function(){
        try { window.ttv2InitMktgFilterDrawer(); } catch(e){}
        try { window.ttv2InitMktgRowCsvUploadModals(); } catch(e){}
      });
    } else {
      try { window.ttv2InitMktgFilterDrawer(); } catch(e){}
      try { window.ttv2InitMktgRowCsvUploadModals(); } catch(e){}
    }
    document.addEventListener('ttv2:content:loaded', function(){
      try { window.ttv2InitMktgFilterDrawer(); } catch(e){}
      try { window.ttv2InitMktgRowCsvUploadModals(); } catch(e){}
    });
  })();
</script>
