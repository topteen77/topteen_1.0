{# Reusable v2 follow-up modal (AJAX save). Requires JS bindings in student_table_ajax.js. #}
<div class="modal fade" id="ttv2FollowUpModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ttv2FollowUpModalTitle">Create follow up</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="ttv2FollowUpForm" autocomplete="off">
        <div class="modal-body">
          <input type="hidden" id="ttv2FollowUpSmId" name="sm_id" value="">
          <div class="row g-2">
            <div class="col-12">
              <label class="form-label">Mode of follow up</label>
              <select class="form-control custom-input" id="ttv2FollowUpMode" required>
                <option value="">Select mode</option>
                <option value="call">Call</option>
                <option value="email">Email</option>
                <option value="meeting">Meeting</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Follow up status</label>
              <select class="form-control custom-input" id="ttv2FollowUpStatus" required>
                <option value="">Select status</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="follow-up">Follow-up</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Last follow up date</label>
              <input type="date" class="form-control custom-input" id="ttv2FollowUpLastDate">
            </div>
            <div class="col-md-6">
              <label class="form-label">Next follow up date</label>
              <input type="date" class="form-control custom-input" id="ttv2FollowUpNextDate">
            </div>
            <div class="col-12">
              <label class="form-label">Message</label>
              <textarea class="form-control custom-input" rows="3" id="ttv2FollowUpMessage" placeholder="Enter follow-up message"></textarea>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="ttv2FollowUpIsFollowed">
                <label class="form-check-label" for="ttv2FollowUpIsFollowed">Mark as followed up</label>
              </div>
            </div>
            <div class="col-12">
              <div class="text-muted" style="font-size:12px;" id="ttv2FollowUpFormStatus"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn custom-button purple-button" id="ttv2FollowUpSaveBtn">Save follow up</button>
        </div>
      </form>
    </div>
  </div>
</div>
