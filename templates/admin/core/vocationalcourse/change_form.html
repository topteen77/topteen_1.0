{% extends "admin/change_form.html" %}

{% block after_field_sets %}
{{ block.super }}

<!-- Content Tools - Add after the form fields -->
<div class="content-tools-wrapper" style="margin: 20px 0; clear: both; padding: 20px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px;">
    <div class="content-toolbar" style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button type="button" id="generate-accordion-btn" class="button" style="background: #417690; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
            Generate Accordion from Content
        </button>
        <button type="button" id="json-preview-btn" class="button" style="background: #417690; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
            JSON Preview
        </button>
        <button type="button" id="save-json-btn" class="button" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
            Save JSON to Model (Auto-saves on Submit)
        </button>
        <button type="button" id="debug-btn" class="button" style="background: #ffc107; color: black; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
            Debug Info
        </button>
    </div>
    
    <!-- Editor and Preview - Side by Side -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
        <!-- Left: Content Editor -->
        <div style="border: 1px solid #ddd; border-radius: 5px; background: #fff; padding: 20px;">
            <h3 style="margin-top: 0; margin-bottom: 15px; color: #417690;">Content Editor</h3>
            <div id="content-field-container">
                <!-- Content field will be moved here by JavaScript -->
                <p style="color: #666; margin-bottom: 10px;">Loading content field...</p>
            </div>
        </div>
        
        <!-- Right: Accordion Preview -->
        <div style="border: 1px solid #ddd; border-radius: 5px; background: #fff; padding: 20px;">
            <h3 style="margin-top: 0; margin-bottom: 15px; color: #417690;">Accordion Preview</h3>
            <div id="accordion-preview-container" style="min-height: 400px; max-height: min(85vh, 1200px); overflow-y: auto; overflow-x: hidden; padding-right: 10px;">
                <p style="color: #666; font-style: italic;">Click "Generate Accordion from Content" to see preview here...</p>
            </div>
        </div>
    </div>
</div>

<!-- JSON Preview Modal -->
<div id="json-preview-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 5px; max-width: 800px; max-height: 80vh; overflow: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">JSON Preview</h2>
            <button type="button" id="close-json-modal" style="background: #dc3545; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Close</button>
        </div>
        <pre id="json-preview-content" style="background: #f8f9fa; padding: 15px; border-radius: 4px; overflow: auto; max-height: 60vh;"></pre>
    </div>
</div>

<style>
/* Hide original content field - it will be shown in custom editor */
.field-content_html.moved {
    display: none !important;
}

.form-row.field-content_html.moved {
    display: none !important;
}

/* Hide content_json field - it's populated by JavaScript */
.field-content_json {
    display: none !important;
}

.form-row.field-content_json {
    display: none !important;
}

#id_content_json {
    display: none !important;
}

.content-toolbar button:hover {
    opacity: 0.9;
}

#accordion-preview-container {
    min-height: 400px;

    overflow-y: auto;

    padding-right: 10px;

/* Custom scrollbar for preview */
#accordion-preview-container::-webkit-scrollbar {

.cat-accordion .accordion-button i {

/* Pros & Cons table (matches public vocational page structure) */
#accordion-preview-container .pros-cons-table-wrap { margin-top: 8px; }
#accordion-preview-container .pros-cons-comparison-table {
    width: 100%; border-collapse: collapse; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;
}
#accordion-preview-container .pros-cons-comparison-table th {
    padding: 10px 12px; font-weight: 700; text-align: left; font-size: 0.95rem;
}
#accordion-preview-container .pros-cons-comparison-table th.pros-col { background: #ecfdf5; color: #047857; }
#accordion-preview-container .pros-cons-comparison-table th.cons-col { background: #fef2f2; color: #b91c1c; }
#accordion-preview-container .pros-cons-comparison-table td {
    padding: 12px 14px; vertical-align: top; font-size: 0.9rem; line-height: 1.5;
}
#accordion-preview-container .pros-cons-comparison-table .pros-cell { background: #f0fdf4; border-right: 1px solid #e5e7eb; }
#accordion-preview-container .pros-cons-comparison-table .cons-cell { background: #fff5f5; }

/* Admin preview: collapsed panels hidden (Bootstrap collapse CSS often not loaded in admin) */
#accordion-preview-container .accordion-collapse.collapse:not(.show) {
    display: none !important;
}
#accordion-preview-container .accordion-collapse.collapse.show {
    display: block;
}
#accordion-preview-container .admin-acc-toggle-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    margin-right: 4px;
    border: 2px solid #5046e5;
    border-radius: 6px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    color: #5046e5;
    background: #f4f3ff;
    user-select: none;
}
#accordion-preview-container .accordion-item.accordion-preview-error {
    border-left: 4px solid #ba2121;
    background: #fff8f8;
}
</style>

<script>
(function() {
    var contentTextarea = null;
    var accordionData = {};
    var jsonData = {};

    function sectionHtmlIsEffectivelyBlank(html) {
        if (!html || !String(html).trim()) return true;
        var d = document.createElement('div');
        try {
            d.innerHTML = html;
        } catch (e) {
            return true;
        }
        var t = (d.textContent || d.innerText || '')
            .replace(/\u00a0/g, ' ')
            .replace(/[\u200b-\u200d\ufeff]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
        return !t;
    }

    /** Collect <li> inner markup from mixed ul/li HTML fragments (pros_cons storage). */
    function fragmentsToLiInnerHtml(parts) {
        if (!parts || !parts.length) return '';
        var out = document.createElement('div');
        parts.forEach(function(fragment) {
            var w = document.createElement('div');
            w.innerHTML = fragment;
            var uls = w.querySelectorAll('ul');
            if (uls.length) {
                uls.forEach(function(ul) {
                    Array.prototype.forEach.call(ul.children, function(child) {
                        if (child.tagName === 'LI') {
                            out.appendChild(child.cloneNode(true));
                        }
                    });
                });
            } else {
                w.querySelectorAll('li').forEach(function(li) {
                    out.appendChild(li.cloneNode(true));
                });
            }
        });
        return out.innerHTML;
    }

    /**
     * Split combined Pros & Cons HTML into inner-<ul> content (series of <li>…</li>).
     * Mirrors public vocational_course_detail parse logic (combined title + orphan lists).
     */
    function splitProsConsHtmlToFragments(html) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = html || '';
        var prosContent = [];
        var consContent = [];
        var currentSection = null;
        // Omit `li` from the selector: each list is collected once via its parent `ul`.
        tempDiv.querySelectorAll('h3, h4, p, ul, strong').forEach(function(el) {
            var text = (el.textContent || '').trim().toLowerCase();
            if (text.indexOf('pros') !== -1 && text.indexOf('cons') !== -1) {
                currentSection = null;
            } else if (text.indexOf('pros') !== -1) {
                currentSection = 'pros';
            } else if (text.indexOf('cons') !== -1) {
                currentSection = 'cons';
            } else if (currentSection === 'pros' && el.tagName !== 'H3' && el.tagName !== 'H4') {
                if (el.tagName === 'UL') {
                    prosContent.push(el.outerHTML);
                } else if (el.closest && el.closest('ul')) {
                    // <p> / <strong> inside <li>: already captured with the parent <ul>
                } else if ((el.textContent || '').trim()) {
                    prosContent.push('<li>' + (el.textContent || '').trim() + '</li>');
                }
            } else if (currentSection === 'cons' && el.tagName !== 'H3' && el.tagName !== 'H4') {
                if (el.tagName === 'UL') {
                    consContent.push(el.outerHTML);
                } else if (el.closest && el.closest('ul')) {
                    // same as pros
                } else if ((el.textContent || '').trim()) {
                    consContent.push('<li>' + (el.textContent || '').trim() + '</li>');
                }
            } else if (currentSection === null && el.tagName === 'UL') {
                if (prosContent.length === 0) {
                    prosContent.push(el.outerHTML);
                } else if (consContent.length === 0) {
                    consContent.push(el.outerHTML);
                } else {
                    consContent.push(el.outerHTML);
                }
            }
        });
        if (prosContent.length === 0 && consContent.length === 0) {
            var lists = tempDiv.querySelectorAll('ul');
            if (lists.length >= 2) {
                prosContent.push(lists[0].outerHTML);
                consContent.push(lists[1].outerHTML);
            } else if (lists.length === 1) {
                prosContent.push(lists[0].outerHTML);
            }
        }
        return {
            pros: fragmentsToLiInnerHtml(prosContent),
            cons: fragmentsToLiInnerHtml(consContent)
        };
    }

    function buildProsConsTableHtml(prosInner, consInner) {
        var p = (prosInner || '').trim();
        var c = (consInner || '').trim();
        if (!p) p = '<li>No pros listed.</li>';
        if (!c) c = '<li>No cons listed.</li>';
        return '<div class="pros-cons-table-wrap">' +
            '<table class="pros-cons-comparison-table">' +
            '<thead><tr><th scope="col" class="pros-col">Pros</th><th scope="col" class="cons-col">Cons</th></tr></thead>' +
            '<tbody><tr><td class="pros-cell"><ul class="pros-cons-ul">' + p + '</ul></td>' +
            '<td class="cons-cell"><ul class="pros-cons-ul">' + c + '</ul></td></tr></tbody></table></div>';
    }

    /** Attach structured pros / cons strings under sections.pros_cons for verification and frontend. */
    function applyProsConsNodes(section) {
        if (!section || typeof section !== 'object') return;
        var html = (section.html || '').trim();
        if (html) {
            var fr = splitProsConsHtmlToFragments(html);
            section.pros = fr.pros;
            section.cons = fr.cons;
        }
    }
    
    // Fixed accordion headings as per requirements
    var FIXED_HEADINGS = [
        'Overview',
        'Eligibility & Admission',
        'Duration & Structure',
        'Curriculum Highlights',
        'Skills Required',
        'Pros & Cons',
        'Internship & Industry Collaborations',
        'Certification & Accreditation',
        'Learning Outcomes',
        'Career Growth & Prospects',
        'Employment Sectors & Employers',
        'Conclusion'
    ];
    
    // Icon mapping for each section
    var iconMap = {
        'Overview': 'bx bx-info-circle',
        'Eligibility & Admission': 'bx bx-user-check',
        'Duration & Structure': 'bx bx-time',
        'Curriculum Highlights': 'bx bx-book-open',
        'Skills Required': 'bx bx-grid-alt',
        'Pros & Cons': 'bx bx-list-ul',
        'Internship & Industry Collaborations': 'bx bx-briefcase-alt-2',
        'Certification & Accreditation': 'bx bx-award',
        'Learning Outcomes': 'bx bx-target-lock',
        'Career Growth & Prospects': 'bx bx-trending-up',
        'Employment Sectors & Employers': 'bx bx-building',
        'Conclusion': 'bx bx-rocket'
    };
    
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialize);
    } else {
        initialize();
    }
    
    function initialize() {
        // Wait for Django admin and CKEditor to fully render
        var checkCKEditor = function() {
            if (typeof CKEDITOR !== 'undefined') {
                setTimeout(function() {
                    // Ensure content_json field exists first
                    ensureContentJsonField();
                    setupContentField();
                    setupEventListeners();
                    setupButtons();
                    loadExistingJSON();
                }, 300);
            } else {
                setTimeout(checkCKEditor, 200);
            }
        };
        
        setTimeout(checkCKEditor, 300);
    }
    
    function setupContentField() {
        // Find the content_html textarea
        contentTextarea = document.querySelector('#id_content_html');
        
        if (!contentTextarea) {
            contentTextarea = document.querySelector('textarea[name="content_html"]');
        }
        
        if (contentTextarea) {
            var container = document.getElementById('content-field-container');
            if (container) {
                var fieldContainer = contentTextarea.closest('.form-row') || 
                                    contentTextarea.closest('div');
                
                if (fieldContainer) {
                    var isCKEditor = false;
                    var editor = null;
                    if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances.id_content_html) {
                        isCKEditor = true;
                        editor = CKEDITOR.instances.id_content_html;
                    }
                    
                    try {
                        container.innerHTML = '';
                        container.appendChild(fieldContainer);
                        
                        fieldContainer.style.display = 'block';
                        fieldContainer.style.visibility = 'visible';
                        
                        // Hide original location
                        var originalFieldContainer = contentTextarea.closest('.form-row');
                        if (originalFieldContainer && originalFieldContainer !== fieldContainer) {
                            originalFieldContainer.style.display = 'none';
                            originalFieldContainer.classList.add('moved');
                        }
                        
                        // Set up event listeners
                        if (isCKEditor && editor) {
                            setTimeout(function() {
                                editor.on('change', function() {
                                    var content = editor.getData();
                                    contentTextarea.value = content;
                                    clearTimeout(window.contentInputTimeout);
                                    window.contentInputTimeout = setTimeout(function() {
                                        generateAccordionFromContent();
                                    }, 500);
                                });
                                
                                editor.on('blur', function() {
                                    generateAccordionFromContent();
                                });
                            }, 100);
                        } else {
                            contentTextarea.addEventListener('input', function() {
                                // Auto-generate on input (debounced)
                                clearTimeout(window.contentInputTimeout);
                                window.contentInputTimeout = setTimeout(function() {
                                    generateAccordionFromContent();
                                }, 1000);
                            });
                            
                            contentTextarea.addEventListener('blur', function() {
                                generateAccordionFromContent();
                            });
                        }
                    } catch (e) {
                        console.error('Error setting up content field:', e);
                        container.innerHTML = '<p style="color: #dc3545;">Error: ' + e.message + '</p>';
                    }
                }
            }
        } else {
            var container = document.getElementById('content-field-container');
            if (container) {
                container.innerHTML = '<p style="color: #dc3545;">Content field not found.</p>';
            }
        }
    }
    
    function setupEventListeners() {
        // Ensure content_json field exists first
        ensureContentJsonField();
        
        // Auto-save JSON on form submit
        var form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function(e) {
                // Generate and save JSON before form submission
                generateAccordionFromContent();
                
                // Find or create the content_json field
                var jsonField = ensureContentJsonField();
                if (jsonField) {
                    var jsonString = JSON.stringify(jsonData);
                    jsonField.value = jsonString;
                    console.log('JSON auto-saved on form submit. Length:', jsonString.length);
                    console.log('JSON preview:', jsonString.substring(0, 200) + '...');
                    console.log('Field name:', jsonField.name, 'Field id:', jsonField.id);
                    console.log('Field in form:', form.contains(jsonField));
                } else {
                    console.error('Could not create content_json field');
                }
                
                // Allow form to submit normally
                return true;
            });
        }
        
        // Hook into Django admin's submit buttons - use mousedown to catch before form validation
        var submitButtons = document.querySelectorAll('input[type="submit"], button[name="_save"], button[name="_continue"], button[name="_addanother"], button[type="submit"]');
        submitButtons.forEach(function(button) {
            // Use mousedown to ensure we run before form validation
            button.addEventListener('mousedown', function(e) {
                // Generate and save JSON before submit
                try {
                    generateAccordionFromContent();
                    
                    var jsonField = ensureContentJsonField();
                    if (jsonField) {
                        jsonField.value = JSON.stringify(jsonData);
                        console.log('JSON auto-saved before form submission');
                    } else {
                        console.error('Could not create content_json field');
                    }
                } catch (err) {
                    console.error('Error auto-saving JSON:', err);
                }
            });
        });
        
        // Also listen for form submit event as backup
        if (form) {
            form.addEventListener('submit', function(e) {
                // Generate and save JSON before form submission
                try {
                    generateAccordionFromContent();
                    
                    var jsonField = ensureContentJsonField();
                    if (jsonField) {
                        jsonField.value = JSON.stringify(jsonData);
                        console.log('JSON auto-saved on form submit (backup)');
                    } else {
                        console.error('Could not create content_json field');
                    }
                } catch (err) {
                    console.error('Error auto-saving JSON on submit:', err);
                }
            }, true); // Use capture phase to run early
        }
        
        // Also watch for any programmatic form submissions
        var originalSubmit = HTMLFormElement.prototype.submit;
        HTMLFormElement.prototype.submit = function() {
            // Generate and save JSON before submit
            try {
                generateAccordionFromContent();
                var jsonField = ensureContentJsonField();
                if (jsonField) {
                    jsonField.value = JSON.stringify(jsonData);
                    console.log('JSON set in programmatic submit. Value length:', jsonField.value.length);
                }
            } catch (err) {
                console.error('Error auto-saving JSON:', err);
            }
            return originalSubmit.apply(this, arguments);
        };
        
        // Final safety check: Before any form submission, ensure JSON is set
        var form = document.querySelector('form');
        if (form) {
            // Use a MutationObserver to watch for form submission
            var observer = new MutationObserver(function(mutations) {
                // This is a backup - ensure JSON is always set
                var jsonField = ensureContentJsonField();
                if (jsonField && (!jsonField.value || jsonField.value === '')) {
                    generateAccordionFromContent();
                    jsonField.value = JSON.stringify(jsonData);
                    console.log('JSON set via MutationObserver backup');
                }
            });
            
            // Also add a final check on form submit using a very early event
            var formSubmitHandler = function(e) {
                generateAccordionFromContent();
                var jsonField = ensureContentJsonField();
                if (jsonField) {
                    jsonField.value = JSON.stringify(jsonData);
                    console.log('FINAL CHECK: JSON set. Length:', jsonField.value.length);
                    console.log('Field exists in DOM:', document.body.contains(jsonField));
                }
            };
            
            // Use capture phase to run very early
            form.addEventListener('submit', formSubmitHandler, true);
        }
    }
    
    function setupButtons() {
        var generateBtn = document.getElementById('generate-accordion-btn');
        if (generateBtn) {
            generateBtn.addEventListener('click', generateAccordionFromContent);
        }
        
        var jsonBtn = document.getElementById('json-preview-btn');
        if (jsonBtn) {
            jsonBtn.addEventListener('click', showJSONModal);
        }
        
        var saveBtn = document.getElementById('save-json-btn');
        if (saveBtn) {
            saveBtn.addEventListener('click', saveJSONToModel);
        }
        
        var debugBtn = document.getElementById('debug-btn');
        if (debugBtn) {
            debugBtn.addEventListener('click', showDebugInfo);
        }
        
        var closeBtn = document.getElementById('close-json-modal');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                document.getElementById('json-preview-modal').style.display = 'none';
            });
        }
    }
    
    function ensureContentJsonField() {
        // Ensure content_json field exists, create if it doesn't
        var jsonField = document.querySelector('#id_content_json');
        
        if (!jsonField) {
            // Try alternative selectors
            jsonField = document.querySelector('input[name="content_json"]');
            jsonField = jsonField || document.querySelector('textarea[name="content_json"]');
        }
        
        if (!jsonField) {
            // Create hidden input field for content_json
            var form = document.querySelector('form');
            if (form) {
                jsonField = document.createElement('input');
                jsonField.type = 'hidden';
                jsonField.id = 'id_content_json';
                jsonField.name = 'content_json';
                jsonField.value = '';
                // Make sure it's added to the form in a way Django will accept
                var fieldset = form.querySelector('fieldset') || form;
                fieldset.appendChild(jsonField);
                console.log('Created hidden content_json field and appended to form');
            } else {
                console.error('Form not found when trying to create content_json field');
            }
        } else {
            console.log('Found existing content_json field:', jsonField.id, jsonField.name);
        }
        
        return jsonField;
    }
    
    function loadExistingJSON() {
        // Load existing content_json if available
        var jsonField = ensureContentJsonField();
        if (jsonField && jsonField.value) {
            try {
                var existingData = JSON.parse(jsonField.value);
                
                // Load full JSON structure including programtitle and overview
                if (existingData) {
                    // Set accordionData from sections
                    if (existingData.sections) {
                        accordionData = existingData.sections;
                    }
                    
                    // Set jsonData with full structure
                    jsonData = {
                        programtitle: existingData.programtitle || '',
                        overview: existingData.overview || '',
                        sections: existingData.sections || accordionData
                    };
                    
                    // If programtitle is missing, get it from name field
                    if (!jsonData.programtitle) {
                        var nameField = document.querySelector('#id_name');
                        if (nameField) {
                            jsonData.programtitle = nameField.value || '';
                        }
                    }
                    
                    // If overview is missing, try to extract from Overview section
                    if (!jsonData.overview) {
                        var overviewKey = 'overview';
                        if (jsonData.sections && jsonData.sections[overviewKey] && jsonData.sections[overviewKey].html) {
                            jsonData.overview = jsonData.sections[overviewKey].html.trim();
                        }
                    }

                    if (jsonData.sections && jsonData.sections.pros_cons) {
                        applyProsConsNodes(jsonData.sections.pros_cons);
                    }
                    
                    updateAccordionPreview();
                }
            } catch (e) {
                console.warn('Error parsing existing JSON:', e);
            }
        }
    }
    
    // Keyword mapping for better matching
    var KEYWORD_MAP = {
        'eligibility_admission': ['eligibility', 'admission', 'admit', 'entry', 'requirement', 'qualification', 'criteria'],
        'duration_structure': ['duration', 'structure', 'length', 'period', 'time', 'year', 'semester', 'term'],
        'curriculum_highlights': ['curriculum', 'syllabus', 'course', 'subject', 'module', 'highlight', 'content', 'study'],
        'skills_required': ['skill', 'ability', 'competence', 'proficiency', 'capability', 'talent'],
        'pros_cons': ['pros', 'cons', 'advantage', 'disadvantage', 'benefit', 'drawback', 'merit', 'demerit', 'strength', 'weakness'],
        'internship_industry_collaborations': ['internship', 'industry', 'collaboration', 'training', 'practical', 'exposure', 'attachment', 'placement'],
        'certification_accreditation': ['certification', 'accreditation', 'certificate', 'accredit', 'license', 'credential', 'diploma'],
        'learning_outcomes': ['learning', 'outcome', 'result', 'achievement', 'objective', 'goal', 'target'],
        'career_growth_prospects': ['career', 'growth', 'prospect', 'opportunity', 'advancement', 'progress', 'future', 'scope'],
        'employment_sectors_employers': ['employment', 'sector', 'employer', 'recruiter', 'company', 'organization', 'job', 'work'],
        'overview': ['overview', 'introduction', 'intro', 'about', 'summary', 'description', 'general', 'brief'],
    'conclusion': ['conclusion', 'summary', 'final', 'overall', 'wrap', 'end']
    };
    
    function normalizeText(text) {
        return text.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
    }
    
    function matchHeadingToSection(headingText) {
        var normalizedHeading = normalizeText(headingText);
        var bestMatch = null;
        var bestScore = 0;
        
        // First try exact or partial match with fixed headings
        FIXED_HEADINGS.forEach(function(fixedHeading) {
            var normalizedFixed = normalizeText(fixedHeading);
            var key = fixedHeading.toLowerCase().replace(/[^a-z0-9]+/g, '_');
            
            // Exact match
            if (normalizedHeading === normalizedFixed) {
                bestMatch = key;
                bestScore = 100;
                return;
            }
            
            // Partial match (one contains the other)
            if (normalizedHeading.includes(normalizedFixed) || normalizedFixed.includes(normalizedHeading)) {
                var score = Math.min(normalizedHeading.length, normalizedFixed.length) / Math.max(normalizedHeading.length, normalizedFixed.length) * 80;
                if (score > bestScore) {
                    bestMatch = key;
                    bestScore = score;
                }
            }
        });
        
        // If no good match found, try keyword matching
        if (bestScore < 50) {
            Object.keys(KEYWORD_MAP).forEach(function(key) {
                var keywords = KEYWORD_MAP[key];
                var matchCount = 0;
                keywords.forEach(function(keyword) {
                    if (normalizedHeading.includes(keyword)) {
                        matchCount++;
                    }
                });
                
                if (matchCount > 0) {
                    var score = (matchCount / keywords.length) * 60;
                    if (score > bestScore) {
                        bestMatch = key;
                        bestScore = score;
                    }
                }
            });
        }
        
        return bestMatch;
    }

    function headingKeyFromText(text) {
        var key = (text || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        return key || 'section_' + Math.random().toString(36).slice(2, 8);
    }
    
    // Helper function to check if a heading text is an exact match to a fixed heading
    function isExactFixedHeading(text) {
        var normalized = normalizeText(text);
        return FIXED_HEADINGS.some(function(fh) {
            return normalizeText(fh) === normalized;
        });
    }
    
    function extractContentUntilNextHeading(element) {
        var content = '';
        var current = element;
        
        // Move to next sibling after the heading element
        current = current.nextSibling;
        
        while (current) {
            // Stop at any next heading (h1-h6): each heading should become its own accordion
            if (current.nodeType === 1 && current.tagName && current.tagName.match(/^H[1-6]$/)) {
                break;
            }
            
            // Handle element nodes
            if (current.nodeType === 1) {
                // Check if this element contains a top-level heading (h1-h6) that is an exact fixed heading
                var headings = current.querySelectorAll('h1, h2, h3, h4, h5, h6');
                var foundExactSectionHeading = false;
                
                for (var i = 0; i < headings.length; i++) {
                    var h = headings[i];
                    // Check if this heading is a direct child (not nested deep)
                    var depth = 0;
                    var parent = h.parentElement;
                    while (parent && parent !== current) {
                        depth++;
                        parent = parent.parentElement;
                    }
                    
                    // Only consider headings that are direct or near-direct children
                    if (depth <= 2) {
                        var hText = h.textContent.trim();
                        // Only stop if it's an exact match to a fixed heading
                        if (isExactFixedHeading(hText)) {
                            // Found a section heading, stop before this element
                            foundExactSectionHeading = true;
                            break;
                        }
                    }
                }
                
                if (foundExactSectionHeading) {
                    break;
                }
                
                // Check for paragraphs with strong tags - only stop if it's an exact fixed heading match
                if (current.tagName === 'P') {
                    var strong = current.querySelector('strong:first-child');
                    if (strong && strong.parentElement === current) {
                        var strongText = strong.textContent.trim();
                        // Only stop if this is an exact match to a fixed heading
                        if (isExactFixedHeading(strongText)) {
                            // Check if this paragraph is very short (likely a heading, not content)
                            var paraText = current.textContent.trim();
                            var isLikelyHeading = paraText.length < 100 && 
                                                  (paraText.split(' ').length <= 10) &&
                                                  // Make sure it's not just a label followed by content
                                                  (current.children.length === 1 || current.textContent === strong.textContent);
                            
                            if (isLikelyHeading) {
                                // This is likely a new section heading, stop before it
                                break;
                            }
                        }
                        // Otherwise, it's probably a sub-heading or label within the content, include it
                    }
                }
                
                // Include this element's HTML (including lists, divs, etc.)
                content += current.outerHTML || '';
            } else if (current.nodeType === 3) {
                // Text node - only include if it has meaningful content
                var text = current.textContent.trim();
                if (text && text.length > 0) {
                    // Wrap in paragraph if it's substantial
                    if (text.length > 10) {
                        content += '<p>' + text + '</p>';
                    } else {
                        content += text;
                    }
                }
            }
            
            current = current.nextSibling;
        }
        
        return content.trim();
    }
    
    function generateAccordionFromContent() {
        if (!contentTextarea) return;
        
        // Get content from CKEditor if available, otherwise from textarea
        var html = '';
        if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances.id_content_html) {
            var editor = CKEDITOR.instances.id_content_html;
            html = editor.getData() || contentTextarea.value || '';
            contentTextarea.value = html;
        } else {
            html = contentTextarea.value || '';
        }
        
        if (!html.trim()) {
            var container = document.getElementById('accordion-preview-container');
            if (container) {
                container.innerHTML = '<p style="color: #666; font-style: italic;">No content found. Add content to generate accordion.</p>';
            }
            return;
        }
        
        // Parse HTML to extract sections based on headings
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        
        // Initialize accordion data with all fixed headings
        accordionData = {};
        FIXED_HEADINGS.forEach(function(heading) {
            accordionData[heading.toLowerCase().replace(/[^a-z0-9]+/g, '_')] = {
                title: heading,
                html: ''
            };
        });
        
        // Find all section headings: every h1–h6 (CKEditor often uses H3+), plus p/div that
        // start with a known section title in bold. Old logic used only H2 when any H2
        // existed, so H3 titles (e.g. "Career Growth & Prospects") never became their own JSON section.
        var headingByEl = new Map();
        function registerHeading(el, source) {
            if (!el || el.nodeType !== 1) return;
            if (headingByEl.has(el)) return;
            headingByEl.set(el, { element: el, type: source || 'heading' });
        }

        tempDiv.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function(h) {
            registerHeading(h, 'hx');
        });

        tempDiv.querySelectorAll('p, div').forEach(function(block) {
            var fc = block.firstElementChild;
            if (!fc || (fc.tagName !== 'STRONG' && fc.tagName !== 'B')) return;
            var raw = (fc.textContent || '').trim();
            if (!raw || raw.length > 140) return;
            if (normalizeText(raw).split(/\s+/).length > 16) return;
            if (!matchHeadingToSection(raw) && !isExactFixedHeading(raw)) return;
            registerHeading(block, 'p-strong');
        });

        var headings = Array.from(headingByEl.values());
        headings.sort(function(a, b) {
            var pos = a.element.compareDocumentPosition(b.element);
            return pos & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
        });

        (function() {
            var out = [];
            var prevKey = null;
            headings.forEach(function(ho) {
                var t = ho.element.textContent.trim();
                var k = matchHeadingToSection(t) || headingKeyFromText(t);
                if (out.length && k === prevKey) return;
                prevKey = k;
                out.push(ho);
            });
            headings = out;
        })();
        
        // Process each heading
        var debugLog = [];
        headings.forEach(function(headingObj, index) {
            var heading = headingObj.element;
            var headingText = heading.textContent.trim();
            
            // Match heading to section
            var matchedKey = matchHeadingToSection(headingText);
            if (!matchedKey) {
                matchedKey = headingKeyFromText(headingText);
            }
            if (!accordionData[matchedKey]) {
                accordionData[matchedKey] = { title: headingText, html: '' };
            }
            
            debugLog.push({
                index: index,
                headingText: headingText,
                matchedKey: matchedKey,
                tagName: heading.tagName
            });
            
            // Extract content after this heading until next heading
            var content = extractContentUntilNextHeading(heading);
            if (content.trim()) {
                if (accordionData[matchedKey].html) {
                    accordionData[matchedKey].html += '<hr style="margin: 20px 0;">' + content;
                } else {
                    accordionData[matchedKey].html = content;
                }
                debugLog[debugLog.length - 1].contentLength = content.length;
            } else {
                debugLog[debugLog.length - 1].contentLength = 0;
                debugLog[debugLog.length - 1].warning = 'No content extracted';
            }
        });
        
        // Store debug log for debugging
        window.lastDebugLog = debugLog;
        console.log('Heading matches:', debugLog);
        
        // Handle content before first heading (hero / subtitle above first section heading).
        // Do not overwrite body extracted under <h2>Overview</h2>; merge like fix_vocational_course_headings.generate_content_json.
        var firstHeading = headings.length > 0 ? headings[0].element : null;
        var overviewKey = 'overview';
        if (firstHeading) {
            var contentBefore = '';
            var current = tempDiv.firstChild;
            while (current && current !== firstHeading) {
                if (current.nodeType === 1) {
                    if (current.tagName && current.tagName.match(/^H[1-6]$/)) {
                        break;
                    }
                    contentBefore += current.outerHTML || '';
                } else if (current.nodeType === 3 && current.textContent.trim()) {
                    contentBefore += '<p>' + current.textContent.trim() + '</p>';
                }
                current = current.nextSibling;
            }

            var innerOverview = (accordionData[overviewKey] && accordionData[overviewKey].html)
                ? accordionData[overviewKey].html.trim() : '';
            var beforeTrim = (contentBefore || '').trim();
            if (accordionData[overviewKey]) {
                if (sectionHtmlIsEffectivelyBlank(innerOverview)) {
                    accordionData[overviewKey].html = beforeTrim;
                } else if (beforeTrim) {
                    var innerPlain = '';
                    try {
                        var iw = document.createElement('div');
                        iw.innerHTML = innerOverview;
                        innerPlain = (iw.textContent || iw.innerText || '').replace(/\s+/g, ' ').trim();
                    } catch (e) {
                        innerPlain = innerOverview;
                    }
                    var leadPlain = '';
                    try {
                        var lw = document.createElement('div');
                        lw.innerHTML = beforeTrim;
                        leadPlain = (lw.textContent || lw.innerText || '').replace(/\s+/g, ' ').trim();
                    } catch (e) {
                        leadPlain = beforeTrim;
                    }
                    var leadPrefix = leadPlain.slice(0, 48);
                    if (leadPrefix && innerPlain.indexOf(leadPrefix) === -1) {
                        accordionData[overviewKey].html = (beforeTrim.replace(/\s+$/, '') + innerOverview).trim();
                    }
                }
            }
        } else {
            // No headings found - put all content in Overview section
            var allContent = tempDiv.innerHTML;
            if (allContent.trim() && accordionData[overviewKey]) {
                accordionData[overviewKey].html = allContent.trim();
            }
        }
        
        // Extract overview content from Overview section if it exists
        var overviewContent = '';
        if (accordionData[overviewKey] && accordionData[overviewKey].html) {
            overviewContent = accordionData[overviewKey].html.trim();
        }
        
        // Get program title from name field
        var programTitle = '';
        var nameField = document.querySelector('#id_name');
        if (nameField) {
            programTitle = nameField.value || '';
        }
        
        // Generate JSON structure with programtitle and overview
        jsonData = {
            programtitle: programTitle,
            overview: overviewContent,
            sections: accordionData
        };

        if (accordionData.pros_cons) {
            applyProsConsNodes(accordionData.pros_cons);
        }

        // Keep hidden content_json in sync with generated jsonData (same as submit / "Save JSON to Model")
        var jsonFieldSync = ensureContentJsonField();
        if (jsonFieldSync) {
            jsonFieldSync.value = JSON.stringify(jsonData);
        }
        
        updateAccordionPreview();
    }

    function setAdminAccordionToggleIcon(btn, open) {
        var ic = btn.querySelector('.admin-acc-toggle-icon');
        if (ic) ic.textContent = open ? '\u2212' : '+';
    }

    function bindAdminAccordionPreviewToggles(accordion) {
        // Independent toggles (do not close other panels) so editors can compare sections side by side
        accordion.querySelectorAll('.accordion-button').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                var sel = btn.getAttribute('data-acc-preview-target');
                if (!sel) return;
                var target = document.querySelector(sel);
                if (!target) return;
                var isOpen = target.classList.contains('show');
                if (isOpen) {
                    target.classList.remove('show');
                    btn.classList.add('collapsed');
                    btn.setAttribute('aria-expanded', 'false');
                    setAdminAccordionToggleIcon(btn, false);
                } else {
                    target.classList.add('show');
                    btn.classList.remove('collapsed');
                    btn.setAttribute('aria-expanded', 'true');
                    setAdminAccordionToggleIcon(btn, true);
                }
            });
        });
    }
    
    function updateAccordionPreview() {
        var container = document.getElementById('accordion-preview-container');
        if (!container) return;
        
        // Use sections from jsonData if available, otherwise use accordionData
        var sectionsToUse = (jsonData && jsonData.sections) ? jsonData.sections : accordionData;

        if (sectionsToUse && sectionsToUse.pros_cons) {
            applyProsConsNodes(sectionsToUse.pros_cons);
        }
        
        if (!sectionsToUse || Object.keys(sectionsToUse).length === 0) {
            container.innerHTML = '<p style="color: #666; font-style: italic;">No accordion data. Click "Generate Accordion from Content" to create.</p>';
            return;
        }
        
        // Create preview wrapper
        var previewWrapper = document.createElement('div');
        
        // Add title and overview section above accordion
        // Get programtitle and overview from jsonData or extract from sections or JSON field
        var programTitle = '';
        var overviewContent = '';
        
        // First try to get from jsonData
        if (jsonData) {
            programTitle = jsonData.programtitle || '';
            overviewContent = jsonData.overview || '';
        }
        
        // If overview is still missing, try to get from JSON field directly
        if (!overviewContent) {
            var jsonField = ensureContentJsonField();
            if (jsonField && jsonField.value) {
                try {
                    var existingData = JSON.parse(jsonField.value);
                    if (existingData && existingData.overview) {
                        overviewContent = existingData.overview;
                    }
                    if (existingData && existingData.programtitle && !programTitle) {
                        programTitle = existingData.programtitle;
                    }
                } catch (e) {
                    console.warn('Error parsing JSON field:', e);
                }
            }
        }
        
        // If overview is still missing, try to extract from Overview section
        if (!overviewContent) {
            var overviewKey = 'overview';
            if (jsonData && jsonData.sections && jsonData.sections[overviewKey] && jsonData.sections[overviewKey].html) {
                overviewContent = jsonData.sections[overviewKey].html.trim();
            } else if (sectionsToUse && sectionsToUse[overviewKey] && sectionsToUse[overviewKey].html) {
                overviewContent = sectionsToUse[overviewKey].html.trim();
            }
        }
        
        // If programtitle is still missing, get it from name field
        if (!programTitle) {
            var nameField = document.querySelector('#id_name');
            if (nameField) {
                programTitle = nameField.value || '';
            }
        }
        
        // Always show hero section if we have title or overview
        if (programTitle || overviewContent) {
            var heroSection = document.createElement('div');
            heroSection.style.cssText = 'background: #FFF4E9C9; background: linear-gradient(90deg, rgba(255, 244, 233, 0.79) 0%, rgba(250, 230, 205, 1) 50%); padding: 20px; border-radius: 12px; margin-bottom: 20px;';
            
            if (programTitle) {
                var titleEl = document.createElement('h2');
                titleEl.style.cssText = 'font-size: 24px; font-weight: 700; color: #222; margin-bottom: 12px;';
                titleEl.textContent = programTitle;
                heroSection.appendChild(titleEl);
            }
            
            if (overviewContent && overviewContent.trim()) {
                var overviewEl = document.createElement('div');
                overviewEl.style.cssText = 'color: #666; font-size: 16px; line-height: 1.6; max-height: 420px; overflow-y: auto;';
                overviewEl.className = 'admin-acc-preview-overview-body';

                // Full overview HTML (hero + subtitle + copy under Overview heading). Old logic showed only the first <p>, hiding parentheticals and long intros.
                overviewEl.innerHTML = overviewContent;

                heroSection.appendChild(overviewEl);
            } else {
                // Debug: log if overview is missing
                console.log('Overview content is empty or missing. jsonData:', jsonData);
            }
            
            previewWrapper.appendChild(heroSection);
        }
        
        // Create accordion element
        var accordion = document.createElement('div');
        accordion.className = 'accordion cat-accordion';
        accordion.id = 'vocationalAccordionPreview';
        
        // Display fixed headings first, then any additional dynamic H2 headings.
        var orderedKeys = [];
        FIXED_HEADINGS.forEach(function(heading) {
            if (heading === 'Overview') return;
            orderedKeys.push(heading.toLowerCase().replace(/[^a-z0-9]+/g, '_'));
        });
        Object.keys(sectionsToUse || {}).forEach(function(key) {
            if (key === 'overview') return;
            if (orderedKeys.indexOf(key) === -1) orderedKeys.push(key);
        });

        var accordionIndex = 0;
        orderedKeys.forEach(function(key) {
            var sectionData = sectionsToUse[key] || { title: key.replace(/_/g, ' '), html: '' };
            var heading = sectionData.title || key.replace(/_/g, ' ');
            var sectionId = 'preview-accordion-' + accordionIndex;
            var iconClass = iconMap[heading] || 'bx bx-layer';
            // Show the same HTML stored in JSON for this section (matches editor / public body).
            var previewBodyHtml = sectionData.html || '';
            var hasHtml = !sectionHtmlIsEffectivelyBlank(previewBodyHtml);
            var hasProsConsNodes = (key === 'pros_cons') &&
                ((sectionData.pros && String(sectionData.pros).trim()) || (sectionData.cons && String(sectionData.cons).trim()));
            var hasContent = hasHtml || hasProsConsNodes;
            if (!hasContent) {
                return;
            }
            if (!hasHtml && hasProsConsNodes) {
                previewBodyHtml = buildProsConsTableHtml(sectionData.pros, sectionData.cons);
            }
            
            // Create accordion item
            var accordionItem = document.createElement('div');
            accordionItem.className = 'accordion-item';
            
            // Create header
            var header = document.createElement('h2');
            header.className = 'accordion-header';
            header.id = sectionId + 'Heading';
            
            // Admin: expand all sections with content so the full document is visible at a glance
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'accordion-button';
            button.setAttribute('data-acc-preview-target', '#' + sectionId);
            button.setAttribute('aria-expanded', 'true');
            button.setAttribute('aria-controls', sectionId);

            var toggleIcon = document.createElement('span');
            toggleIcon.className = 'admin-acc-toggle-icon';
            toggleIcon.setAttribute('aria-hidden', 'true');
            toggleIcon.textContent = '\u2212';
            
            // Add icon and text
            var buttonContent = document.createElement('span');
            buttonContent.style.display = 'flex';
            buttonContent.style.alignItems = 'center';
            buttonContent.style.flex = '1';
            buttonContent.style.gap = '10px';
            buttonContent.innerHTML = '<i class="' + iconClass + '"></i><span>' + sectionData.title + '</span>';
            button.appendChild(toggleIcon);
            button.appendChild(buttonContent);
            
            header.appendChild(button);
            
            // Create collapse div
            var collapse = document.createElement('div');
            collapse.id = sectionId;
            collapse.className = 'accordion-collapse collapse show';
            collapse.setAttribute('aria-labelledby', header.id);
            collapse.setAttribute('data-bs-parent', '#vocationalAccordionPreview');
            
            // Create body
            var body = document.createElement('div');
            body.className = 'accordion-body';
            body.innerHTML = previewBodyHtml;
            
            collapse.appendChild(body);
            accordionItem.appendChild(header);
            accordionItem.appendChild(collapse);
            accordion.appendChild(accordionItem);
            
            // Increment accordion index for next iteration
            accordionIndex++;
        });

        if (accordion.children.length === 0) {
            var emptyAcc = document.createElement('p');
            emptyAcc.style.cssText = 'color:#666;padding:12px;margin:0;';
            emptyAcc.textContent = 'No sections with body content were found. Add section headings (H1–H6) or a short bold line that matches a fixed section name, then click Generate Accordion from Content.';
            accordion.appendChild(emptyAcc);
        }
        
        // Append accordion to wrapper
        previewWrapper.appendChild(accordion);
        
        // Clear and append wrapper
        container.innerHTML = '';
        container.appendChild(previewWrapper);

        bindAdminAccordionPreviewToggles(accordion);
    }
    
    function showJSONModal() {
        generateAccordionFromContent();
        
        // Ensure programtitle and overview are included before displaying
        if (!jsonData.programtitle) {
            var nameField = document.querySelector('#id_name');
            if (nameField) {
                jsonData.programtitle = nameField.value || '';
            }
        }
        
        // Ensure overview is included (extract from Overview section if not set)
        if (!jsonData.overview) {
            var overviewKey = 'overview';
            if (jsonData.sections && jsonData.sections[overviewKey] && jsonData.sections[overviewKey].html) {
                jsonData.overview = jsonData.sections[overviewKey].html.trim();
            }
        }
        
        var modal = document.getElementById('json-preview-modal');
        var content = document.getElementById('json-preview-content');
        
        if (modal && content) {
            content.textContent = JSON.stringify(jsonData, null, 2);
            modal.style.display = 'block';
        }
    }
    
    function saveJSONToModel() {
        generateAccordionFromContent();
        
        // Ensure programtitle and overview are included
        if (!jsonData.programtitle) {
            var nameField = document.querySelector('#id_name');
            if (nameField) {
                jsonData.programtitle = nameField.value || '';
            }
        }
        
        // Ensure overview is included (extract from Overview section if not set)
        if (!jsonData.overview) {
            var overviewKey = 'overview';
            if (jsonData.sections && jsonData.sections[overviewKey] && jsonData.sections[overviewKey].html) {
                jsonData.overview = jsonData.sections[overviewKey].html.trim();
            }
        }
        
        // Find or create the content_json field
        var jsonField = ensureContentJsonField();
        if (jsonField) {
            jsonField.value = JSON.stringify(jsonData, null, 2);
            
            // Show success message
            var saveBtn = document.getElementById('save-json-btn');
            if (saveBtn) {
                var originalText = saveBtn.textContent;
                saveBtn.textContent = 'Saved!';
                saveBtn.style.background = '#28a745';
                setTimeout(function() {
                    saveBtn.textContent = originalText;
                    saveBtn.style.background = '#28a745';
                }, 2000);
            }
            
            // Show notification instead of alert
            showNotification('JSON data has been saved to the content_json field. Click "Save" on the form to persist changes.', 'success');
        } else {
            alert('Could not create content_json field. Please check the form and try again.');
        }
    }
    
    function showNotification(message, type) {
        // Remove existing notification if any
        var existing = document.getElementById('json-notification');
        if (existing) {
            existing.remove();
        }
        
        // Create notification
        var notification = document.createElement('div');
        notification.id = 'json-notification';
        notification.style.cssText = 'position: fixed; top: 20px; right: 20px; padding: 15px 20px; background: ' + 
            (type === 'success' ? '#28a745' : '#dc3545') + '; color: white; border-radius: 5px; z-index: 10001; ' +
            'box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px;';
        notification.textContent = message;
        
        document.body.appendChild(notification);
        
        // Auto-remove after 3 seconds
        setTimeout(function() {
            if (notification.parentNode) {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(function() {
                    notification.remove();
                }, 300);
            }
        }, 3000);
    }
    
    function showDebugInfo() {
        generateAccordionFromContent();
        
        var debugInfo = '=== DEBUG INFO ===\n\n';
        debugInfo += 'Total Sections Found: ' + Object.keys(accordionData).length + '\n\n';
        
        debugInfo += 'Section Content Status:\n';
        Object.keys(accordionData).forEach(function(key) {
            var section = accordionData[key];
            var hasContent = section.html && section.html.trim().length > 0;
            var contentLength = section.html ? section.html.length : 0;
            debugInfo += '- ' + section.title + ': ' + (hasContent ? 'YES (' + contentLength + ' chars)' : 'NO') + '\n';
        });
        
        debugInfo += '\n=== JSON Structure ===\n';
        debugInfo += JSON.stringify(jsonData, null, 2);
        
        // Show in modal
        var modal = document.getElementById('json-preview-modal');
        var content = document.getElementById('json-preview-content');
        
        if (modal && content) {
            content.textContent = debugInfo;
            modal.style.display = 'block';
        } else {
            console.log(debugInfo);
            alert('Debug info logged to console. Check browser console (F12).');
        }
    }
    
    // Make functions available globally if needed
    window.generateAccordionFromContent = generateAccordionFromContent;
})();
</script>
{% endblock %}
