  <div class="cmm-sidebar-help-dialog">
    <header class="cmm-sidebar-help-header">
      <h2 id="cmm-sidebar-help-title">Course mindmap guide</h2>
      <button type="button" class="cmm-sidebar-help-close" data-cmm-help-close aria-label="Close help">&times;</button>

      {% course_mindmap_sidebar_help_body %}

    <footer class="cmm-sidebar-help-footer">
      <button type="button" class="button" data-cmm-help-close>Close</button>
    </footer>
