<div class="accordion-preview-wrapper">
    <div class="cat-accordion" id="careerAccordionPreview">
        <!-- Accordion will be generated by JavaScript -->
    </div>
</div>

<script>
(function() {
    // Get description HTML from the page
    var descriptionHtml = `{{ description|safe }}`;
    
    if (!descriptionHtml || !descriptionHtml.trim()) {
        document.getElementById('careerAccordionPreview').innerHTML = '<p style="color: #666; padding: 20px;">No description content available.</p>';
        return;
    }
    
    // Create a temporary container to parse HTML
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = descriptionHtml;
    
    // Find all H2 headings
    var h2Tags = tempDiv.querySelectorAll('h2');
    
    if (h2Tags.length === 0) {
        document.getElementById('careerAccordionPreview').innerHTML = '<p style="color: #666; padding: 20px;">No H2 headings found in description. Use "Convert to H2" button to convert &lt;p&gt;&lt;strong&gt; patterns to H2 tags.</p>';
        return;
    }
    
    // Icon mapping
    var iconMap = {
        'Overview': 'bx bx-id-card',
        'Roles and Responsibilities': 'bx bx-task',
        'Study Route & Eligibility Criteria': 'bx bx-book-reader',
        'Significant Observations': 'bx bx-bulb',
        'Internships & Practical Exposure': 'bx bx-briefcase-alt-2',
        'Courses & Specializations to Enter the Field': 'bx bx-book-content',
        'Top Institutes for Automobile Design Education in India': 'bx bx-building-house',
        'Top International Institutes': 'bx bx-globe',
        'Entrance Tests Required': 'bx bx-edit-alt',
        'Ideal Progressing Career Path': 'bx bx-trending-up',
        'Major Areas of Employment': 'bx bx-map-alt',
        'Prominent Employers': 'bx bx-building',
        'Pros and Cons of the Profession': 'bx bx-traffic-cone',
        'Industry Trends and Future Outlook': 'bx bx-line-chart',
        'Notable Automobile Designers and Their Contributions': 'bx bx-user-voice',
        'Key Software Tools': 'bx bx-chip',
        'Professional Organizations and Networks': 'bx bx-network-chart',
        'Advice for Aspiring Automobile Designers': 'bx bx-message-dots',
        'Conclusion': 'bx bx-check-shield',
        'Related Courses': 'bx bx-book-open',
        'Career Resources': 'bx bx-folder-open',
        'Frequently Asked Questions': 'bx bx-help-circle'
    };
    
    // Generate accordion items
    var accordion = document.getElementById('careerAccordionPreview');
    accordion.innerHTML = '';
    
    h2Tags.forEach(function(h2, index) {
        var sectionIndex = index + 1;
        var sectionId = 'careerAccordionItem' + sectionIndex;
        var sectionName = h2.textContent.trim();
        
        // Create accordion item
        var accordionItem = document.createElement('div');
        accordionItem.className = 'accordion-item';
        
        // Create header
        var header = document.createElement('h2');
        header.className = 'accordion-header';
        header.id = sectionId + 'Heading';
        
        var button = document.createElement('button');
        button.type = 'button';
        button.className = index === 0 ? 'accordion-button' : 'accordion-button collapsed';
        button.setAttribute('data-bs-toggle', 'collapse');
        button.setAttribute('data-bs-target', '#' + sectionId);
        button.setAttribute('aria-expanded', index === 0 ? 'true' : 'false');
        button.setAttribute('aria-controls', sectionId);
        
        var iconClass = iconMap[sectionName] || 'bx bx-layer';
        button.innerHTML = '<i class="' + iconClass + '"></i><span>' + sectionName + '</span>';
        
        header.appendChild(button);
        
        // Create collapse
        var collapse = document.createElement('div');
        collapse.id = sectionId;
        collapse.className = index === 0 ? 'accordion-collapse collapse show' : 'accordion-collapse collapse';
        collapse.setAttribute('aria-labelledby', header.id);
        collapse.setAttribute('data-bs-parent', '#careerAccordionPreview');
        
        var body = document.createElement('div');
        body.className = 'accordion-body';
        
        // Collect content between this H2 and next H2
        var contentElements = [];
        var current = h2.nextSibling;
        
        while (current) {
            if (current.nodeType === 1 && current.tagName === 'H2') {
                break;
            }
            if (current.nodeType === 1 || (current.nodeType === 3 && current.textContent.trim())) {
                contentElements.push(current.cloneNode(true));
            }
            current = current.nextSibling;
        }
        
        // Append content to body
        contentElements.forEach(function(el) {
            body.appendChild(el);
        });
        
        collapse.appendChild(body);
        accordionItem.appendChild(header);
        accordionItem.appendChild(collapse);
        accordion.appendChild(accordionItem);
    });
})();
</script>
