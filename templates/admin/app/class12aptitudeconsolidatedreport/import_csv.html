{% extends "admin/base_site.html" %}

{% block content %}
<h1>{{ title }}</h1>
<p>
  Export the list first to get the correct column layout. Put one bullet per line in
  <code>real_life_signs</code> and <code>daily_life_impact</code>.
</p>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <table>{{ form.as_table }}</table>
  <div class="submit-row">
    <input type="submit" value="Import" class="default">
    <a href="{% url 'admin:app_class12aptitudeconsolidatedreport_changelist' %}">Cancel</a>
  </div>
</form>
{% endblock %}
