{% extends 'topteenadmin/base.html' %}
{% block additional_header %}

<script>
            
  function wrong_pass_alert() {
            if (document.getElementById('old').value != "" &&
                document.getElementById('new').value != "" &&
                document.getElementById('confirm').value != "")
                 {
                alert("Your response is submitted");
            }
            else {
                alert("Please fill all the fields");
            }
        }
</script>


{% endblock %}
{% block main %}
<div class="card mb-5 mb-xl-10">
    <!--begin::Card header-->
    <div class="card-header border-0 cursor-pointer" role="button" data-bs-toggle="collapse" data-bs-target="#kt_account_profile_details" aria-expanded="true" aria-controls="kt_account_profile_details">
        <!--begin::Card title-->
        <div class="card-title m-0">
            <h3 class="fw-bolder m-0">Profile Details</h3>
        </div>
        <!--end::Card title-->
    </div>
    <!--begin::Card header-->
    <!--begin::Content-->
    <div id="kt_account_settings_profile_details" class="collapse show">
        <!--begin::Form-->
        <form id="kt_account_profile_details_form" class="form" method="POST" enctype="multipart/form-data" >
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <!--begin::Card body-->
            <div class="card-body border-top p-9">
                <!--begin::Input group-->
                <div class="row mb-6">
                    <!--begin::Label-->
                    <label class="col-lg-4 col-form-label fw-bold fs-6">Avatar</label>
                    <!--end::Label-->
                    <!--begin::Col-->
                    <div class="col-lg-8">
                        <!--begin::Image input-->
                        <div class="image-input image-input-outline" data-kt-image-input="true" style="background-image: url('assets/media/svg/avatars/blank.svg')">
                            <!--begin::Preview existing avatar-->
                            <div class="image-input-wrapper w-125px h-125px" style="background-image: url(assets/media/avatars/300-1.jpg)"></div>
                            <!--end::Preview existing avatar-->
                            <!--begin::Label-->
                            <label class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow" data-kt-image-input-action="change" data-bs-toggle="tooltip" title="Change avatar">
                                <i class="bi bi-pencil-fill fs-7"></i>
                                <!--begin::Inputs-->
                                <input type="file" name="image" accept=".png, .jpg, .jpeg" />
                                <input type="hidden" name="image_remove" />
                                <!--end::Inputs-->
                            </label>
                            <!--end::Label-->
                            <!--begin::Cancel-->
                            <span class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow" data-kt-image-input-action="cancel" data-bs-toggle="tooltip" title="Cancel avatar">
                                <i class="bi bi-x fs-2"></i>
                            </span>
                            <!--end::Cancel-->
                            <!--begin::Remove-->
                            <span class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow" data-kt-image-input-action="remove" data-bs-toggle="tooltip" title="Remove avatar">
                                <i class="bi bi-x fs-2"></i>
                            </span>
                            <!--end::Remove-->
                        </div>
                        <!--end::Image input-->
                        <!--begin::Hint-->
                        <div class="form-text">Allowed file types: png, jpg, jpeg.</div>
                        <!--end::Hint-->
                    </div>
                    <!--end::Col-->
                </div>
                <!--end::Input group-->
                <!--begin::Input group-->
                <div class="row mb-6">
                    <!--begin::Label-->
                    <label class="col-lg-4 col-form-label required fw-bold fs-6">Full Name</label>
                    <!--end::Label-->
                    <!--begin::Col-->
                    <div class="col-lg-8">
                        <!--begin::Row-->
                        <div class="row">
                            <!--begin::Col-->
                            <div class="col-lg-6 fv-row">
                                <input type="text" name="name" class="form-control form-control-lg form-control-solid mb-3 mb-lg-0"  value="{{user}}" />
                            </div>
                            <!--end::Col-->
                        </div>
                        <!--end::Row-->
                    </div>
                    <!--end::Col-->
                </div>
                <!--end::Input group-->
                
            <div class="card-footer d-flex justify-content-end py-6 px-9">
				<button type="reset" class="btn btn-light btn-active-light-primary me-2" >Discard</button>
                <button type="submit" class="btn btn-primary" id="kt_account_profile_details_submit" >Save Changes</button>
			</div>
              
        </form>  
        <form class="form" novalidate="novalidate" method="POST">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            
            <div class="row mb-1">
                <div class="row mb-1">
                    <div class="col-lg-4">
                        <div class="fv-row mb-0">
                            <label for="currentpassword" class="form-label fs-6 fw-bolder mb-3">Current Password</label>
                            <input type="password" class="form-control form-control-lg form-control-solid" name="oldpassword" id="old" minlength="8"/>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="fv-row mb-0">
                            <label for="newpassword" class="form-label fs-6 fw-bolder mb-3">New Password</label>
                            <input type="password" class="form-control form-control-lg form-control-solid" name="newpassword" id="new" minlength="8"/>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="fv-row mb-0">
                            <label for="confirmpassword" class="form-label fs-6 fw-bolder mb-3">Confirm New Password</label>
                            <input type="password" class="form-control form-control-lg form-control-solid" name="confirmpassword" id="confirm" minlength="8"/>
                        </div>
                    </div>
                </div>
                <div class="form-text mb-5">Password must be at least 8 character and contain symbols</div>
                <div class="d-flex">
                <button id="kt_password_submit" type="submit" class="btn btn-primary me-2 px-6"onclick="wrong_pass_alert()">Update Password</button>
                <button id="kt_password_cancel" type="reset" class="btn btn-color-gray-400 btn-active-light-primary px-6">Cancel</button>
            </div>
        </form> 
     </div>            
</div>

{% endblock %}
