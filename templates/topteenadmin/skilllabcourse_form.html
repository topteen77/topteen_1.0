{% extends 'topteenadmin/base.html' %}
{% block main %}
<!--begin::Post-->
<div class="post d-flex flex-column-fluid" id="kt_post">
    <!--begin::Container-->
    <div id="kt_content_container" class="container-xxl">
        <!--begin::Form-->
        <form method="POST" novalidate class="form d-flex flex-column flex-lg-row" enctype="multipart/form-data">
            <!--begin::Main column-->
            <div class="d-flex flex-column flex-row-fluid gap-7 gap-lg-10">
                <!--begin:::Tabs-->
				<ul class="nav nav-custom nav-tabs nav-line-tabs nav-line-tabs-2x border-0 fs-4 fw-bold mb-n2">
					<li class="nav-item">
                        <h2>{% if object %}Edit{% else %}Add{% endif %} Skill Lab Course</h2>
					</li>
					<li class="nav-item ms-auto">
						<button type="button" class="btn btn-sm btn-light-info" data-bs-toggle="modal" data-bs-target="#skilllabCourseGuideModal" title="How to add a course">
							<span class="svg-icon svg-icon-3">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
									<path opacity="0.3" d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="currentColor"/>
									<path d="M12 17C11.4 17 11 16.6 11 16V12C11 11.4 11.4 11 12 11C12.6 11 13 11.4 13 12V16C13 16.6 12.6 17 12 17ZM13 9H11V7H13V9Z" fill="currentColor"/>
								</svg>
							</span>
						</button>
					</li>
				</ul>
				<!--end:::Tabs-->
                <!--begin::Tab content-->
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="kt_ecommerce_add_product_general" role="tab-panel">
                        <div class="d-flex flex-column gap-7 gap-lg-10">
                            {% include 'topteenadmin/includes/base_form.html' %}
                        </div>
                    </div>
                </div>
                <!--end::Tab content-->
                <div class="d-flex justify-content-end">
                    <a href="{{url('topteenadminmanaged:skilllabcourselist')}}" class="btn btn-light me-5">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <span class="indicator-label">{% if object %}Save Changes{% else %}Save{% endif %}</span>
                        <span class="indicator-progress">Please wait...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
                    </button>
                </div>
            </div>
            <!--end::Main column-->
        </form>
        <!--end::Form-->
    </div>
    <!--end::Container-->
</div>
<!--end::Post-->
{% include 'topteenadmin/includes/skilllabcourse_import_guide_modal.html' %}
{% endblock %}
