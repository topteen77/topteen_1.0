<!-- CKEditor 5 Classic + upload adapter (screen2-style toolbar, headings H1–H6) -->
<script>
    var TOPTEEN_CKEDITOR_HEADING_OPTIONS = [
        { model: 'paragraph', title: 'Paragraph', class: 'ck-heading_paragraph' },
        { model: 'heading1', view: 'h1', title: 'Heading 1', class: 'ck-heading_heading1' },
        { model: 'heading2', view: 'h2', title: 'Heading 2', class: 'ck-heading_heading2' },
        { model: 'heading3', view: 'h3', title: 'Heading 3', class: 'ck-heading_heading3' },
        { model: 'heading4', view: 'h4', title: 'Heading 4', class: 'ck-heading_heading4' },
        { model: 'heading5', view: 'h5', title: 'Heading 5', class: 'ck-heading_heading5' },
        { model: 'heading6', view: 'h6', title: 'Heading 6', class: 'ck-heading_heading6' },
    ];

    function getTopteenCkEditorConfig(extraPlugins) {
        return {
            extraPlugins: extraPlugins || [],
            heading: {
                options: TOPTEEN_CKEDITOR_HEADING_OPTIONS,
            },
        };
    }

    class MyUploadAdapter {
       constructor(loader) {
          this.loader = loader;
          this.url = '{{ url("core:upload") }}';
       }
       upload() {
          return this.loader.file.then(
             (file) =>
                new Promise((resolve, reject) => {
                   this._initRequest();
                   this._initListeners(resolve, reject, file);
                   this._sendRequest(file);
                })
          );
       }
       abort() {
          if (this.xhr) {
             this.xhr.abort();
          }
       }
       _initRequest() {
          const xhr = (this.xhr = new XMLHttpRequest());
          xhr.open("POST", this.url, true);
          xhr.setRequestHeader("X-CSRFToken", "{{ csrf_token }}");
          xhr.responseType = "json";
       }
       _initListeners(resolve, reject, file) {
          const xhr = this.xhr;
          const loader = this.loader;
          const genericErrorText = `Couldn't upload file: ${file.name}.`;
          xhr.addEventListener("error", () => reject(genericErrorText));
          xhr.addEventListener("abort", () => reject());
          xhr.addEventListener("load", () => {
             const response = xhr.response;
             if (!response || response.error) {
                return reject(response && response.error ? response.error.message : genericErrorText);
             }
             resolve({
                default: response.url,
             });
          });
          if (xhr.upload) {
             xhr.upload.addEventListener("progress", (evt) => {
                if (evt.lengthComputable) {
                   loader.uploadTotal = evt.total;
                   loader.uploaded = evt.loaded;
                }
             });
          }
       }
       _sendRequest(file) {
          const data = new FormData();
          data.append("upload", file);
          this.xhr.send(data);
       }
    }

    function SimpleUploadAdapterPlugin(editor) {
       editor.plugins.get("FileRepository").createUploadAdapter = (loader) => {
          return new MyUploadAdapter(loader);
       };
    }

    function classieditor(id) {
        var tag = document.getElementById(id);
        if (!tag || typeof ClassicEditor === 'undefined') {
            return Promise.resolve(null);
        }
        if (tag._ckeditorInstance) {
            return Promise.resolve(tag._ckeditorInstance);
        }
        return ClassicEditor.create(tag, getTopteenCkEditorConfig([SimpleUploadAdapterPlugin]))
            .then(function (editor) {
                tag._ckeditorInstance = editor;
                return editor;
            })
            .catch(function (error) {
                console.error('CKEditor init failed for', id, error);
            });
    }
    window.classieditor = classieditor;

    function initAllTopteenAdminEditors() {
        if (typeof ClassicEditor === 'undefined') {
            console.error('CKEditor Classic build is not loaded');
            return Promise.resolve();
        }
        var chain = Promise.resolve();
        document.querySelectorAll('textarea.ckeditor').forEach(function (el) {
            if (!el.id) {
                el.id = 'ckeditor-' + Math.random().toString(36).slice(2, 9);
            }
            if (el._ckeditorInstance) {
                return;
            }
            chain = chain.then(function () {
                return classieditor(el.id);
            });
        });
        return chain.then(function () {
            var form = document.querySelector('form[method="POST"], form[method="post"]');
            if (form) {
                form.addEventListener('submit', function () {
                    document.querySelectorAll('textarea.ckeditor').forEach(function (el) {
                        if (el._ckeditorInstance && typeof el._ckeditorInstance.updateSourceElement === 'function') {
                            el._ckeditorInstance.updateSourceElement();
                        }
                    });
                });
            }
            document.dispatchEvent(new CustomEvent('topteen-ckeditor-ready'));
        });
    }
    window.initAllTopteenAdminEditors = initAllTopteenAdminEditors;
</script>
