<div class="menu menu-sub menu-sub-dropdown w-300px w-md-325px" data-kt-menu="true">
    <!--begin::Header-->
    <div class="px-7 py-5">
        <div class="fs-5 text-dark fw-bolder">Filter Options</div>
    </div>
    <!--end::Header-->
    <!--begin::Separator-->
    <div class="separator border-gray-200"></div>
    <!--end::Separator-->
    <!--begin::Content-->
    <div class="px-7 py-5" data-kt-subscription-table-filter="form">
        <!--begin::Input group-->
    <form method="GET">
        {% for field in filter_form %}
        <div class="mb-10">
            <label class="form-label fs-6 fw-bold">{{field.label}}</label>
            {{field}}
        </div>
        <!--begin::Input group-->
        {% endfor %}
        <!--begin::Actions-->
        <div class="d-flex justify-content-end">
            <button type="reset" onclick="window.location.href='{{reset_url}}'" class="btn btn-light btn-active-light-primary fw-bold me-2 px-6" data-kt-menu-dismiss="true" data-kt-subscription-table-filter="reset">Reset</button>
            <button type="submit" class="btn btn-primary fw-bold px-6" data-kt-menu-dismiss="true" data-kt-subscription-table-filter="filter">Apply</button>
        </div>
        <!--end::Actions-->
    </form>
    </div>
    <!--end::Content-->
</div>
