{# Demo accounts from DB only. Click a card to log in via token (no credentials in template or .env). #}
{% if demo_accounts %}
<div class="demo-credentials-section mt-5 text-start">
  <h5 class="fw-700 text-purple mb-2">Demo accounts</h5>
  <p class="text-gray fs-14 mb-3">Click a card to log in.</p>
  <div class="demo-credentials-grid d-flex flex-wrap gap-3">
    {% for account in demo_accounts %}
    <div class="demo-credential-card-wrapper">
      <form method="post" action="{{ demo_login_url }}" class="d-inline">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ demo_csrf_token }}">
        <input type="hidden" name="token" value="{{ account.token }}">
        <button type="submit" class="demo-credential-card card border rounded-3 p-3 cursor-pointer w-100 text-start border-2">
          <div class="demo-credential-card-inner">
            <h6 class="fw-600 text-dark mb-2">{{ account.name }}</h6>
            <span class="badge bg-secondary mb-2">{{ account.role_label }}</span>
            <span class="badge bg-purple">Login as {{ account.role_label }}</span>
          </div>
        </button>
      </form>
    </div>
    {% endfor %}
  </div>
</div>

<style>
.demo-credentials-section {
  width: 100%;
  overflow: hidden;
}
.demo-credentials-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.demo-credential-card-wrapper {
  min-width: 0;
}
.demo-credential-card {
  min-width: 180px;
  transition: all 0.2s ease;
  border: 2px solid #e4e4e4 !important;
  background: #fff !important;
  cursor: pointer;
}
.demo-credential-card:hover {
  border-color: #3f37c9 !important;
  box-shadow: 0 4px 12px rgba(63, 55, 201, 0.15);
}
.demo-credential-card-inner {
  display: block;
  min-width: 0;
}
.bg-purple { background-color: #3f37c9; }
</style>
{% endif %}
