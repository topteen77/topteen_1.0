{% if defer_scripts %}
<script type="text/plain" data-parent-report-script>
{% else %}
<script>
{% endif %}
  (function () {
    var scriptEl = document.currentScript;
    var root = (window.__ttParentReportRoot)
      || (scriptEl && (
        scriptEl.closest('.parent-inline-psychometric-dashboard')
        || scriptEl.closest('.psychometric-dashboard-page')
        || scriptEl.closest('.parent-assessment-report-pane')
      ))
      || document;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function countUpDayStreak(el, end, duration) {
      if (!el || reduceMotion) {
        if (el) el.textContent = 'Day ' + end;
        return;
      }
      var start = 0;
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var easeOut = 1 - Math.pow(1 - progress, 2);
        var current = Math.round(start + (end - start) * easeOut);
        el.textContent = 'Day ' + current;
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = 'Day ' + end;
      }
      requestAnimationFrame(step);
    }
    function countUp(el, end, duration) {
      if (!el || reduceMotion) { if (el) el.textContent = end; return; }
      var start = 0;
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var easeOut = 1 - Math.pow(1 - progress, 2);
        var current = Math.round(start + (end - start) * easeOut);
        el.textContent = current;
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = end;
      }
      requestAnimationFrame(step);
    }
    function initDashboardStatTooltips() {
      if (typeof bootstrap === 'undefined' || !bootstrap.Popover) return;

      function buildPopoverHtml(text) {
        var safe = String(text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
        return (
          '<div class="stat-card-info-popover-inner">' +
            '<button type="button" class="stat-card-info-popover-close" aria-label="Close">' +
              '<i class="bx bx-x" aria-hidden="true"></i>' +
            '</button>' +
            '<p class="stat-card-info-popover-text mb-0">' + safe + '</p>' +
          '</div>'
        );
      }

      root.querySelectorAll('#dashboard-stats-section .stat-card-info-btn').forEach(function (el) {
        var existingTip = bootstrap.Tooltip && bootstrap.Tooltip.getInstance(el);
        if (existingTip) existingTip.dispose();
        var existingPop = bootstrap.Popover.getInstance(el);
        if (existingPop) existingPop.dispose();

        var text = el.getAttribute('data-stat-info') || el.getAttribute('data-bs-title') || '';
        var pop = new bootstrap.Popover(el, {
          container: 'body',
          html: true,
          sanitize: false,
          trigger: 'click',
          placement: 'top',
          customClass: 'stat-card-info-popover',
          content: buildPopoverHtml(text)
        });

        el.addEventListener('shown.bs.popover', function () {
          el.setAttribute('aria-expanded', 'true');
          var tipId = el.getAttribute('aria-describedby');
          var tip = tipId ? document.getElementById(tipId) : null;
          if (!tip) return;
          var closeBtn = tip.querySelector('.stat-card-info-popover-close');
          if (!closeBtn) return;
          closeBtn.onclick = function (e) {
            e.preventDefault();
            e.stopPropagation();
            pop.hide();
          };
        });
        el.addEventListener('hidden.bs.popover', function () {
          el.setAttribute('aria-expanded', 'false');
        });
      });

      // Close when clicking outside (and don't open the stat modal)
      if (!root.__ttStatInfoOutsideBound) {
        root.__ttStatInfoOutsideBound = true;
        document.addEventListener('click', function (e) {
          var t = e.target;
          if (!t || !t.closest) return;
          if (t.closest('.stat-card-info-btn') || t.closest('.stat-card-info-popover')) return;
          root.querySelectorAll('#dashboard-stats-section .stat-card-info-btn').forEach(function (btn) {
            var instance = bootstrap.Popover.getInstance(btn);
            if (instance) instance.hide();
          });
        }, true);
      }
    }
    function initDashboardStatDetailTriggers() {
      root.querySelectorAll('#dashboard-stats-section .stat-card-info-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          // Keep card modal from opening; Bootstrap popover handles open/close
          e.stopPropagation();
        });
      });
      root.querySelectorAll('#dashboard-stats-section .stat-card-clickable').forEach(function (el) {
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            el.click();
          }
        });
      });
    }
    function initDashboardStats() {
      initDashboardStatTooltips();
      initDashboardStatDetailTriggers();
      var trophiesEl = root.querySelector('#stat-trophies');
      var pointsEl = root.querySelector('#stat-points');
      var streakEl = root.querySelector('#stat-streak');
      var streakLabel = root.querySelector('#stat-streak-label');
      var duration = 800;
      if (trophiesEl && trophiesEl.hasAttribute('data-value')) {
        var tv = parseInt(trophiesEl.getAttribute('data-value'), 10) || 0;
        countUp(trophiesEl, tv, duration);
      }
      if (pointsEl && pointsEl.hasAttribute('data-value')) {
        var pv = parseInt(pointsEl.getAttribute('data-value'), 10) || 0;
        countUp(pointsEl, pv, duration);
      }
      if (streakEl && streakEl.hasAttribute('data-value')) {
        var sv = parseInt(streakEl.getAttribute('data-value'), 10) || 0;
        if (streakEl.getAttribute('data-streak-format') === 'day-label') {
          countUpDayStreak(streakEl, sv, duration);
          if (streakLabel) streakLabel.textContent = 'Streak';
        } else {
          countUp(streakEl, sv, duration);
          if (streakLabel) {
            var psychStreak = /streak/i.test(streakLabel.textContent);
            if (sv === 1) streakLabel.textContent = psychStreak ? '1 day streak' : '1 day';
            else streakLabel.textContent = psychStreak ? (sv + ' day streak') : (sv + ' days');
          }
        }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDashboardStats);
    } else {
      initDashboardStats();
    }
  })();
</script>
