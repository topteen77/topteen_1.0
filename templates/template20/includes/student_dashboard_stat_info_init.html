{% if defer_scripts %}
<script type="text/plain" data-parent-report-script>
{% else %}
<script>
{% endif %}
  (function () {
    var scriptEl = document.currentScript;
    var root = (scriptEl && (
      scriptEl.closest('.parent-inline-psychometric-dashboard')
      || scriptEl.closest('.psychometric-dashboard-page')
      || scriptEl.closest('.parent-assessment-report-pane')
    )) || document;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function countUpDayStreak(el, end, duration) {
      if (!el || reduceMotion) {
        if (el) el.textContent = 'Day ' + end;
        return;
      }
      var start = 0;
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var easeOut = 1 - Math.pow(1 - progress, 2);
        var current = Math.round(start + (end - start) * easeOut);
        el.textContent = 'Day ' + current;
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = 'Day ' + end;
      }
      requestAnimationFrame(step);
    }
    function countUp(el, end, duration) {
      if (!el || reduceMotion) { if (el) el.textContent = end; return; }
      var start = 0;
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var easeOut = 1 - Math.pow(1 - progress, 2);
        var current = Math.round(start + (end - start) * easeOut);
        el.textContent = current;
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = end;
      }
      requestAnimationFrame(step);
    }
    function initDashboardStatTooltips() {
      if (typeof bootstrap === 'undefined' || !bootstrap.Tooltip) return;
      root.querySelectorAll('#dashboard-stats-section [data-bs-toggle="tooltip"]').forEach(function (el) {
        var existing = bootstrap.Tooltip.getInstance(el);
        if (existing) existing.dispose();
        new bootstrap.Tooltip(el, { container: 'body' });
      });
    }
    function initDashboardStatDetailTriggers() {
      root.querySelectorAll('#dashboard-stats-section .stat-value-trigger').forEach(function (el) {
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            el.click();
          }
        });
      });
    }
    function initDashboardStats() {
      initDashboardStatTooltips();
      initDashboardStatDetailTriggers();
      var trophiesEl = root.querySelector('#stat-trophies');
      var pointsEl = root.querySelector('#stat-points');
      var streakEl = root.querySelector('#stat-streak');
      var streakLabel = root.querySelector('#stat-streak-label');
      var duration = 800;
      if (trophiesEl && trophiesEl.hasAttribute('data-value')) {
        var tv = parseInt(trophiesEl.getAttribute('data-value'), 10) || 0;
        countUp(trophiesEl, tv, duration);
      }
      if (pointsEl && pointsEl.hasAttribute('data-value')) {
        var pv = parseInt(pointsEl.getAttribute('data-value'), 10) || 0;
        countUp(pointsEl, pv, duration);
      }
      if (streakEl && streakEl.hasAttribute('data-value')) {
        var sv = parseInt(streakEl.getAttribute('data-value'), 10) || 0;
        if (streakEl.getAttribute('data-streak-format') === 'day-label') {
          countUpDayStreak(streakEl, sv, duration);
          if (streakLabel) streakLabel.textContent = 'Streak';
        } else {
          countUp(streakEl, sv, duration);
          if (streakLabel) {
            var psychStreak = /streak/i.test(streakLabel.textContent);
            if (sv === 1) streakLabel.textContent = psychStreak ? '1 day streak' : '1 day';
            else streakLabel.textContent = psychStreak ? (sv + ' day streak') : (sv + ' days');
          }
        }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDashboardStats);
    } else {
      initDashboardStats();
    }
  })();
</script>
