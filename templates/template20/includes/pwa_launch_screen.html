<div id="pwa-launch-screen" class="pwa-launch-screen" hidden aria-hidden="true" aria-live="polite" aria-label="TopTeen is loading">
  <div class="pwa-launch-screen__bg" aria-hidden="true">
    <div class="pwa-launch-screen__mesh"></div>
    <div class="pwa-launch-screen__orb pwa-launch-screen__orb--1"></div>
    <div class="pwa-launch-screen__orb pwa-launch-screen__orb--2"></div>
    <div class="pwa-launch-screen__orb pwa-launch-screen__orb--3"></div>
    <div class="pwa-launch-screen__spark pwa-launch-screen__spark--1"></div>
    <div class="pwa-launch-screen__spark pwa-launch-screen__spark--2"></div>
    <div class="pwa-launch-screen__grid"></div>
  </div>

  <div class="pwa-launch-screen__content">
    <div class="pwa-launch-screen__logo-wrap">
      <div class="pwa-launch-screen__logo-glow" aria-hidden="true"></div>
      <div class="pwa-launch-screen__logo-card">
        <img
          class="pwa-launch-screen__logo"
          src="{{ static('images_new/logos/logo.svg') }}"
          alt="TopTeen"
          width="156"
          height="46"
          decoding="sync"
          fetchpriority="high"
        />
      </div>
    </div>

    <p class="pwa-launch-screen__eyebrow">Your career journey starts here</p>

    <p class="pwa-launch-screen__tagline">
      Explore Careers.<br />
      Discover Your Strengths.<br />
      <span class="pwa-launch-screen__tagline-accent">Shape Your Future.</span>
    </p>

    <div class="pwa-launch-screen__loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="pwa-launch-screen__loader-track">
        <div class="pwa-launch-screen__loader-bar" id="pwa-launch-progress"></div>
      </div>
      <p class="pwa-launch-screen__loader-label">Loading experience…</p>
    </div>
  </div>
</div>
<script src="{{ static('js_new/pwa-splash.js') }}?v=7"></script>
