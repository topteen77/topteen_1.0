{% if show_registration_welcome_popup %}
<style>
  .reg-welcome-overlay {
    position: fixed;
    inset: 0;
    z-index: 13000;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s ease;
    isolation: isolate;
    overflow: hidden;
  }

  .reg-welcome-backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: rgba(15, 23, 42, 0.42);
    backdrop-filter: blur(3px);
    pointer-events: none;
  }

  .reg-welcome-overlay.is-hiding {
    opacity: 0;
  }

  .reg-welcome-popup-wrap {
    position: relative;
    z-index: 1;
    pointer-events: auto;
    transform: scale(1) translateY(0);
    animation: regWelcomePopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .reg-welcome-popup {
    position: relative;
    width: min(360px, calc(100vw - 28px));
    padding: 1.65rem 1.45rem 1.25rem;
    border-radius: 24px;
    text-align: center;
    color: #ffffff;
    background: linear-gradient(155deg, #6366f1 0%, #4338ca 38%, #6d28d9 72%, #7c3aed 100%);
    box-shadow:
      0 28px 60px rgba(67, 56, 202, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.22) inset,
      0 0 80px rgba(129, 140, 248, 0.35);
    overflow: hidden;
    clip-path: inset(0 round 24px);
  }

  .reg-welcome-confetti-layer {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    overflow: hidden;
    border-radius: 24px;
    pointer-events: none;
    clip-path: inset(0 round 24px);
    contain: paint;
  }

  .reg-welcome-confetti-piece {
    position: absolute;
    left: var(--x);
    bottom: var(--y, 10%);
    width: var(--size, 7px);
    height: var(--size, 7px);
    margin-left: calc(var(--size, 7px) * -0.5);
    background: var(--color);
    border-radius: var(--round, 2px);
    opacity: 0;
    will-change: transform, opacity;
    animation: regWelcomeConfettiFly var(--duration, 2s) ease-out var(--delay, 0s) forwards;
  }

  @keyframes regWelcomeConfettiFly {
    0% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(0.45);
    }
    65% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translate3d(var(--tx), var(--ty), 0) rotate(var(--rot)) scale(1);
    }
  }

  .reg-welcome-popup::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.22) 0%, transparent 42%),
      radial-gradient(circle at 80% 100%, rgba(253, 224, 71, 0.12) 0%, transparent 38%);
    pointer-events: none;
  }

  .reg-welcome-popup::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.15);
    z-index: 2;
  }

  .reg-welcome-progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 100%;
    background: linear-gradient(90deg, #fde047, #f472b6, #60a5fa);
    transform-origin: left center;
    animation: regWelcomeProgress 20s linear forwards;
    z-index: 3;
    border-radius: 0 0 24px 24px;
  }

  @keyframes regWelcomeProgress {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }

  .reg-welcome-overlay.is-hiding .reg-welcome-popup-wrap {
    transform: scale(0.9) translateY(16px);
    opacity: 0;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }

  @keyframes regWelcomePopIn {
    0% { transform: scale(0.68) translateY(32px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .reg-welcome-inner {
    position: relative;
    z-index: 3;
  }

  .reg-welcome-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease;
    z-index: 4;
  }

  .reg-welcome-close:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: scale(1.06);
  }

  .reg-welcome-coin-wrap {
    perspective: 520px;
    width: 96px;
    height: 96px;
    margin: 0 auto 0.85rem;
    position: relative;
  }

  .reg-welcome-coin-glow {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(253, 224, 71, 0.55) 0%, transparent 68%);
    animation: regCoinGlow 2s ease-in-out infinite;
  }

  @keyframes regCoinGlow {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .reg-welcome-coin {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    animation: regCoinSpin3d 3.2s ease-in-out infinite;
  }

  .reg-welcome-coin-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform-style: preserve-3d;
  }

  .reg-welcome-coin-front {
    transform: translateZ(4px);
  }

  .reg-welcome-coin-back {
    transform: rotateY(180deg) translateZ(4px);
  }

  @keyframes regCoinSpin3d {
    0%, 12%, 88%, 100% { transform: rotateY(0deg) rotateX(14deg) scale(1); }
    50% { transform: rotateY(180deg) rotateX(-10deg) scale(1.06); }
  }

  .reg-welcome-coin-face svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.35));
  }

  .reg-welcome-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.28rem 0.65rem;
    margin-bottom: 0.55rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #fef9c3 !important;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .reg-welcome-title {
    font-size: 1.55rem;
    font-weight: 800;
    margin: 0 0 0.45rem;
    letter-spacing: -0.02em;
    color: #ffffff !important;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
  }

  .reg-welcome-sub {
    font-size: 0.95rem;
    margin: 0 0 1rem;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.92) !important;
    font-weight: 500;
  }

  .reg-welcome-points {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    padding: 0.55rem 1.1rem;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.32);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
    color: #ffffff !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }

  .reg-welcome-points strong {
    font-size: 1.35rem;
    font-weight: 800;
    color: #fde047 !important;
    text-shadow: 0 0 18px rgba(253, 224, 71, 0.45);
  }

  .reg-welcome-hint {
    font-size: 0.78rem;
    margin: 0;
    color: rgba(255, 255, 255, 0.78) !important;
    font-weight: 500;
  }
</style>

<div class="reg-welcome-overlay" id="regWelcomeOverlay" role="dialog" aria-labelledby="regWelcomeTitle" aria-live="polite">
  <div class="reg-welcome-backdrop" aria-hidden="true"></div>
  <div class="reg-welcome-popup-wrap" id="regWelcomePopupWrap">
    <div class="reg-welcome-popup" id="regWelcomePopup">
      <div class="reg-welcome-confetti-layer" id="regWelcomeConfettiLayer" aria-hidden="true"></div>
      <div class="reg-welcome-progress" aria-hidden="true"></div>
      <button type="button" class="reg-welcome-close" id="regWelcomeClose" aria-label="Close">&times;</button>

      <div class="reg-welcome-inner">
      <div class="reg-welcome-coin-wrap">
        <div class="reg-welcome-coin-glow"></div>
        <div class="reg-welcome-coin">
          <div class="reg-welcome-coin-face reg-welcome-coin-front">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="regCoinFaceFront" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff9db"/>
                  <stop offset="40%" stop-color="#fbbf24"/>
                  <stop offset="100%" stop-color="#b45309"/>
                </linearGradient>
                <linearGradient id="regCoinEdgeFront" x1="0%" y1="50%" x2="100%" y2="50%">
                  <stop offset="0%" stop-color="#92400e"/>
                  <stop offset="50%" stop-color="#fde68a"/>
                  <stop offset="100%" stop-color="#78350f"/>
                </linearGradient>
                <radialGradient id="regCoinShineFront" cx="32%" cy="28%" r="58%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="64" rx="44" ry="7" fill="#000" opacity="0.2"/>
              <circle cx="60" cy="56" r="44" fill="url(#regCoinEdgeFront)"/>
              <circle cx="60" cy="54" r="38" fill="url(#regCoinFaceFront)"/>
              <circle cx="60" cy="54" r="38" fill="url(#regCoinShineFront)"/>
              <circle cx="60" cy="54" r="32" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.6"/>
              <path d="M60 28 L64.2 42.8 L79.8 42.8 L67.4 52.2 L71.6 67 L60 57.6 L48.4 67 L52.6 52.2 L40.2 42.8 L55.8 42.8 Z" fill="#fffbeb"/>
              <text x="60" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e" font-family="DM Sans, Space Grotesk, sans-serif">POINTS</text>
            </svg>
          </div>
          <div class="reg-welcome-coin-face reg-welcome-coin-back">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="regCoinFaceBack" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff9db"/>
                  <stop offset="40%" stop-color="#fbbf24"/>
                  <stop offset="100%" stop-color="#b45309"/>
                </linearGradient>
                <linearGradient id="regCoinEdgeBack" x1="0%" y1="50%" x2="100%" y2="50%">
                  <stop offset="0%" stop-color="#92400e"/>
                  <stop offset="50%" stop-color="#fde68a"/>
                  <stop offset="100%" stop-color="#78350f"/>
                </linearGradient>
                <radialGradient id="regCoinShineBack" cx="68%" cy="28%" r="58%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="64" rx="44" ry="7" fill="#000" opacity="0.2"/>
              <circle cx="60" cy="56" r="44" fill="url(#regCoinEdgeBack)"/>
              <circle cx="60" cy="54" r="38" fill="url(#regCoinFaceBack)"/>
              <circle cx="60" cy="54" r="38" fill="url(#regCoinShineBack)"/>
              <circle cx="60" cy="54" r="32" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.6"/>
              <path d="M60 28 L64.2 42.8 L79.8 42.8 L67.4 52.2 L71.6 67 L60 57.6 L48.4 67 L52.6 52.2 L40.2 42.8 L55.8 42.8 Z" fill="#fffbeb"/>
              <text x="60" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e" font-family="DM Sans, Space Grotesk, sans-serif">POINTS</text>
            </svg>
          </div>
        </div>
      </div>

      <span class="reg-welcome-badge">&#127881; Welcome Bonus</span>
      <h2 class="reg-welcome-title" id="regWelcomeTitle">Congratulations!</h2>
      <p class="reg-welcome-sub">Welcome to TopTeen! Your career journey starts now — keep exploring to earn more rewards.</p>
      <div class="reg-welcome-points">
        You earned <strong>{{ registration_welcome_points|default(50) }}</strong> points
      </div>
      <p class="reg-welcome-hint">Closing in 20 seconds&hellip;</p>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var POPUP_DURATION_MS = 20000;
    var overlay = document.getElementById('regWelcomeOverlay');
    var popup = document.getElementById('regWelcomePopup');
    var confettiLayer = document.getElementById('regWelcomeConfettiLayer');
    if (!overlay || !popup || !confettiLayer) return;

    if (overlay.parentNode !== document.body) {
      document.body.appendChild(overlay);
    }

    var colors = ['#fde047', '#f472b6', '#60a5fa', '#34d399', '#fb923c', '#c084fc', '#ffffff', '#facc15', '#a78bfa'];
    var hideTimer = null;
    var confettiTimers = [];

    function spawnConfettiWave(count) {
      var layerHeight = confettiLayer.clientHeight || popup.clientHeight || 320;
      var maxRise = Math.min(layerHeight * 0.62, 200);

      for (var i = 0; i < count; i++) {
        var piece = document.createElement('span');
        piece.className = 'reg-welcome-confetti-piece';
        var size = 5 + Math.floor(Math.random() * 6);
        var x = 6 + Math.random() * 88;
        var y = 4 + Math.random() * 14;
        var tx = (Math.random() - 0.5) * 72;
        var ty = -(40 + Math.random() * maxRise);
        var rot = Math.floor(Math.random() * 720) + 'deg';
        var color = colors[Math.floor(Math.random() * colors.length)];
        var delay = Math.random() * 0.35;
        var duration = 1.4 + Math.random() * 1.1;
        var round = Math.random() > 0.45 ? '50%' : '2px';

        piece.style.setProperty('--x', x + '%');
        piece.style.setProperty('--y', y + '%');
        piece.style.setProperty('--size', size + 'px');
        piece.style.setProperty('--color', color);
        piece.style.setProperty('--tx', tx + 'px');
        piece.style.setProperty('--ty', ty + 'px');
        piece.style.setProperty('--rot', rot);
        piece.style.setProperty('--delay', delay + 's');
        piece.style.setProperty('--duration', duration + 's');
        piece.style.setProperty('--round', round);
        confettiLayer.appendChild(piece);
      }
    }

    function startConfettiSplash() {
      spawnConfettiWave(42);
      confettiTimers.push(window.setTimeout(function () { spawnConfettiWave(32); }, 350));
      confettiTimers.push(window.setTimeout(function () { spawnConfettiWave(24); }, 700));
      confettiTimers.push(window.setTimeout(function () { spawnConfettiWave(18); }, 1050));
    }

    function stopConfetti() {
      for (var i = 0; i < confettiTimers.length; i++) {
        window.clearTimeout(confettiTimers[i]);
      }
      confettiTimers = [];
      confettiLayer.innerHTML = '';
    }

    function hidePopup() {
      if (!overlay || overlay.classList.contains('is-hiding')) return;
      overlay.classList.add('is-hiding');
      stopConfetti();
      window.setTimeout(function () {
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 520);
    }

    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(startConfettiSplash);
    });
    hideTimer = window.setTimeout(hidePopup, POPUP_DURATION_MS);

    var closeBtn = document.getElementById('regWelcomeClose');
    if (closeBtn) {
      closeBtn.addEventListener('click', function () {
        if (hideTimer) window.clearTimeout(hideTimer);
        hidePopup();
      });
    }
  });
</script>
{% endif %}
