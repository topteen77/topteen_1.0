{# Opens the centralized #tt-language-widget panel. Pass icon_only=true for compact topbars. #}
{% set _icon_only = icon_only|default(false) %}
{% set _shell = shell|default(false) %}
<button type="button"
        class="tt-lang-toggle notranslate skiptranslate{% if _icon_only %} tt-lang-toggle--icon{% endif %}{% if _shell %} tt-lang-toggle--shell{% endif %}"
        data-tt-lang-trigger
        translate="no"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-label="Select language"
        title="Select language">
  <span class="tt-lang-toggle-icon" aria-hidden="true"></span>
  {% if not _icon_only %}
  <span class="tt-lang-toggle-label">Language</span>
  <i class="bx bx-chevron-down tt-lang-chevron" aria-hidden="true"></i>
  {% endif %}
</button>
