{# Freetrail: after freetrail_seconds the content is hidden and login popup shown; on popup close without login, redirect to back_url. #}
<script>
document.addEventListener('DOMContentLoaded', function() {
  var wrap = document.getElementById('freetrail-content-wrap');
  if (!wrap) return;
  var sec = {{ freetrail_seconds|default(5) }};
  var backUrl = "{{ back_url|escapejs }}";
  var delayMs = (sec <= 0 ? 0 : sec) * 1000;
  var popupCount = 0;
  var redirectAfter = 3;
  var popupTimer = null;
  var guardKey = '__freetrailClosePatched';
  var origClose = window.closeLoginRequiredPopup;

  function shouldGate() {
    return (typeof window.IS_AUTHENTICATED === 'undefined' || !window.IS_AUTHENTICATED);
  }

  function scheduleNextPopup() {
    if (!shouldGate()) return;
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(showGatePopup, delayMs);
  }

  function showGatePopup() {
    if (!shouldGate()) return;
    wrap.style.display = 'none';
    window.freetrailExpired = true;
    window.studentLoginNextUrl = window.location.href;
    popupCount += 1;
    if (typeof window.showLoginRequiredPopup === 'function') {
      window.showLoginRequiredPopup(window.location.href);
    }
  }

  if (typeof origClose === 'function' && !window[guardKey]) {
    window[guardKey] = true;
    window.closeLoginRequiredPopup = function() {
      origClose();
      if (!shouldGate() || !window.freetrailExpired) return;
      if (popupCount >= redirectAfter) {
        window.location.href = document.referrer || backUrl || '/';
        return;
      }
      // Keep page visible between popup attempts.
      wrap.style.display = '';
      window.freetrailExpired = false;
      scheduleNextPopup();
    };
  }

  // First popup after freemium time; subsequent popups are scheduled after each close.
  scheduleNextPopup();
});
</script>
