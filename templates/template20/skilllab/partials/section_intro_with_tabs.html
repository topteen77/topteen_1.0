<div class="skilllab-section-tabs card border-0 shadow-sm">
  <div class="skilllab-section-tabs-header">
    <ul class="nav nav-tabs lesson-content-tabs mb-0" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link {% if active_tab != 'mindmap' %}active{% endif %}" id="sl-content-tab" data-bs-toggle="tab" data-bs-target="#sl-content-pane" type="button" role="tab" aria-selected="{{ 'false' if active_tab == 'mindmap' else 'true' }}">
          <i class='bx bx-file-blank'></i> Content
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link {% if active_tab == 'mindmap' %}active{% endif %}" id="sl-mindmap-tab" data-bs-toggle="tab" data-bs-target="#sl-mindmap-pane" type="button" role="tab" aria-selected="{{ 'true' if active_tab == 'mindmap' else 'false' }}">
          <i class='bx bx-git-branch'></i> Mindmap
        </button>
      </li>
    </ul>
    <div id="skilllab-tabs-toolbar-slot" class="skilllab-tabs-toolbar-slot"></div>
  </div>
  <div class="tab-content">
    <div class="tab-pane fade {% if active_tab != 'mindmap' %}show active{% endif %}" id="sl-content-pane" role="tabpanel">
      <div class="section-content-intro introduction-content skilllab-lesson-prose">
        {% if content %}{{ content|safe }}{% else %}<p>Welcome to {{ chapter.chapter_name }}.</p>{% endif %}
      </div>
    </div>
    <div class="tab-pane fade {% if active_tab == 'mindmap' %}show active{% endif %}" id="sl-mindmap-pane" role="tabpanel">
      {% if section_mindmap and section_mindmap.embed_url %}
      {# Section content is injected via AJAX (innerHTML), which does NOT execute the
         mindmap widget's <script>. Load the working full render in an iframe instead. #}
      <iframe
        class="sl-mindmap-frame"
        data-src="{{ section_mindmap.embed_url }}"
        title="Section mindmap"
        loading="lazy"
        style="width:100%;height:60vh;min-height:360px;border:0;border-radius:8px;background:#fff;"></iframe>
      {% else %}
      <p class="text-muted mb-0">Mindmap is not available for this section.</p>
      {% endif %}
    </div>
  </div>
</div>
