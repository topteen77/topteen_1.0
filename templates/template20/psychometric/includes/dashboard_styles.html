<style>

  }

  .psych-section-title {

  .stat-card-icon-wrap {

  .stat-card-icon-wrap.streak { background: linear-gradient(145deg, #ffedd5, #fdba74); }
  .stat-card-icon-wrap.level { background: linear-gradient(145deg, #d1fae5, #a7f3d0); }
  /* Level card: match main user dashboard badge image + frame */
  .stat-card.stat-card-level > div:first-child.level-badge-icon {
    flex-shrink: 0;
  }
  .stat-card.stat-card-level .level-badge-icon {

    height: 50px;
    border-radius: 12px;

  .stat-card.stat-card-level .level-badge-icon img {

    height: 100%;

    display: block;
    filter: drop-shadow(0 3px 8px rgba(36, 46, 96, 0.28));

  .stat-card .stat-value {

    font-weight: 700;
    color: #0f172a;
    line-height: 1.2;
  }
  .stat-card .stat-label {
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #64748b;
    margin-top: 2px;
  }
  .report-card {
    border-radius: 16px;
    padding: 22px 18px 18px;
    text-align: center;
    border: 1px solid #dde5ff;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    overflow: hidden;
  }
  .report-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    opacity: 0.95;
  }


  .report-badge {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    margin-top: 10px;
    max-width: 100%;
    text-align: center;
    line-height: 1.35;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);

  .report-badge-personality { background: #5a3d7a; }
  .report-badge-interest { background: #c97b3d; }
  .report-badge-intelligence { background: #b83d6d; }
  /* Circular progress filled by percentage (conic-gradient) */
  .circle-progress {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: conic-gradient(var(--circle-color, #ddd) 0deg calc(var(--pct, 0) * 360deg), rgba(15, 23, 42, 0.08) calc(var(--pct, 0) * 360deg) 360deg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    font-size: 1.05rem;
    font-weight: 800;
    color: #0f172a;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5);
  }
  .circle-progress::before {
    content: '';
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: #fff;
    z-index: 0;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  .circle-progress .circle-progress-text { position: relative; z-index: 1; }
  .report-card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    /* opacity: 0; */
    transition: opacity 0.2s ease;
  }
  .report-card:hover .report-card-actions { opacity: 1; }
  @media (max-width: 768px) {
    .report-card-actions { opacity: 1; }
  }
  .report-card-actions a {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    transition: transform 0.2s ease;
  }

  .report-card-actions a:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.95);
    outline-offset: 2px;
  }
  .report-card-actions .btn-view { background: #3F37C9; }
  .report-card-actions .btn-view:hover { background: #2e2899; color: #fff; }
  .report-card-actions .btn-download { background: #0d6efd; }
  .report-card-actions .btn-download:hover { background: #0b5ed7; color: #fff; }
  .report-card-main-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

    align-items: stretch;

  }

  }

  }

  .report-card-score.interest { color: #b45309; }
  .report-card-score.intelligence { color: #be185d; }

    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .modern-pill {
    font-size: 10px;

    border-radius: 999px;

    border: 1px solid transparent;
  }
  .modern-pill.personality { color: #5b21b6; background: #ede9fe; border-color: #ddd6fe; }
  .modern-pill.interest { color: #9a3412; background: #ffedd5; border-color: #fed7aa; }
  .modern-pill.intelligence { color: #be185d; background: #fce7f3; border-color: #fbcfe8; }
  .modern-pill.i-high {
    color: #166534;
    background: #dcfce7;
    border-color: #86efac;
  }
  .modern-pill.i-avg {
    color: #c2410c;
    background: #ffedd5;
    border-color: #fdba74;
  }
  .modern-pill.i-below {
    color: #b91c1c;
    background: #fee2e2;
    border-color: #fca5a5;
  }
  .modern-pill.warn {
    color: #b91c1c;
    background: #fee2e2;
    border-color: #fecaca;
  }
  .interest-avoid-wrap {
    margin-top: 12px;
    border-top: 1px solid #e2e8f0;
    padding-top: 12px;
  }
  .interest-avoid-title {
    margin: 0 0 7px;

    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #475569;
  }
  .interest-avoid-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .interest-avoid-chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #c2410c;
    background: #fff7ed;
    border: 1px solid #fed7aa;
  }
  .modern-bars {
    display: grid;
    gap: 9px;
    margin-top: 10px;
  }
  .modern-bar-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 10px;
  }
  .modern-bar-row span {
    grid-column: 1;
    grid-row: 1;
    font-size: 12px;
    color: #525252;
    font-weight: 600;
    white-space: nowrap;
  }
  .modern-bar-track {
    grid-column: 1 / -1;
    grid-row: 2;
    height: 7px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    border: 0;
  }
  .modern-bar-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
  }
  /* Shared RIASEC palette to match report UI */
  .modern-bar-fill.personality { background: linear-gradient(90deg, #6b7280, #9ca3af); }
  .modern-bar-fill.personality.riasec-s,
  .modern-bar-fill.interest.riasec-s { background: linear-gradient(90deg, #1f9d77, #2ab08c); } /* Social */
  .modern-bar-fill.personality.riasec-c,
  .modern-bar-fill.interest.riasec-c { background: linear-gradient(90deg, #6f63ce, #8a7de1); } /* Conventional */
  .modern-bar-fill.personality.riasec-i,
  .modern-bar-fill.interest.riasec-i { background: linear-gradient(90deg, #3e7ec8, #5a96dc); } /* Investigative */
  .modern-bar-fill.personality.riasec-a,
  .modern-bar-fill.interest.riasec-a { background: linear-gradient(90deg, #c65687, #db729f); } /* Artistic */
  .modern-bar-fill.personality.riasec-r,
  .modern-bar-fill.interest.riasec-r { background: linear-gradient(90deg, #df8b17, #eda432); } /* Realistic */
  .modern-bar-fill.personality.riasec-e,
  .modern-bar-fill.interest.riasec-e { background: linear-gradient(90deg, #bf562f, #d56e45); } /* Enterprising */
  .modern-bar-fill.interest { background: linear-gradient(90deg, #d97706, #f59e0b); }
  .modern-bar-fill.intelligence { background: linear-gradient(90deg, #f97316, #fb923c); }
  .modern-bar-fill.intelligence.high { background: linear-gradient(90deg, #16a34a, #22c55e); }
  .modern-bar-fill.intelligence.avg { background: linear-gradient(90deg, #ea580c, #f59e0b); }
  .modern-bar-fill.intelligence.below { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .modern-bar-mark {
    grid-column: 2;
    grid-row: 1;
    font-size: 12px;
    font-weight: 700;
    text-transform: none;
    text-align: right;
    line-height: 1.2;
    color: #262626;
  }
  .modern-bar-mark.avg { color: #c2410c; }
  .modern-bar-mark.below { color: #b91c1c; }
  .modern-bar-mark.high { color: #166534; }
  .modern-card-footer {
    margin-top: auto;
    padding-top: 12px;
  }
  .report-card-modern .report-card-actions {
    margin-top: 8px;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .report-card-modern .report-card-actions a {

    flex: 0 0 auto;

    padding: 0 10px;

    gap: 4px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.14);

    font-size: 14px;
    line-height: 1;
  }
  .report-card-modern .report-card-actions .btn-view {
    background: linear-gradient(135deg, #4f46e5, #3F37C9);
  }
  .report-card-modern .report-card-actions .btn-download {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
  }
  .stream-card {
    background: #fff;
    border: 1px solid var(--psych-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 100%;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
  }
  .stream-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(76, 201, 240, 0.15);
    border-color: rgba(76, 201, 240, 0.45);
  }
  .stream-card-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 12px;
    background: linear-gradient(145deg, rgba(76, 201, 240, 0.25), rgba(76, 201, 240, 0.1));
    display: flex;
    align-items: center;
    justify-content: center;

  .psych-cta-row {
    margin-top: 1.5rem;
    padding-top: 0.25rem;
  }

    font-weight: 600;
    font-size: 0.9375rem;
    box-shadow: 0 4px 14px rgba(63, 55, 201, 0.35), 0 1px 0 rgba(255, 255, 255, 0.15) inset;

    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;

  .view-report-btn:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
  .download-report-btn {

    padding: 12px 24px;

    font-size: 0.9375rem;
    display: inline-flex;
    align-items: center;

  .download-report-btn:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }

  }
  @media (min-width: 768px) {

      padding: 16px;
    }

  .level-progress-wrap { height: 4px; border-radius: 2px; background: rgba(91, 201, 234, 0.22); overflow: hidden; }
  .level-progress-bar { height: 100%; border-radius: 2px; background: #5bc9ea; transition: width 0.5s ease; }
