<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Sorter Combined Assessment Report</title>
  <style>
    @page {
      size: A4;
      margin: 2cm;
    }
    body {
      margin: 0;
      padding: 0;
      color: #494949;
      font-family: 'Galano Grotesque', Arial, sans-serif;
      font-size: 10pt;
      counter-reset: chapters;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    ul { list-style-type: none; padding: 0; }
    a { color: inherit; text-decoration: none; }
    hr { height: 0; border: 0; border-top: 1px solid #494949; margin: 10px 0; }
    .chapterPage {
      max-width: 100%;
      width: 1000px;
      margin: 0 auto;
      clear: both;
      padding: 20px;
      page-break-after: always;
      box-sizing: border-box;
    }
    .pageBreak { page-break-before: always; height: 1cm; }
    .coverPage { margin: .5cm; }
    .coverPage h1 { margin-top: .23cm; font-size: 35px; color: #3F37C9; }
    .text-color-top { display: flex; justify-content: center; }
    .top-layout {
      background: #3F37C9;
      color: #fff;
      font-size: 27px;
      padding: 11px 38px;
      margin-top: 28px;
      font-weight: 600;
      border-radius: 10px 10px 0 0;
    }
    .db-header { margin-top: 10px; text-align: center; }
    .db-header h1 { color: #3F37C9; font-size: 24pt; margin: 0 0 10px 0; }
    .intro-box { background: #E7FEFF; padding: 18px; }
    .intro-box p { font-size: 16px; color: #494949; font-weight: 500; margin-bottom: 10px; }
    .text-info-paragraph p { font-size: 16px; color: #494949; margin-bottom: 10px; }
    .box-info {
      background: #E7E5FF;
      border-radius: 10px;
      border-right: 4px solid #3F37C9;
      border-bottom: 4px solid #3F37C9;
      width: 180px;
      margin: 10px;
      float: left;
      text-align: center;
    }
    .box-info .img { text-align: center; margin-top: 20px; }
    .box-info h5 { font-size: 14px; text-align: center; color: #000; margin-bottom: 11px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px; text-align: left; outline: 0; }
    th { background-color: #E7E5FF; color: #3F37C9; padding: 21px 0 21px 14px; }
    tr { border: 1px solid #9490dd; }
    .threebox-col { display: flex; justify-content: center; }
    .box-i {
      width: 190px;
      height: 100px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      background: #ffe5e6;
      margin: 20px 8px;
      border-radius: 10px;
      text-align: center;
      border-right: 4px solid #3F37C9;
      border-bottom: 4px solid #3F37C9;
    }
    .box-i p { color: #120d77; font-weight: 700; font-size: 23px; margin-bottom: 0; }
    .two-box { display: flex; justify-content: center; margin: 54px 0; width: 100%; }
    .two-box-in {
      width: 300px;
      display: flex;
      flex-direction: column;
      background: #E7E5FF;
      align-items: center;
      text-align: center;
      margin: 0 9px;
      padding: 3px 7px;
      border-radius: 10px;
      border-right: 3px solid #3F37CB;
      border-bottom: 3px solid #3F37C9;
    }
    .cat-box { display: flex; flex-direction: column; justify-content: center; margin-bottom: 7px; }
    .cat-head {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #3F37C9;
      border-radius: 7px 7px 0 0;
      padding: 13px 0;
      color: #fff;
    }
    .cat-head h4 { font-size: 16px; margin: 0; }
    .cat-list { background: #F7F6FF; padding: 6px; margin-top: 0; }
    .cat-list ul { column-count: 3; padding-left: 20px; }
    .cat-list ul li { padding: 5px 0; font-size: 14px; }
    .test-title { color: #000; font-size: 16px; font-weight: 600; margin-top: 10px; }
    .combined-report-page { padding: 0; background: white; overflow-x: hidden; }
    .report-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      background: white;
      padding: 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    .report-container img { max-width: 100%; height: auto; }
    .report-container div[style*="900px"],
    .report-container div[style*="width: 600px"] { max-width: 100%; box-sizing: border-box; }
    .img-tow { margin-top: 0; }
    .r-img, .img-info, .framework-img, .ris-box { }
    .graph { width: 100%; text-align: center; }
    .onebox { }
  </style>
</head>
<body class="combined-report-page">
{% include 'template20/app/class10_combined_report_content.html' %}
</body>
</html>
