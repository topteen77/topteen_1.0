<div class="counselor-mindmap-widget border rounded p-2 bg-white" data-json-url="{{ mindmap_json_url }}" data-map-type="{{ mindmap_map_type|default('', true) }}" data-radial-src="{{ static('js/radial-mindmap.js') }}" data-classic-src="{{ static('counselor/classic-mindmap/classic-mindmap.js') }}" data-classic-css="{{ static('counselor/classic-mindmap/classic-mindmap.css') }}" id="cmw-{{ widget_id }}">
  <div id="cmhost-{{ widget_id }}" class="counselor-mm-host position-relative rounded overflow-hidden border bg-light" style="min-height:280px;">
    <div id="cmload-{{ widget_id }}" class="align-items-center justify-content-center gap-2 position-absolute top-0 start-0 w-100 h-100" style="display:none;z-index:5;background:rgba(255,255,255,0.9);">
      <div class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></div>
      <span class="text-muted small">Loading mindmap…</span>
    </div>
    <svg class="counselor-mindmap-svg w-100 border-0 rounded-0 bg-transparent" id="cmsvg-{{ widget_id }}" style="min-height:280px;display:block;"></svg>
    <div id="cmctl-{{ widget_id }}" class="d-none position-absolute top-0 end-0 p-2" style="z-index:10;">
      <div class="btn-group-vertical gap-1 shadow-sm">
        <button type="button" class="btn btn-sm btn-outline-primary border" data-cm-maximize title="Expand mind map to full screen" aria-pressed="false" aria-label="Maximize mind map">
          <i class="bx bx-expand-alt counselor-mm-fs-icon" data-cm-fs-icon aria-hidden="true"></i><span class="counselor-mm-fs-label ms-1">Maximize</span>
        </button>
        <button type="button" class="btn btn-sm btn-light border d-none" data-cm-expand-all title="Expand all branches" aria-label="Expand all"><i class="bx bx-expand-vertical"></i></button>
        <button type="button" class="btn btn-sm btn-light border d-none" data-cm-collapse-all title="Collapse to root only" aria-label="Collapse all"><i class="bx bx-collapse-vertical"></i></button>
        <button type="button" class="btn btn-sm btn-light border" data-cm-zoom-in title="Zoom in" aria-label="Zoom in">＋</button>
        <button type="button" class="btn btn-sm btn-light border" data-cm-zoom-out title="Zoom out" aria-label="Zoom out">－</button>

  </div>

</div>
<script type="module">
(function () {
  /* Pin markmap-lib + markmap-view + markmap-common to one line (0.17 + common@0.18 broke: childSelector removed from common). */
  var MAP_LIB = 'https://esm.sh/markmap-lib@0.18.12?deps=markmap-common@0.18.9';
  var MAP_VIEW = 'https://esm.sh/markmap-view@0.18.12?deps=markmap-common@0.18.9,d3@7.9.0';
  var D3_MOD = 'https://esm.sh/d3@7.9.0';

  var COURSE_MAP_NUM = {
    '1': 'tree',
    '2': 'concept',
    '3': 'radial',
    '4': 'cluster',
    '5': 'career_radial',
    '6': 'radial',
    '7': 'career_radial',
    '8': 'classic',
    '9': 'classic_vertical',
  };

  function normalizeMapType(s) {
    if (s == null || typeof s !== 'string') return 'tree';
    var t = s.trim().toLowerCase();
    if (COURSE_MAP_NUM[t]) return COURSE_MAP_NUM[t];
    if (t === 'concept' || t === 'concept_map' || t === 'conceptmap') return 'concept';
    if (t === 'radial' || t === 'radial_tree' || t === 'sunburst' || t === 'ring') return 'radial';
    if (t === 'cluster' || t === 'dendrogram' || t === 'tidy' || t === 'horizontal_tree') return 'cluster';
    if (
      t === 'career_radial' ||
      t === 'careers_radial' ||
      t === 'career_radial_mindmap' ||
      t === 'radial_drill' ||
      t === 'xmind_style'
    ) {
      return 'career_radial';
    }
    if (
      t === 'classic' ||
      t === 'classic_mindmap' ||
      t === 'classic mindmap' ||
      t === 'classic-mindmap' ||
      t === 'horizontal_classic'
    ) {
      return 'classic';
    }
    if (
      t === 'classic_vertical' ||
      t === 'classic-vertical' ||
      t === 'classic vertical' ||
      t === 'vertical_classic' ||
      t === '9'
    ) {
      return 'classic_vertical';
    }
    if (t === 'tree' || t === 'hierarchical' || t === 'hierarchy' || t === 'outline' || t === 'markmap' || t === 'mindmap') return 'tree';
    return 'tree';
  }

  function resolveMapType(rootEl, data) {
    try {
      var params = new URLSearchParams(window.location.search || '');
      var fromUrl = params.get('mindmap_type') || params.get('map_type');
      if (fromUrl) return normalizeMapType(fromUrl);
    } catch (e) {}
    /* Static JSON map_type matches admin 1–9; prefer it over global data-map-type. */
    var fromJson = (data && (data.map_type || data.mapType)) || '';
    if (fromJson) return normalizeMapType(String(fromJson));
    var fromAttr = (rootEl && rootEl.getAttribute('data-map-type')) || '';
    if (fromAttr.trim()) return normalizeMapType(fromAttr);
    return 'tree';
  }

  function plainLabel(node) {
    var d = document.createElement('div');
    d.innerHTML = node.content || '';
    var t = (d.textContent || '').trim().replace(/\s+/g, ' ');
    if (t.length > 80) t = t.slice(0, 77) + '…';
    return t || '—';
  }

  /** Markmap root -> flat nodes for CounselorClassicMindmap (doc-md/mindmap layout). */
  function markmapToClassicNodes(mmRoot) {
    var list = [];
    function walk(mm, parentId, depth, pathIndices) {
      var id = pathIndices.length === 0 ? 'root' : 'n' + pathIndices.join('_');
      var level =
        depth === 0 ? 'root' : depth === 1 ? 'topic' : depth === 2 ? 'sub' : 'leaf';
      var text = plainLabel(mm);
      var o = { id: id, text: text, level: level };
      if (parentId) o.parent = parentId;
      list.push(o);
      var kids = mm.children || [];
      kids.forEach(function (ch, i) {
        walk(ch, id, depth + 1, pathIndices.concat([i]));
      });
    }
    walk(mmRoot, null, 0, []);
    return list;
  }

  /** Markmap transform root -> jsMind node_tree (same shape as careers/views career_mindmap_json_api). */
  function markmapToJsMindTree(mmRoot) {
    function walk(mm, pathIndices, depth) {
      var id = pathIndices.length === 0 ? 'root' : 'n' + pathIndices.join('_');
      var kids = mm.children || [];
      var hasKids = kids.length > 0;
      /* depth 0 = root (expanded if has children); depth >= 1 branch nodes start collapsed so user opens deeper levels. */
      var expanded = !hasKids || depth < 1;
      var o = { id: id, topic: plainLabel(mm), expanded: expanded };
      if (hasKids) {
        o.children = kids.map(function (ch, i) {
          return walk(ch, pathIndices.concat([i]), depth + 1);
        });
      }
      return o;
    }
    return walk(mmRoot, [], 0);
  }

  /**
   * Career-style fullscreen: reparent to document.body while maximized so position:fixed works
   * (Bootstrap tabs / .fade use transforms that break fixed positioning inside the tab).
   */
  function wireCounselorMindmapMaximize(widgetEl) {
    if (!widgetEl || widgetEl.getAttribute('data-cm-maximize-wired')) return;
    var btn = widgetEl.querySelector('[data-cm-maximize]');
    if (!btn) return;
    if (document.body && document.body.classList.contains('counselor-mindmap-fullscreen-page')) {
      btn.classList.add('d-none');
      return;
    }
    widgetEl.setAttribute('data-cm-maximize-wired', '1');
    var icon = btn.querySelector('[data-cm-fs-icon]');
    var label = btn.querySelector('.counselor-mm-fs-label');
    function setMaximized(on) {
      var host = widgetEl.querySelector('.counselor-mm-host');
      if (on) {
        if (!widgetEl._cmPlaceholder) {
          var ph = document.createComment('counselor-mm-placeholder');
          if (widgetEl.parentNode) {
            widgetEl.parentNode.insertBefore(ph, widgetEl);
            widgetEl._cmPlaceholder = ph;
          }
        }
        if (document.body && widgetEl.parentNode !== document.body) {
          document.body.appendChild(widgetEl);
        }
        if (host) {
          widgetEl.dataset.cmHostPrevHeight = host.style.height || '';
          widgetEl.dataset.cmHostPrevMinHeight = host.style.minHeight || '';
          host.style.height = '';
          host.style.minHeight = '';
        }
      } else {
        var ph = widgetEl._cmPlaceholder;
        if (ph && ph.parentNode) {
          ph.parentNode.insertBefore(widgetEl, ph);
          ph.parentNode.removeChild(ph);
        }
        widgetEl._cmPlaceholder = null;
        if (host && widgetEl.dataset.cmHostPrevHeight !== undefined) {
          host.style.height = widgetEl.dataset.cmHostPrevHeight;
          host.style.minHeight = widgetEl.dataset.cmHostPrevMinHeight;
          delete widgetEl.dataset.cmHostPrevHeight;
          delete widgetEl.dataset.cmHostPrevMinHeight;
        }
      }
      widgetEl.classList.toggle('counselor-mm-maximized', on);
      document.body.classList.toggle('counselor-mm-maximized-open', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.title = on ? 'Return mind map to inline size' : 'Expand mind map to full screen';
      if (icon) {
        icon.classList.remove('bx-expand-alt', 'bx-exit-fullscreen');
        icon.classList.add(on ? 'bx-exit-fullscreen' : 'bx-expand-alt');
      }
      if (label) label.textContent = on ? 'Minimize' : 'Maximize';
      window.dispatchEvent(new Event('resize'));
      setTimeout(function () {
        window.dispatchEvent(new Event('resize'));
      }, 120);
    }
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      setMaximized(!widgetEl.classList.contains('counselor-mm-maximized'));
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && widgetEl.classList.contains('counselor-mm-maximized')) {
        setMaximized(false);
      }
    });
  }

  /**
   * Bootstrap hides inactive tab panes (0×0 layout). RadialMindmap then initializes with zero size and stays blank.
   * Reflow when the host gets real dimensions (tab shown or layout complete).
   */
  function setupCounselorMindmapVisibleReflow(hostEl, svgEl, markmapInstance) {
    var widget = hostEl && hostEl.closest && hostEl.closest('.counselor-mindmap-widget');
    if (widget) wireCounselorMindmapMaximize(widget);
    if (!hostEl || typeof window.ResizeObserver === 'undefined') return;
    var timer;
    var ro = new ResizeObserver(function () {
      if (hostEl.clientWidth < 2 || hostEl.clientHeight < 2) return;
      clearTimeout(timer);
      timer = setTimeout(function () {
        window.dispatchEvent(new Event('resize'));
        if (markmapInstance && typeof markmapInstance.fit === 'function') {
          try {
            markmapInstance.fit();
          } catch (e) {}
        }
      }, 60);
    });
    ro.observe(hostEl);
  }

  var counselorClassicLoadPromise = null;
  function ensureClassicMindmap(scriptUrl) {
    if (typeof window !== 'undefined' && window.CounselorClassicMindmap) return Promise.resolve();
    if (!scriptUrl) return Promise.reject(new Error('No classic mindmap script URL'));
    if (counselorClassicLoadPromise) return counselorClassicLoadPromise;
    counselorClassicLoadPromise = new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = scriptUrl;
      sc.async = true;
      sc.onload = function () {
        if (window.CounselorClassicMindmap) resolve();
        else {
          counselorClassicLoadPromise = null;
          reject(new Error('CounselorClassicMindmap not defined after script load'));
        }
      };
      sc.onerror = function () {
        counselorClassicLoadPromise = null;
        reject(new Error('Failed to load classic-mindmap.js'));
      };
      document.head.appendChild(sc);
    });
    return counselorClassicLoadPromise;
  }

  function ensureClassicCss(href) {
    if (!href) return;
    var lid = 'counselor-classic-mm-css';
    if (document.getElementById(lid)) return;
    var lk = document.createElement('link');
    lk.id = lid;
    lk.rel = 'stylesheet';
    lk.href = href;
    document.head.appendChild(lk);
  }

  var counselorRadialLoadPromise = null;
  function ensureRadialMindmap(scriptUrl) {
    if (typeof window !== 'undefined' && window.RadialMindmap) return Promise.resolve();
    if (!scriptUrl) return Promise.reject(new Error('No radial-mindmap script URL'));
    if (counselorRadialLoadPromise) return counselorRadialLoadPromise;
    counselorRadialLoadPromise = new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = scriptUrl;
      sc.async = true;
      sc.onload = function () {
        if (window.RadialMindmap) resolve();
        else {
          counselorRadialLoadPromise = null;
          reject(new Error('RadialMindmap not defined after script load'));
        }
      };
      sc.onerror = function () {
        counselorRadialLoadPromise = null;
        reject(new Error('Failed to load radial-mindmap.js'));
      };
      document.head.appendChild(sc);
    });
    return counselorRadialLoadPromise;
  }

  function mindmapToHierarchy(mmNode) {
    var kids = mmNode.children || [];
    var o = { name: plainLabel(mmNode) };
    if (kids.length) o.children = kids.map(mindmapToHierarchy);
    return o;
  }

  /** Deepest visible depth from root: 0 = root only, 1 = root + direct children (deeper structure dropped for first paint). */
  function mindmapToHierarchyClamped(mmNode, maxDepthInclusive) {
    function walk(mm, depth) {
      var name = plainLabel(mm);
      var kids = mm.children || [];
      if (!kids.length || depth > maxDepthInclusive) return { name: name };
      return { name: name, children: kids.map(function (ch) { return walk(ch, depth + 1); }) };
    }
    return walk(mmNode, 0);
  }

  function renderConceptMap(svgEl, root) {
    var NS = 'http://www.w3.org/2000/svg';
    var w = Math.max(svgEl.clientWidth || 0, 400);
    var h = Math.max(svgEl.clientHeight || 0, 280);
    svgEl.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
    var zoomRoot = document.createElementNS(NS, 'g');
    zoomRoot.setAttribute('class', 'counselor-mm-svg-zoom-root');
    svgEl.appendChild(zoomRoot);

    function addLine(x1, y1, x2, y2) {
      var line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#94a3b8');
      line.setAttribute('stroke-width', '2');
      zoomRoot.appendChild(line);
    }

    function addBubble(x, y, text, opt) {
      opt = opt || {};
      var r = opt.r || 36;
      var g = document.createElementNS(NS, 'g');
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', x);
      c.setAttribute('cy', y);
      c.setAttribute('r', r);
      c.setAttribute('fill', opt.fill || '#e0e7ff');
      c.setAttribute('stroke', opt.stroke || '#6366f1');
      c.setAttribute('stroke-width', '2');
      g.appendChild(c);
      var fo = document.createElementNS(NS, 'foreignObject');
      fo.setAttribute('x', x - r);
      fo.setAttribute('y', y - r);
      fo.setAttribute('width', r * 2);
      fo.setAttribute('height', r * 2);
      var div = document.createElement('div');
      div.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
      div.style.cssText = 'display:flex;align-items:center;justify-content:center;text-align:center;height:100%;font-size:' + (opt.fontSize || '11px') + ';padding:6px;box-sizing:border-box;overflow:hidden;line-height:1.2;color:#1e293b;';
      div.textContent = text;
      fo.appendChild(div);
      g.appendChild(fo);
      zoomRoot.appendChild(g);
    }

    var cx = w / 2;
    var cy = h / 2;
    var rootText = plainLabel(root);
    var rr = Math.min(56, 22 + Math.min(rootText.length, 40) * 0.9);
    addBubble(cx, cy, rootText, { r: rr, fill: '#fef3c7', stroke: '#d97706' });

    var kids = root.children || [];
    var n = kids.length;
    if (!n) return;

    var R = Math.min(w, h) * 0.3;
    kids.forEach(function (child, i) {
      var angle = (2 * Math.PI * i) / n - Math.PI / 2;
      var x = cx + R * Math.cos(angle);
      var y = cy + R * Math.sin(angle);
      addLine(cx, cy, x, y);
      var ct = plainLabel(child);
      addBubble(x, y, ct, { r: 40, fill: '#dbeafe', stroke: '#2563eb' });
    });
  }

  function renderD3RadialTree(svgEl, mmRoot, d3) {
    var data = mindmapToHierarchyClamped(mmRoot, 1);
    var w = Math.max(svgEl.clientWidth || 0, 420);
    var h = Math.max(svgEl.clientHeight || 0, 320);
    var outerRadius = Math.min(w, h) / 2 - 24;
    var innerPad = 8;

    var root = d3.hierarchy(data);
    root.sort(function (a, b) {
      return d3.ascending(a.height, b.height) || d3.ascending(a.data.name, b.data.name);
    });

    var tree = d3
      .tree()
      .size([2 * Math.PI, outerRadius - innerPad])
      .separation(function (a, b) {
        return (a.parent === b.parent ? 1 : 2) / Math.max(a.depth, 1);
      });

    tree(root);

    var svg = d3.select(svgEl);
    svg.selectAll('*').remove();
    svg
      .attr('viewBox', [-w / 2, -h / 2, w, h].join(' '))
      .attr('width', '100%')
      .attr('height', h)
      .style('font', '11px system-ui, sans-serif');

    var linkGen = d3
      .linkRadial()
      .angle(function (d) {
        return d.x;
      })
      .radius(function (d) {
        return d.y;
      });

    var g = svg.append('g').attr('class', 'counselor-mm-d3-zoom');

    g.selectAll('path.counselor-mm-link')
      .data(root.links())
      .join('path')
      .attr('class', 'counselor-mm-link')
      .attr('fill', 'none')
      .attr('stroke', '#94a3b8')
      .attr('stroke-width', 1.5)
      .attr('d', linkGen);

    var color = d3.scaleOrdinal(d3.schemeTableau10);

    var node = g
      .selectAll('g.counselor-mm-node')
      .data(root.descendants())
      .join('g')
      .attr('class', 'counselor-mm-node')
      .attr('transform', function (d) {
        return 'rotate(' + ((d.x * 180) / Math.PI - 90) + ') translate(' + d.y + ',0)';
      });

    node
      .append('circle')
      .attr('fill', function (d) {
        return color(d.depth);
      })
      .attr('r', function (d) {
        return d.depth === 0 ? 7 : 4;
      })
      .attr('stroke', '#fff')
      .attr('stroke-width', 1.2);

    node
      .append('text')
      .attr('dy', '0.31em')
      .attr('x', function (d) {
        return d.x < Math.PI === !d.children ? 8 : -8;
      })
      .attr('text-anchor', function (d) {
        return d.x < Math.PI === !d.children ? 'start' : 'end';
      })
      .attr('transform', function (d) {
        return 'rotate(' + (d.x >= Math.PI ? 180 : 0) + ')';
      })
      .attr('fill', '#1e293b')
      .text(function (d) {
        var n = d.data.name;
        return n.length > 36 ? n.slice(0, 33) + '…' : n;
      })
      .clone(true)
      .lower()
      .attr('stroke', '#fff')
      .attr('stroke-width', 3)
      .attr('fill', null);
  }

  /** Zoom/pan helpers for SVG-based maps (concept, D3 radial/cluster). */
  function hideToolbarExpandCollapse(ctl) {
    if (!ctl) return;
    var exp = ctl.querySelector('[data-cm-expand-all]');
    var col = ctl.querySelector('[data-cm-collapse-all]');
    if (exp) exp.classList.add('d-none');
    if (col) col.classList.add('d-none');
  }

  function wireSvgGroupZoom(ctl, groupEl, cx, cy) {
    if (!ctl || !groupEl) return;
    var k = 1;
    function apply() {
      if (cx == null || cy == null) {
        groupEl.setAttribute('transform', 'scale(' + k + ')');
      } else {
        groupEl.setAttribute(
          'transform',
          'translate(' + cx + ',' + cy + ') scale(' + k + ') translate(' + -cx + ',' + -cy + ')'
        );
      }
    }
    ctl.classList.remove('d-none');
    hideToolbarExpandCollapse(ctl);
    var zin = ctl.querySelector('[data-cm-zoom-in]');
    var zout = ctl.querySelector('[data-cm-zoom-out]');
    var rst = ctl.querySelector('[data-cm-reset]');
    if (zin) zin.onclick = function () { k *= 1.15; apply(); };
    if (zout) zout.onclick = function () { k /= 1.15; if (k < 0.25) k = 0.25; apply(); };
    if (rst) rst.onclick = function () { k = 1; apply(); };
  }

  function wireMarkmapToolbar(ctl, mm) {
    if (!ctl || !mm) return;
    ctl.classList.remove('d-none');
    hideToolbarExpandCollapse(ctl);
    var zin = ctl.querySelector('[data-cm-zoom-in]');
    var zout = ctl.querySelector('[data-cm-zoom-out]');
    var rst = ctl.querySelector('[data-cm-reset]');
    if (zin) {
      zin.onclick = function () {
        mm.rescale(1.15).catch(function () {});
      };
    }
    if (zout) {
      zout.onclick = function () {
        mm.rescale(1 / 1.15).catch(function () {});
      };
    }
    if (rst) {
      rst.onclick = function () {
        mm.fit().catch(function () {});
      };
    }
  }

  function renderD3Cluster(svgEl, mmRoot, d3) {
    var data = mindmapToHierarchyClamped(mmRoot, 1);
    var w = Math.max(svgEl.clientWidth || 0, 480);
    var h = Math.max(svgEl.clientHeight || 0, 300);

    var root = d3.hierarchy(data);
    root.sort(function (a, b) {
      return d3.ascending(a.data.name, b.data.name);
    });

    var cluster = d3.cluster().size([h - 48, w - 32]);
    cluster(root);

    var svg = d3.select(svgEl);
    svg.selectAll('*').remove();
    svg.attr('viewBox', [0, 0, w, h].join(' ')).attr('width', '100%').attr('height', h).style('font', '11px system-ui, sans-serif');

    var gOuter = svg.append('g').attr('transform', 'translate(16,24)');
    var g = gOuter.append('g').attr('class', 'counselor-mm-d3-zoom');

    var link = d3
      .linkHorizontal()
      .x(function (d) {
        return d.y;
      })
      .y(function (d) {
        return d.x;
      });

    g.selectAll('path.counselor-mm-link')
      .data(root.links())
      .join('path')
      .attr('class', 'counselor-mm-link')
      .attr('fill', 'none')
      .attr('stroke', '#94a3b8')
      .attr('stroke-width', 1.5)
      .attr('d', link);

    var color = d3.scaleOrdinal(d3.schemeTableau10);

    var node = g
      .selectAll('g.counselor-mm-node')
      .data(root.descendants())
      .join('g')
      .attr('class', 'counselor-mm-node')
      .attr('transform', function (d) {
        return 'translate(' + d.y + ',' + d.x + ')';
      });

    node
      .append('circle')
      .attr('r', 4)
      .attr('fill', function (d) {
        return color(d.depth);
      })
      .attr('stroke', '#fff')
      .attr('stroke-width', 1);

    node
      .append('text')
      .attr('dy', '0.31em')
      .attr('x', 8)
      .attr('fill', '#1e293b')
      .text(function (d) {
        var n = d.data.name;
        return n.length > 48 ? n.slice(0, 45) + '…' : n;
      });
  }

  var wid = {{ widget_id|tojson }};
  var rootEl = document.getElementById('cmw-' + wid);
  var hostEl = document.getElementById('cmhost-' + wid);
  var svgEl = document.getElementById('cmsvg-' + wid);
  var errEl = document.getElementById('cme-' + wid);
  if (!rootEl || !svgEl || !hostEl) return;
  var url = rootEl.getAttribute('data-json-url');
  if (!url) {
    if (errEl) {
      errEl.classList.remove('d-none');
      errEl.textContent = 'Missing mindmap data URL.';
    }
    return;
  }

  /**
   * JSON is already loaded via fetch (AJAX). The slow part is doing that work while the Mindmap
   * tab is still hidden (course learning) or during the critical first paint. Defer until the
   * tab is shown, or use requestIdleCallback when the widget is already visible.
   */
  function scheduleMindmapLoad() {
    var tabPane = rootEl.closest('.tab-pane');
    var hiddenTab = !!(tabPane && !tabPane.classList.contains('show'));

    function runMindmapLoad() {
      if (rootEl.getAttribute('data-cm-loaded') === '1') return;
      rootEl.setAttribute('data-cm-loaded', '1');

      fetch(url, { credentials: 'same-origin' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var md = (data && (data.markdown || data.md)) || '';
      if (typeof md !== 'string' || !md.trim()) {
        throw new Error('No markdown in JSON');
      }
      var mapType = resolveMapType(rootEl, data);
      var libP = import(MAP_LIB).then(function (lib) {
        var Transformer = lib.Transformer;
        var transformer = new Transformer();
        var result = transformer.transform(md);
        return { root: result.root, mapType: mapType };
      });

      if (mapType === 'concept') {
        return libP.then(function (pack) {
          renderConceptMap(svgEl, pack.root);
          var ctlC = document.getElementById('cmctl-' + wid);
          var zr = svgEl.querySelector('.counselor-mm-svg-zoom-root');
          var vb = svgEl.viewBox && svgEl.viewBox.baseVal;
          var cw = vb && vb.width ? vb.width / 2 : Math.max(svgEl.clientWidth, 400) / 2;
          var ch = vb && vb.height ? vb.height / 2 : Math.max(svgEl.clientHeight, 280) / 2;
          if (ctlC && zr) wireSvgGroupZoom(ctlC, zr, cw, ch);
          setupCounselorMindmapVisibleReflow(hostEl, svgEl, null);
        });
      }

      if (mapType === 'radial' || mapType === 'cluster') {
        return libP.then(function (pack) {
          return import(D3_MOD).then(function (d3) {
            var ctlD = document.getElementById('cmctl-' + wid);
            if (mapType === 'radial') {
              renderD3RadialTree(svgEl, pack.root, d3);
              var zgR = svgEl.querySelector('.counselor-mm-d3-zoom');
              if (ctlD && zgR) wireSvgGroupZoom(ctlD, zgR, 0, 0);
            } else {
              renderD3Cluster(svgEl, pack.root, d3);
              var zgC = svgEl.querySelector('.counselor-mm-d3-zoom');
              var wc = Math.max(svgEl.clientWidth || 0, 480);
              var hc = Math.max(svgEl.clientHeight || 0, 300);
              if (ctlD && zgC) wireSvgGroupZoom(ctlD, zgC, (wc - 32) / 2, (hc - 48) / 2);
            }
            setupCounselorMindmapVisibleReflow(hostEl, svgEl, null);
          });
        });
      }

      if (mapType === 'career_radial') {
        var radialSrc = rootEl.getAttribute('data-radial-src');
        var loadEl = document.getElementById('cmload-' + wid);
        var ctl = document.getElementById('cmctl-' + wid);
        return libP.then(function (pack) {
          if (loadEl) {
            loadEl.style.display = 'flex';
          }
          var isFullscreenPage = document.body && document.body.classList.contains('counselor-mindmap-fullscreen-page');
          /* Fullscreen: let CSS size .counselor-mm-host to viewport; inline height on a short host + tall SVG min-height was clipping the graph. */
          if (isFullscreenPage) {
            hostEl.style.height = '';
            hostEl.style.minHeight = '';
          } else {
            var hTarget = Math.min(520, Math.max(300, Math.round(window.innerHeight * 0.42)));
            hostEl.style.minHeight = '280px';
            hostEl.style.height = hTarget + 'px';
          }
          return ensureRadialMindmap(radialSrc).then(function () {
            if (!window.RadialMindmap) throw new Error('RadialMindmap unavailable');
            var iid = 'counselor-mm-' + String(wid).replace(/[^a-zA-Z0-9_-]/g, '_');
            var payload = {
              format: 'node_tree',
              meta: { name: 'Mindmap', version: '1.0' },
              data: markmapToJsMindTree(pack.root)
            };
            function wireControls() {
              if (ctl) {
                ctl.classList.remove('d-none');
                var expBtn = ctl.querySelector('[data-cm-expand-all]');
                var colBtn = ctl.querySelector('[data-cm-collapse-all]');
                if (expBtn) expBtn.classList.add('d-none');
                if (colBtn) colBtn.classList.add('d-none');
                var zin = ctl.querySelector('[data-cm-zoom-in]');
                var zout = ctl.querySelector('[data-cm-zoom-out]');
                var rst = ctl.querySelector('[data-cm-reset]');
                if (zin) zin.onclick = function () { window.RadialMindmap.zoomIn(iid); };
                if (zout) zout.onclick = function () { window.RadialMindmap.zoomOut(iid); };
                if (rst) rst.onclick = function () { window.RadialMindmap.reset(iid); };
              }
            }
            function doInit() {
              window.RadialMindmap.init({
                instanceId: iid,
                containerId: 'cmhost-' + wid,
                svgId: 'cmsvg-' + wid,
                loadingId: 'cmload-' + wid,
                data: payload,
                onNodeClick: function (node, ctx) {
                  if (ctx.goToParent || ctx.hasChildren) window.RadialMindmap.setCenter(iid, node);
                }
              });
              wireControls();
            }
            if (isFullscreenPage) {
              requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                  doInit();
                  setupCounselorMindmapVisibleReflow(hostEl, svgEl, null);
                });
              });
            } else {
              doInit();
              setupCounselorMindmapVisibleReflow(hostEl, svgEl, null);
            }
          });
        });
      }

      if (mapType === 'classic' || mapType === 'classic_vertical') {
        var classicSrc = rootEl.getAttribute('data-classic-src');
        var classicCss = rootEl.getAttribute('data-classic-css');
        var ctlClassic = document.getElementById('cmctl-' + wid);
        var classicLayout = mapType === 'classic_vertical' ? 'vertical' : 'horizontal';
        return libP.then(function (pack) {
          var classicNodes = markmapToClassicNodes(pack.root);
          ensureClassicCss(classicCss);
          svgEl.style.display = 'none';
          var slotId = 'cm-classic-slot-' + wid;
          var slot = document.getElementById(slotId);
          if (!slot) {
            slot = document.createElement('div');
            slot.id = slotId;
            slot.className = 'position-relative w-100';
            slot.style.minHeight = Math.max(280, hostEl.clientHeight || 0) + 'px';
            if (ctlClassic) hostEl.insertBefore(slot, ctlClassic);
            else hostEl.appendChild(slot);
          } else {
            slot.innerHTML = '';
            slot.style.display = 'block';
            slot.style.minHeight = Math.max(280, hostEl.clientHeight || 0) + 'px';
          }
          return ensureClassicMindmap(classicSrc).then(function () {
            if (!window.CounselorClassicMindmap) throw new Error('CounselorClassicMindmap unavailable');
            var api = window.CounselorClassicMindmap.mount(slot, {
              nodes: classicNodes,
              layout: classicLayout,
              initialExpandDepth: 1,
            });
            if (ctlClassic) {
              ctlClassic.classList.remove('d-none');
              var expC = ctlClassic.querySelector('[data-cm-expand-all]');
              var colC = ctlClassic.querySelector('[data-cm-collapse-all]');
              if (expC) {
                expC.classList.remove('d-none');
                expC.onclick = function () { api.expandAll(); };
              }
              if (colC) {
                colC.classList.remove('d-none');
                colC.onclick = function () { api.collapseAll(); };
              }
              var zinC = ctlClassic.querySelector('[data-cm-zoom-in]');
              var zoutC = ctlClassic.querySelector('[data-cm-zoom-out]');
              var rstC = ctlClassic.querySelector('[data-cm-reset]');
              if (zinC) zinC.onclick = function () { api.zoomIn(); };
              if (zoutC) zoutC.onclick = function () { api.zoomOut(); };
              if (rstC) rstC.onclick = function () { api.reset(); };
            }
            setupCounselorMindmapVisibleReflow(hostEl, svgEl, null);
          });
        });
      }

      if (mapType === 'tree') {
        return libP.then(function (pack) {
          return import(MAP_VIEW).then(function (view) {
            var Markmap = view.Markmap;
            var ctlT = document.getElementById('cmctl-' + wid);
            var mm = Markmap.create(svgEl, { initialExpandLevel: 3 }, pack.root);
            mm.fit();
            wireMarkmapToolbar(ctlT, mm);
            setupCounselorMindmapVisibleReflow(hostEl, svgEl, mm);
          });
        });
      }

      return libP.then(function (pack) {
        return import(MAP_VIEW).then(function (view) {
          var Markmap = view.Markmap;
          var ctlF = document.getElementById('cmctl-' + wid);
          var mm = Markmap.create(svgEl, { initialExpandLevel: 3 }, pack.root);
          mm.fit();
          wireMarkmapToolbar(ctlF, mm);
          setupCounselorMindmapVisibleReflow(hostEl, svgEl, mm);
        });
      });
    })
    .catch(function (err) {
      console.error('Counselor mindmap:', err);
      if (errEl) {
        errEl.classList.remove('d-none');
        if (err && err.message) errEl.textContent = 'Could not load mindmap: ' + err.message;
      }
    });
    }

    if (hiddenTab) {
      var paneId = tabPane && tabPane.id;
      var tabBtn = paneId ? document.querySelector('[data-bs-target="#' + paneId + '"]') : null;
      var ran = false;
      function runOnce() {
        if (ran) return;
        ran = true;
        runMindmapLoad();
      }
      if (tabBtn) {
        tabBtn.addEventListener('shown.bs.tab', runOnce);
      }
      if (typeof IntersectionObserver !== 'undefined') {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting && entry.intersectionRatio > 0) {
              io.disconnect();
              runOnce();
            }
          });
        }, { root: null, rootMargin: '0px', threshold: 0.01 });
        io.observe(hostEl);
      } else if (!tabBtn) {
        runOnce();
      }
      if (!tabBtn && tabPane && typeof MutationObserver !== 'undefined') {
        var mo = new MutationObserver(function () {
          if (tabPane.classList.contains('show')) {
            mo.disconnect();
            runOnce();
          }
        });
        mo.observe(tabPane, { attributes: true, attributeFilter: ['class'] });
      }
      return;
    }

    if (typeof requestIdleCallback === 'function') {
      requestIdleCallback(
        function () {
          runMindmapLoad();
        },
        { timeout: 1200 }
      );
    } else {
      setTimeout(function () {
        runMindmapLoad();
      }, 0);
    }
  }

  scheduleMindmapLoad();
})();
</script>
