<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | Top Teen</title>
  <meta name="theme-color" content="#1a237e">
  <style>
    :root {
      --bg: #eef2ff;
      --card-bg: #ffffff;
      --title: #1f2a78;
      --text: #5b6483;
      --primary: #3f37c9;
      --primary-dark: #2f2997;
      --ring: rgba(63, 55, 201, 0.18);
      --border: #e5e9fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Space Grotesk", system-ui, sans-serif;
      background:
        radial-gradient(80% 60% at 10% 0%, #dde4ff 0%, rgba(221, 228, 255, 0) 70%),
        radial-gradient(70% 55% at 90% 100%, #d8f0ff 0%, rgba(216, 240, 255, 0) 72%),
        var(--bg);
      color: var(--title);
      padding: 20px;
      text-align: center;
    }

    .card {
      width: min(100%, 460px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px 24px;
      box-shadow: 0 18px 42px rgba(26, 35, 126, 0.14);
    }

    .card img {
      width: min(100%, 220px);
      height: auto;
      margin: 0 auto 14px;
      display: block;
      filter: drop-shadow(0 8px 18px rgba(63, 55, 201, 0.14));
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.4rem, 3.8vw, 1.8rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--title);
    }

    p {
      margin: 0 auto 20px;
      max-width: 34ch;
      color: var(--text);
      line-height: 1.55;
      font-size: 0.98rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 118px;
      padding: 11px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #4b42dc 0%, var(--primary) 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 10px 22px rgba(63, 55, 201, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      outline: none;
    }

    a:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #453bd6 0%, var(--primary-dark) 100%);
      box-shadow: 0 12px 24px rgba(63, 55, 201, 0.34);
    }

    a:focus-visible {
      box-shadow:
        0 0 0 4px var(--ring),
        0 10px 22px rgba(63, 55, 201, 0.3);
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        border-radius: 16px;
        padding: 22px 16px 18px;
      }

      .card img {
        width: min(100%, 190px);
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="img-fluid" src="{{ static('images_new/general/offline-mode.png') }}" alt="Offline Mode" />
    <h1>You are offline</h1>
    <p>TopTeen needs an internet connection for most pages. Check your connection and try again.</p>
    <a href="/">Retry</a>
  </div>
</body>
</html>
