<script>
  // Initialize Bootstrap tooltips
  function initTooltips() {
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl);
    });
  }
  
  // AJAX function to load institutes table
  function loadInstitutesTable(url) {
    const tableWrapper = document.getElementById('institutes-table-wrapper');
    const loader = document.getElementById('institutes-loader');
    
    if (!tableWrapper || !loader) {
      console.error('Required elements not found');
      return;
    }
    
    tableWrapper.style.display = 'none';
    loader.style.display = 'block';
    
    // Ensure data_type is in URL for AJAX requests
    let ajaxUrl = url;
    if (!ajaxUrl.includes('data_type=')) {
      ajaxUrl += (ajaxUrl.includes('?') ? '&' : '?') + 'data_type=institutes';
    }
    
    console.log('Loading institutes from:', ajaxUrl);
    
    fetch(ajaxUrl, {
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
      }
    })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.text();
    })
    .then(html => {
      console.log('Received HTML response, length:', html.length);
      
      if (!html || html.trim().length === 0) {
        throw new Error('Empty response received');
      }
      
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      
      const newTableWrapper = tempDiv.querySelector('#institutes-table-wrapper');
      const newModals = tempDiv.querySelectorAll('.modal');
      
      if (newTableWrapper) {
        // Remove existing modals for institutes before adding new ones
        const existingModals = document.querySelectorAll('[id^="viewInstituteModal"], [id^="updateInstituteModal"], [id^="changePasswordModal"]');
        existingModals.forEach(modal => modal.remove());
        
        // Extract table content (without modals)
        const tableContent = newTableWrapper.cloneNode(true);
        // Remove modals from table content
        const modalsInContent = tableContent.querySelectorAll('.modal');
        modalsInContent.forEach(modal => modal.remove());
        
        tableWrapper.innerHTML = tableContent.innerHTML;
        
        // Append modals to body
        newModals.forEach(modal => {
          document.body.appendChild(modal.cloneNode(true));
        });
      } else {
        // Fallback: try to find table container and pagination separately
        const newTableContainer = tempDiv.querySelector('#institutes-table-container');
        const newPagination = tempDiv.querySelector('#institutes-pagination');
        
        if (newTableContainer || newPagination) {
          tableWrapper.innerHTML = '';
          if (newTableContainer) {
            tableWrapper.appendChild(newTableContainer);
          }
          if (newPagination) {
            tableWrapper.appendChild(newPagination);
          }
        } else {
          // If no table found, show the HTML directly
          tableWrapper.innerHTML = html;
        }
      }
      
      // Append modals to body if they exist
      if (newModals && newModals.length > 0) {
        newModals.forEach(modal => {
          // Remove existing modal with same ID if it exists
          const existingModal = document.getElementById(modal.id);
          if (existingModal) {
            existingModal.remove();
          }
          // Append new modal to body
          document.body.appendChild(modal.cloneNode(true));
        });
      }
      
      // Re-initialize hover handlers for institute rows
      initializeInstituteRowHover();
      
      // Update URL without data_type parameter for cleaner URLs
      const urlObj = new URL(url, window.location.origin);
      urlObj.searchParams.delete('data_type');
      const cleanUrl = urlObj.pathname + (urlObj.search ? urlObj.search : '');
      window.history.pushState({}, '', cleanUrl);
      
      loader.style.display = 'none';
      tableWrapper.style.display = 'block';
      
      initTooltips();
      console.log('Institutes table loaded successfully');
    })
    .catch(error => {
      console.error('Error loading institutes:', error);
      console.error('Error details:', {
        message: error.message,
        stack: error.stack,
        url: ajaxUrl
      });
      loader.innerHTML = '<div class="alert alert-danger"><p class="mb-0">Error loading institutes. Please refresh the page.</p><p class="mb-0 fs-12 mt-2">' + error.message + '</p></div>';
      loader.style.display = 'block';
      tableWrapper.style.display = 'none';
    });
  }
  
  // Load statistics via AJAX
  function loadStatistics() {
    const sc = document.getElementById('students-count');
    if (!sc && !document.getElementById('sidebar-total-credits')) {
      return;
    }
    const url = window.location.pathname + '?data_type=stats';
    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    }
    fetch(url, {
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
      }
    })
    .then(response => response.json())
    .then(data => {
      setText('students-count', data.total_stu_count || 0);
      setText('counselors-count', data.counselors_count || 0);
      setText('credits-count', data.total_credits || 0);
      setText('events-count', data.total_events || 0);
      const totalCredits = data.global_credits || 5000;
      const usedCredits = data.total_credits || 0;
      const remainingCredits = totalCredits - usedCredits;
      setText('sidebar-total-credits', totalCredits.toLocaleString());
      setText('sidebar-used-credits', usedCredits.toLocaleString());
      setText('sidebar-remaining-credits', remainingCredits.toLocaleString());
    })
    .catch(error => {
      console.error('Error loading statistics:', error);
      setText('students-count', '0');
      setText('counselors-count', '0');
      setText('credits-count', '0');
      setText('events-count', '0');
      setText('sidebar-total-credits', '0');
      setText('sidebar-used-credits', '0');
      setText('sidebar-remaining-credits', '0');
    });
  }
  
  // Load institute count
  function loadInstituteCount() {
    const institutesCountEl = document.getElementById('institutes-count');
    if (institutesCountEl) {
      {% if total_institute_count is defined %}
      institutesCountEl.textContent = {{ total_institute_count }};
      {% else %}
      institutesCountEl.textContent = '0';
      {% endif %}
    }
  }
  
  // Load charts data via AJAX
  function loadCharts() {
    bindMktgGraphViewToggles();
    if (!document.getElementById('charts-section')) {
      return;
    }
    const url = window.location.pathname + '?data_type=charts';
    fetch(url, {
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
      }
    })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      console.log('Charts data received:', data);
      // Show charts section
      document.getElementById('charts-section').style.display = 'block';
      
      // Load location chart
      if (data.institutes && data.institutes.length > 0) {
        loadLocationChart(data.institutes);
      } else {
        document.getElementById('location-chart-loader').innerHTML = '<p class="text-gray">No data available</p>';
      }
      
      // Show bottom charts section
      document.getElementById('bottom-charts-section').style.display = 'block';
      
      // Load personality chart
      if (data.total_students_count !== undefined && data.test_result_count !== undefined) {
        loadPersonalityChart(data.total_students_count, data.test_result_count);
      } else {
        document.getElementById('personality-chart-loader').innerHTML = '<p class="text-gray">No data available</p>';
      }
      
      // Load streams chart
      if (data.streams_chart_data && data.streams_chart_data.length > 0) {
        loadStreamsChart(data.streams_chart_data);
      } else {
        const streamsLoader = document.getElementById('streams-chart-loader');
        if (streamsLoader) {
          streamsLoader.innerHTML = '<p class="text-gray">No stream data available</p>';
        }
      }
      
      // Load seat capacity table with institutes data from charts
      if (data.seat_capacity_institutes && data.seat_capacity_institutes.length > 0) {
        loadSeatCapacityDashboardChart(data.seat_capacity_institutes);
      } else {
        const seatCapacityLoader = document.getElementById('seat-capacity-loader');
        const seatCapacitySection = document.getElementById('seat-capacity-section');
        if (seatCapacityLoader && seatCapacitySection) {
          seatCapacitySection.style.display = 'block';
          seatCapacityLoader.innerHTML = '<p class="text-gray">No seat capacity data available</p>';
        }
      }
    })
    .catch(error => {
      console.error('Error loading charts:', error);
      document.getElementById('charts-section').style.display = 'block';
      const locationLoader = document.getElementById('location-chart-loader');
      const personalityLoader = document.getElementById('personality-chart-loader');
      if (locationLoader) {
        locationLoader.innerHTML = '<p class="text-danger">Error loading chart: ' + error.message + '</p>';
      }
      if (personalityLoader) {
        personalityLoader.innerHTML = '<p class="text-danger">Error loading chart</p>';
      }
    });
  }

  function renderMktgSimpleTable(tbodyId, rows) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    if (!rows || !rows.length) {
      tbody.innerHTML = '<tr><td colspan="2" class="text-muted">No data available</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => (
      '<tr><td>' + (r.label || '-') + '</td><td class="text-end">' + (r.value || 0) + '</td></tr>'
    )).join('');
  }

  function setMktgGraphView(target, view) {
    const chartWrap = document.querySelector('[data-mktg-chart-wrap="' + target + '"]');
    const tableWrap = document.querySelector('[data-mktg-table-wrap="' + target + '"]');
    if (!chartWrap || !tableWrap) return;
    const showTable = view === 'table';
    chartWrap.style.display = showTable ? 'none' : '';
    tableWrap.style.display = showTable ? '' : 'none';
    document.querySelectorAll('[data-mktg-view-btn][data-target="' + target + '"]').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-view') === view);
    });
  }

  function bindMktgGraphViewToggles() {
    if (window._mktgGraphViewToggleBound) return;
    window._mktgGraphViewToggleBound = true;
    document.addEventListener('click', function(e) {
      const btn = e.target && (e.target.closest ? e.target.closest('[data-mktg-view-btn]') : null);
      if (!btn) return;
      e.preventDefault();
      const target = (btn.getAttribute('data-target') || '').trim();
      const view = (btn.getAttribute('data-view') || '').trim();
      if (!target || !view) return;
      setMktgGraphView(target, view);
    });
  }
  
  // Load location chart - ranked bars for faster reading.
  function loadLocationChart(institutes) {
    const loader = document.getElementById('location-chart-loader');
    const canvas = document.getElementById('locationChart');
    
    if (!loader || !canvas) {
      return;
    }
    
    // Safety check: if data is too large or invalid, limit it
    if (!Array.isArray(institutes) || institutes.length === 0) {
      loader.innerHTML = '<p class="text-gray">No data available</p>';
      return;
    }
    
    const maxPoints = 12;
    const ranked = [...institutes]
      .map(inst => ({
        fullLabel: (inst.address || 'Unknown').trim() || 'Unknown',
        count: Number(inst.student_count || 0),
      }))
      .sort((a, b) => b.count - a.count)
      .slice(0, maxPoints);
    const labels = ranked.map(x => x.fullLabel.length > 28 ? (x.fullLabel.substring(0, 28) + '...') : x.fullLabel);
    const data = ranked.map(x => x.count);
    renderMktgSimpleTable('mktgLocationTableBody', ranked.map(x => ({ label: x.fullLabel, value: x.count })));
    
    if (labels.length > 0) {
      loader.style.display = 'none';
      canvas.style.display = 'block';
      
      // Destroy existing chart if it exists
      if (window.locationChartInstance) {
        window.locationChartInstance.destroy();
      }
      
      window.locationChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Students',
            data: data,
            backgroundColor: 'rgba(76, 201, 240, 0.75)',
            borderColor: 'rgba(6, 182, 212, 1)',
            borderWidth: 1,
            borderRadius: 6,
            barThickness: 16
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              title: {
                display: true,
                text: 'Students'
              },
              ticks: {
                precision: 0
              },
            },
            y: {
              title: {
                display: true,
                text: 'Location (Top 12)'
              }
            }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                title: function(items) {
                  if (!items || !items.length) return '';
                  const idx = items[0].dataIndex;
                  return ranked[idx] ? ranked[idx].fullLabel : '';
                },
                label: function(ctx) {
                  return ' Students: ' + (ctx.raw || 0);
                }
              }
            }
          },
        }
      });
    } else {
      loader.innerHTML = '<p class="text-gray">No data available</p>';
    }
  }
  
  // Load personality chart
  function loadPersonalityChart(totalStudents, testResults) {
    const loader = document.getElementById('personality-chart-loader');
    const canvas = document.getElementById('personalityChart');
    
    const total = typeof totalStudents === 'number' ? totalStudents : (totalStudents || 0);
    const completed = typeof testResults === 'number' ? testResults : (testResults || 0);
    const pending = Math.max(0, total - completed);
    renderMktgSimpleTable('mktgPsychTableBody', [
      { label: 'Completed', value: completed },
      { label: 'Pending', value: pending },
    ]);
    
    if (total > 0) {
      loader.style.display = 'none';
      canvas.style.display = 'block';
      if (window.personalityChartInstance) {
        try { window.personalityChartInstance.destroy(); } catch (e) {}
        window.personalityChartInstance = null;
      }
      
      window.personalityChartInstance = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: ['Completed', 'Pending'],
          datasets: [{
            data: [completed, pending],
            backgroundColor: [
              'rgba(40, 167, 69, 0.8)',
              'rgba(255, 193, 7, 0.8)'
            ],
            borderColor: [
              'rgba(40, 167, 69, 1)',
              'rgba(255, 193, 7, 1)'
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 4,
              bottom: 4,
              left: 4,
              right: 4
            }
          },
          cutout: '62%',
          plugins: {
            legend: {
              position: 'bottom'
            }
          },
          animation: {
            duration: 750,
            easing: 'easeOutQuart'
          }
        }
      });
    } else {
      loader.innerHTML = '<p class="text-gray">No data available</p>';
    }
  }
  
  // Load streams chart - ranked bars for quick comparison.
  function loadStreamsChart(streamsData) {
    const loader = document.getElementById('streams-chart-loader');
    const canvas = document.getElementById('streamsChart');
    const section = document.getElementById('bottom-charts-section');
    
    if (!loader || !canvas || !section) {
      return;
    }
    
    // Limit data points to prevent browser hang
    const maxPoints = 15; // Limit to 15 streams max
    // Safety check: if data is too large, limit it
    if (!Array.isArray(streamsData) || streamsData.length === 0) {
      loader.innerHTML = '<p class="text-gray">No stream data available</p>';
      return;
    }
    
    // Sort by count (descending) and take top N
    const sortedData = [...streamsData].sort((a, b) => (b.count || 0) - (a.count || 0));
    const limitedData = sortedData.slice(0, maxPoints);
    
    const labels = limitedData.map(item => item.stream || 'Other');
    const data = limitedData.map(item => item.count || 0);
    renderMktgSimpleTable('mktgStreamsTableBody', limitedData.map(item => ({
      label: item.stream || 'Other',
      value: item.count || 0,
    })));
    
    // Truncate long stream names to prevent chart overflow
    const shortLabels = labels.map(label => {
      return label.length > 20 ? label.substring(0, 20) + '...' : label;
    });
    
    if (shortLabels.length > 0 && data.some(count => count > 0)) {
      section.style.display = 'block';
      loader.style.display = 'none';
      canvas.style.display = 'block';
      
      // Destroy existing chart if it exists
      if (window.streamsChartInstance) {
        window.streamsChartInstance.destroy();
      }
      
      window.streamsChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: shortLabels,
          datasets: [{
            label: 'Students',
            data: data,
            backgroundColor: 'rgba(99, 102, 241, 0.75)',
            borderColor: 'rgba(79, 70, 229, 1)',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 4,
              bottom: 4,
              left: 4,
              right: 4
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: 'Stream'
              },
              ticks: {
                maxRotation: 20,
                minRotation: 20,
                maxTicksLimit: 15,
                font: {
                  size: 11
                }
              },
              grid: {
                display: false
              }
            },
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'Count'
              },
              ticks: {
                precision: 0
              }
            }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                title: function(items) {
                  if (!items || !items.length) return '';
                  const idx = items[0].dataIndex;
                  return labels[idx] || '';
                },
                label: function(ctx) {
                  return ' Students: ' + (ctx.raw || 0);
                }
              }
            }
          },
        }
      });
    } else {
      section.style.display = 'block';
      loader.innerHTML = '<p class="text-gray">No stream data available</p>';
    }
  }
  
  // Dashboard: compact seat-capacity graph (details are available on the dedicated Seat capacity page).
  function loadSeatCapacityDashboardChart(institutes) {
    const section = document.getElementById('seat-capacity-section');
    const loader = document.getElementById('seat-capacity-loader');
    const wrapper = document.getElementById('seat-capacity-table-wrapper');
    const canvas = document.getElementById('seatCapacityDashboardChart');

    if (!section || !canvas) return;
    section.style.display = 'block';

    if (!institutes || !institutes.length) {
      if (loader) loader.innerHTML = '<p class="text-gray">No seat capacity data available</p>';
      return;
    }

    const labels = institutes.map(inst => inst.name || 'Unknown');
    const totals = institutes.map(inst =>
      (Number(inst.pcm || 0) + Number(inst.cbm || 0) + Number(inst.comm || 0) + Number(inst.hme || 0) + Number(inst.hmb || 0))
    );
    renderMktgSimpleTable('mktgSeatTableBody', labels.map((name, idx) => ({
      label: name,
      value: totals[idx] || 0,
    })));

    if (loader) loader.style.display = 'none';
    if (wrapper) wrapper.style.display = 'block';
    canvas.style.display = 'block';

    if (window._mktgSeatCapacityChart) {
      try { window._mktgSeatCapacityChart.destroy(); } catch (e) {}
      window._mktgSeatCapacityChart = null;
    }

    window._mktgSeatCapacityChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Total seats',
          data: totals,
          backgroundColor: 'rgba(167, 139, 250, 0.85)',
          borderColor: 'rgba(139, 92, 246, 1)',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            ticks: {
              autoSkip: false,
              maxRotation: 90,
              minRotation: 90
            }
          },
          y: { beginAtZero: true, title: { display: true, text: 'Seats' } }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  // Seat-capacity dedicated page: keep detailed editable table here.
  function ttv2LoadSeatCapacityPage() {
    const section = document.getElementById('seat-capacity-section');
    const tbody = document.getElementById('seat-capacity-tbody');
    if (!section || !tbody) return;
    const url = window.location.pathname + '?data_type=charts';
    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(r => { if (!r.ok) throw new Error('HTTP error! status: ' + r.status); return r.json(); })
      .then(data => {
        loadSeatCapacityTable((data && data.seat_capacity_institutes) ? data.seat_capacity_institutes : []);
      })
      .catch(() => {
        const loader = document.getElementById('seat-capacity-loader');
        if (loader) loader.innerHTML = '<p class="text-danger">Error loading seat capacity data</p>';
      });
  }

  // Load seat capacity table with inline edit functionality
  function loadSeatCapacityTable(institutes) {
    const section = document.getElementById('seat-capacity-section');
    const tbody = document.getElementById('seat-capacity-tbody');
    const loader = document.getElementById('seat-capacity-loader');
    const tableWrapper = document.getElementById('seat-capacity-table-wrapper');
    
    if (!section || !tbody) {
      return;
    }
    
    section.style.display = 'block';
    
    if (institutes && institutes.length > 0) {
      let html = '';
      institutes.forEach((inst, index) => {
        // Default seat capacity values (100 per stream as per production)
        const pcm = inst.pcm || 100;
        const cbm = inst.cbm || 100;
        const comm = inst.comm || 100;
        const hme = inst.hme || 100;
        const hmb = inst.hmb || 100;
        const name = inst.name || 'Unknown';
        const instId = inst.id || index;
        const slug = (inst.slug && String(inst.slug).trim()) ? String(inst.slug).trim() : '';
        const nameCell = slug
          ? `<a class="text-decoration-none" href="/institute/${encodeURIComponent(slug)}/dashboard/">${name}</a>`
          : name;
        html += `
          <tr data-institute-id="${instId}" data-edit-mode="false">
            <td>${index + 1}</td>
            <td class="institute-name">${nameCell}</td>
            <td class="pcm-value">${pcm}</td>
            <td class="cbm-value">${cbm}</td>
            <td class="comm-value">${comm}</td>
            <td class="hme-value">${hme}</td>
            <td class="hmb-value">${hmb}</td>
            <td>
              <button class="btn btn-sm btn-primary edit-seat-capacity-btn" onclick="toggleEditSeatCapacity(${instId})">
                <i class='bx bx-edit'></i> Edit
              </button>
              <button class="btn btn-sm btn-success save-seat-capacity-btn" onclick="saveSeatCapacity(${instId})" style="display: none;">
                <i class='bx bx-save'></i> Save
              </button>
            </td>
          </tr>
        `;
      });
      
      tbody.innerHTML = html;
      
      // Hide loader and show table
      if (loader) {
        loader.style.display = 'none';
      }
      if (tableWrapper) {
        tableWrapper.style.display = 'block';
      }
    } else {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray">No data available</td></tr>';
      
      // Hide loader and show table even if no data
      if (loader) {
        loader.style.display = 'none';
      }
      if (tableWrapper) {
        tableWrapper.style.display = 'block';
      }
    }
  }
  
  // Toggle edit mode for seat capacity row
  function toggleEditSeatCapacity(instituteId) {
    const row = document.querySelector(`tr[data-institute-id="${instituteId}"]`);
    if (!row) return;
    
    const isEditMode = row.getAttribute('data-edit-mode') === 'true';
    
    if (!isEditMode) {
      // Enter edit mode
      const pcm = row.querySelector('.pcm-value').textContent.trim();
      const cbm = row.querySelector('.cbm-value').textContent.trim();
      const comm = row.querySelector('.comm-value').textContent.trim();
      const hme = row.querySelector('.hme-value').textContent.trim();
      const hmb = row.querySelector('.hmb-value').textContent.trim();
      
      row.querySelector('.pcm-value').innerHTML = `<input type="number" class="form-control form-control-sm" value="${pcm}" style="width: 80px;">`;
      row.querySelector('.cbm-value').innerHTML = `<input type="number" class="form-control form-control-sm" value="${cbm}" style="width: 80px;">`;
      row.querySelector('.comm-value').innerHTML = `<input type="number" class="form-control form-control-sm" value="${comm}" style="width: 80px;">`;
      row.querySelector('.hme-value').innerHTML = `<input type="number" class="form-control form-control-sm" value="${hme}" style="width: 80px;">`;
      row.querySelector('.hmb-value').innerHTML = `<input type="number" class="form-control form-control-sm" value="${hmb}" style="width: 80px;">`;
      
      row.querySelector('.edit-seat-capacity-btn').style.display = 'none';
      row.querySelector('.save-seat-capacity-btn').style.display = 'inline-block';
      row.setAttribute('data-edit-mode', 'true');
    }
  }
  
  // Save seat capacity
  function saveSeatCapacity(instituteId) {
    const row = document.querySelector(`tr[data-institute-id="${instituteId}"]`);
    if (!row) return;
    
    const pcm = row.querySelector('.pcm-value input').value;
    const cbm = row.querySelector('.cbm-value input').value;
    const comm = row.querySelector('.comm-value input').value;
    const hme = row.querySelector('.hme-value input').value;
    const hmb = row.querySelector('.hmb-value input').value;
    
    // Get CSRF token
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                     document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
    
    // Disable save button during request
    const saveBtn = row.querySelector('.save-seat-capacity-btn');
    const originalText = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="bx bx-loader bx-spin"></i> Saving...';
    
    // Send AJAX request to save seat capacity
    const formData = new FormData();
    formData.append('institute_id', instituteId);
    formData.append('pcm', pcm);
    formData.append('cbm', cbm);
    formData.append('comm', comm);
    formData.append('hme', hme);
    formData.append('hmb', hmb);
    formData.append('csrfmiddlewaretoken', csrfToken);
    
    fetch('{{ url("institute:updateseatcapacity") }}', {
      method: 'POST',
      body: formData,
      headers: {
        'X-Requested-With': 'XMLHttpRequest'
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        // Update the display with saved values
        row.querySelector('.pcm-value').textContent = data.data.pcm;
        row.querySelector('.cbm-value').textContent = data.data.cbm;
        row.querySelector('.comm-value').textContent = data.data.comm;
        row.querySelector('.hme-value').textContent = data.data.hme;
        row.querySelector('.hmb-value').textContent = data.data.hmb;
        
        row.querySelector('.edit-seat-capacity-btn').style.display = 'inline-block';
        saveBtn.style.display = 'none';
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;
        row.setAttribute('data-edit-mode', 'false');
        
        // Show success message
        Swal.fire({
          icon: 'success',
          title: 'Success!',
          text: 'Seat capacity updated successfully!',
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 3000,
          timerProgressBar: true
        });
      } else {
        throw new Error(data.error || 'Failed to save seat capacity');
      }
    })
    .catch(error => {
      console.error('Error saving seat capacity:', error);
      Swal.fire({
        icon: 'error',
        title: 'Error!',
        text: 'Error saving seat capacity: ' + error.message,
        confirmButtonText: 'OK'
      });
      saveBtn.disabled = false;
      saveBtn.innerHTML = originalText;
    });
  }
  
  // Update per_page and reload table
  function updatePerPage(value) {
    const url = new URL(window.location.href);
    url.searchParams.set('per_page', value);
    url.searchParams.delete('page'); // Reset to page 1 when changing per_page
    url.searchParams.set('data_type', 'institutes');
    loadInstitutesTable(url.toString());
  }
  
  // Load institutes table on page load
  function loadInstitutesOnPageLoad() {
    // Build URL properly to avoid duplicate query parameters
    const urlObj = new URL(window.location.href);
    urlObj.searchParams.set('data_type', 'institutes');
    const url = urlObj.pathname + urlObj.search;
    loadInstitutesTable(url);
  }

  /** Show chart card shells + spinners immediately; data fills when loadCharts() completes. */
  function ttv2RevealMarketingChartShells() {
    try {
      var bottom = document.getElementById('bottom-charts-section');
      if (bottom) {
        bottom.style.display = 'flex';
        bottom.style.visibility = 'visible';
      }
      var topCharts = document.getElementById('charts-section');
      if (topCharts) {
        topCharts.style.display = 'block';
        topCharts.style.visibility = 'visible';
      }
    } catch (e) {}
  }

  // Location suggest dropdown (custom menu over native datalist for better UX).
  function ttv2InitLocationSuggestDropdown() {
    const input = document.getElementById('location_filter');
    const datalist = document.getElementById('location_suggestions');
    const menu = document.getElementById('location_filter_menu');
    const clearBtn = document.getElementById('location_filter_clear');
    if (!input || !datalist || !menu || !clearBtn) return;
    if (input.dataset.ttv2SuggestBound === '1') return;
    input.dataset.ttv2SuggestBound = '1';

    const options = Array.from(datalist.querySelectorAll('option'))
      .map(o => (o.value || '').trim())
      .filter(Boolean);

    function setClearVisible() {
      clearBtn.style.display = (input.value || '').trim() ? 'block' : 'none';
    }

    function hideMenu() {
      menu.style.display = 'none';
      menu.innerHTML = '';
    }

    function renderMenu(raw) {
      const q = (raw || '').trim().toLowerCase();
      const filtered = options.filter(v => !q || v.toLowerCase().includes(q)).slice(0, 30);
      if (!filtered.length) {
        menu.innerHTML = '<div class="ttv2-suggest-empty">No matching locations</div>';
      } else {
        menu.innerHTML = filtered
          .map(v => `<button type="button" class="ttv2-suggest-item" data-val="${String(v).replace(/"/g, '&quot;')}">${v}</button>`)
          .join('');
      }
      menu.style.display = 'block';
    }

    input.addEventListener('focus', function () {
      renderMenu(input.value);
      setClearVisible();
    });
    input.addEventListener('input', function () {
      renderMenu(input.value);
      setClearVisible();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') hideMenu();
    });

    clearBtn.addEventListener('click', function () {
      input.value = '';
      setClearVisible();
      renderMenu('');
      input.focus();
    });

    menu.addEventListener('click', function (e) {
      const btn = e.target.closest('.ttv2-suggest-item');
      if (!btn) return;
      input.value = btn.getAttribute('data-val') || '';
      setClearVisible();
      hideMenu();
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });

    document.addEventListener('click', function (e) {
      if (!input.closest('.ttv2-suggest-wrap')) return;
      if (input.closest('.ttv2-suggest-wrap').contains(e.target)) return;
      hideMenu();
    });

    setClearVisible();
  }
  
  // Boot all dashboard loaders + delegated listeners. For Template v2 the body is
  // injected into #ttv2AjaxContent after this script runs, so we also expose this
  // on window and call it from the v2 shell after the partial HTML is inserted.
  function ttv2BootMarketingGroupDashboard() {
    loadInstituteCount();
    ttv2RevealMarketingChartShells();
    loadStatistics();
    if (document.getElementById('institutes-loader') || document.getElementById('institutes-table-wrapper')) {
      loadInstitutesOnPageLoad();
    }
    ttv2InitLocationSuggestDropdown();
    loadCharts();
    ttv2LoadSeatCapacityPage();
    
    const sidebarPendingBtn = document.getElementById('sidebar-pending-institutes-btn');
    if (sidebarPendingBtn && !sidebarPendingBtn.getAttribute('data-mktg-bound')) {
      sidebarPendingBtn.setAttribute('data-mktg-bound', '1');
      sidebarPendingBtn.addEventListener('click', function() {
        const statusSel = document.getElementById('institute_status_filter');
        const form = document.getElementById('institute-filter-form');
        if (statusSel) {
          statusSel.value = 'pending';
        }
        let url;
        if (form) {
          const params = new URLSearchParams(new FormData(form));
          url = window.location.pathname + '?' + params.toString();
        } else {
          url = window.location.pathname + '?status=pending';
        }
        loadInstitutesTable(url);
        const mainCol = document.getElementById('main-content-area');
        if (mainCol) {
          mainCol.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    }

    const instituteFilterForm = document.getElementById('institute-filter-form');
    
    if (instituteFilterForm && instituteFilterForm.getAttribute('data-mktg-ttv2-bound') !== '1') {
      instituteFilterForm.setAttribute('data-mktg-ttv2-bound', '1');
      instituteFilterForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const params = new URLSearchParams(formData);
        const url = window.location.pathname + '?' + params.toString();
        loadInstitutesTable(url);
        // Reload charts with new filters
        setTimeout(function() {
          loadCharts();
        }, 500);
      });
      
      // Also handle filter changes without submit
      const filterInputs = instituteFilterForm.querySelectorAll('input, select');
      filterInputs.forEach(input => {
        input.addEventListener('change', function() {
          const formData = new FormData(instituteFilterForm);
          const params = new URLSearchParams(formData);
          const url = window.location.pathname + '?' + params.toString();
          loadInstitutesTable(url);
        });
      });
    }
    
    // Handle pagination links with AJAX; hard-delete (empty institutes only) — document delegation once
    if (!window._ttv2MktgDocClickBound) {
      window._ttv2MktgDocClickBound = true;
      document.addEventListener('click', function(e) {
      const delBtn = e.target.closest('.institute-hard-delete-btn');
      if (delBtn) {
        e.preventDefault();
        const deleteUrl = delBtn.getAttribute('data-delete-url');
        const row = delBtn.closest('tr.institute-row');
        const insName = (row && row.getAttribute('data-institute-name')) || 'this institute';
        if (!deleteUrl) {
          return;
        }
        Swal.fire({
          icon: 'warning',
          title: 'Permanently delete institute?',
          text: 'This cannot be undone.\n\nInstitute: ' + insName,
          showCancelButton: true,
          confirmButtonText: 'Yes, delete permanently',
          confirmButtonColor: '#d33',
          cancelButtonText: 'Cancel'
        }).then(function(result) {
          if (!result.isConfirmed) {
            return;
          }
          const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value ||
            document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
          const formData = new FormData();
          formData.append('csrfmiddlewaretoken', csrfToken);
          fetch(deleteUrl, {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            credentials: 'same-origin'
          })
            .then(function(response) {
              return response.json().then(function(data) {
                return { ok: response.ok, status: response.status, data: data };
              });
            })
            .then(function(res) {
              if (res.ok && res.data.success) {
                Swal.fire({
                  icon: 'success',
                  title: 'Deleted',
                  text: res.data.message || 'Institute removed.',
                  toast: true,
                  position: 'top-end',
                  showConfirmButton: false,
                  timer: 3000,
                  timerProgressBar: true
                });
                loadInstitutesTable(
                  window.location.pathname + '?data_type=institutes' +
                  (window.location.search ? '&' + window.location.search.substring(1) : '')
                );
              } else {
                throw new Error(res.data.error || 'Delete failed');
              }
            })
            .catch(function(err) {
              Swal.fire({
                icon: 'error',
                title: 'Error',
                text: err.message || 'Delete failed',
                confirmButtonText: 'OK'
              });
            });
        });
        return;
      }
      const paginationLink = e.target.closest('.pagination a');
      if (paginationLink) {
        e.preventDefault();
        const url = paginationLink.href;
        if (url.includes('page=')) {
          loadInstitutesTable(url);
        }
      }
    });
    }
    
    // Handle update institute / password modals (once globally)
    if (!window._ttv2MktgDocSubmitBound) {
      window._ttv2MktgDocSubmitBound = true;
      document.addEventListener('submit', function(e) {
      const updateForm = e.target.closest('form[id^="updateInstituteForm"]');
      if (updateForm) {
        e.preventDefault();
        const formData = new FormData(updateForm);
        const submitBtn = updateForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="bx bx-loader bx-spin"></i> Updating...';
        
        fetch('{{ url("institute:marketingprofileedit") }}', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        })
        .then(response => {
          if (response.ok) {
            return response.json();
          } else {
            return response.json().then(data => {
              throw new Error(data.error || 'Error updating institute');
            });
          }
        })
        .then(data => {
          if (data.success) {
            // Reload the institutes table
            loadInstitutesTable(window.location.pathname + '?data_type=institutes' + (window.location.search ? '&' + window.location.search.substring(1) : ''));
            // Close the modal
            const modal = bootstrap.Modal.getInstance(updateForm.closest('.modal'));
            if (modal) {
              modal.hide();
            }
            // Show success message
            Swal.fire({
              icon: 'success',
              title: 'Success!',
              text: data.message || 'Institute updated successfully!',
              toast: true,
              position: 'top-end',
              showConfirmButton: false,
              timer: 3000,
              timerProgressBar: true
            });
          } else {
            throw new Error(data.error || 'Error updating institute');
          }
        })
        .catch(error => {
          console.error('Error updating institute:', error);
          Swal.fire({
            icon: 'error',
            title: 'Error!',
            text: 'Error updating institute: ' + error.message,
            confirmButtonText: 'OK'
          });
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        });
      }
      
      // Handle change password form submissions
      const passwordForm = e.target.closest('form[id^="changePasswordForm"]');
      if (passwordForm) {
        e.preventDefault();
        const formData = new FormData(passwordForm);
        const newPassword = formData.get('new_password');
        const confirmPassword = formData.get('confirm_password');
        
        if (newPassword !== confirmPassword) {
          Swal.fire({
            icon: 'error',
            title: 'Error!',
            text: 'Passwords do not match!',
            confirmButtonText: 'OK'
          });
          return;
        }
        
        const submitBtn = passwordForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="bx bx-loader bx-spin"></i> Changing...';
        
        fetch('{{ url("institute:marketingprofileedit") }}', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        })
        .then(response => {
          if (response.ok) {
            return response.json();
          } else {
            return response.json().then(data => {
              throw new Error(data.error || 'Error changing password');
            });
          }
        })
        .then(data => {
          if (data.success) {
            // Close the modal
            const modal = bootstrap.Modal.getInstance(passwordForm.closest('.modal'));
            if (modal) {
              modal.hide();
            }
            // Clear the form
            passwordForm.reset();
            // Show success message
            Swal.fire({
              icon: 'success',
              title: 'Success!',
              text: data.message || 'Password changed successfully!',
              toast: true,
              position: 'top-end',
              showConfirmButton: false,
              timer: 3000,
              timerProgressBar: true
            });
          } else {
            throw new Error(data.error || 'Error changing password');
          }
        })
        .catch(error => {
          console.error('Error changing password:', error);
          Swal.fire({
            icon: 'error',
            title: 'Error!',
            text: 'Error changing password: ' + error.message,
            confirmButtonText: 'OK'
          });
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        });
      }
    });
    }
    
    // Initialize tooltips for non-AJAX content
    initTooltips();
  }

  window.ttv2BootMarketingGroupDashboard = ttv2BootMarketingGroupDashboard;
  document.addEventListener('DOMContentLoaded', function() {
    if (!document.getElementById('ttv2AjaxContent')) {
      ttv2BootMarketingGroupDashboard();
    }
  });

</script>

<script>
  // Initialize institute row hover functionality
  let hoverTimeout = null;
  let panelHoverTimeout = null;
  
  function initializeInstituteRowHover() {
    const panel = document.getElementById('instituteDetailsPanel');
    const closeBtn = document.getElementById('closePanelBtn');
    const instituteRows = document.querySelectorAll('.institute-row');
    
    if (!panel) return;
    
    // Close panel handler (only add once)
    if (closeBtn && !closeBtn.hasAttribute('data-hover-initialized')) {
      closeBtn.setAttribute('data-hover-initialized', 'true');
      closeBtn.addEventListener('click', function() {
        clearTimeout(hoverTimeout);
        clearTimeout(panelHoverTimeout);
        panel.classList.remove('show');
      });
    }
    
    // Hover handlers for each row (use event delegation to avoid duplicates)
    instituteRows.forEach(row => {
      // Skip if already initialized
      if (row.hasAttribute('data-hover-initialized')) {
        return;
      }
      row.setAttribute('data-hover-initialized', 'true');
      
      row.addEventListener('mouseenter', function() {
        clearTimeout(hoverTimeout);
        clearTimeout(panelHoverTimeout);
        hoverTimeout = setTimeout(() => {
          // Get data from row
          const name = row.getAttribute('data-institute-name') || '-';
          const email = row.getAttribute('data-institute-email') || '-';
          const contact = row.getAttribute('data-institute-contact') || '-';
          const address = row.getAttribute('data-institute-address') || '-';
          const admin = row.getAttribute('data-institute-admin') || '-';
          const students = parseInt(row.getAttribute('data-institute-students') || '0');
          const totalCredits = parseInt(row.getAttribute('data-institute-credits') || '0');
          
          // Calculate credits
          const usedCredits = students; // Used credits = number of students
          const remainingCredits = totalCredits - usedCredits;
          
          // Update panel content
          const nameEl = document.getElementById('panel-institute-name');
          const emailEl = document.getElementById('panel-institute-email');
          const contactEl = document.getElementById('panel-institute-contact');
          const addressEl = document.getElementById('panel-institute-address');
          const adminEl = document.getElementById('panel-institute-admin');
          const studentsEl = document.getElementById('panel-institute-students');
          const totalCreditsEl = document.getElementById('panel-institute-total-credits');
          const usedCreditsEl = document.getElementById('panel-institute-used-credits');
          const remainingCreditsEl = document.getElementById('panel-institute-remaining-credits');
          
          if (nameEl) nameEl.textContent = name;
          if (emailEl) emailEl.textContent = email;
          if (contactEl) contactEl.textContent = contact;
          if (addressEl) addressEl.textContent = address;
          if (adminEl) adminEl.textContent = admin;
          if (studentsEl) studentsEl.textContent = students;
          if (totalCreditsEl) totalCreditsEl.textContent = totalCredits.toLocaleString();
          if (usedCreditsEl) usedCreditsEl.textContent = usedCredits.toLocaleString();
          if (remainingCreditsEl) remainingCreditsEl.textContent = remainingCredits.toLocaleString();
          
          var slug = row.getAttribute('data-institute-slug') || '';
          var studentsBase = (panel.getAttribute('data-ttv2-students-list-url') || '').trim();
          var stuLink = document.getElementById('panel-institute-students-link');
          if (stuLink) {
            if (slug && studentsBase) {
              var sep = studentsBase.indexOf('?') >= 0 ? '&' : '?';
              stuLink.href = studentsBase + sep + 'institute_slug=' + encodeURIComponent(slug);
              stuLink.classList.remove('disabled');
              stuLink.style.pointerEvents = '';
              stuLink.setAttribute('aria-disabled', 'false');
            } else {
              stuLink.href = '#';
              stuLink.classList.add('disabled');
              stuLink.style.pointerEvents = 'none';
              stuLink.setAttribute('aria-disabled', 'true');
            }
          }
          
          // Show panel
          panel.classList.add('show');
        }, 200); // Small delay to prevent flickering
      });
      
      row.addEventListener('mouseleave', function() {
        clearTimeout(hoverTimeout);
        // Don't hide immediately - wait a bit in case mouse moves to panel
        hoverTimeout = setTimeout(() => {
          // Check if mouse is over panel
          if (!panel.matches(':hover')) {
            panel.classList.remove('show');
          }
        }, 300);
      });
    });
    
    // Keep panel open when hovering over it (only add once)
    if (!panel.hasAttribute('data-hover-initialized')) {
      panel.setAttribute('data-hover-initialized', 'true');
      panel.addEventListener('mouseenter', function() {
        clearTimeout(hoverTimeout);
        clearTimeout(panelHoverTimeout);
      });
      
      panel.addEventListener('mouseleave', function() {
        clearTimeout(hoverTimeout);
        clearTimeout(panelHoverTimeout);
        panelHoverTimeout = setTimeout(() => {
          panel.classList.remove('show');
        }, 200);
      });
    }
  }
  
  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    initializeInstituteRowHover();
  });
</script>
