{% for skill in resumeskill %}
<div class="added-item d-flex align-items-start justify-content-between gap-2">
  <div class="flex-grow-1">
    <p class="fs-15 fw-semibold text-dark mb-1">{{ skill.title }}</p>
    <p class="fs-13 text-gray mb-0">{{ skill.get_profficiency_display() }}</p>
  </div>
  <div class="d-flex align-items-center gap-1 flex-shrink-0">
    <button type="button" class="btn btn-link p-1 text-secondary resume-edit-open" title="Edit"
            data-bs-toggle="modal" data-bs-target="#skillModal" data-edit-kind="skill" data-edit-id="{{ skill.id }}">
      <i class="bx bx-edit-alt fs-22"></i>
    </button>
    <button type="button" class="data-delete-btn" onclick="deleteResumeItem(this)"
            data-id="{{ skill.id }}" data-url="/api/v1/user/resume-skill" data-mdivid="skillm" data-ddivid="skilld">
      <i class="bx bx-x-circle fs-24"></i>
    </button>
  </div>
</div>
{% endfor %}
