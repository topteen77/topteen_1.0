{% for a in resumeactivity %}
<div class="added-item d-flex align-items-start justify-content-between gap-2">
  <div class="flex-grow-1">
    <p class="fs-15 fw-semibold text-dark mb-1">{{ a.title }}</p>
    {% if a.issue_date %}
    <p class="fs-13 text-gray mb-0">{{ date_format(a.issue_date) }}</p>
    {% endif %}
  </div>
  <div class="d-flex align-items-center gap-1 flex-shrink-0">
    <button type="button" class="btn btn-link p-1 text-secondary resume-edit-open" title="Edit"
            data-bs-toggle="modal" data-bs-target="#activityModal" data-edit-kind="activity" data-edit-id="{{ a.id }}">
      <i class="bx bx-edit-alt fs-22"></i>
    </button>
    <button type="button" class="data-delete-btn" onclick="deleteResumeItem(this)"
            data-id="{{ a.id }}" data-url="/api/v1/user/resume-activity" data-mdivid="activitym" data-ddivid="activityd">
      <i class="bx bx-x-circle fs-24"></i>
    </button>
  </div>
</div>
{% endfor %}
