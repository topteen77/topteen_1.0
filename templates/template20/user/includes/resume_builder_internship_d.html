{% for i in resumeinternship %}
<div class="added-item d-flex align-items-start justify-content-between gap-2">
  <div class="flex-grow-1">
    <p class="fs-15 fw-semibold text-dark mb-1">{{ i.role }}</p>
    <p class="fs-13 text-gray mb-0">
      {{ i.provider }} •
      {% if i.start_date %}{{ date_format(i.start_date) }}{% endif %}
      {% if i.end_date %} - {{ date_format(i.end_date) }}{% endif %}
    </p>
  </div>
  <div class="d-flex align-items-center gap-1 flex-shrink-0">
    <button type="button" class="btn btn-link p-1 text-secondary resume-edit-open" title="Edit"
            data-bs-toggle="modal" data-bs-target="#internshipModal" data-edit-kind="internship" data-edit-id="{{ i.id }}">
      <i class="bx bx-edit-alt fs-22"></i>
    </button>
    <button type="button" class="data-delete-btn" onclick="deleteResumeItem(this)"
            data-id="{{ i.id }}" data-url="/api/v1/user/resume-internship" data-mdivid="internshipm" data-ddivid="internshipd">
      <i class="bx bx-x-circle fs-24"></i>
    </button>
  </div>
</div>
{% endfor %}
