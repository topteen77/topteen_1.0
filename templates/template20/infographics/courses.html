{% if infographics.courses %}
<!-- Courses & Specializations Infographic - Mobile Optimized -->
<div class="courses-infographic-container" style="margin: 1rem 0; padding: 0; background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); overflow: hidden;">
  
  <!-- Compact Header -->
  <div style="background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); padding: 1rem 1rem; text-align: center; color: white;">
    <div style="font-size: 24px; margin-bottom: 0.25rem;">📚</div>
    <div style="font-size: 18px; font-weight: 700; margin-bottom: 0.25rem;">{{ career.name }}</div>
    <div style="font-size: 13px; opacity: 0.95;">Courses & Specializations</div>
  </div>
  
  <!-- Compact Grid -->
  <div class="courses-grid" style="padding: 1rem 0.75rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; max-height: 500px; overflow-y: auto;">
    {% for course in infographics.courses %}
    <div class="course-card" style="background: white; border-radius: 10px; padding: 0.75rem; box-shadow: 0 2px 8px rgba(255, 152, 0, 0.12); border-left: 3px solid #ff9800; display: flex; align-items: flex-start; gap: 0.5rem;">
      
      <!-- Small Icon -->
      <div style="flex-shrink: 0; width: 28px; height: 28px; background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 14px;">📖</span>
      </div>
      
      <!-- Compact Course Name -->
      <div style="font-size: 11px; font-weight: 600; color: #e65100; line-height: 1.4; flex: 1;">
        {{ course.name }}
      </div>
      
    </div>
    {% endfor %}
  </div>
  
  <!-- Thin Footer -->
  <div style="height: 3px; background: linear-gradient(90deg, #ff9800 0%, #f57c00 100%);"></div>
  
</div>

<style>
.courses-infographic-container {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  max-width: 100%;
  overflow-x: hidden;
}

.courses-grid {
  scrollbar-width: thin;
  scrollbar-color: #ff9800 #fff3e0;
}

.courses-grid::-webkit-scrollbar {
  width: 4px;
}

.courses-grid::-webkit-scrollbar-track {
  background: #fff3e0;
  border-radius: 2px;
}

.courses-grid::-webkit-scrollbar-thumb {
  background: #ff9800;
  border-radius: 2px;
}

.course-card:active {
  transform: scale(0.98);
  transition: transform 0.1s ease;
}

@media (max-width: 480px) {
  .courses-grid {
    grid-template-columns: 1fr !important;
    padding: 0.75rem 0.5rem !important;
    gap: 0.5rem !important;
    max-height: 400px !important;
  }
  
  .course-card {
    padding: 0.75rem !important;
  }
  
  .course-card > div:last-child {
    font-size: 10px !important;
  }
}

@media (min-width: 481px) and (max-width: 768px) {
  .courses-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 0.75rem !important;
    max-height: 450px !important;
  }
}

@media (min-width: 769px) {
  .courses-grid {
    grid-template-columns: repeat(3, 1fr) !important;
    max-width: 100%;
  }
}
</style>
{% endif %}
