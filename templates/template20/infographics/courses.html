{% if infographics.courses %}
<!-- Courses & Specializations Infographic -->
<div class="infographic-container courses-infographic-container" style="margin: 2rem 0; padding: 2rem; background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);">
  <div class="courses-infographic">
    <div class="infographic-title">Courses & Specializations to Enter the Field</div>
    <div class="courses-grid">
      {% for course in infographics.courses %}
      <div class="course-card">
        <div class="course-icon">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <rect x="6" y="8" width="24" height="20" rx="2" fill="#ff9800" opacity="0.2"/>
            <path d="M12 14 L18 18 L24 14" stroke="#ff9800" stroke-width="2" fill="none"/>
            <line x1="12" y1="22" x2="24" y2="22" stroke="#ff9800" stroke-width="2"/>
          </svg>
        </div>
        <div class="course-name">{{ course.name }}</div>
        {% if course.description %}
        <div class="course-description">{{ course.description }}</div>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </div>
</div>

<style>
.courses-infographic {
  position: relative;
}

.courses-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
}

.course-card {
  background: white;
  border-radius: 10px;
  padding: 18px;
  box-shadow: 0 2px 10px rgba(255, 152, 0, 0.15);
  border-left: 3px solid #ff9800;
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.course-card:hover {
  transform: translateX(4px);
  box-shadow: 0 4px 16px rgba(255, 152, 0, 0.25);
}

.course-icon {
  flex-shrink: 0;
}

.course-name {
  font-size: 15px;
  font-weight: 600;
  color: #e65100;
  line-height: 1.4;
}

.course-description {
  font-size: 13px;
  color: #666;
  margin-top: 4px;
}

@media (max-width: 768px) {
  .courses-grid {
    grid-template-columns: 1fr;
  }
}
</style>
{% endif %}
