{% if infographics.roles_responsibilities %}
<!-- Roles and Responsibilities - Circular/Radial Design -->
<div class="roles-radial-container" style="margin: 2rem 0; padding: 3rem 2rem; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); position: relative; overflow: hidden;">
  
  <!-- Background Decoration -->
  <div style="position: absolute; top: -50px; right: -50px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%); border-radius: 50%;"></div>
  <div style="position: absolute; bottom: -80px; left: -80px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(118, 75, 162, 0.1) 0%, transparent 70%); border-radius: 50%;"></div>
  
  <!-- Header -->
  <div style="text-align: center; margin-bottom: 3rem; position: relative; z-index: 1;">
    <h2 style="font-size: 36px; font-weight: 800; color: #2d3748; margin-bottom: 0.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
      {{ career.name }}
    </h2>
    <p style="font-size: 18px; color: #718096; font-weight: 500;">Roles and Responsibilities</p>
  </div>
  
  <!-- Circular Role Cards -->
  <div class="roles-circular-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; position: relative; z-index: 1;">
    
    {% for role in infographics.roles_responsibilities %}
    <div class="role-circular-card" style="background: white; border-radius: 24px; padding: 2rem; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden;">
      
      <!-- Card Gradient Border -->
      <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);"></div>
      
      <!-- Role Icon Circle -->
      <div style="width: 80px; height: 80px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3); position: relative;">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="white" stroke-width="2" fill="none" opacity="0.3"/>
          <path d="M20 10 L25 15 L20 20 L15 15 Z" fill="white"/>
          <path d="M20 20 L25 25 L20 30 L15 25 Z" fill="white"/>
        </svg>
        <!-- Pulse Ring -->
        <div style="position: absolute; width: 80px; height: 80px; border: 2px solid rgba(102, 126, 234, 0.3); border-radius: 50%; animation: ripple 2s infinite;"></div>
      </div>
      
      <!-- Role Title -->
      <h3 style="font-size: 22px; font-weight: 700; color: #2d3748; text-align: center; margin-bottom: 1.5rem; line-height: 1.3;">
        {{ role.name }}
      </h3>
      
      <!-- Responsibilities List -->
      {% if role.responsibilities %}
      <div class="responsibilities-list" style="space-y: 0.75rem;">
        {% for resp in role.responsibilities %}
        <div class="resp-item" style="display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.875rem; background: linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%); border-radius: 12px; margin-bottom: 0.75rem; transition: all 0.2s ease; border: 1px solid rgba(102, 126, 234, 0.1);">
          <!-- Bullet Point -->
          <div style="flex-shrink: 0; width: 6px; height: 6px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; margin-top: 8px;"></div>
          <!-- Text -->
          <div style="flex: 1; font-size: 14px; line-height: 1.6; color: #4a5568; font-weight: 400;">
            {{ resp }}
          </div>
        </div>
        {% endfor %}
      </div>
      {% endif %}
      
    </div>
    {% endfor %}
    
  </div>
  
</div>

<style>
.roles-radial-container {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

.role-circular-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 16px 40px rgba(102, 126, 234, 0.2);
}

.resp-item:hover {
  transform: translateX(4px);
  border-color: rgba(102, 126, 234, 0.3);
  background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
}

@keyframes ripple {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  100% {
    transform: scale(1.3);
    opacity: 0;
  }
}

@media (max-width: 768px) {
  .roles-circular-grid {
    grid-template-columns: 1fr !important;
    gap: 1.5rem !important;
  }
  
  .roles-radial-container {
    padding: 2rem 1rem !important;
  }
  
  h2 {
    font-size: 28px !important;
  }
  
  .role-circular-card {
    padding: 1.5rem !important;
  }
}

@media (max-width: 480px) {
  .role-circular-card {
    padding: 1.25rem !important;
  }
  
  .resp-item {
    padding: 0.75rem !important;
  }
}
</style>

<script>
// Stagger animation on load
document.addEventListener('DOMContentLoaded', function() {
  const cards = document.querySelectorAll('.role-circular-card');
  
  cards.forEach((card, index) => {
    card.style.opacity = '0';
    card.style.transform = 'translateY(30px)';
    card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    
    setTimeout(() => {
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    }, index * 150);
  });
});
</script>
{% endif %}
