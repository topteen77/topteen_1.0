{% if infographics.internships %}
<!-- Internships & Practical Exposure Infographic - Timeline Design -->
<div class="internships-infographic-container" style="margin: 1rem 0; padding: 0; background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%); border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); overflow: hidden;">
  
  <!-- Header -->
  <div class="internships-header" style="background: linear-gradient(135deg, #4db6ac 0%, #26a69a 100%); padding: 1.25rem 1rem; text-align: center; color: white;">
    <div style="font-size: 24px; margin-bottom: 0.25rem;">💼</div>
    <div style="font-size: 18px; font-weight: 700; margin-bottom: 0.25rem;">{{ career.name }}</div>
    <div style="font-size: 13px; opacity: 0.95; font-weight: 400;">Internships & Practical Experience</div>
  </div>

  <!-- Timeline Layout -->
  <div class="internships-timeline-wrapper" style="padding: 1.5rem 1rem; position: relative; max-height: 600px; overflow-y: auto;">
    
    {% for internship in infographics.internships %}
    <div class="internship-timeline-item" style="position: relative; margin-bottom: 1.5rem; padding-left: 50px;">
      
      <!-- Timeline Line -->
      {% if not loop.last %}
      <div class="timeline-line" style="position: absolute; left: 20px; top: 40px; width: 3px; height: calc(100% + 0.5rem); background: linear-gradient(180deg, #4db6ac 0%, #26a69a 100%); border-radius: 2px; z-index: 1;"></div>
      {% endif %}
      
      <!-- Timeline Icon -->
      <div class="timeline-icon" style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: linear-gradient(135deg, #4db6ac 0%, #26a69a 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(77, 182, 172, 0.4); z-index: 2; border: 3px solid white;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="2.5">
          <rect x="3" y="4" width="14" height="12" rx="2"/>
          <path d="M3 8 L10 12 L17 8"/>
        </svg>
      </div>
      
      <!-- Internship Card -->
      <div class="internship-card" style="background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(77, 182, 172, 0.15); border-left: 4px solid #4db6ac; position: relative; transition: all 0.3s ease;">
        
        <!-- Step Number Badge -->
        <div style="position: absolute; top: -12px; right: 12px; width: 32px; height: 32px; background: linear-gradient(135deg, #4db6ac 0%, #26a69a 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 700; box-shadow: 0 2px 8px rgba(77, 182, 172, 0.3); border: 2px solid white;">
          {{ loop.index }}
        </div>
        
        <!-- Internship Content -->
        <div style="font-size: 12px; line-height: 1.6; color: #333; padding-right: 0.5rem;">
          {{ internship.description }}
        </div>
        
      </div>
      
    </div>
    {% endfor %}
    
  </div>
  
  <!-- Footer -->
  <div style="height: 3px; background: linear-gradient(90deg, #4db6ac 0%, #26a69a 100%);"></div>
  
</div>

<style>
.internships-infographic-container {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  max-width: 100%;
  overflow-x: hidden;
}

.internship-card {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.internship-card:hover {
  transform: translateX(5px);
  box-shadow: 0 4px 12px rgba(77, 182, 172, 0.25);
}

.internships-timeline-wrapper {
  scrollbar-width: thin;
  scrollbar-color: #4db6ac #e0f7fa;
}

.internships-timeline-wrapper::-webkit-scrollbar {
  width: 6px;
}

.internships-timeline-wrapper::-webkit-scrollbar-track {
  background: #e0f7fa;
  border-radius: 3px;
}

.internships-timeline-wrapper::-webkit-scrollbar-thumb {
  background: #4db6ac;
  border-radius: 3px;
}

@media (max-width: 480px) {
  .internships-timeline-wrapper {
    padding: 1rem 0.75rem !important;
    max-height: 500px !important;
  }
  
  .internship-timeline-item {
    padding-left: 40px !important;
    margin-bottom: 1.25rem !important;
  }
  
  .timeline-icon {
    width: 32px !important;
    height: 32px !important;
  }
  
  .timeline-icon svg {
    width: 16px !important;
    height: 16px !important;
  }
  
  .timeline-line {
    left: 15px !important;
    top: 32px !important;
    width: 2px !important;
  }
  
  .internships-header {
    padding: 1rem 0.75rem !important;
  }
  
  .internships-header div:nth-child(2) {
    font-size: 16px !important;
  }
  
  .internships-header div:nth-child(3) {
    font-size: 12px !important;
  }
  
  .internship-card {
    padding: 0.875rem !important;
  }
  
  .internship-card > div:last-child {
    font-size: 11px !important;
    line-height: 1.5 !important;
  }
  
  .internship-card > div:first-child {
    width: 28px !important;
    height: 28px !important;
    font-size: 12px !important;
    top: -10px !important;
    right: 10px !important;
  }
}

@media (min-width: 481px) and (max-width: 768px) {
  .internships-timeline-wrapper {
    padding: 1.25rem 0.875rem !important;
    max-height: 550px !important;
  }
  
  .internship-timeline-item {
    padding-left: 45px !important;
  }
}
</style>
{% endif %}
