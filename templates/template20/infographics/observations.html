{% if infographics.observations %}
<!-- Significant Observations Infographic - Alternating Card Design -->
<div class="observations-infographic-container" style="margin: 1rem 0; padding: 0; background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%); border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); overflow: hidden;">
  
  <!-- Header -->
  <div style="background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%); padding: 1.25rem 1rem; text-align: center; color: white;">
    <div style="font-size: 24px; margin-bottom: 0.25rem;">💡</div>
    <div style="font-size: 18px; font-weight: 700; margin-bottom: 0.25rem;">{{ career.name }}</div>
    <div style="font-size: 13px; opacity: 0.95;">Academic Related Points</div>
  </div>
  
  <!-- Alternating Cards Layout -->
  <div class="observations-alternating-wrapper" style="padding: 1.5rem 1rem; max-height: 600px; overflow-y: auto;">
    
    {% for obs in infographics.observations %}
    <div class="observation-alternating-item" style="position: relative; margin-bottom: 1.5rem; display: flex; align-items: flex-start; gap: 1rem; {% if loop.index % 2 == 0 %}flex-direction: row-reverse;{% endif %}">
      
      <!-- Number Badge (Left/Right based on index) -->
      <div class="observation-number-badge" style="flex-shrink: 0; width: 50px; height: 50px; background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: 700; box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3); position: relative;">
        {{ loop.index }}
        <!-- Decorative corner -->
        <div style="position: absolute; top: -3px; right: -3px; width: 16px; height: 16px; background: #2e7d32; border-radius: 0 12px 0 8px;"></div>
      </div>
      
      <!-- Observation Card -->
      <div class="observation-card-alt" style="flex: 1; background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(76, 175, 80, 0.15); position: relative; {% if loop.index % 2 == 0 %}border-right: 4px solid #4caf50;{% else %}border-left: 4px solid #4caf50;{% endif %} transition: all 0.3s ease;">
        
        <!-- Title -->
        <div style="font-size: 13px; font-weight: 700; color: #2e7d32; margin-bottom: 0.5rem; line-height: 1.4;">
          {{ obs.title }}
        </div>
        
        <!-- Description -->
        {% if obs.description %}
        <div style="font-size: 11px; color: #555; line-height: 1.5;">
          {{ obs.description }}
        </div>
        {% endif %}
        
        <!-- Decorative Icon -->
        <div style="position: absolute; {% if loop.index % 2 == 0 %}left: 8px;{% else %}right: 8px;{% endif %} bottom: 8px; opacity: 0.1;">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" stroke="#4caf50" stroke-width="2"/>
            <path d="M20 10 L25 15 L20 20 L15 15 Z" fill="#4caf50"/>
          </svg>
        </div>
        
      </div>
      
    </div>
    {% endfor %}
    
  </div>
  
  <!-- Footer -->
  <div style="height: 3px; background: linear-gradient(90deg, #4caf50 0%, #2e7d32 100%);"></div>
  
</div>

<style>
.observations-infographic-container {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  max-width: 100%;
  overflow-x: hidden;
}

.observation-card-alt {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.observation-card-alt:hover {
  transform: translateY(-3px);
  box-shadow: 0 4px 12px rgba(76, 175, 80, 0.25);
}

.observation-number-badge {
  transition: transform 0.2s ease;
}

.observation-alternating-item:hover .observation-number-badge {
  transform: scale(1.1) rotate(5deg);
}

.observations-alternating-wrapper {
  scrollbar-width: thin;
  scrollbar-color: #4caf50 #e8f5e9;
}

.observations-alternating-wrapper::-webkit-scrollbar {
  width: 6px;
}

.observations-alternating-wrapper::-webkit-scrollbar-track {
  background: #e8f5e9;
  border-radius: 3px;
}

.observations-alternating-wrapper::-webkit-scrollbar-thumb {
  background: #4caf50;
  border-radius: 3px;
}

@media (max-width: 480px) {
  .observations-alternating-wrapper {
    padding: 1rem 0.75rem !important;
    max-height: 500px !important;
  }
  
  .observation-alternating-item {
    flex-direction: column !important;
    gap: 0.75rem !important;
    margin-bottom: 1.25rem !important;
  }
  
  .observation-number-badge {
    width: 40px !important;
    height: 40px !important;
    font-size: 18px !important;
    align-self: flex-start !important;
  }
  
  .observation-card-alt {
    border-left: 4px solid #4caf50 !important;
    border-right: none !important;
    padding: 0.875rem !important;
  }
  
  .observation-card-alt > div:first-child {
    font-size: 12px !important;
  }
  
  .observation-card-alt > div:last-child {
    font-size: 10px !important;
  }
}

@media (min-width: 481px) and (max-width: 768px) {
  .observations-alternating-wrapper {
    padding: 1.25rem 0.875rem !important;
    max-height: 550px !important;
  }
  
  .observation-alternating-item {
    gap: 0.875rem !important;
  }
  
  .observation-number-badge {
    width: 45px !important;
    height: 45px !important;
    font-size: 19px !important;
  }
}
</style>
{% endif %}
