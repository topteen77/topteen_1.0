<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume</title>
  <link rel="stylesheet" href="{{ studio_resume_css_url }}">
  <style>
    {{ studio_root_style|safe }}
    @page { size: A4 portrait; margin: 0; }
    body { margin: 0; background: #fff; font-family: var(--font-stack, "Inter", system-ui, sans-serif); }
    .pdf-wrap {
      width: 210mm;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0;
      box-sizing: border-box;
      overflow: visible;
    }
    .preview-wrap { background: #fff; overflow: visible; }
    article#resume.resume {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    article#resume.resume .resume__mount {
      width: 100%;
      min-height: auto;
      zoom: 1 !important;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="pdf-wrap">
    <main class="preview-wrap">
      <article class="resume" id="resume" data-template="{{ studio_template_id }}">
        <div id="resumeMount" class="resume__mount">
          {{ studio_mount_html|safe }}
        </div>
      </article>
    </main>
  </div>
</body>
</html>
