<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume</title>
  <style>
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 24px 32px; color: #1a1a2e; background: #fff; }
    .pdf-wrap { max-width: 820px; margin: 0 auto; }
    .rv-name { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 700; color: #07090f; margin-bottom: 4px; }
    .rv-tag { font-size: 12px; color: #4a5a6e; margin-bottom: 8px; }
    .rv-con { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: #4a5a6e; padding-bottom: 12px; border-bottom: 2px solid #07090f; margin-bottom: 18px; }
    .rv-con a { color: #3f37c9; text-decoration: none; }
    .rv-sec { margin-bottom: 16px; }
    .rv-sh { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #07090f; padding-bottom: 4px; border-bottom: 1px solid #ddd; margin-bottom: 8px; }
    .rv-it { margin-bottom: 10px; }
    .rv-ith { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .rv-itn { font-size: 13px; font-weight: 600; color: #1a1a2e; }
    .rv-itd { font-size: 11px; color: #888; white-space: nowrap; }
    .rv-ito { font-size: 12px; color: #5a6a80; font-style: italic; margin-bottom: 4px; }
    .rv-bul { list-style: none; padding: 0; margin: 0; }
    .rv-bul li { font-size: 12px; color: #2a2a3a; padding: 2px 0 2px 14px; position: relative; line-height: 1.55; }
    .rv-bul li::before { content: '▸'; position: absolute; left: 0; color: #07090f; font-size: 9px; top: 4px; }
    .rv-sum { font-size: 13px; color: #2a2a3a; line-height: 1.65; background: #f4f6fc; border-left: 3px solid #07090f; padding: 10px 12px; border-radius: 0 5px 5px 0; }
    .rv-skw { display: flex; flex-wrap: wrap; gap: 5px; }
    .rv-sk { padding: 3px 8px; background: #eef0f8; border-radius: 4px; font-size: 11px; color: #243060; font-weight: 500; }
  </style>
</head>
<body>
  <div class="pdf-wrap">
    {{ generated_resume_html|safe }}
  </div>
</body>
</html>
