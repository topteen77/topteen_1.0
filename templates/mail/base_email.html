<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>TopTeen</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#eef2f7;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#eef2f7;">
    {{ preheader }}
  </div>

  <table data-topteen-email-layout="1" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;background-color:#eef2f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;max-width:640px;width:100%;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding:0;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#312e81 0%,#4f46e5 45%,#009EF7 100%);">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                <tr>
                  <td align="center" style="padding:28px 24px 18px;">
                    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;margin:0 auto;">
                      <tr>
                        <td align="center" style="padding:16px 30px;background-color:#ffffff;border-radius:14px;border:1px solid #e5e7eb;">
                          <a href="{{ site_url }}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;line-height:0;">
                            <img src="{{ logo_url }}" width="168" alt="TopTeen" style="display:block;border:0;outline:none;text-decoration:none;height:auto;max-width:168px;width:100%;margin:0 auto;" />
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 24px 24px;">
                    <p style="margin:0;font-size:13px;line-height:1.5;color:#e0e7ff;letter-spacing:0.4px;text-transform:uppercase;font-weight:600;">
                      Empowering Students to Discover Their Best Careers
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td align="left" style="padding:0;background-color:#ffffff;border-left:1px solid #e5e7eb;border-right:1px solid #e5e7eb;">
              <div style="padding:32px 28px;color:#1f2937;font-size:15px;line-height:1.65;">
                {{ email_body|safe }}
                <p style="margin:24px 0 0;font-size:15px;line-height:1.65;color:#1f2937;font-weight:600;">
                  Kind regards,<br>The TOPTEEN Team
                </p>
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:0;border-radius:0 0 12px 12px;background-color:#111827;border:1px solid #111827;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                <tr>
                  <td align="center" style="padding:24px 28px 10px;">
                    <p style="margin:0 0 14px;font-size:13px;line-height:1.6;color:#9ca3af;">
                      Need help? Email us at
                      <a href="mailto:{{ support_email }}" style="color:#60a5fa;text-decoration:none;">{{ support_email }}</a>
                    </p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 28px 18px;">
                    <p style="margin:0;font-size:12px;line-height:1.7;color:#9ca3af;">
                      <a href="{{ site_url }}" target="_blank" rel="noopener" style="color:#d1d5db;text-decoration:none;font-weight:600;">{{ site_url }}</a>
                    </p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 28px 24px;border-top:1px solid #374151;">
                    <p style="margin:0 0 8px;font-size:12px;line-height:1.6;color:#9ca3af;">
                      Copyright &copy; {{ year }} TopTeen. All rights reserved.
                    </p>
                    <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;">
                      <a href="{{ site_url }}/privacy-policy/" target="_blank" rel="noopener" style="color:#9ca3af;text-decoration:underline;">Privacy Policy</a>
                      &nbsp;&middot;&nbsp;
                      <a href="{{ site_url }}/terms-and-condition/" target="_blank" rel="noopener" style="color:#9ca3af;text-decoration:underline;">Terms of Service</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
