<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>TopTeen</title>
</head>
<body style="margin:0;padding:0;background-color:#edf2f7;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
  <span style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{ preheader }}</span>
  <table data-topteen-email-layout="1" align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;margin:0 auto;padding:0;max-width:600px;background-color:#edf2f7;">
    <tbody>
      <tr>
        <td align="center" style="text-align:center;padding:32px 20px 24px;">
          <a href="{{ site_url }}" rel="noopener" target="_blank" style="text-decoration:none;">
            <img alt="TopTeen" src="{{ logo_url }}" style="height:auto;max-width:220px;width:100%;border:0;display:block;margin:0 auto;" />
          </a>
        </td>
      </tr>
      <tr>
        <td align="left" style="padding:0 20px 24px;">
          <div style="text-align:left;padding:32px;background-color:#ffffff;border-radius:8px;color:#2F3044;font-size:15px;line-height:1.5;">
            {{ email_body|safe }}
          </div>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:0 20px 32px;text-align:center;font-size:13px;color:#6d6e7c;line-height:1.6;">
          <p style="margin:0 0 8px;">Kind regards,<br><strong>The TOPTEEN Team</strong></p>
          <p style="margin:0 0 8px;">Copyright &copy; {{ year }}
            <a href="{{ site_url }}" rel="noopener" target="_blank" style="color:#009EF7;text-decoration:none;">TOPTEEN</a>
          </p>
          <p style="margin:0;">
            <a href="{{ site_url }}/privacy-policy/" rel="noopener" target="_blank" style="color:#6d6e7c;text-decoration:underline;">Privacy Policy</a>
            &nbsp;|&nbsp;
            <a href="{{ site_url }}/terms-and-conditions/" rel="noopener" target="_blank" style="color:#6d6e7c;text-decoration:underline;">Terms of Service</a>
          </p>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
