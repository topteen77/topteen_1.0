<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/customCSS.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <title>Notes Adding</title>
</head>
<body>

    <main class="lg:max-w-[1280px] mx-auto pt-[12px] lg:pt-[60px] ">

        <!-- Notes Heading -->
        <section class="lg:hidden">
            <div
                class="py-[24px] border-b-[2px] border-solid border-[#ebebee] relative px-[20px] lg:px-[100px] ">
                <button class="absolute top-[15px] left-[24px]">
                    <i class="fa-solid fa-arrow-left text-[#828282] text-[18px] leading-[50px]"></i>
                </button>
            </div>

        </section>
        <!-- End of Notes Heading -->

        <!-- Content -->
        <section class="pt-[24px] px-[24px] lg:px-[100px] notesContent">
            <img src="../assets/images/folders.svg" class="w-[36px] h-[51px] lg:w-[48px] lg:h-[68px]" alt="">
            <input type="text" class="block text-[24px] leading-[32px] semibold px-0 border-none notesdAdding" placeholder="Untitled" >
            <textarea placeholder="Tap here to continue..." name="" id="" class="px-0 notesAdding border-none mt-[12px]"></textarea>
        </section>

        <!-- Content -->


    </main>
    
</body>
</html>
