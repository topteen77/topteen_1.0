<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/customCSS.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.1/index.global.min.js"></script>
    <title>Document</title>
  </head>

  <body class="h-[100vh] w-full">

    <main>

      
     <div class="eventAddPop hidden">
      <div class="relative w-full h-full">
        <div class="eventAddPopContent shadow-xl rounded-[10px]">
          <div
            class="w-full h-full relative flex flex-col gap-[20px] items-center"
          >
            <button class="absolute right-[15px] top-[10px] eventAddCloseBtn">
              <i class="fa fa-xmark"></i>
            </button>

            <input
              type="text"
              placeholder="Enter event id"
              class="eventId mx-auto"
            />
            <input
              type="text"
              placeholder="Enter event name"
              class="eventName mx-auto"
            />

            <!-- <select class="allDaySelect">
              <option value="true">Full Day</option>
              <option value="false">Not full day</option>
            </select> -->

            <input type="date" value="" class="startDateIp dateIp" />
            <input type="date" value="" class="endDateIp dateIp" />


            <button
              type="button"
              class="submitBtn mx-auto w-full h-[53px] rounded-[10px] bg-[#2e289d] relative mt-[15px]"
            >
              <div
                class="w-full h-[48px] rounded-[10px] bg-[#3f37c9] absolute top-0 flex justify-center items-center"
              >
                <p class="text-[14px] leading-[18.9px] boldFont text-[#ffffff]">
                  Submit
                </p>
              </div>
            </button>

          </div>
        </div>
      </div>
    </div> 

  <div class="eventDelPop hidden">
      <div class="h-full w-full relative">
          <div class="eventDelPopContent  absolute bg-[#ffffff] rounded-xl py-[26px] px-[20px] inline-block mx-auto">
              <p class="deleteQuestn text-[16px] leading-[21px] mediumFont text-[#828282]">Are you sure you want to delete this?</p>
              <div class="flex mt-[24px] gap-[30px] justify-end">
                  <button type="button" class="noEvtDelBtn inline-block boldFont text-[#3f37c9] text-[16px]">
                      No
                  </button>
                  <button type="button" class="yesEvtDelBtn inline-block boldFont text-[#3f37c9] text-[16px]">
                      Yes
                  </button>
              </div>
          </div>
      </div>
  </div>

    <div
      id="calendar"
      class="lg:px-[100px] lg:py-[50px] lg:max-w-[1280px] mx-auto mt-10"
    ></div>

  <div></div>

    </main>


    <script>

      let data = [
        {
          id: "event 1",
          title: "event 1",
          start: "2023-02-03",
          end: "2023-02-05",
        },
        {
          id: "cooking",
          title: "Cooking",
          start: "2023-02-14",
          end: "2023-02-16",
        },
        {
          id: "running",
          title: "Running",
          start: "2023-02-21",
          end: "2023-02-23",
        },
      ];

      const eventAddPop = document.querySelector(".eventAddPop");
      const eventDelPop = document.querySelector(".eventDelPop");
      const startDate = document.querySelector(".startDateIp");
      const endDate = document.querySelector(".endDateIp");
      const name = document.querySelector(".eventName");
      const eventId = document.querySelector(".eventId");
      const submitBtn = document.querySelector(".submitBtn");
      const eventAddClose = document.querySelector(".eventAddCloseBtn");
      const noDelBtn = document.querySelector(".noEvtDelBtn");
      const yesDelBtn = document.querySelector(".yesEvtDelBtn");
      const allDaySelect = document.querySelector(".allDaySelect");
      const dateIps = document.querySelectorAll(".dateIp");

      console.log(eventDelPop)

      eventAddClose.addEventListener("click", function () {
        eventAddPop.classList.add("hidden");
      });

      document.addEventListener("DOMContentLoaded", function () {
        var calendarEl = document.getElementById("calendar");
        var calendar = new FullCalendar.Calendar(calendarEl, {
          headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,timeGridWeek,timeGridDay",
          },
          eventSources: [
            data,
            {
              events: [],
            },
          ],  
          eventColor: "#3f37c9",
          displayEventTime: true,
          dateClick: function (info) {
            const todayPrev = new Date();
            const today = todayPrev.getFullYear() + '-' + ((todayPrev.getMonth() < 9? '0': '') + (todayPrev.getMonth()+1)) + '-' + ((todayPrev.getDate() < 9? '0': '') + (todayPrev.getDate()));
            console.log(today)
            console.log(info.dateStr)
            if(info.dateStr < today){
              alert("You can't select previous dates")
            }else{
              eventAddPop.classList.remove("hidden");
            }

            startDate.value = info.dateStr;

            
          },
          eventClick: function (el) {

            const parameter = el.event.id;
            eventDelPop.classList.remove("hidden");
            customEventClick(parameter);

          },
          initialView: "dayGridMonth",
        });
        calendar.render();

        // Event Adding
        submitBtn.addEventListener("click", function () {
          const dummyOb = {
            id: eventId.value,
            title: name.value,
            start: startDate.value,
            end: endDate.value,
          };

          calendar.addEvent(dummyOb);
          data = calendar.getEvents();
          console.log(data);
          eventAddPop.classList.add("hidden");
        });

        // Event Deleting

        function customEventClick(elem){

          noDelBtn.addEventListener("click", function(){
            eventDelPop.classList.add("hidden");
            })

            yesDelBtn.addEventListener("click", function(){
            const toDel = calendar.getEventById(elem);
              toDel.remove();
              data = calendar.getEvents();
              console.log(data);
              eventDelPop.classList.add("hidden")
            })
        }

        
      // allDaySelect.addEventListener("change", function(){
      //     dateIps.forEach(elem => {
      //       elem.type = "datetime-local";
      //     })
      //   })
      });
    </script>
  </body>
</html>
