<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup/Basic details</title>
    <Link href='../assets/css/customCSS.css' rel='stylesheet' />
    <Link href='../layouts/css/styles.css' rel='stylesheet' />
</head>

<body>
    <div class='w-full h-full'>
        <!-- header -->
        <header class='flex justify-between items-center mt-[27px] lg:mt-[35px]  '>
            <img class='h-[15px] w-[15px] ml-[20px] lg:ml-[100px] ' src='../assets/images/arrow.left.png' />
            <div class=' justify-center space-x-1 items-center mr-[0px] lg:mr-[120px] flex'>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full'></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full '></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full opacity-20'></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full opacity-20'></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full opacity-20'></div>
            </div>
            <!-- <h2 class='text-[#494949] font-bold lg:hidden flex'>LOG IN</h2> -->
            <p class='text-white'>1</p>
        </header>
        <!-- second line -->
        <div class='flex justify-center items-center font-semibold text-[24px] mt-[20px] lg:mt-[30px]'>
            <P>Tell us more about yourself</P>
        </div>
        <!-- third line -->
        <div class='flex justify-center items-center font-normal text-center text-[16px] mt-[10px]'>
            <P class=' w-[344px] h-[44px] text-[#494949]'>Lets’s get the essentials out of the way</P>
        </div>

        <!--form starts-->
        <!-- full name line -->
        <div class='w-full flex justify-center relative items-center mt-[10px] lg:mt-[5px] '>
            <img class='absolute left-[25px] lg:left-[525px] ' src='../assets/images/signature.png'/>
            <input   class='w-[344px] h-[48px] bg-[#F7F7FA] pl-12 rounded-xl text-gray-600  font-bold border-[1.5px] border-[#DCDCDC]' placeholder='Full name'  />
        </div>

        <!-- Date of Birth and Gender -->
        <div class='w-full flex justify-center relative items-center space-x-4 mt-[10px] lg:mt-[10px] '>
            <div>
                <img class='absolute left-[25px] lg:left-[525px] top-4 ' src='../assets/images/calender1.png'/>
                <input   class='w-[164px] h-[48px] bg-[#F7F7FA] pl-10 rounded-xl text-gray-600  font-bold border-[1.5px] border-[#DCDCDC]' placeholder='Date of Birth'  />
            </div>

            <div>
                <img class='absolute left-[210px] lg:left-[705px] top-4 ' src='../assets/images/person.fill.png'/>
                <input   class='w-[164px] h-[48px] bg-[#F7F7FA] pl-10 rounded-xl text-gray-600  font-bold border-[1.5px] border-[#DCDCDC]' placeholder='Gender '  />
            </div>

        </div>

        <!-- phone number line -->
        <div class='w-full flex justify-center relative items-center mt-[10px] lg:mt-[10px] '>
            <img class='absolute left-[25px] lg:left-[525px] ' src='../assets/images/phone.fill.png'/>
            <input   class='w-[344px] h-[48px] bg-[#F7F7FA] pl-12 rounded-xl text-gray-600 font-bold border-[1.5px] border-[#DCDCDC]' placeholder='Phone number'  />
        </div>

         <!-- email address line -->
         <div class='w-full flex justify-center relative items-center mt-[10px] lg:mt-[10px]'>
            <img class='absolute left-[25px] lg:left-[525px] ' src='../assets/images/envelope.png'/>
            <input   class='w-[344px] h-[48px] bg-[#F7F7FA] pl-12 rounded-xl text-gray-600  font-bold border-[1.5px] border-[#DCDCDC]' placeholder='Email address'  />
        </div>

         <!-- school name  line -->
         <div class='w-full flex justify-center relative items-center mt-[10px] lg:mt-[10px] '>
            <img class='absolute left-[25px] lg:left-[525px] ' src='../assets/images/person.2.crop.square.stack.fill.png'/>
            <input   class='w-[344px] h-[48px] bg-[#F7F7FA] pl-12 rounded-xl text-gray-600  font-bold border-[1.5px] border-[#DCDCDC]' placeholder='School name'  />
        </div>

           <!-- Grade   line -->
           <div class='w-full flex justify-center relative items-center mt-[10px] lg:mt-[10px]  '>
            <img class='absolute left-[25px] lg:left-[525px] ' src='../assets/images/bookmark.square.png'/>
            <input   class='w-[344px] h-[48px] bg-[#F7F7FA] pl-12 rounded-xl text-gray-600  font-bold border-[1.5px] border-[#DCDCDC]' placeholder='Grade'  />
        </div>


        <!-- button -->
        <div class='w-full flex justify-center items-center mt-[30px] lg:mt-[50px] '>
            <button class='w-[344px] h-[48px] bg-[#3F37C9] rounded-xl text-white font-bold'>CONTINUE</button>
        </div>

        <!-- footer -->
    </div>

    <div
        class='h-[50px]  flex flex-col bg-[#F9F9F9] lg:hidden justify-center items-center border-t-[1px] border-gray-500 mt-7'>
        <div class='flex justify-center items-center space-x-[3px]'>
            <P>topteen.com</P>
            <img src='../assets/images/trust.png' />
        </div>
        <div class='bg-[#4B4B4B] h-[5px] w-[139px] rounded-full mt-[5px] mb-[8px]'></div>
    </div>


</body>

</html>
