<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/customCSS.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
  />
    <title>Welcome Page</title>
</head>
<body>
<main class="h-full w-full relative">

    <i class="fa fa-arrow-left absolute top-[24px] left-[24px] lg:top-[53px] lg:left-[100px] text-[#828282]"></i>

    <div class="flex gap-[8px] absolute top-[24px] lg:top-[53px] left-[50%] -translate-x-[50%]">
        <img src="../assets/images/graduation.svg" class="w-[38px] h-[38px] object-cover my-auto" alt="">
        <p class="text-[13px] leading-[16px] text-[#494949] boldFont my-auto">TOPTEEN</p>
    </div>

    <div class="absolute top-[160px] lg:top-[140px] left-[50%] -translate-x-[50%]">
        <img src="../assets/images/welcomeImg.svg" class="w-[230px] h-[151px] object-cover mx-auto" alt="">
        <p class="text-[20px] leading-[38px] tracking-[1%] text-[#333333] semibold lg:text-[32px] lg:leading-[43px] mt-[38px] lg:mt-[32px] text-center">Welcome to TopTeen!</p>
        <p class="text-[16px] leading-[21.6px] lg:leading-[27px] regularFont w-[344px] lg:w-[431px] mt-[6px] mx-auto text-[#494949] text-opacity-80 text-center ">Join a community of 10k+ students and discover your true passion. We will get you up and running in a few taps.</p>
        
        <div class="flex justify-center mt-[130px] lg:mt-[30px]">
            <button class="w-[344px] h-[53px] rounded-[10px] bg-[#2e289d] relative">
                <div class="w-[344px] h-[48px] absolute top-0 rounded-[10px] bg-[#3f37c9] py-[14px] ">
                    <p class="text-[14px] leading-[19px] boldFont text-[#ffffff] text-center ">GET STARTED</p>
                </div>
            </button>
        </div>

        <p class="text-[14px] leading-[19px] semibold text-[#3f37c9] text-center mt-[20px]">I HAVE AN ACCOUNT</p>
    </div>
</main>
    
</body>
</html>
