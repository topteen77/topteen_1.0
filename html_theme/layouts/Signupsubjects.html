<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup/Subjects</title>
    <Link href='../assets/css/customCSS.css' rel='stylesheet' />
    <Link href='../layouts/css/styles.css' rel='stylesheet' />
    <script src="https://kit.fontawesome.com/75bd64d95c.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class='w-full h-full'>
        <!-- header -->
        <header class='flex justify-between items-center mt-[27px] lg:mt-[35px]  '>
            <img class='h-[15px] w-[15px] ml-[20px] lg:ml-[100px] ' src='../assets/images/arrow.left.png' />
            <div class=' justify-center space-x-1 items-center  mr-[0px] lg:mr-[120px] flex'>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full'></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full '></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full '></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full  '></div>
                <div class='bg-[#4CC9F0] h-[13px] w-[13px] rounded-full opacity-30'></div>
            </div>
            <!-- <h2 class='text-[#494949] font-bold lg:hidden flex'>LOG IN</h2> -->
            <!-- <p class='text-[#3F37C9] flex lg:hidden text-[16px] font-semibold pr-[20px]'>SKIP</p> -->
            <p class='text-white '>1</p>
        </header>
        <!-- second line -->
        <div class='flex justify-center items-center font-semibold text-[24px] mt-[20px] lg:mt-[30px]'>
            <P>What do you enjoy learning?</P>
        </div>
        <!-- third line -->
        <div class='flex justify-center items-center font-normal text-center text-[16px] mt-[10px]'>
            <P class=' w-[344px] h-[44px] text-[#494949]'>Drag right for subjects you like and left for subjects you
                dont</P>
        </div>

        <!-- center portion -->
        <div class='flex justify-center items-center w-full h-full mt-[30px]'>
            <div class='flex justify-center items-center'>
                <div class='w-[64px] h-[59px] bg-[#4CC9F0] hidden lg:flex justify-center items-center rounded-full'>
                    <img class='w-[29px] h-[29px]' src='../assets/images/xmark.circle.fill.png' />
                </div>
                <div class='mx-10 flex flex-col items-center justify-center -space-y-[190px]'>
                    <div class='w-[178px] h-[198px] bg-[#EBEAF4] rounded-[10px] z-10'></div>
                    <div class='w-[202px] h-[205px] bg-[#F1F0F8] rounded-[10px] z-20'></div>
                    <div
                        class='w-[223px] h-[241px] bg-[#F7F7FA] rounded-[10px] z-30 flex flex-col justify-center items-center'>
                        <img src='../assets/images/equation 1.png' />
                        <div class='w-[108px] h-[22px] text-center mt-10'>
                            <p class='text-[14px] font-bold text-[#4F4F4F]'>Mathematics</p>
                        </div>
                        <div class='w-[183px] h-[32px] text-center mt-2'>
                            <p class='text-[#828282] text-[10px]'>Mathematician, Engineer, Physicist, Researcher</p>
                        </div>

                    </div>

                </div>
                <div class='w-[64px] h-[59px] bg-[#EF5DA8] hidden lg:flex justify-center items-center rounded-full'>
                    <img class='w-[29px] h-[29px]' src='../assets/images/heart.circle.fill.png' />
                </div>
            </div>
        </div>

        <!-- below center portion -->
        <div class='w-full h-full flex items-center justify-center mt-5 lg:mt-10'>
            <div class='flex space-x-4'>
                <div class='bg-[#F7F7FA] w-[52px] h-[52px] rounded-full'></div>
                <div class='bg-[#F7F7FA] w-[52px] h-[52px] rounded-full'></div>
                <div class='bg-[#F7F7FA] w-[52px] h-[52px] rounded-full'></div>
                <div class='bg-[#F7F7FA] w-[52px] h-[52px] rounded-full'></div>
                <div class='bg-[#F7F7FA] w-[52px] h-[52px] rounded-full'></div>
            </div>
        </div>



        <!-- button -->
        <div class='w-full flex justify-center items-center mt-[14px] lg:mt-[30px] '>
            <button class='w-[344px] h-[48px] bg-[#3F37C9] rounded-xl text-white font-bold'>CONTINUE</button>
        </div>

        <!-- footer -->
    </div>

    <div
        class='h-[50px]  flex flex-col bg-[#F9F9F9] lg:hidden justify-center items-center border-t-[1px] border-gray-500 mt-7'>
        <div class='flex justify-center items-center space-x-[3px]'>
            <P>topteen.com</P>
            <img src='../assets/images/trust.png' />
        </div>
        <div class='bg-[#4B4B4B] h-[5px] w-[139px] rounded-full mt-[5px] mb-[8px]'></div>
    </div>


</body>

</html>
