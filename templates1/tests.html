  <section class="test-filters py-4 d-none">

    </div>

</template>

  function createTestCard(test, testStatus) {
    const template = document.getElementById('test-card-template');
    const card = template.content.cloneNode(true);
    const cardBox = card.querySelector('.pt-y-box');

    // Set basic test information
    card.querySelector('.category-badge').textContent = test.category_name || 'Uncategorized';
    card.querySelector('.test-title').textContent = test.title;

    // Set description with truncation
    const descriptionElement = card.querySelector('.test-description');
    const readMoreBtn = card.querySelector('.read-more-btn');
    const normalView = card.querySelector('.normal-view');
    const expandedView = card.querySelector('.expanded-view');
    const scrollableDescription = card.querySelector('.scrollable-description');
    const closeBtn = card.querySelector('.close-btn');

    // Initially hide the expanded view
    expandedView.style.display = 'none';

    // Set descriptions
    descriptionElement.textContent = test.description;
    scrollableDescription.textContent = test.description;
    
    // Store the full text for search functionality
    descriptionElement.setAttribute('data-full-text', test.description);

    // Add click event to read more button
    readMoreBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        normalView.style.display = 'none';
        expandedView.style.display = 'block';
        expandedView.setAttribute('tabindex', '-1');
        expandedView.focus();
    });

    // Add click event to close button
    closeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        expandedView.style.display = 'none';
        normalView.style.display = 'block';
    });

    // Get status and button elements
    const statusElement = card.querySelector('.test-status');
    const startButton = card.querySelector('.take-test-btn');
    const viewButton = card.querySelector('.details-btn');

    // Get test status from the database info with default values
    const testInfo = testStatus[test.id] || { completed: false };
    const isCompleted = testInfo.completed || false;

    if (isCompleted) {
        // Update status to show completed with better styling
        statusElement.innerHTML = '<span class="badge badge-success">Completed</span>';
        viewButton.classList.remove('d-none');
        viewButton.classList.add('btn-success');
        startButton.classList.remove('purple-button');
        startButton.classList.add('d-none');
        viewButton.style.backgroundColor = '#28a745';
        viewButton.style.borderColor = '#28a745';
        viewButton.style.color = 'white';
        viewButton.href = `/api/web/results/?test_id=${test.id}`;
    } else {
        // Default state for uncompleted tests
        statusElement.innerHTML = '<span class="badge badge-secondarys">Not Started</span>';
        startButton.textContent = 'Start Test';
    }

    if (test.id === 4) {  // For Aptitude Test with Sections
        const questionsCount = card.querySelector('.questions-count');
        
        if (testInfo.sections_status) {
            // Get completed sections count from database status
            const completedSections = testInfo.completed_sections || 0;
            const totalSections = testInfo.total_sections || 0;
            questionsCount.textContent = `${completedSections}/${totalSections} sections completed`;
        } else {
            // Fallback to API call if status not available
            fetch(`/api/sections/?test=${test.id}&page_size=100`)
                .then(res => res.json())
                .then(data => {
                    const sectionsCount = data.results ? data.results.length : 0;
                    questionsCount.textContent = `${sectionsCount} sections`;
                })
                .catch(error => {
                    console.error('Error fetching sections:', error);
                    questionsCount.textContent = '0 sections';
                });
        }

        // Set href only if not completed
        if (!isCompleted) {
            startButton.href = `/api/web/test/${test.id}/sections/`;
        }
    } else {
        // For all other tests
        card.querySelector('.questions-count').textContent = `${test.questions_count} questions`;
        
        // Set href only if not completed
        if (!isCompleted) {
            startButton.href = `/api/web/take_test/${test.id}/`;
        }
    }

    card.querySelector('.time-limit').textContent = `${test.time_limit} minutes`;
    return card;
}

  // Show loading state
  function showLoading() {
    testsContainer.innerHTML = '<div class="loading">Loading tests...</div>';
  }

  // Show error state
  function showError() {
    testsContainer.innerHTML = '<div class="error">Error loading tests. Please try again later.</div>';
  }

  // Render tests
  function renderTests(tests, categoryMap) {
    testsContainer.innerHTML = '';
    if (!tests.length) {
      testsContainer.innerHTML = '<div class="no-tests">No tests found.</div>';
      return;
    }
    // Get test status from the context
    const testStatus = window.testStatus || {}; // This should be populated from Django context
    console.log("All Test Status:", testStatus);
    tests.forEach(test => {
      test.category_name = categoryMap[test.category] || 'Uncategorized';
      testsContainer.appendChild(createTestCard(test, testStatus));
    });
  }

  // Render categories in filter
  function renderCategories(categories, selectedId) {
    categoryFilter.innerHTML = '<option value="">All Categories</option>';
    categories.forEach(cat => {
      const option = document.createElement('option');
      option.value = cat.id;
      option.textContent = cat.name;
      if (selectedId && selectedId == cat.id) option.selected = true;
      categoryFilter.appendChild(option);
    });
  }

  // Fetch and render everything
  function loadTestsAndCategories() {
    showLoading();

    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get('category') || '';

    // Fetch tests (optionally filtered)
    const testsUrl = categoryId
      ? `/api/tests/?category=${categoryId}`
      : "/api/tests/";

    const testsPromise = fetch(testsUrl).then(res => {
      if (!res.ok) throw new Error("Failed to fetch tests");
      return res.json();
    });

    const categoriesPromise = fetch("/api/categories/").then(res => {
      if (!res.ok) throw new Error("Failed to fetch categories");
      return res.json();
    });

    Promise.all([testsPromise, categoriesPromise])
      .then(([testsData, categoriesData]) => {
        const tests = testsData.results || [];
        const categories = categoriesData.results || [];
        renderCategories(categories, categoryId);

        // Create category map
        const categoryMap = {};
        categories.forEach(cat => {
          categoryMap[cat.id] = cat.name;
        });

        renderTests(tests, categoryMap);
      })
      .catch(error => {
        console.error('Error loading tests or categories:', error);
        showError();
      });
  }

  // Handle search input
  searchBox.addEventListener('input', function () {
    const query = this.value.toLowerCase();
    const cards = testsContainer.querySelectorAll('.pt-y-box');
    cards.forEach(card => {
      const title = card.querySelector('.test-title').textContent.toLowerCase();
      const description = card.querySelector('.test-description').getAttribute('data-full-text').toLowerCase();
      card.parentElement.style.display = (title.includes(query) || description.includes(query)) ? '' : 'none';
    });
  });

  // Handle category filter change
  categoryFilter.addEventListener('change', function () {
    const selectedCategory = this.value;
    if (selectedCategory) {
      window.location.href = `tests.html?category=${selectedCategory}`;
    } else {
      window.location.href = 'tests.html';
    }
  });

  // Initial load
  loadTestsAndCategories();
</script>
