{% extends "base1.html" %}

{% block main-content %}
<div class="auth-container row py-5">
  <div class="auth-wrapper col-md-4 mx-auto ">
    <!-- Left Side - Branding -->


    <!-- Right Side - Login Form -->
    <div class="auth-form-section">
      <div class="form-container">
        <div class="form-header">
          <h2>Sign In</h2>
          <p>Access your personalized dashboard</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post"  action="?next={{ request.GET.next }}" class="auth-form" id="loginForm">
          {% csrf_token %}

          <div class="form-group">
            <label for="username">Username or Email</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input type="text" id="username" name="username" placeholder="Enter your username or email" required
                autocomplete="username">
            </div>
            <!-- <div class="input-feedback" id="username-feedback"></div> -->
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" name="password" placeholder="Enter your password" required
                autocomplete="current-password">
              <button type="button" class="password-toggle" id="togglePassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <!-- <div class="input-feedback" id="password-feedback"></div> -->
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" name="remember_me">
              <span class="checkmark"></span>
              <span class="checkbox-text">Remember me</span>
            </label>
            <!-- <a href="/forgot-password" class="forgot-link">Forgot Password?</a> -->
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
            <span class="btn-text">
              <i class="fas fa-sign-in-alt"></i>
              Sign In
            </span>
            <div class="btn-loader" style="display: none;">
              <div class="spinner"></div>
            </div>
          </button>
        </form>

        <!-- <div class="form-divider">
          <span>or continue with</span>
        </div> -->



        <div class="form-footer">
          <p>Don't have an account?
            <a href="{% url 'post_matric:register' %}" class="register-link">
              <strong>Create Account</strong>
              <i class="fas fa-arrow-right"></i>
            </a>
          </p>
          <!-- <div class="help-links">
            <a href="/help">Need Help?</a>
            <span>•</span>
            <a href="/contact">Contact Support</a>
          </div> -->
        </div>
      </div>
    </div>
  </div>
</div>



<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const btnLoader = submitBtn.querySelector('.btn-loader');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    // Password toggle functionality
    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);

      const icon = this.querySelector('i');
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    });

    // Form validation and submission
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      if (validateForm()) {
        showLoading();

        // Simulate form submission delay
        setTimeout(() => {
          form.submit();
        }, 1000);
      }
    });

    function validateForm() {
      let isValid = true;

      // Reset previous feedback
      document.querySelectorAll('.input-feedback').forEach(el => {
        el.textContent = '';
        el.parentElement.querySelector('.input-wrapper').classList.remove('error');
      });

      // Validate username
      const username = document.getElementById('username').value.trim();
      if (username.length === 0) {
        showFieldError('username', 'Username or email is required');
        isValid = false;
      }

      // Validate password
      const password = document.getElementById('password').value;
      if (password.length === 0) {
        showFieldError('password', 'Password is required');
        isValid = false;
      }

      return isValid;
    }

    function showFieldError(fieldId, message) {
      const feedback = document.getElementById(fieldId + '-feedback');
      const wrapper = document.getElementById(fieldId).closest('.input-wrapper');

      feedback.textContent = message;
      wrapper.classList.add('error');
    }

    function showLoading() {
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'flex';
    }

    // Real-time validation feedback
    document.querySelectorAll('input[required]').forEach(input => {
      input.addEventListener('input', function () {
        if (this.closest('.input-wrapper').classList.contains('error') && this.value.trim() !== '') {
          this.closest('.input-wrapper').classList.remove('error');
          const feedback = document.getElementById(this.id + '-feedback');
          if (feedback) feedback.textContent = '';
        }
      });
    });

    // Add floating label effect
    document.querySelectorAll('.input-wrapper input').forEach(input => {
      input.addEventListener('focus', function () {
        this.closest('.input-wrapper').classList.add('focused');
      });

      input.addEventListener('blur', function () {
        if (this.value === '') {
          this.closest('.input-wrapper').classList.remove('focused');
        }
      });

      // Check if input has value on page load
      if (input.value !== '') {
        input.closest('.input-wrapper').classList.add('focused');
      }
    });
  });

  // Demo account functionality
  function fillDemoCredentials() {
    document.getElementById('username').value = 'demo_user';
    document.getElementById('password').value = 'demo123';

    // Add visual feedback
    document.querySelectorAll('.input-wrapper').forEach(wrapper => {
      wrapper.classList.add('focused');
    });

    // Show success message
    showDemoMessage();
  }

  function showDemoMessage() {
    const demoBtn = document.querySelector('.demo-btn');
    const originalText = demoBtn.innerHTML;

    demoBtn.innerHTML = '<i class="fas fa-check"></i> Demo credentials filled!';
    demoBtn.classList.add('success');

    setTimeout(() => {
      demoBtn.innerHTML = originalText;
      demoBtn.classList.remove('success');
    }, 3000);
  }

  // Add smooth entrance animation
  window.addEventListener('load', function () {
    document.querySelector('.auth-wrapper').style.animation = 'slideInUp 0.6s ease-out';
  });
</script>

<style>
  /* Reset and Base Styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
    background: #f8f9fa;
  }

  /* Auth Container */
  .auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 2rem 1rem;
  }

  .auth-wrapper { 
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
  }

  @keyframes slideInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }



  /* Recent Activity */
  .recent-activity {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    padding: 1.5rem;
    backdrop-filter: blur(10px);
  }

  .recent-activity h4 {
    font-size: 1.1rem;
    margin-bottom: 1rem;
    color: #3498db;
  }

  .activity-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .activity-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.9rem;
    opacity: 0.9;
  }

  .activity-item i {
    color: #27ae60;
    font-size: 1rem;
  }

  /* Right Side - Form */
  .auth-form-section {
    padding: 1rem;
    display: flex;
    align-items: center;
  }

  .form-container {
    width: 100%;
     }

  .form-header {
    text-align: center;
    margin-bottom: 1rem;
  }

  .form-header h2 {
    font-size: 2rem;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 0.5rem;
  }

  .form-header p {
    color: #6c757d;
    font-size: 1rem;
  }

  /* Alert Styles */
  .alert {
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .alert-error {
    background: #fee;
    color: #c53030;
    border: 1px solid #fed7d7;
  }

  /* Form Styles */
  .auth-form {
    margin-bottom: 1rem;
  }

  .form-group {
    margin-bottom: 1rem;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper i {
    position: absolute;
    left: 1rem;
    color: #6c757d;
    z-index: 2;
    transition: color 0.3s ease;
  }

  .input-wrapper.focused i {
    color: #667eea;
  }

  .input-wrapper input {
    width: 100%;
    padding: 1rem 1rem 1rem 3rem;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: #fff;
  }

  .input-wrapper input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .input-wrapper.error input {
    border-color: #e53e3e;
    box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.1);
  }

  .password-toggle {
   position: absolute;
  right: 32px;
  background: none;
  border: none;
  color: #6c757d;
  cursor: pointer;
  padding: 0.5rem;
  z-index: 2;
  transition: color 0.3s ease;
  top: 15px;
  }

  .password-toggle:hover {
    color: #495057;
  }

  .input-feedback {
    font-size: 0.85rem;
    color: #e53e3e;
    margin-top: 0.25rem;
    min-height: 1.2rem;
  }

  /* Form Options */
  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .checkbox-label input[type="checkbox"] {
    display: none;
  }

  .checkmark {
    width: 18px;
    height: 18px;
    border: 2px solid #dee2e6;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .checkbox-label input[type="checkbox"]:checked+.checkmark {
    background: #667eea;
    border-color: #667eea;
  }

  .checkbox-label input[type="checkbox"]:checked+.checkmark::after {
    content: '✓';
    color: white;
    font-size: 0.7rem;
    font-weight: bold;
  }

  .forgot-link {
    color: #667eea;
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.3s ease;
  }

  .forgot-link:hover {
    color: #764ba2;
    text-decoration: underline;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    cursor: pointer;
    font-size: 1rem;
    position: relative;
    overflow: hidden;
  }

  .btn-full {
    width: 100%;
  }

  .btn-primary {
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  }

  .btn-primary:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .btn-social {
    flex: 1;
    background: white;
    color: #495057;
    border: 2px solid #dee2e6;
    padding: 0.75rem 1rem;
    font-size: 0.9rem;
  }

  .btn-social:hover {
    border-color: #adb5bd;
    background: #f8f9fa;
  }

  .btn-google:hover {
    border-color: #db4437;
    color: #db4437;
  }

  .btn-linkedin:hover {
    border-color: #0077b5;
    color: #0077b5;
  }

  .btn-microsoft:hover {
    border-color: #00a1f1;
    color: #00a1f1;
  }

  .btn-outline {
    background: transparent;
    color: #667eea;
    border: 2px solid #667eea;
  }

  .btn-outline:hover {
    background: #667eea;
    color: white;
  }

  .btn-outline.success {
    border-color: #28a745;
    color: #28a745;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid transparent;
    border-top: 2px solid currentColor;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }

  /* Form Divider */
  .form-divider {
    text-align: center;
    margin: 1.5rem 0;
    position: relative;
  }

  .form-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #dee2e6;
  }

  .form-divider span {
    background: white;
    padding: 0 1rem;
    color: #6c757d;
    font-size: 0.9rem;
    position: relative;
  }


  /* Form Footer */
  .form-footer {
    text-align: center;
    padding-top: 1rem;
    border-top: 1px solid #dee2e6;
  }

  .form-footer p {
    color: #6c757d;
    margin-bottom: 1rem;
  }

  .register-link {
    color: #667eea;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    transition: all 0.3s ease;
  }

  .register-link:hover {
    color: #764ba2;
    transform: translateX(3px);
  }

  .help-links {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.9rem;
  }

  .help-links a {
    color: #6c757d;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .help-links a:hover {
    color: #667eea;
  }

  .help-links span {
    color: #dee2e6;
  }

  /* Demo Section */
  .demo-section {
    background: #f8f9fa;
    padding: 2rem 0;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  .demo-content {
    text-align: center;
    max-width: 500px;
    margin: 0 auto;
  }

  .demo-content h3 {
    font-size: 1.5rem;
    color: #2c3e50;
    margin-bottom: 0.5rem;
  }

  .demo-content p {
    color: #6c757d;
    margin-bottom: 1.5rem;
  }

  .demo-btn {
    padding: 0.75rem 2rem;
  }

  /* Responsive Design */
  @media (max-width: 968px) {
    .auth-wrapper {
      grid-template-columns: 1fr;
      max-width: 500px;
    }

    .auth-branding {
      padding: 2rem;
      text-align: center;
    }

    .branding-content h2 {
      font-size: 1.5rem;
    }

    .stats-grid {
      grid-template-columns: 1fr;
    }

    .recent-activity {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .auth-container {
      padding: 1rem;
    }

    .auth-form-section {
      padding: 2rem 1.5rem;
    }

    .form-header h2 {
      font-size: 1.75rem;
    }



    .form-options {
      flex-direction: column;
      gap: 1rem;
      align-items: flex-start;
    }

    .demo-section {
      padding: 1.5rem 0;
    }
  }
</style>

{% endblock %}
