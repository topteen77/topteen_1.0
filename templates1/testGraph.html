<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- HTML for the pie chart -->
<canvas id="instituteStudentsChart" style="width: 10px; height: 10px;"></canvas>
<canvas id="streamStudentsChart" style="width: 20px; height: 20px;"></canvas>

<script>
    // Assume this data is dynamically retrieved (e.g., from an API or database)
    const institutesData = {
        labels: ['Institute A', 'Institute B', 'Institute C', 'Institute D'],
        studentCount: [120, 80, 200, 150]
    };

    const streamsData = {
        labels: ['Stream X', 'Stream Y', 'Stream Z'],
        studentCount: [100, 120, 180]
    };

    // Function to render pie chart dynamically
    function renderPieChart(chartId, labels, data) {
        const ctx = document.getElementById(chartId).getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)',
                        'rgba(54, 162, 235, 0.7)',
                        'rgba(255, 206, 86, 0.7)',
                        'rgba(75, 192, 192, 0.7)',
                        'rgba(153, 102, 255, 0.7)',
                        'rgba(255, 159, 64, 0.7)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(153, 102, 255, 1)',
                        'rgba(255, 159, 64, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: chartId === 'instituteStudentsChart' 
                            ? 'Students per Institute' 
                            : 'Stream-Based Student Distribution'
                    }
                }
            }
        });
    }

    // Render both pie charts with dynamic data
    renderPieChart('instituteStudentsChart', institutesData.labels, institutesData.studentCount);
    renderPieChart('streamStudentsChart', streamsData.labels, streamsData.studentCount);
</script>
