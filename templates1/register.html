{% extends "base1.html" %}

{% block main-content %}
<div class="auth-container py-10 row">
  <div class="col-md-5 mx-auto">
    <div class="auth-wrapper ">
      <!-- Left Side - Branding -->

      <!-- Right Side - Registration Form -->
      <div class="auth-form-section">
        <div class="form-container">
          <div class="form-header">
            <h2>Create Your Account</h2>
            <p>Start your journey of self-discovery today</p>
          </div>

          {% if error %}
          <div class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
          </div>
          {% endif %}

          <form method="post" class="auth-form" id="registerForm">
            {% csrf_token %}

            <div class="row">

              <div class="col-md-6">

                <div class="form-group">
                  <label for="username">Username</label>
                  <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required
                      autocomplete="username">
                  </div>
                  <!-- <div class="input-feedback" id="username-feedback"></div> -->
                </div>
              </div>

              <div class="col-md-6">

                <div class="form-group">
                  <label for="email">Email Address</label>
                  <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Enter your email " required
                      autocomplete="email">
                  </div>
                  <!-- <div class="input-feedback" id="email-feedback"></div> -->
                </div>
              </div>

              <div class="col-md-6">

                <div class="form-group">
                  <label for="class">Enter Class</label>
                  <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="className" name="className" placeholder="Enter your Class" required
                      autocomplete="username">
                  </div>
                  <!-- <div class="input-feedback" id="className-feedback"></div> -->
                </div>
              </div>


              <div class="col-md-6">

                <div class="form-group">
                  <label for="gender">Gender</label>
                  <div class="gender-container">
                    <div class="gender-option">
                      <input type="radio" name="gender" id="gender-male" value="Male" checked>
                      <label for="gender-male">
                        <div class="radio-button">
                          <div class="radio-inner"></div>
                        </div>
                        <span>Male</span>
                      </label>
                    </div>

                    <div class="gender-option">
                      <input type="radio" name="gender" id="gender-female" value="female">
                      <label for="gender-female">
                        <div class="radio-button">
                          <div class="radio-inner"></div>
                        </div>
                        <span>Female</span>
                      </label>
                    </div>
                  </div>
                </div>
                <!-- <div class="input-feedback" id="gender-feedback"></div> -->
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required
                  autocomplete="new-password">
                <button type="button" class="password-toggle" id="togglePassword">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="password-strength" id="password-strength">
                <div class="strength-bar">
                  <div class="strength-fill"></div>
                </div>
                <span class="strength-text">Password strength</span>
              </div>
              <!-- <div class="input-feedback" id="password-feedback"></div> -->
            </div>

            <div class="form-group">
              <label class="checkbox-label d-flex">
                <input type="checkbox" required>
                <span class="checkmark"></span>
                <span class="checkbox-text">
                  I agree to the <a href="/terms" target="_blank">Terms of Service</a>
                  and <a href="/privacy" target="_blank">Privacy Policy</a>
                </span>
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
              <span class="btn-text">Create Account</span>
              <div class="btn-loader" style="display: none;">
                <div class="spinner"></div>
              </div>
            </button>
          </form>

          <!-- <div class="form-divider">
            <span>or</span>
          </div> -->



          <div class="form-footer">
            <p>Already have an account?
              <a href="{% url 'post_matric:login' %}" class="login-link">
                <strong>Sign In</strong>
                <i class="fas fa-arrow-right"></i>
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const btnLoader = submitBtn.querySelector('.btn-loader');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const strengthIndicator = document.getElementById('password-strength');

    // Password toggle functionality
    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);

      const icon = this.querySelector('i');
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    });

    // Password strength checker
    passwordInput.addEventListener('input', function () {
      const password = this.value;
      const strength = calculatePasswordStrength(password);
      updatePasswordStrength(strength);
    });

    // Form validation
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      if (validateForm()) {
        showLoading();

        // Simulate form submission (replace with actual form submission)
        setTimeout(() => {
          form.submit();
        }, 1000);
      }
    });

    function calculatePasswordStrength(password) {
      let strength = 0;

      if (password.length >= 8) strength += 25;
      if (password.match(/[a-z]/)) strength += 25;
      if (password.match(/[A-Z]/)) strength += 25;
      if (password.match(/[0-9]/)) strength += 12.5;
      if (password.match(/[^A-Za-z0-9]/)) strength += 12.5;

      return Math.min(strength, 100);
    }

    function updatePasswordStrength(strength) {
      const fill = strengthIndicator.querySelector('.strength-fill');
      const text = strengthIndicator.querySelector('.strength-text');

      fill.style.width = strength + '%';

      if (strength < 25) {
        fill.className = 'strength-fill weak';
        text.textContent = 'Weak password';
      } else if (strength < 50) {
        fill.className = 'strength-fill fair';
        text.textContent = 'Fair password';
      } else if (strength < 75) {
        fill.className = 'strength-fill good';
        text.textContent = 'Good password';
      } else {
        fill.className = 'strength-fill strong';
        text.textContent = 'Strong password';
      }
    }

    function validateForm() {
      let isValid = true;

      // Reset previous feedback
      document.querySelectorAll('.input-feedback').forEach(el => {
        el.textContent = '';
        el.parentElement.querySelector('.input-wrapper')?.classList.remove('error');
      });

      // Validate username
      const username = document.getElementById('username').value.trim();
      if (username.length < 3) {
        showFieldError('username', 'Username must be at least 3 characters long');
        isValid = false;
      }

      // Validate email
      const email = document.getElementById('email').value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showFieldError('email', 'Please enter a valid email address');
        isValid = false;
      }

      // Validate password
      const password = document.getElementById('password').value;
      if (password.length < 8) {
        showFieldError('password', 'Password must be at least 8 characters long');
        isValid = false;
      }

      return isValid;
    }

    function showFieldError(fieldId, message) {
      const feedback = document.getElementById(fieldId + '-feedback');
      const wrapper = document.getElementById(fieldId).closest('.input-wrapper');
      
      if (feedback) feedback.textContent = message;
      if (wrapper) wrapper.classList.add('error');
    }

    function showLoading() {
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'block';
    }

    // Real-time validation feedback
    document.querySelectorAll('input[required]').forEach(input => {
      if (input.closest('.input-wrapper')) {
        input.addEventListener('blur', function () {
          if (this.value.trim() === '') {
            this.closest('.input-wrapper').classList.add('error');
          } else {
            this.closest('.input-wrapper').classList.remove('error');
          }
        });

        input.addEventListener('input', function () {
          if (this.closest('.input-wrapper').classList.contains('error') && this.value.trim() !== '') {
            this.closest('.input-wrapper').classList.remove('error');
            const feedback = document.getElementById(this.id + '-feedback');
            if (feedback) feedback.textContent = '';
          }
        });
      }
    });
    
    // Add animation for radio buttons
    const genderRadios = document.querySelectorAll('input[name="gender"]');
    genderRadios.forEach(radio => {
      radio.addEventListener('change', function() {
        const genderOptions = document.querySelectorAll('.gender-option');
        genderOptions.forEach(option => {
          option.classList.remove('active-pulse');
        });
        
        const parentOption = this.closest('.gender-option');
        if (parentOption) {
          parentOption.classList.add('active-pulse');
        }
      });
    });
    
    // Initialize first radio as active
    const defaultRadio = document.getElementById('gender-male');
    if (defaultRadio && defaultRadio.checked) {
      const parentOption = defaultRadio.closest('.gender-option');
      if (parentOption) {
        parentOption.classList.add('active-pulse');
      }
    }
  });
</script>

<style>
  /* Reset and Base Styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
  }

  /* Auth Container */
  .auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 2rem 1rem;
  }

  .auth-wrapper {
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
  }


  /* Right Side - Form */
  .auth-form-section {
    padding: 3rem;
    display: flex;
    align-items: center;
  }

  .form-container {
    width: 100%;
  }

  .form-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .form-header h2 {
    font-size: 2rem;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 0.5rem;
  }

  .form-header p {
    color: #6c757d;
    font-size: 1rem;
  }

  /* Alert Styles */
  .alert {
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .alert-error {
    background: #fee;
    color: #c53030;
    border: 1px solid #fed7d7;
  }

  /* Form Styles */
  .auth-form {
    margin-bottom: 2rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper i {
    position: absolute;
    left: 1rem;
    color: #6c757d;
    z-index: 2;
  }

  .input-wrapper input {
    width: 100%;
    padding: 1rem 1rem 1rem 3rem;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: #fff;
  }

  .input-wrapper input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .input-wrapper.error input {
    border-color: #e53e3e;
    box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.1);
  }

  .password-toggle {
     position: absolute;
  right: 32px;
  background: none;
  border: none;
  color: #6c757d;
  cursor: pointer;
  padding: 0.5rem;
  z-index: 2;
  transition: color 0.3s ease;
  top: 15px;
  }

  .password-toggle:hover {
    color: #495057;
  }

  .input-feedback {
    font-size: 0.85rem;
    color: #e53e3e;
    margin-top: 0.25rem;
    min-height: 1.2rem;
  }

  /* Gender Radio Buttons */
  .gender-container {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }
  
  .gender-option {
    position: relative;
    flex: 1;
    transition: all 0.3s ease;
  }
  
  .gender-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  
  .gender-option label {
    display: flex;
    align-items: center;
    padding: 16px 9px;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: normal;
  }
  
  .gender-option:hover label {
    border-color: #d1d5db;
  }
  
  .gender-option input[type="radio"]:checked + label {
    border-color: #667eea;
    background-color: rgba(102, 126, 234, 0.05);
  }
  
  .radio-button {
    width: 20px;
    height: 20px;
    border: 2px solid #cbd5e0;
    border-radius: 50%;
    margin-right: 10px;
    padding: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  
  .radio-inner {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: transparent;
    transition: all 0.2s;
  }
  
  .gender-option input[type="radio"]:checked + label .radio-button {
    border-color: #667eea;
  }
  
  .gender-option input[type="radio"]:checked + label .radio-inner {
    background-color: #667eea;
  }
  
  .gender-option input[type="radio"]:focus + label {
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }
  
  /* Animation for selection */
  .active-pulse {
    animation: pulse 0.5s;
  }
  
  @keyframes pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.03);
    }
    100% {
      transform: scale(1);
    }
  }

  /* Password Strength */
  .password-strength {
    margin-top: 0.5rem;
  }

  .strength-bar {
    height: 4px;
    background: #e9ecef;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 0.25rem;
  }

  .strength-fill {
    height: 100%;
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .strength-fill.weak {
    background: #e53e3e;
  }

  .strength-fill.fair {
    background: #fd7e14;
  }

  .strength-fill.good {
    background: #ffc107;
  }

  .strength-fill.strong {
    background: #28a745;
  }

  .strength-text {
    font-size: 0.8rem;
    color: #6c757d;
  }

  /* Checkbox */
  .checkbox-label {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .checkbox-label input[type="checkbox"] {
    display: none;
  }

  .checkmark {
    width: 20px;
    height: 20px;
    border: 2px solid #dee2e6;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .checkbox-label input[type="checkbox"]:checked+.checkmark {
    background: #667eea;
    border-color: #667eea;
  }

  .checkbox-label input[type="checkbox"]:checked+.checkmark::after {
    content: '✓';
    color: white;
    font-size: 0.8rem;
    font-weight: bold;
  }

  .checkbox-text a {
    color: #667eea;
    text-decoration: none;
  }

  .checkbox-text a:hover {
    text-decoration: underline;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    cursor: pointer;
    font-size: 1rem;
    position: relative;
    overflow: hidden;
  }

  .btn-full {
    width: 100%;
  }

  .btn-primary {
    background: linear-gradient(45deg, #808188, #764ba2);
    color: white;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  }

  .btn-primary:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .btn-social {
    width: 100%;
    background: white;
    color: #495057;
    border: 2px solid #dee2e6;
    margin-bottom: 0.75rem;
  }

  .btn-social:hover {
    border-color: #adb5bd;
    background: #f8f9fa;
  }

  .btn-google:hover {
    border-color: #db4437;
    color: #db4437;
  }

  .btn-linkedin:hover {
    border-color: #0077b5;
    color: #0077b5;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid transparent;
    border-top: 2px solid currentColor;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }

  /* Form Divider */
  .form-divider {
    text-align: center;
    margin: 1.5rem 0;
    position: relative;
  }

  .form-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #dee2e6;
  }

  .form-divider span {
    background: white;
    padding: 0 1rem;
    color: #6c757d;
    font-size: 0.9rem;
    position: relative;
  }



  /* Form Footer */
  .form-footer {
    text-align: center;
    padding-top: 1.5rem;

  }

  .form-footer p {
    color: #6c757d;
    margin: 0;
  }

  .login-link {
    color: #667eea;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    transition: all 0.3s ease;
  }

  .login-link:hover {
    color: #764ba2;
    transform: translateX(3px);
  }

  /* Responsive Design */
  @media (max-width: 968px) {
    .auth-wrapper {
      grid-template-columns: 1fr;
      max-width: 500px;
    }

    .auth-branding {
      padding: 2rem;
      text-align: center;
    }

    .branding-content h2 {
      font-size: 1.5rem;
    }

    .testimonial {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .auth-container {
      padding: 1rem;
    }

    .auth-form-section {
      padding: 2rem 1.5rem;
    }

    .form-header h2 {
      font-size: 1.75rem;
    }

    .btn-social {
      font-size: 0.9rem;
    }
    
    .gender-container {
      flex-direction: column;
      gap: 10px;
    }
  }
</style>

{% endblock %}
