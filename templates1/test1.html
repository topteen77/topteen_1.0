<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .img-container {
            margin-top: 20px;
        }
        img {
            width: 100px; /* Adjust as needed */
            height: auto;
        }
    </style>
</head>
<body>
    {% load static %}

    {{static}}
    
    <h1>Welcome to My Simple HTML Page</h1>
    <p>This is a basic example of an HTML page.</p>
    <p>fhksdljfklsdjfklsdfkl{{ static }}</p>
    
    <div class="img-container">
        <img src="{% static 'images/pcm-icon.png' %}" alt="Your Image">
    </div>
    
    <p>Feel free to modify this template as needed!</p>
</body>
</html>
