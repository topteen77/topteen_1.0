<div class="page-header">
    <div class="container">
        <a href="/results.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Results</a>
        <h1 id="test-title">Result Details</h1>
        <span class="category-badge" id="test-category">Category</span>
    </div>
</div>

<section class="result-details">
    <div class="container">
        <div class="result-summary-card">
            <div class="result-header">
                <h2>Test Summary</h2>
                <span class="completion-date" id="completion-date">Completed on: --</span>
            </div>
            <div class="result-body">
                <div class="score-section">
                    <div class="score-display">
                        <div class="score-circle">
                            <span class="score-value" id="score-value">--</span>
                        </div>
                        <span class="grade" id="grade-value">--</span>
                    </div>
                    <div class="score-details">
                        <p id="score-description">Loading result details...</p>
                    </div>
                </div>
                
                <div class="test-meta">
                    <div class="meta-item">
                        <i class="fas fa-clock"></i>
                        <div class="meta-content">
                            <h4>Duration</h4>
                            <p id="test-duration">--</p>
                        </div>
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-check-circle"></i>
                        <div class="meta-content">
                            <h4>Questions</h4>
                            <p id="questions-answered">--</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="result-analysis" id="result-analysis">
            <h3>Detailed Analysis</h3>
            <div id="analysis-content">
                <div class="loading">Loading analysis...</div>
            </div>
        </div>
        
        <div class="result-feedback">
            <h3>Feedback</h3>
            <div class="feedback-content" id="feedback-content">
                Loading feedback...
            </div>
        </div>
        
        <div class="result-actions">
            <button id="download-pdf-btn" class="btn btn-outline"><i class="fas fa-download"></i> Download PDF</button>
            <button id="share-results-btn" class="btn btn-outline"><i class="fas fa-share-alt"></i> Share Results</button>
        </div>
    </div>
</section>

<!-- Templates for different result visualizations -->
<template id="aptitude-result-template">
    <div class="aptitude-results">
        <div class="score-breakdown">
            <h4>Score Breakdown</h4>
            <div class="progress-bar-container">
                <div class="progress-label">Correct Answers</div>
                <div class="progress-bar">
                    <div class="progress correct-progress"></div>
                </div>
                <div class="progress-value correct-value"></div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-label">Incorrect Answers</div>
                <div class="progress-bar">
                    <div class="progress incorrect-progress"></div>
                </div>
                <div class="progress-value incorrect-value"></div>
            </div>
        </div>
    </div>
</template>

<template id="personality-result-template">
    <div class="personality-results">
        <div class="dimensions-chart">
            <h4>Personality Dimensions</h4>
            <div class="chart-container">
                <canvas id="personality-chart"></canvas>
            </div>
        </div>
        <div class="dimensions-explanation">
            <!-- Dimension explanations will be added here dynamically -->
        </div>
    </div>
</template>

<template id="career-result-template">
    <div class="career-results">
        <div class="top-careers">
            <h4>Top Career Matches</h4>
            <div class="career-matches">
                <!-- Career matches will be added here dynamically -->
            </div>
        </div>
        <div class="interest-areas">
            <h4>Interest Areas</h4>
            <div class="chart-container">
                <canvas id="interests-chart"></canvas>
            </div>
        </div>
    </div>
</template>

<template id="motivation-result-template">
    <div class="motivation-results">
        <div class="motivation-factors">
            <h4>Motivation Factors</h4>
            <div class="factors-chart">
                <canvas id="motivation-chart"></canvas>
            </div>
        </div>
        <div class="factors-explanation">
            <!-- Factor explanations will be added here dynamically -->
        </div>
    </div>
</template>
