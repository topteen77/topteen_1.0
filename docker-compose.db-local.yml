# TopTeens - Local MySQL 8 container (use when DB_MODE=local)
# Merged with docker-compose.yml: docker compose -f docker-compose.yml -f docker-compose.db-local.yml up -d

services:
  web:
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306

  celery_beat:
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-topteens}
      MYSQL_USER: ${DB_USER:-topteens}
      MYSQL_PASSWORD: ${DB_PASSWORD:-topteens}
    volumes:
      # MYSQL_DATA_PATH: bind mount (e.g. /data/topteen12). Unset: use named volume mysql_data
      - ${MYSQL_DATA_PATH:-mysql_data}:/var/lib/mysql
    ports:
      # Host port 3307 to avoid conflict with other MySQL on 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
