# TopTeens - Rollback with external mysql8 (use when DB_MODE=external)
# Merged with docker-compose.rollback.yml - uses :previous web image, connects to mysql8

services:
  web:
    networks:
      - default
      - external_db
    environment:
      - DB_HOST=mysql8
      - DB_PORT=3306

  celery:
    networks:
      - default
      - external_db
    environment:
      - DB_HOST=mysql8
      - DB_PORT=3306

  celery_beat:
    networks:
      - default
      - external_db
    environment:
      - DB_HOST=mysql8
      - DB_PORT=3306

networks:
  external_db:
    external: true
    name: 0innerdb_default
