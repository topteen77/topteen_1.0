# Production Docker deploy via docker_files/deploy.sh
#
# Triggers: push to `production` branch (or manual workflow_dispatch)
#
# Required GitHub secrets:
#   AWS_SSH_KEY          SSH private key for the production server
#   AWS_HOST             Server hostname or IP
#   AWS_USER             SSH user (e.g. ubuntu)
#
# Optional secrets:
#   DEPLOY_PATH_PRODUCTION   Repo path on server
#                            Default: /home/ubuntu/git-project/topteen_1.0
#   DOCKERHUB_USERNAME       Docker Hub user (push on successful deploy)
#   DOCKERHUB_TOKEN          Docker Hub access token
#
# Failure email uses the website AWS SES settings from repo-root .env on the
# server (EMAIL_HOST / EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / DEFAULT_FROM_EMAIL).
# Optional on server .env: DEPLOY_NOTIFY_TO (default it@canamgroup.com)
# No GitHub SMTP secrets required.
name: Deploy Production (Docker)

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  # Must match the real clone on the EC2 host (override with secret DEPLOY_PATH_PRODUCTION)
  DEFAULT_DEPLOY_PATH: /home/ubuntu/git-project/topteen_1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_ed25519_github_devtopteen
          chmod 600 ~/.ssh/id_ed25519_github_devtopteen
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Validate SSH key
        run: |
          if [ ! -s ~/.ssh/id_ed25519_github_devtopteen ]; then
            echo "SSH key is missing or empty!"
            exit 1
          fi

      - name: Resolve deploy path
        id: paths
        run: |
          SECRET_PATH='${{ secrets.DEPLOY_PATH_PRODUCTION }}'
          if [ -n "$SECRET_PATH" ]; then
            echo "DEPLOY_PATH=$SECRET_PATH" >> "$GITHUB_ENV"
            echo "path=$SECRET_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY_PATH=${{ env.DEFAULT_DEPLOY_PATH }}" >> "$GITHUB_ENV"
            echo "path=${{ env.DEFAULT_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Using DEPLOY_PATH: ${SECRET_PATH:-${{ env.DEFAULT_DEPLOY_PATH }}}"

      - name: Production Docker deploy
        id: remote_deploy
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/id_ed25519_github_devtopteen \
            -o StrictHostKeyChecking=no \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            "DEPLOY_PATH='${{ env.DEPLOY_PATH }}' \
             DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' \
             DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' \
             GITHUB_SHA='${{ github.sha }}' \
             GITHUB_REF_NAME='${{ github.ref_name }}' \
             bash -s" << 'REMOTE' 2>&1 | tee deploy-production.log
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/git-project/topteen_1.0}"
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "Deploy path not found: $DEPLOY_PATH"
            echo "Hint: set GitHub secret DEPLOY_PATH_PRODUCTION to the real repo path on the server."
            ls -la /home/*/git-project/topteen_1.0 2>/dev/null || true
            ls -la /home/*/topteen_1.0 2>/dev/null || true
            exit 1
          fi
          cd "$DEPLOY_PATH"

          echo "[CI] Repo: $DEPLOY_PATH"
          git fetch origin production
          git reset --hard origin/production
          echo "[CI] Deploying commit: $(git rev-parse HEAD) $(git log -1 --oneline)"

          if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          if [ ! -f docker_files/.env ]; then
            echo "[CI] Creating docker_files/.env from env.example"
            cp docker_files/env.example docker_files/.env
          fi
          upsert_env() {
            local key="$1" val="$2" file="docker_files/.env"
            if grep -qE "^${key}=" "$file" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$file"
            else
              echo "${key}=${val}" >> "$file"
            fi
          }
          upsert_env SSL_MODE off
          upsert_env APP_PORT 8090
          upsert_env HTTPS_PORT 8444
          upsert_env TEST_HTTP_PORT 8085
          upsert_env USE_HTTPS True
          upsert_env SECURE_SSL_REDIRECT True
          upsert_env WEB_REPLICAS 1
          upsert_env COMPOSE_PROFILES ""
          echo "[CI] Option A env: SSL_MODE=off APP_PORT=8090 WEB_REPLICAS=1"
          grep -E '^(SSL_MODE|APP_PORT|HTTPS_PORT|USE_HTTPS|WEB_REPLICAS)=' docker_files/.env || true

          export BUILD_PULL=1
          export PUSH_ON_SUCCESS=1
          export GITHUB_SHA GITHUB_REF_NAME
          chmod +x docker_files/deploy.sh docker_files/scripts/notify_deploy_failure.py

          echo "[CI] Running preflight..."
          ./docker_files/deploy.sh preflight

          set +e
          ./docker_files/deploy.sh deploy 2>&1 | tee /tmp/topteen-deploy.log
          DEPLOY_RC=${PIPESTATUS[0]}
          set -e

          if [ "$DEPLOY_RC" -ne 0 ]; then
            echo "[CI] Deploy failed (rc=$DEPLOY_RC) — emailing via site SES..."
            export DEPLOY_FAIL_LOG=/tmp/topteen-deploy.log
            ./docker_files/deploy.sh notify-failure /tmp/topteen-deploy.log || true
            exit "$DEPLOY_RC"
          fi

          echo "[CI] Smoke: curl Docker nginx on :8090"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Host: www.topteen.in" \
            http://127.0.0.1:8090/ || true

          echo "[CI] Production Docker deploy finished successfully."
          REMOTE

      - name: Fail job if deploy failed
        if: steps.remote_deploy.outcome != 'success'
        run: |
          echo "Deploy failed. Check log above."
          echo "Failure email (if sent) used server repo-root .env EMAIL_* (AWS SES)."
          echo "Common fix: set secret DEPLOY_PATH_PRODUCTION=/home/ubuntu/git-project/topteen_1.0"
          exit 1
