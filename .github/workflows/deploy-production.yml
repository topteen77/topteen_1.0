# Production Docker deploy via docker_files/deploy.sh
#
# Triggers: push to `production` branch (or manual workflow_dispatch)
#
# Required GitHub secrets:
#   AWS_SSH_KEY          SSH private key for the production server
#   AWS_HOST             Server hostname or IP
#   AWS_USER             SSH user (e.g. ubuntu)
#
# Optional secrets:
#   DEPLOY_PATH_PRODUCTION   Repo path on server (default: /home/ubuntu/topteen_1.0)
#   DOCKERHUB_USERNAME       Docker Hub user (push on successful deploy)
#   DOCKERHUB_TOKEN          Docker Hub access token
#
# Email on failure (subject: deploy fail):
#   SMTP_SERVER            e.g. email-smtp.ap-south-1.amazonaws.com
#   SMTP_PORT              e.g. 587
#   SMTP_USERNAME          SMTP user
#   SMTP_PASSWORD          SMTP password
#   SMTP_FROM              From address (e.g. noreply@topteen.in)
#   DEPLOY_NOTIFY_TO       Override recipient (default: it@canamgroup.com)
name: Deploy Production (Docker)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_ed25519_github_devtopteen
          chmod 600 ~/.ssh/id_ed25519_github_devtopteen
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Validate SSH key
        run: |
          if [ ! -s ~/.ssh/id_ed25519_github_devtopteen ]; then
            echo "SSH key is missing or empty!"
            exit 1
          fi

      - name: Production Docker deploy
        id: remote_deploy
        continue-on-error: true
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_PRODUCTION || '/home/ubuntu/topteen_1.0' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/id_ed25519_github_devtopteen \
            -o StrictHostKeyChecking=no \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' \
             DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' \
             DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' \
             GITHUB_SHA='${{ github.sha }}' \
             GITHUB_REF_NAME='${{ github.ref_name }}' \
             bash -s" << 'REMOTE' 2>&1 | tee deploy-production.log
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/topteen_1.0}"
          cd "$DEPLOY_PATH" || { echo "Deploy path not found: $DEPLOY_PATH"; exit 1; }

          echo "[CI] Repo: $DEPLOY_PATH"
          git fetch origin production
          git reset --hard origin/production
          echo "[CI] Deploying commit: $(git rev-parse HEAD) $(git log -1 --oneline)"

          if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          export BUILD_PULL=1
          export PUSH_ON_SUCCESS=1
          chmod +x docker_files/deploy.sh
          ./docker_files/deploy.sh deploy

          echo "[CI] Production Docker deploy finished successfully."
          REMOTE

      - name: Capture deploy outcome
        if: always()
        run: |
          if [ "${{ steps.remote_deploy.outcome }}" = "success" ]; then
            echo "DEPLOY_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_STATUS=failed" >> "$GITHUB_ENV"
          fi

      - name: Send failure email
        if: steps.remote_deploy.outcome != 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: deploy fail
          to: ${{ secrets.DEPLOY_NOTIFY_TO || 'it@canamgroup.com' }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            TopTeen production Docker deploy failed.

            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit     : ${{ github.sha }}
            Actor      : ${{ github.actor }}
            Workflow   : ${{ github.workflow }}
            Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            See deploy-production.log attachment for full output.
            If rollback ran on the server, the previous Docker images should still be serving traffic.

            Server deploy path: ${{ secrets.DEPLOY_PATH_PRODUCTION || '/home/ubuntu/topteen_1.0' }}
          attachments: deploy-production.log

      - name: Fail job if deploy failed
        if: steps.remote_deploy.outcome != 'success'
        run: exit 1
