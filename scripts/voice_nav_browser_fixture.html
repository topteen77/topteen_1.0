<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Nav Fixture</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body>
  <main class="p-3">
    <h1 class="h4">Profile voice fixture</h1>
    <button type="button" class="btn btn-primary" id="openPersonalInfoModal" data-bs-toggle="modal" data-bs-target="#personalInfoModal">
      Add/Edit Contact Info
    </button>

    <div class="modal fade" id="personalInfoModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Personal Information</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="personalInfoForm">
            <div class="modal-body">
              <div id="personalInfoErr" class="text-danger" style="display:none;"></div>
              <label class="form-label" for="piName">Full Name</label>
              <input class="form-control mb-2" id="piName" name="username" required />
              <label class="form-label" for="piEmail">Email</label>
              <input class="form-control mb-2" id="piEmail" name="useremail" type="email" />
              <label class="form-label" for="piMobile">Mobile</label>
              <input class="form-control mb-2" id="piMobile" name="userphone" required maxlength="10" />
              <label class="form-label" for="piGender">Gender</label>
              <select class="form-control mb-2" id="piGender" name="gender">
                <option value="">Select</option>
                <option value="20">Male</option>
                <option value="30">Female</option>
              </select>
              <label class="form-label" for="piGrade">Class</label>
              <select class="form-control" id="piGrade" name="usergrade">
                <option value="">Select</option>
                <option value="10">Class 10</option>
                <option value="12">Class 12</option>
              </select>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="personalInfoSaveBtn">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.TT_VOICE_TO_TEXT_ENABLED = true;
    window.isSecureContext = true;
    // Mock speech recognition so UI can mount without real mic/STT
    window.SpeechRecognition = window.webkitSpeechRecognition = function MockSR() {
      this.continuous = false;
      this.interimResults = true;
      this.lang = 'en-IN';
      this.start = function () {
        var self = this;
        setTimeout(function () { if (self.onstart) self.onstart(); }, 10);
      };
      this.abort = function () {};
      this.stop = function () { if (this.onend) this.onend(); };
    };
  </script>
  <script src="../static/js_new/tt-voice-nav.js"></script>
  <script>
    document.getElementById('personalInfoForm').addEventListener('submit', function (e) {
      e.preventDefault();
      window.__voiceSaveCount = (window.__voiceSaveCount || 0) + 1;
    });

    window.TTVoiceNav.attach({
      pageCommands: [{
        match: /^(edit contact|open contact)$/i,
        run: function (done) {
          document.getElementById('openPersonalInfoModal').click();
          setTimeout(function () { done('Opened personal information'); }, 300);
          return 'async';
        }
      }],
      forms: [{
        id: 'personal',
        form: '#personalInfoForm',
        modal: '#personalInfoModal',
        fields: [
          { id: 'piName', label: 'Full name', keys: ['name', 'full name'], type: 'text', required: true },
          { id: 'piEmail', label: 'Email', keys: ['email'], type: 'email', required: false },
          { id: 'piMobile', label: 'Mobile', keys: ['mobile', 'phone'], type: 'mobile', required: true },
          { id: 'piGender', label: 'Gender', keys: ['gender'], type: 'gender', required: false },
          { id: 'piGrade', label: 'Class', keys: ['class', 'grade'], type: 'grade', required: false }
        ],
        onSave: function (done) {
          document.getElementById('personalInfoForm').requestSubmit();
          setTimeout(function () { done('Saved'); }, 50);
          return 'async';
        }
      }]
    });
  </script>
</body>
</html>
