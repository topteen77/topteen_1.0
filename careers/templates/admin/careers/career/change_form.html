{% extends "admin/<p><strong>" %}

{% block after_field_sets %}
{{ block.super }}

<!-- Description Tools - Add after the form fields -->
<div class="description-tools-wrapper" style="margin: 20px 0; clear: both; padding: 20px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px;">
    <div class="description-toolbar" style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button type="button" id="convert-to-h2-btn" class="button" style="background: #417690; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
            Convert to H2
        </button>
        <button type="button" id="json-preview-btn" class="button" style="background: #417690; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
            JSON Preview
        </button>
    </div>
    
    <!-- Editor and Preview - Side by Side -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
        <!-- Left: Description Editor -->
        <div style="border: 1px solid #ddd; border-radius: 5px; background: #fff; padding: 20px;">
            <h3 style="margin-top: 0; margin-bottom: 15px; color: #417690;">Description Editor</h3>
            <div id="description-field-container">
                <!-- Description field will be moved here by JavaScript -->
                <p style="color: #666; margin-bottom: 10px;">Loading description field...</p>
            </div>
        </div>
        
        <!-- Right: Accordion Preview -->
        <div style="border: 1px solid #ddd; border-radius: 5px; background: #fff; padding: 20px;">
            <h3 style="margin-top: 0; margin-bottom: 15px; color: #417690;">Accordion Preview</h3>
            <div id="accordion-preview-container" style="min-height: 400px;">
                <p style="color: #666; font-style: italic;">Start editing the description to see accordion preview here...</p>
            </div>
        </div>
    </div>
</div>

<!-- JSON Preview Modal -->
<div id="json-preview-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 5px; max-width: 800px; max-height: 80vh; overflow: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">JSON Preview</h2>
            <button type="button" id="close-json-modal" style="background: #dc3545; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Close</button>
        </div>
        <pre id="json-preview-content" style="background: #f8f9fa; padding: 15px; border-radius: 4px; overflow: auto; max-height: 60vh;"></pre>
    </div>
</div>

<style>
/* Hide original description field - it will be shown in custom editor */
.field-description {
    display: none !important;
}

/* Also hide by form-row class if description is in it */
.form-row.field-description {
    display: none !important;
}

.description-toolbar button:hover {
    opacity: 0.9;
}

.tab-button.active {
    border-bottom: 2px solid #417690 !important;
    font-weight: bold;
}

.tab-pane {
    display: none;
}

.tab-pane.active {
    display: block;
}

#accordion-preview-container {
    min-height: 400px;
}

#description-field-container {
    min-height: 300px;
}

/* Accordion styles from frontend */
.cat-accordion {
    margin-top: 32px;
}

.cat-accordion .accordion-item {
    border: 1px solid #e4e7fb;
    border-radius: 16px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(12, 15, 37, 0.06);
}

.cat-accordion .accordion-button {
    font-weight: 600;
    font-size: 18px;
    padding: 18px 24px;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: #fff;
    border: none;
    cursor: pointer;
}

.cat-accordion .accordion-button i {
    font-size: 22px;
    color: #5046e5;
    margin-right: 10px;
}

.cat-accordion .accordion-button:not(.collapsed) {
    color: #090b24;
    background: #f4f3ff;
    box-shadow: none;
}

.cat-accordion .accordion-body {
    padding: 20px 28px 28px;
    background: #fff;
}
</style>

<script>
(function() {
    var descriptionTextarea = null;
    var accordionData = [];
    var jsonData = {};
    
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialize);
    } else {
        initialize();
    }
    
    function initialize() {
        // Wait for Django admin and CKEditor to fully render
        // Check if CKEditor is loading
        var checkCKEditor = function() {
            if (typeof CKEDITOR !== 'undefined') {
                // CKEditor is available, wait a bit more for instances to initialize
                setTimeout(function() {
                    setupDescriptionField();
                    setupEventListeners();
                    setupButtons();
                    // Initial update
                    updatePreview();
                }, 300);
            } else {
                // CKEditor not loaded yet, wait and check again
                setTimeout(checkCKEditor, 200);
            }
        };
        
        // Start checking after initial delay
        setTimeout(checkCKEditor, 300);
    }
    
    function setupDescriptionField() {
        // Find the description textarea (original) - try multiple selectors
        descriptionTextarea = document.querySelector('#id_description');
        
        if (!descriptionTextarea) {
            // Try alternative selectors
            descriptionTextarea = document.querySelector('textarea[name="description"]');
        }
        
        // Try finding in CKEditor if it exists
        if (!descriptionTextarea) {
            var ckeditorInstance = null;
            if (typeof CKEDITOR !== 'undefined') {
                ckeditorInstance = CKEDITOR.instances.id_description;
                if (ckeditorInstance) {
                    descriptionTextarea = document.querySelector('#id_description');
                }
            }
        }
        
        if (descriptionTextarea) {
            // Hide the original description field in Basic Information section
            // Try multiple ways to find the container
            var originalFieldContainer = null;
            
            // Method 1: Find by form-row class
            originalFieldContainer = descriptionTextarea.closest('.form-row');
            
            // Method 2: Find by field-description class
            if (!originalFieldContainer) {
                originalFieldContainer = descriptionTextarea.closest('.field-description');
            }
            
            // Method 3: Find parent div that contains the label
            if (!originalFieldContainer) {
                var parent = descriptionTextarea.parentElement;
                while (parent && parent.tagName !== 'BODY') {
                    if (parent.querySelector('label[for="id_description"]') || 
                        parent.querySelector('label:contains("Description")')) {
                        originalFieldContainer = parent;
                        break;
                    }
                    parent = parent.parentElement;
                }
            }
            
            // Method 4: Find by fieldset and look for description field
            if (!originalFieldContainer) {
                var fieldset = descriptionTextarea.closest('fieldset');
                if (fieldset) {
                    var labels = fieldset.querySelectorAll('label');
                    for (var i = 0; i < labels.length; i++) {
                        var labelText = labels[i].textContent.trim().toLowerCase();
                        if (labelText.includes('description') && !labelText.includes('seo')) {
                            originalFieldContainer = labels[i].closest('.form-row') || 
                                                    labels[i].closest('div');
                            break;
                        }
                    }
                }
            }
            
            // Method 5: Last resort - find closest div
            if (!originalFieldContainer) {
                originalFieldContainer = descriptionTextarea.closest('div');
            }
            
            if (originalFieldContainer) {
                originalFieldContainer.style.display = 'none';
                originalFieldContainer.style.visibility = 'hidden';
                originalFieldContainer.style.height = '0';
                originalFieldContainer.style.overflow = 'hidden';
            }
            
            var container = document.getElementById('description-field-container');
            if (container) {
                // Find the parent field container
                var fieldContainer = descriptionTextarea.closest('.form-row') || 
                                    descriptionTextarea.closest('div');
                
                if (fieldContainer) {
                    // Check if CKEditor is being used
                    var isCKEditor = false;
                    var editor = null;
                    if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances.id_description) {
                        isCKEditor = true;
                        editor = CKEDITOR.instances.id_description;
                    }
                    
                    // Move the original field container instead of cloning
                    // This preserves CKEditor functionality since we're moving the actual DOM element
                    try {
                        // Clear container and move the field
                        container.innerHTML = '';
                        container.appendChild(fieldContainer);
                        
                        // Make sure it's visible
                        fieldContainer.style.display = 'block';
                        fieldContainer.style.marginTop = '10px';
                        fieldContainer.style.marginBottom = '10px';
                        
                        // Set up event listeners
                        if (isCKEditor && editor) {
                            // CKEditor is already attached to the textarea, it should still work after moving
                            // Wait a moment for CKEditor to adjust after DOM move
                            setTimeout(function() {
                                // Update preview when CKEditor content changes
                                editor.on('change', function() {
                                    var content = editor.getData();
                                    descriptionTextarea.value = content;
                                    updatePreview();
                                });
                                
                                editor.on('blur', function() {
                                    updateJSON();
                                });
                                
                                // Also listen to textarea changes (if user types directly)
                                descriptionTextarea.addEventListener('input', function() {
                                    if (editor) {
                                        editor.setData(this.value);
                                    }
                                    updatePreview();
                                });
                                
                                descriptionTextarea.addEventListener('blur', function() {
                                    updateJSON();
                                });
                                
                                // Initial content sync - get from editor or textarea
                                var initialContent = editor.getData() || descriptionTextarea.value || '';
                                if (initialContent) {
                                    // Make sure both are in sync
                                    editor.setData(initialContent);
                                    descriptionTextarea.value = initialContent;
                                }
                                
                                // Initial preview update
                                updatePreview();
                            }, 100);
                        } else {
                            // Regular textarea handling - sync changes
                            descriptionTextarea.addEventListener('input', function() {
                                updatePreview();
                            });
                            
                            descriptionTextarea.addEventListener('blur', function() {
                                updateJSON();
                            });
                            
                            // Initial preview update
                            updatePreview();
                        }
                    } catch (e) {
                        console.error('Error moving field:', e);
                        container.innerHTML = '<p style="color: #dc3545;">Error setting up description editor: ' + e.message + '</p>';
                        return;
                    }
                } else {
                    container.innerHTML = '<p style="color: #dc3545;">Could not find description field container.</p>';
                }
            }
        } else {
            var container = document.getElementById('description-field-container');
            if (container) {
                var errorMsg = '<p style="color: #dc3545; padding: 10px; background: #ffe6e6; border: 1px solid #dc3545; border-radius: 4px;">';
                errorMsg += '<strong>Description field not found.</strong><br>';
                errorMsg += 'Please check:<br>';
                errorMsg += '1. The field ID should be "id_description"<br>';
                errorMsg += '2. Check browser console for errors<br>';
                errorMsg += '3. The field should be in "Basic Information" fieldset';
                errorMsg += '</p>';
                container.innerHTML = errorMsg;
            }
            console.error('Description textarea not found. Available textareas:', document.querySelectorAll('textarea'));
        }
    }
    
    function setupEventListeners() {
        // Event listeners setup if needed
    }
    
    function setupButtons() {
        // Convert to H2 button
        var convertBtn = document.getElementById('convert-to-h2-btn');
        if (convertBtn) {
            convertBtn.addEventListener('click', convertToH2);
        }
        
        // JSON Preview button
        var jsonBtn = document.getElementById('json-preview-btn');
        if (jsonBtn) {
            jsonBtn.addEventListener('click', showJSONModal);
        }
        
        // Close JSON modal
        var closeBtn = document.getElementById('close-json-modal');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                document.getElementById('json-preview-modal').style.display = 'none';
            });
        }
    }
    
    function parseDescriptionToAccordion(html) {
        if (!html) return [];
        
        var accordionItems = [];
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        
        // Find all H2 headings
        var h2Elements = tempDiv.querySelectorAll('h2');
        
        if (h2Elements.length === 0) {
            // If no H2, try to find other heading tags
            h2Elements = tempDiv.querySelectorAll('h1, h2, h3, h4, h5, h6');
        }
        
        if (h2Elements.length === 0) {
            // If still no headings, treat entire content as one item
            var text = tempDiv.textContent.trim();
            if (text) {
                accordionItems.push({
                    title: 'Description',
                    content: html
                });
            }
            return accordionItems;
        }
        
        // Process each heading
        for (var i = 0; i < h2Elements.length; i++) {
            var heading = h2Elements[i];
            var title = heading.textContent.trim();
            
            // Get content after this heading until next heading
            var content = '';
            var nextElement = heading.nextElementSibling;
            
            while (nextElement) {
                // Stop if we hit another heading
                if (nextElement.tagName && nextElement.tagName.match(/^H[1-6]$/)) {
                    break;
                }
                content += nextElement.outerHTML || nextElement.textContent;
                nextElement = nextElement.nextElementSibling;
            }
            
            // If no content found, try getting text until next heading
            if (!content.trim()) {
                var current = heading.nextSibling;
                while (current) {
                    if (current.nodeType === 1 && current.tagName && current.tagName.match(/^H[1-6]$/)) {
                        break;
                    }
                    if (current.nodeType === 1) {
                        content += current.outerHTML;
                    } else if (current.nodeType === 3) {
                        content += current.textContent;
                    }
                    current = current.nextSibling;
                }
            }
            
            accordionItems.push({
                title: title || 'Untitled Section',
                content: content.trim() || '<p>No content</p>'
            });
        }
        
        return accordionItems;
    }
    
    function generateJSON(accordionItems) {
        return {
            accordion: accordionItems.map(function(item, index) {
                return {
                    id: index + 1,
                    title: item.title,
                    content: item.content
                };
            }),
            total_items: accordionItems.length,
            generated_at: new Date().toISOString()
        };
    }
    
    function updatePreview() {
        if (!descriptionTextarea) return;
        
        // Get content from CKEditor if available, otherwise from textarea
        var html = '';
        if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances.id_description) {
            var editor = CKEDITOR.instances.id_description;
            html = editor.getData() || descriptionTextarea.value || '';
            // Sync to textarea
            descriptionTextarea.value = html;
        } else {
            html = descriptionTextarea.value || '';
        }
        
        accordionData = parseDescriptionToAccordion(html);
        jsonData = generateJSON(accordionData);
        
        // Update accordion preview
        updateAccordionPreview();
    }
    
    function updateJSON() {
        if (!descriptionTextarea) return;
        
        // Get content from CKEditor if available, otherwise from textarea
        var html = '';
        if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances.id_description) {
            var editor = CKEDITOR.instances.id_description;
            html = editor.getData() || descriptionTextarea.value || '';
            // Sync to textarea
            descriptionTextarea.value = html;
        } else {
            html = descriptionTextarea.value || '';
        }
        
        accordionData = parseDescriptionToAccordion(html);
        jsonData = generateJSON(accordionData);
    }
    
    function updateAccordionPreview() {
        var container = document.getElementById('accordion-preview-container');
        if (!container) return;
        
        if (accordionData.length === 0) {
            container.innerHTML = '<p style="color: #666; font-style: italic;">No accordion structure found. Add H2 headings to create accordion items.</p>';
            return;
        }
        
        var html = '<div style="max-height: 500px; overflow-y: auto;">';
        html += '<div style="margin-bottom: 15px; padding: 10px; background: #e9ecef; border-radius: 4px;">';
        html += '<strong>Found ' + accordionData.length + ' accordion item(s) - All expanded:</strong>';
        html += '</div>';
        
        accordionData.forEach(function(item, index) {
            var itemId = 'preview-accordion-item-' + index;
            html += '<div class="accordion-item" style="border: 1px solid #e4e7fb; border-radius: 16px; margin-bottom: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(12, 15, 37, 0.06);">';
            html += '<button class="accordion-button" type="button" onclick="togglePreviewAccordion(\'' + itemId + '\')" style="font-weight: 600; font-size: 16px; padding: 15px 20px; width: 100%; text-align: left; background: #f4f3ff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;">';
            html += '<span style="display: flex; align-items: center; gap: 10px;">';
            html += '<span style="background: #417690; color: white; padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: bold;">' + (index + 1) + '</span>';
            html += '<span>' + item.title + '</span>';
            html += '</span>';
            html += '<span style="font-size: 24px; color: #5046e5; font-weight: bold; min-width: 30px; text-align: center;">−</span>';
            html += '</button>';
            html += '<div id="' + itemId + '" class="accordion-body" style="display: block; padding: 20px 24px; background: #fff; border-top: 1px solid #e4e7fb;">';
            html += item.content;
            html += '</div>';
            html += '</div>';
        });
        
        html += '</div>';
        container.innerHTML = html;
    }
    
    
    function togglePreviewAccordion(itemId) {
        var item = document.getElementById(itemId);
        var button = item.previousElementSibling;
        var icon = button.querySelector('span:last-child');
        
        if (item.style.display === 'none') {
            item.style.display = 'block';
            button.style.background = '#f4f3ff';
            icon.textContent = '−';
        } else {
            item.style.display = 'none';
            button.style.background = '#fff';
            icon.textContent = '+';
        }
    }
    
    function convertToH2() {
        if (!descriptionTextarea) {
            alert('Description field not found');
            return;
        }
        
        var content = descriptionTextarea.value;
        // Simple conversion - wrap paragraphs in H2 if they look like headings
        // This is a basic implementation
        alert('Convert to H2 feature - You can manually add <h2>Your Heading</h2> tags in the description.');
    }
    
    function showJSONModal() {
        updateJSON();
        var modal = document.getElementById('json-preview-modal');
        var content = document.getElementById('json-preview-content');
        
        if (modal && content) {
            content.textContent = JSON.stringify(jsonData, null, 2);
            modal.style.display = 'block';
        }
    }
    
    // Make toggle function available globally
    window.togglePreviewAccordion = togglePreviewAccordion;
})();
</script>
{% endblock %}
